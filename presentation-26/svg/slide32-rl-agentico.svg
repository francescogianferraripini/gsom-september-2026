<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" role="img">
  <title>Lo stesso task verificabile provato tre volte: ogni tentativo e' una traiettoria di chiamate a sistemi esterni e riceve 1 o 0 da un controllo deterministico. Il GRPO confronta i tre punteggi con la loro media e da quel vantaggio ricava il gradiente che aggiorna le matrici del modello; sulla traiettoria vincente il premio risale e tocca ogni passo, tool call comprese</title>

  <!-- Le tre matricine in fondo a destra sono ricopiate dalla TAPPA 4 della slide 34 e dal
       blocco modello della slide 36: stesse etichette, stesso schema di celle gialle.
       Se cambiano la', vanno cambiate anche qui. Il punto della slide e' che cambia solo
       da dove arriva il punteggio: cross-entropy (34), reward model (36), controllo
       deterministico su una traiettoria intera (qui). -->

  <defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#838383"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a1245a"/></marker></defs>

  <rect x="0" y="210" width="190" height="190" rx="7" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/>
  <rect x="0" y="210" width="3" height="190" rx="0" fill="#161719"/>
  <text x="20" y="238" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#838383" letter-spacing="1.2">TASK</text>
  <text x="20" y="266" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#161719">trova il prezzo</text>
  <text x="20" y="288" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#161719">e aggiorna il foglio</text>
  <line x1="20" y1="308" x2="170" y2="308" stroke="#dee2e6" stroke-width="1"/>
  <text x="20" y="332" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#a1245a" letter-spacing="1.2">VERIFICABILE</text>
  <text x="20" y="354" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#212529">il foglio ha il prezzo</text>
  <text x="20" y="370" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#212529">giusto? sì / no — lo dice</text>
  <text x="20" y="386" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#212529">un controllo, non un umano</text>
  <g fill="none" stroke="#838383" stroke-width="1.4">
