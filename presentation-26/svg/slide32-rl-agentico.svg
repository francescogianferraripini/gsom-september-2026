  <path d="M190 305 C 204 305 200 275 210 275" marker-end="url(#ag)"/>
  <path d="M190 305 C 204 305 200 485 210 485" marker-end="url(#ag)"/>
  </g>
  <text x="214" y="28" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#838383" letter-spacing="1.2">TENTATIVO 1</text>
  <rect x="214" y="40" width="86" height="50" rx="7" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
