  <text x="784" y="281" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="17" font-weight="700" fill="#a1245a">r = 1</text>
  <text x="214" y="448" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#838383" letter-spacing="1.2">TENTATIVO 3</text>
  <rect x="214" y="460" width="86" height="50" rx="7" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="257" y="490" text-anchor="middle" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#212529">pensiero</text>
  <line x1="300" y1="485" x2="314" y2="485" stroke="#838383" stroke-width="1.4" marker-end="url(#ag)"/>
  <rect x="318" y="460" width="86" height="50" rx="7" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/>
  <text x="361" y="490" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="500" fill="#212529">leggi()</text>
  <line x1="404" y1="485" x2="418" y2="485" stroke="#838383" stroke-width="1.4" marker-end="url(#ag)"/>
