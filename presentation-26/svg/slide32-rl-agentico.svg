  <text x="784" y="491" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="17" font-weight="700" fill="#838383">r = 0</text>
  <text x="214" y="534" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#838383">ogni tentativo è una traiettoria: n chiamate a sistemi esterni, una dopo l'altra</text>
