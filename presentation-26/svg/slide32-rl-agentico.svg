  <circle cx="465" cy="300" r="3.4" fill="#a1245a"/>
  <circle cx="569" cy="300" r="3.4" fill="#a1245a"/>
  <text x="214" y="356" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#a1245a">il premio non va alla risposta finale: risale la traiettoria e premia ogni passo, tool call comprese</text>
  <rect x="856" y="30" width="264" height="176" rx="7" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <rect x="856" y="30" width="3" height="176" rx="0" fill="#a1245a"/>
  <text x="876" y="58" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#a1245a" letter-spacing="1.4">GRPO</text>
  <text x="876" y="82" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#161719">il punteggio è relativo</text>
  <text x="876" y="102" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#161719">al gruppo</text>
  <text x="876" y="130" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#838383">media dei tentativi</text>
  <text x="876" y="148" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="600" fill="#212529">(1 + 0 + 0) / 3 = 0,33</text>
  <text x="876" y="174" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#838383">vantaggio = r − media</text>
  <text x="876" y="194" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="700" fill="#a1245a">+0,67   −0,33   −0,33</text>
  <rect x="856" y="222" width="264" height="66" rx="7" fill="#f6f6f6"/>
  <rect x="856" y="222" width="3" height="66" rx="0" fill="#161719"/>
  <text x="876" y="246" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#212529">niente reward model: il critico</text>
  <text x="876" y="264" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#212529">è la media del gruppo, e il</text>
  <text x="876" y="282" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#212529">punteggio lo dà il controllo.</text>
