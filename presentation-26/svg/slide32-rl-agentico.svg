  <text x="1001" y="332" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#a1245a">gradiente</text>
  <rect x="856" y="364" width="264" height="150" rx="7" fill="#161719"/>
  <text x="876" y="392" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#ffffff">modello</text>
  <text x="876" y="412" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#9aa0a6">aggiorna i pesi, un passo alla volta</text>
