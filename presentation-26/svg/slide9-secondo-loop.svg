<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 632 555" width="632" height="555" role="img">
  <title>Due loop annidati: la conversazione contiene la generazione, la corona di mezzo è ancora vuota</title>

  <g font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" transform="translate(-68,-15)">

    <!-- ============ anelli ============ -->
    <g id="anelli" fill="none">
      <circle cx="335" cy="272" r="225" stroke="#dee2e6" stroke-width="2"/>
      <circle cx="335" cy="272" r="62" fill="#f6f6f6" stroke="#838383" stroke-width="1.5"/>
    </g>

    <!-- ============ frecce di verso (orario) ============ -->
    <g id="frecce-esterne" fill="#838383">
      <polygon points="0,-5 11,0 0,5" transform="translate(529.9,159.5) rotate(60)"/>
      <polygon points="0,-5 11,0 0,5" transform="translate(447.5,467) rotate(150)"/>
      <polygon points="0,-5 11,0 0,5" transform="translate(222.5,467) rotate(-150)"/>
      <polygon points="0,-5 11,0 0,5" transform="translate(113,233) rotate(-80)"/>
    </g>
    <g id="frecce-interne" fill="#838383">
      <polygon points="0,-4 8,0 0,4" transform="translate(378.8,228.2) rotate(45)"/>
      <polygon points="0,-4 8,0 0,4" transform="translate(291.2,315.8) rotate(-135)"/>
    </g>

    <!-- ============ anello esterno: 2° loop, conversazione ============ -->
    <g id="loop-esterno">
      <g fill="#f6f6f6" stroke="#dee2e6" stroke-width="1">
        <rect x="257" y="27" width="156" height="40" rx="8"/>
        <rect x="452" y="364.5" width="156" height="40" rx="8"/>
        <rect x="80" y="350.5" width="120" height="68" rx="8"/>
      </g>
      <g text-anchor="middle" font-size="15" font-weight="500" fill="#212529">
        <text x="335" y="52.5">l'utente scrive</text>
        <text x="530" y="389.5">il modello risponde</text>
        <text x="140" y="370.5">la risposta</text>
        <text x="140" y="389.5">si accoda</text>
        <text x="140" y="408.5">alla storia</text>
      </g>
      <g text-anchor="middle" font-size="13" font-weight="500" fill="#838383">
        <text x="530" y="424">qui dentro gira</text>
        <text x="530" y="441">il 1° loop</text>
      </g>
      <rect x="211" y="483" width="248" height="28" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
      <text x="335" y="501.5" text-anchor="middle" font-size="13" font-weight="700"
            letter-spacing="0.9" fill="#838383">2° LOOP — CONVERSAZIONE</text>
    </g>

    <!-- ============ corona di mezzo: ancora vuota (elemento focale) ============ -->
    <g id="corona-vuota">
      <g fill="none" stroke="#a1245a" stroke-width="1.5" stroke-dasharray="9 7">
        <circle cx="335" cy="272" r="135"/>
        <circle cx="335" cy="272" r="92"/>
      </g>
      <g text-anchor="middle" font-size="40" font-weight="700" fill="#a1245a">
        <text x="335" y="173">?</text>
        <text x="448.5" y="287">?</text>
        <text x="335" y="400">?</text>
      </g>
    </g>

    <!-- ============ nucleo: 1° loop, generazione ============ -->
    <g id="loop-interno" text-anchor="middle">
      <text x="335" y="252" font-size="13" font-weight="700" letter-spacing="0.9" fill="#838383">1° LOOP</text>
      <text x="335" y="275" font-size="16" font-weight="700" fill="#161719">generazione</text>
      <text x="335" y="297" font-size="13" font-weight="500" fill="#838383">fino a <tspan
        font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace"
        font-size="13" font-weight="600" fill="#212529">STOP</tspan></text>
    </g>

    <!-- ============ dettaglio del 1° loop ============ -->
    <g id="dettaglio-interno">
      <text x="80" y="535" font-size="13" font-weight="700" letter-spacing="0.9" fill="#838383">1° LOOP</text>
      <text x="80" y="552" font-size="13" font-weight="500" fill="#838383">in dettaglio</text>
      <g fill="#f6f6f6" stroke="#dee2e6" stroke-width="1">
        <rect x="182" y="522" width="126" height="36" rx="8"/>
        <rect x="336" y="522" width="126" height="36" rx="8"/>
        <rect x="492" y="522" width="94" height="36" rx="8"/>
      </g>
      <g text-anchor="middle" font-size="14" font-weight="500" fill="#212529">
        <text x="245" y="545">leggi il contesto</text>
        <text x="399" y="545">genera un token</text>
        <text x="539" y="545">appendi</text>
      </g>
      <g fill="#838383">
        <polygon points="0,-5 11,0 0,5" transform="translate(315,540)"/>
        <polygon points="0,-5 11,0 0,5" transform="translate(469,540)"/>
        <polygon points="0,-5 11,0 0,5" transform="translate(593,540)"/>
      </g>
      <rect x="612" y="522" width="76" height="36" rx="8" fill="#161719"/>
      <text x="650" y="545" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1"
            font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" fill="#ffffff">STOP</text>
    </g>

  </g>
</svg>
