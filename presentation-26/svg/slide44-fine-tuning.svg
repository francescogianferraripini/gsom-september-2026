<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" width="1080" height="720" role="img"
     font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Fine-tuning: dal minimo principale della valle dell&#8217;errore una breve discesa porta alla conca secondaria della specializzazione, con il rischio di risalire altrove</title>

  <!-- EVOLUZIONE DI slide30-gradient-descent.svg.
       Assi, area-valle e "profilo-valle" sono copiati LETTERALMENTE da quella slide: stesso viewBox,
       stessi path, stesse coordinate. Il minimo principale resta (640, 560); la valletta laterale
       coincide con la conca secondaria gia' presente sul profilo, a (933, 497).
       La discesa secondaria (id "discesa-fine-tuning") e' lo stesso profilo ritagliato tra x=640 e x=933:
       nessuna curva nuova. Se cambia slide30, ricopiare qui i due path e il clip resta valido. -->

  <defs>
    <marker id="freccia-indietro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#838383"/>
    </marker>
    <clipPath id="clip-discesa">
      <rect x="640" y="0" width="293" height="720"/>
    </clipPath>
  </defs>

  <g id="assi">
    <path id="area-valle" d="M120 58 C133.3 80 173.3 149.7 200 190 C226.7 230.3 255 270.3 280 300 C305 329.7 326.7 346.7 350 368 C373.3 389.3 395 406.3 420 428 C445 449.7 475 479 500 498 C525 517 548.3 531.7 570 542 C591.7 552.3 608.3 559 630 560 C651.7 561 675 559.3 700 548 C725 536.7 755 507 780 492 C805 477 828.3 459 850 458 C871.7 457 891.7 480 910 486 C928.3 492 936.7 506 960 494 C983.3 482 1035 427.3 1050 414 L1050 668 L120 668 Z" fill="#f6f6f6"/>
    <path d="M88 20 L88 668 L1058 668" fill="none" stroke="#dee2e6" stroke-width="2"/>
    <path d="M88 14 L82 30 L94 30 Z" fill="#dee2e6"/>
    <path d="M1064 668 L1048 662 L1048 674 Z" fill="#dee2e6"/>
    <text x="575" y="700" text-anchor="middle" font-size="19" font-weight="500" fill="#212529">configurazione dei pesi</text>
    <text transform="translate(44 344) rotate(-90)" text-anchor="middle" font-size="19" font-weight="500" fill="#212529">errore (loss)</text>
  </g>

  <!-- profilo della valle: identico a slide30, elemento di supporto -->
  <path id="profilo-valle" d="M120 58 C133.3 80 173.3 149.7 200 190 C226.7 230.3 255 270.3 280 300 C305 329.7 326.7 346.7 350 368 C373.3 389.3 395 406.3 420 428 C445 449.7 475 479 500 498 C525 517 548.3 531.7 570 542 C591.7 552.3 608.3 559 630 560 C651.7 561 675 559.3 700 548 C725 536.7 755 507 780 492 C805 477 828.3 459 850 458 C871.7 457 891.7 480 910 486 C928.3 492 936.7 506 960 494 C983.3 482 1035 427.3 1050 414"
        fill="none" stroke="#838383" stroke-width="2" stroke-linecap="round"/>

  <!-- ELEMENTO FOCALE: la brevita' della discesa secondaria (stesso profilo, ritagliato) -->
  <g id="discesa-fine-tuning" clip-path="url(#clip-discesa)">
    <path d="M120 58 C133.3 80 173.3 149.7 200 190 C226.7 230.3 255 270.3 280 300 C305 329.7 326.7 346.7 350 368 C373.3 389.3 395 406.3 420 428 C445 449.7 475 479 500 498 C525 517 548.3 531.7 570 542 C591.7 552.3 608.3 559 630 560 C651.7 561 675 559.3 700 548 C725 536.7 755 507 780 492 C805 477 828.3 459 850 458 C871.7 457 891.7 480 910 486 C928.3 492 936.7 506 960 494 C983.3 482 1035 427.3 1050 414"
          fill="none" stroke="#a1245a" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- i pochi passi della discesa secondaria -->
  <g id="passi-fine-tuning" fill="#ffffff" stroke="#a1245a" stroke-width="2.5">
    <circle cx="700" cy="548" r="6"/>
    <circle cx="780" cy="492" r="6"/>
    <circle cx="850" cy="458" r="6"/>
    <circle cx="910" cy="486" r="6"/>
  </g>

  <!-- palline: stesso trattamento della slide 36 -->
  <circle id="pre-addestrato" cx="640" cy="560" r="11" fill="#a1245a"/>
  <circle id="specializzato" cx="933" cy="497" r="11" fill="#a1245a"/>

  <g id="etichetta-pre-addestrato">
    <line x1="640" y1="392" x2="640" y2="547" stroke="#dee2e6" stroke-width="1.5"/>
    <text x="640" y="380" text-anchor="end" font-size="21" font-weight="600" fill="#161719">modello pre-addestrato</text>
  </g>

  <g id="etichetta-specializzato">
    <path d="M941 507 C962 524 972 532 992 540" fill="none" stroke="#a1245a" stroke-width="1.5"/>
    <text x="1058" y="562" text-anchor="end" font-size="21" font-weight="600" fill="#a1245a">specializzato sui tuoi dati</text>
  </g>

  <g id="avvertimento">
    <line x1="850" y1="394" x2="850" y2="450" stroke="#dee2e6" stroke-width="1.5" stroke-dasharray="4 4"/>
    <rect x="696" y="290" width="350" height="104" rx="8" fill="#161719"/>
    <rect x="696" y="290" width="3" height="104" fill="#ffbe0b"/>
    <text x="720" y="319" font-size="13" font-weight="700" fill="#ffbe0b" letter-spacing="0.8">CATASTROPHIC FORGETTING</text>
    <text x="720" y="350" font-size="18" font-weight="500" fill="#ffffff">attenzione: muovendo tutti i pesi</text>
    <text x="720" y="375" font-size="18" font-weight="500" fill="#ffffff">si pu&#242; risalire altrove</text>
    <path d="M688 344 L604 304" fill="none" stroke="#838383" stroke-width="2" marker-end="url(#freccia-indietro)"/>
  </g>

  <!-- confronto delle due discese: la brevita' del fine-tuning -->
  <g id="confronto-discese">
    <path d="M120 600 L120 612 L640 612 L640 600" fill="none" stroke="#dee2e6" stroke-width="2"/>
    <path d="M640 600 L640 612 L933 612 L933 600" fill="none" stroke="#a1245a" stroke-width="2"/>
    <text x="380" y="640" text-anchor="middle" font-size="17" font-weight="500" fill="#838383">addestramento da zero: milioni di passi</text>
    <text x="786" y="640" text-anchor="middle" font-size="17" font-weight="600" fill="#a1245a">pochi passi, dati tuoi</text>
  </g>
</svg>
