<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340" role="img">
  <title>La stessa domanda posta a un modello standard e a uno di reasoning: il primo risponde subito e sbaglia, il secondo genera prima i passaggi e poi risponde giusto</title>

  <!-- Riusa l'idioma dei payload della sezione 2 (slide 8, 9b): riquadri con tag di ruolo,
       burgundy per cio' che il modello genera adesso. Il blocco [thinking] e' tratteggiato:
       sono token generati come gli altri, ma non sono la risposta. -->

  <text x="12" y="26" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#a1245a" letter-spacing="1.5">SENZA REASONING</text>
  <text x="12" y="45" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#838383">risponde con il primo token utile</text>
  <text x="368" y="26" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#a1245a" letter-spacing="1.5">CON REASONING</text>
  <text x="368" y="45" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#838383">prima genera il ragionamento</text>
  <rect x="12" y="62" width="320" height="46" rx="7" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/>
  <text x="28" y="82" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#161719">[user]</text>
  <text x="76.4" y="82" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#212529">Un prodotto costa 80€. Applico</text>
  <text x="76.4" y="99" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#212529">−25%, poi +25%. Quanto costa?</text>
  <rect x="12" y="118" width="320" height="29" rx="7" fill="#a1245a"/>
  <text x="28" y="138" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#ecd3de">[assistant]</text>
  <text x="110.9" y="138" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#ffffff">80€.</text>
  <text x="12" y="177" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#212529">Risponde subito. E sbaglia:</text>
  <text x="12" y="194" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#838383">gli sconti non si compensano.</text>
  <rect x="368" y="62" width="320" height="46" rx="7" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/>
  <text x="384" y="82" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#161719">[user]</text>
  <text x="432.4" y="82" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#212529">Un prodotto costa 80€. Applico</text>
  <text x="432.4" y="99" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#212529">−25%, poi +25%. Quanto costa?</text>
  <rect x="368" y="118" width="320" height="63" rx="7" fill="#ffffff" stroke="#838383" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="384" y="138" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#838383">[thinking]</text>
  <text x="460" y="138" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#838383">−25% → 80 × 0,75 = 60</text>
  <text x="460" y="155" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#838383">+25% → 60 × 1,25 = 75</text>
  <text x="460" y="172" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#838383">il secondo % si applica a 60</text>
  <rect x="368" y="191" width="320" height="29" rx="7" fill="#a1245a"/>
  <text x="384" y="211" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#ecd3de">[assistant]</text>
  <text x="466.9" y="211" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#ffffff">75€.</text>
  <text x="368" y="250" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#212529">Gli stessi pesi, la stessa macchina:</text>
  <text x="368" y="267" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#838383">solo, lo STOP arriva molto più tardi.</text>
  <path d="M 694 118 C 700 118 698 124 698 124 L 698 175 C 698 175 700 181 694 181" fill="none" stroke="#a1245a" stroke-width="1.5" stroke-linecap="round"/>
  <text transform="rotate(90 712 147)" x="712" y="147" text-anchor="middle" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#a1245a">token che paghi e non vedi</text>
</svg>
