<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 380" width="1140" height="380" role="img">
  <title>Lo stesso prompt dato a due modelli: quello uscito dal solo pretraining continua il testo con altre domande, quello dopo il secondo addestramento risponde</title>

  <!-- Adattata da slide14-rlhf-comparison.svg del deck gsom-april-2026, riportata alla
       palette e ai font di questo deck (quella di aprile era in Arial su fondi grigi). -->

  <text x="570" y="22" text-anchor="middle" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#838383" letter-spacing="1.4">LO STESSO PROMPT</text>
  <rect x="350" y="32" width="440" height="42" rx="7" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/>
  <text x="570" y="59" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="400" fill="#212529">Come posso aumentare le vendite?</text>
  <path d="M 480 74 L 480 90 Q 480 100 470 100 L 290 100 L 290 118" fill="none" stroke="#dee2e6" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="285,116 290,126 295,116" fill="#dee2e6"/>
  <path d="M 660 74 L 660 90 Q 660 100 670 100 L 850 100 L 850 118" fill="none" stroke="#a1245a" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="845,116 850,126 855,116" fill="#a1245a"/>
  <line x1="570" y1="118" x2="570" y2="368" stroke="#dee2e6" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="40" y="138" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#838383" letter-spacing="1.2">MODELLO BASE</text>
  <text x="40" y="156" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#838383">solo pretraining</text>
  <rect x="40" y="168" width="490" height="146" rx="7" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/>
  <text x="58" y="194" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="400" fill="#9aa0a6">Come posso aumentare le vendite?</text>
  <text x="58" y="217" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="400" fill="#9aa0a6">E quante persone lavorano nella tua azienda?</text>
  <text x="58" y="240" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="400" fill="#9aa0a6">Il settore è B2B o B2C? In quale mercato</text>
  <text x="58" y="263" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="400" fill="#9aa0a6">operate? Negli ultimi anni la domanda è</text>
  <text x="58" y="286" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="400" fill="#9aa0a6">cresciuta o è rimasta stabile?</text>
  <text x="40" y="336" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#838383">Continua la frase come farebbe un testo del web:</text>
  <text x="40" y="352" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#838383">altre domande, non una risposta.</text>
  <text x="610" y="138" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#a1245a" letter-spacing="1.2">DOPO IL SECONDO ADDESTRAMENTO</text>
  <text x="610" y="156" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#838383">stesso modello, un addestramento in più</text>
  <rect x="610" y="168" width="490" height="146" rx="7" fill="#ffffff" stroke="#a1245a" stroke-width="1.4"/>
  <text x="628" y="194" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#212529">Per aumentare le vendite puoi agire su tre leve:</text>
  <text x="628" y="217" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#212529">1) acquisire nuovi clienti (marketing, partnership);</text>
  <text x="628" y="240" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#212529">2) aumentare il valore medio per cliente (upselling);</text>
  <text x="628" y="263" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#212529">3) migliorare la retention (CRM, customer success).</text>
  <text x="628" y="286" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#212529">Vuoi approfondire una di queste?</text>
  <text x="610" y="336" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#838383">Riconosce una domanda e risponde: utile,</text>
  <text x="610" y="352" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#838383">strutturata, orientata all'azione.</text>
</svg>
