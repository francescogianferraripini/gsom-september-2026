<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 540" width="700" height="540" role="img">
  <title>Tre loop annidati; acceso l'anello esterno: il 2° loop, la conversazione a turni</title>

  <!-- Tre varianti della stessa figura: cambia solo quale anello e' acceso.
       slide33-primo-loop (35b) · slide33-secondo-loop (36b) · slide33-terzo-loop (38).
       La geometria e' identica in tutte e tre — e' la condizione perche' si leggano come
       la stessa figura che si accende un pezzo alla volta. Se sposti un elemento, va
       spostato in tutte e tre. -->

  <g font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

    <g id="anelli" fill="none">
      <circle cx="335" cy="272" r="225" stroke="#a1245a" stroke-width="2.5"/>
      <circle cx="335" cy="272" r="135" stroke="#dee2e6" stroke-width="2"/>
      <circle cx="335" cy="272" r="62" fill="#f6f6f6" stroke="#838383" stroke-width="1.5"/>
    </g>
    <g id="frecce-esterne" fill="#a1245a">
      <polygon points="0,-5 11,0 0,5" transform="translate(529.9,159.5) rotate(60)"/>
      <polygon points="0,-5 11,0 0,5" transform="translate(447.5,467) rotate(150)"/>
      <polygon points="0,-5 11,0 0,5" transform="translate(222.5,467) rotate(-150)"/>
      <polygon points="0,-5 11,0 0,5" transform="translate(113,233) rotate(-80)"/>
    </g>
    <g id="frecce-mezzo" fill="#838383">
      <polygon points="0,-5 11,0 0,5" transform="translate(430.5,176.5) rotate(45)"/>
      <polygon points="0,-5 11,0 0,5" transform="translate(239.5,367.5) rotate(-135)"/>
      <polygon points="0,-5 11,0 0,5" transform="translate(430.5,367.5) rotate(135)"/>
    </g>
    <g id="frecce-interne" fill="#838383">
      <polygon points="0,-4 8,0 0,4" transform="translate(378.8,228.2) rotate(45)"/>
      <polygon points="0,-4 8,0 0,4" transform="translate(291.2,315.8) rotate(-135)"/>
    </g>
    <g id="loop-esterno">
      <g fill="#ecd3de" stroke="#a1245a" stroke-width="1.5">
        <rect x="257" y="27" width="156" height="40" rx="8"/>
        <rect x="452" y="364.5" width="156" height="40" rx="8"/>
        <rect x="80" y="350.5" width="120" height="68" rx="8"/>
      </g>
      <g text-anchor="middle" font-size="15" font-weight="600" fill="#161719">
        <text x="335" y="52.5">l'utente scrive</text>
        <text x="530" y="389.5">il modello lavora</text>
        <text x="140" y="370.5">la risposta</text>
        <text x="140" y="389.5">si accoda</text>
        <text x="140" y="408.5">alla storia</text>
      </g>
      <rect x="211" y="483" width="248" height="28" rx="8" fill="#a1245a"/>
      <text x="335" y="501.5" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="0.9" fill="#ffffff">2° LOOP — CONVERSAZIONE</text>
    </g>
    <g id="loop-mezzo">
      <g fill="#f6f6f6" stroke="#dee2e6" stroke-width="1">
        <rect x="231" y="114" width="208" height="46" rx="8"/>
        <rect x="408" y="249" width="124" height="46" rx="8"/>
        <rect x="231" y="384" width="208" height="46" rx="8"/>
      </g>
      <g text-anchor="middle" font-size="15" font-weight="500" fill="#212529">
        <text x="335" y="133">il modello emette</text>
        <text x="335" y="152">una tool call</text>
        <text x="470" y="268">qualcuno</text>
        <text x="470" y="287">la esegue</text>
        <text x="335" y="403">il risultato rientra</text>
        <text x="335" y="422">nel contesto</text>
      </g>
      <rect x="128" y="248" width="138" height="48" rx="8" fill="#f6f6f6"/>
      <g text-anchor="middle" font-size="14" font-weight="600" fill="#838383">
        <text x="197" y="268">ripeti fino a</text>
        <text x="197" y="286">task completato</text>
      </g>
      <rect x="156" y="179" width="152" height="26" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
      <text x="232" y="197" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="0.9" fill="#838383">3° LOOP — TASK</text>
    </g>
    <g id="loop-interno" text-anchor="middle">
      <text x="335" y="252" font-size="13" font-weight="700" letter-spacing="0.9" fill="#838383">1° LOOP</text>
      <text x="335" y="275" font-size="16" font-weight="700" fill="#161719">generazione</text>
      <text x="335" y="297" font-size="13" font-weight="500" fill="#838383">fino a <tspan font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600" fill="#212529">STOP</tspan></text>
    </g>

  </g>
</svg>
