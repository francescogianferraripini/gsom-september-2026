<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 356" width="1140" height="356" role="img">
  <title>A sinistra una conversazione normale, un giro di generazione per turno. A destra la stessa meccanica con una tool call: dentro un solo turno il modello genera due volte, perche' in mezzo qualcun altro esegue il tool e appende il risultato al contesto</title>

  <!-- La meta sinistra e, identica, la meta destra di slide9-comparazione-loop.svg: e' la
       citazione che rende leggibile il confronto. A destra lo stesso payload, con la
       dichiarazione del tool dentro il system prompt e il giro di tool call nel flusso. -->

  <text x="12" y="26" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#a1245a" letter-spacing="1.6">SENZA TOOL</text><text x="12" y="47" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#838383">un giro di generazione per turno</text>
  <text x="575" y="26" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#a1245a" letter-spacing="1.6">CON UNA TOOL CALL</text><text x="575" y="47" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#838383">due giri dentro un solo turno</text>
  <line x1="556" y1="12" x2="556" y2="344" stroke="#dee2e6" stroke-width="1"/>
  <rect x="68" y="62" width="460" height="60" rx="7" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/><text x="56" y="82" text-anchor="end" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#838383">turno 1</text><text x="84" y="81.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">[system]</text><text x="146.2" y="81.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">Sei un assistente utile.</text><text x="84" y="97.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#161719">[user]</text><text x="132.4" y="97.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#212529">Ciao, chi sei?</text><rect x="76" y="102" width="444" height="16" rx="5" fill="#a1245a"/><text x="84" y="113.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#ecd3de">[assistant]</text><text x="166.9" y="113.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#ffffff">Sono un assistente AI.</text><rect x="68" y="128" width="460" height="92" rx="7" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/><text x="56" y="148" text-anchor="end" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#838383">turno 2</text><text x="84" y="147.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">[system]</text><text x="146.2" y="147.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">Sei un assistente utile.</text><text x="84" y="163.5" font-family="'SFMono-Regular', Menlo, 