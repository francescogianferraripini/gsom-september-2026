naco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">[user]</text><text x="132.4" y="261.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">Ciao, chi sei?</text><text x="84" y="277.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">[assistant]</text><text x="166.9" y="277.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">Sono un assistente AI.</text><text x="84" y="293.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">[user]</text><text x="132.4" y="293.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">Spiegami cosa sono i transformer</text><text x="84" y="309.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">[assistant]</text><text x="166.9" y="309.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">Un'architettura del 2017…</text><text x="84" y="325.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#161719">[user]</text><text x="132.4" y="325.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#212529">E l'attention come funziona?</text><rect x="76" y="330" width="444" height="16" rx="5" fill="#a1245a"/><text x="84" y="341.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#ecd3de">[assistant]</text><text x="166.9" y="341.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#ffffff">È il meccanismo che pesa i token…</text>
  <rect x="630" y="62" width="460" height="76" rx="7" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/><text x="618" y="82" text-anchor="end" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#838383">giro 1</text><text x="646" y="81.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">[system]</text><text x="708.2" y="81.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">Sei un assistente utile.</text><text x="646" y="97.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6"></text><text x="708" y="97.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">Tool: cerca_ordine(id_ordine) — stato di un ordine</text><text x="646" y="113.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#161719">[user]</text><text x="694.4" y="113.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#212529">Dov'è il mio ordine 4471?</text><rect x="638" y="118" width="444" height="16" rx="5" fill="#a1245a"/><text x="646" y="129.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#ecd3de">[assistant]</text><text x="728.9" y="129.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#ffffff">→ cerca_ordine("4471")</text>
  <rect x="630" y="144" width="460" height="108" rx="7" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/><text x="618" y="164" text-anchor="end" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#838383">giro 2</text><text x="646" y="163.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">[system]</text><text x="708.2" y="163.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">Sei un assistente utile.</text><text x="646" y="179.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6"></text><text x="708" y="179.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">Tool: cerca_ordine(id_ordine) — stato di un ordine</text><text x="646" y="195.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">[user]</text><text x="694.4" y="195.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">Dov'è il mio ordine 4471?</text><text x="646" y="211.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">[assistant]</text><text x="728.9" y="211.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">→ cerca_ordine("4471")</text><rect x="638" y="216" width="444" height="16" rx="5" fill="#d1efea" stroke="#1ab197" stroke-width="1"/><text x="646" y="227.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" fill="#0e7c6a">[tool]</text><text x="694.4" y="227.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#212529">{ stato: "in transito", consegna: "giovedì" }</text><rect x="638" y="232" width="444" height="16" rx="5" fill="#a1245a"/><text x="646" y="243.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#ecd3de">[assistant]</text><text x="728.9" y="243.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#ffffff">Il tuo ordine è in transito, arriva giovedì.</text>
  <path d="M 1090 62 C 1096 62 1094 68 1094 68 L 1094 151 C 1094 157 1096 155 1100 157 C 1096 159 1094 157 1094 163 L 1094 246 C 1094 246 1096 252 1090 252" fill="none" stroke="#838383" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text transform="rotate(90 1124 157)" x="1124" y="157" text-anchor="middle" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500" fill="#212529">un solo turno dell'utente</text>
  <text x="575" y="286" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#a1245a" letter-spacing="1.4">IL GIRO</text>
  <text x="575" y="306" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#212529">① il modello chiede un tool, e si ferma.</text>
  <text x="575" y="323" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#0e7c6a">② qualcun altro esegue e appende il risultato al contesto.</text>
  <text x="575" y="340" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#212529">③ il modello riparte — e il turno non è ancora finito.</text>
