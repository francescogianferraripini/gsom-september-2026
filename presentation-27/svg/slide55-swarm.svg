<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Due pannelli. Swarm: quattro esoscheletri piccoli in cerchio con frecce in tutte le direzioni, un groviglio, e al centro una finestra condivisa alta e piena: entra tutto, per tutti; su due frecce un anello con per dodici: si rimpallano; nessun nodo in evidenza: chi decide? Orchestrator-workers, il pattern 1: un esoscheletro padre in alto e tre figli sotto collegati solo al padre con frecce verticali, compito in giù e paragrafo in su, nessuna freccia fra i figli, la finestra del padre corta: un punto di decisione, contesti isolati, una traccia per figlio</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#838383"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a1245a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0e7c6a"/></marker>
    <g id="eso">
      <rect x="0" y="0" width="72" height="52" rx="4" fill="#ffffff" stroke="#161719" stroke-width="1.2"/>
      <rect x="3" y="3" width="15" height="46" rx="2" fill="#d1efea" stroke="#1ab197"/>
      <rect x="54" y="3" width="15" height="46" rx="2" fill="#fff2ce" stroke="#ffbe0b"/>
      <rect x="22" y="6" width="28" height="40" rx="5" fill="none" stroke="#4da0d7" stroke-width="1.3"/>
      <rect x="28" y="18" width="16" height="16" rx="2" fill="#a1245a"/>
    </g>
  </defs>
  <line x1="350" y1="10" x2="350" y2="430" stroke="#dee2e6"/>

  <!-- ===== SWARM ===== -->
  <text x="12" y="24" font-size="12" font-weight="700" letter-spacing="1.4" fill="#838383">SWARM</text>
  <text x="12" y="40" font-size="9.5" font-style="italic" fill="#838383">N agenti pari che si parlano, senza un padre</text>
  <!-- i quattro -->
  <use href="#eso" x="134" y="56"/>
  <text x="170" y="122" text-anchor="middle" font-size="8.5" fill="#6c757d">"il ricercatore"</text>
  <use href="#eso" x="248" y="170"/>
  <text x="284" y="236" text-anchor="middle" font-size="8.5" fill="#6c757d">"il critico"</text>
  <use href="#eso" x="134" y="284"/>
  <text x="170" y="350" text-anchor="middle" font-size="8.5" fill="#6c757d">"il redattore"</text>
  <use href="#eso" x="20" y="170"/>
  <text x="56" y="236" text-anchor="middle" font-size="8.5" fill="#6c757d">"il moderatore"</text>
  <!-- la finestra condivisa al centro -->
  <rect x="140" y="128" width="60" height="118" rx="3" fill="#fbe3ec" stroke="#a1245a" stroke-width="1.3"/>
  <g fill="#a1245a" fill-opacity="0.35"><rect x="145" y="134" width="50" height="7"/><rect x="145" y="145" width="50" height="7"/><rect x="145" y="156" width="50" height="7"/><rect x="145" y="167" width="50" height="7"/><rect x="145" y="178" width="50" height="7"/><rect x="145" y="189" width="50" height="7"/><rect x="145" y="200" width="50" height="7"/><rect x="145" y="211" width="50" height="7"/><rect x="145" y="222" width="50" height="7"/><rect x="145" y="233" width="50" height="7"/></g>
  <text x="170" y="258" text-anchor="middle" font-size="8" font-weight="600" fill="#a1245a">finestra condivisa:</text>
  <text x="170" y="269" text-anchor="middle" font-size="8" font-weight="600" fill="#a1245a">entra tutto, per tutti</text>
  <!-- il groviglio -->
  <g fill="none" stroke="#838383" stroke-width="1.1" marker-end="url(#a)">
    <path d="M206 96 C 240 120, 250 150, 252 168"/>
    <path d="M250 200 C 220 210, 200 220, 206 300"/>
    <path d="M134 306 C 100 300, 90 260, 92 224"/>
    <path d="M92 168 C 100 130, 120 110, 134 96"/>
    <path d="M206 70 C 260 60, 300 120, 320 190"/>
    <path d="M92 190 C 140 160, 200 150, 248 186"/>
    <path d="M248 214 C 200 250, 150 280, 96 300 "/>
    <path d="M134 84 C 110 140, 120 200, 140 280"/>
    <path d="M200 96 C 190 150, 190 220, 200 280"/>
  </g>
  <g fill="none" stroke="#a1245a" stroke-width="1.4" marker-end="url(#ab)">
    <path d="M320 196 C 330 250, 300 300, 210 316"/>
    <path d="M206 296 C 260 280, 300 240, 316 202"/>
  </g>
  <text x="300" y="262" font-size="9" font-weight="700" fill="#a1245a">↻ ×12</text>
  <text x="300" y="274" font-size="8" font-style="italic" fill="#a1245a">si rimpallano</text>
  <text x="170" y="384" text-anchor="middle" font-size="22" font-weight="700" fill="#838383">chi decide?</text>
  <text x="170" y="406" text-anchor="middle" font-size="9" font-style="italic" fill="#838383">instabile · costoso · opaco:</text>
  <text x="170" y="420" text-anchor="middle" font-size="9" font-style="italic" fill="#838383">nessuna traiettoria singola da leggere</text>

  <!-- ===== ORCHESTRATOR-WORKERS ===== -->
  <text x="366" y="24" font-size="12" font-weight="700" letter-spacing="1.4" fill="#0e7c6a">ORCHESTRATOR-WORKERS</text>
  <text x="366" y="40" font-size="9.5" font-style="italic" fill="#838383">il pattern 1: un padre, figli-tool</text>
  <use href="#eso" x="489" y="60"/>
  <text x="480" y="90" text-anchor="end" font-size="9" font-weight="700" fill="#161719">il padre</text>
  <rect x="571" y="62" width="60" height="48" rx="3" fill="#ffffff" stroke="#161719" stroke-width="1"/>
  <rect x="575" y="66" width="52" height="12" rx="1" fill="#d1efea"/>
  <rect x="575" y="82" width="36" height="7" rx="3" fill="#a1245a"/>
  <rect x="575" y="93" width="52" height="10" rx="1" fill="#d1efea"/>
  <text x="601" y="122" text-anchor="middle" font-size="7.5" font-style="italic" fill="#838383">finestra corta</text>
  <!-- i figli -->
  <use href="#eso" x="380" y="230"/>
  <use href="#eso" x="489" y="230"/>
  <use href="#eso" x="598" y="230"/>
  <g font-size="8.5" fill="#6c757d" text-anchor="middle">
    <text x="416" y="296">figlio 1</text>
    <text x="525" y="296">figlio 2</text>
    <text x="634" y="296">figlio 3</text>
  </g>
  <!-- frecce verticali: compito giù, paragrafo su -->
  <g fill="none" stroke="#a1245a" stroke-width="1.4" marker-end="url(#ab)">
    <path d="M505 112 C 470 150, 430 180, 412 228"/>
    <line x1="521" y1="112" x2="521" y2="228"/>
    <path d="M545 112 C 580 150, 620 180, 638 228"/>
  </g>
  <g fill="none" stroke="#0e7c6a" stroke-width="1.4" marker-end="url(#at)">
    <path d="M424 228 C 442 180, 482 150, 517 114"/>
    <line x1="531" y1="228" x2="531" y2="114"/>
    <path d="M626 228 C 608 180, 568 150, 533 114"/>
  </g>
  <text x="440" y="150" font-size="8.5" font-weight="600" fill="#a1245a">compito ↓</text>
  <text x="586" y="150" text-anchor="end" font-size="8.5" font-weight="600" fill="#0e7c6a">↑ paragrafo</text>
  <text x="525" y="322" text-anchor="middle" font-size="8.5" font-style="italic" fill="#838383">nessuna freccia fra i figli</text>
  <g font-size="9.5" fill="#161719" text-anchor="middle">
    <text x="525" y="368" font-weight="700">un punto di decisione</text>
    <text x="525" y="384">contesti isolati</text>
    <text x="525" y="400">una traccia per figlio</text>
  </g>
  <text x="525" y="424" text-anchor="middle" font-size="9" font-style="italic" fill="#0e7c6a">fa lo stesso lavoro, e si legge</text>
</svg>
