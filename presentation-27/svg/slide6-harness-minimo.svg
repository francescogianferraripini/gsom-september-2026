<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 320" width="1140" height="320" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>L'harness più semplice possibile: chiama il modello, leggi la risposta, se è una tool call esegui e appendi il risultato alla finestra e richiama; se è testo il turno è finito. A destra lo stesso flusso in cinque righe di pseudocodice</title>

  <!-- Il flusso corre da sinistra a destra (lo slot in slide e' largo e basso: 1140x330);
       il rombo di decisione e la freccia di ritorno sono l'elemento focale. -->

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#838383"/>
    </marker>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a1245a"/>
    </marker>
  </defs>

  <!-- ===== il flusso ===== -->
  <g id="flusso">
    <!-- 1. chiama il modello -->
    <rect x="16" y="120" width="186" height="48" rx="8" fill="#f6f6f6" stroke="#dee2e6"/>
    <text x="109" y="150" text-anchor="middle" font-size="16" font-weight="600" fill="#161719">chiama il modello</text>
    <text x="109" y="188" text-anchor="middle" font-size="12" font-weight="400" fill="#838383">tutta la finestra, ogni volta</text>

    <line x1="202" y1="144" x2="234" y2="144" stroke="#838383" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- 2. leggi la risposta -->
    <rect x="236" y="120" width="166" height="48" rx="8" fill="#f6f6f6" stroke="#dee2e6"/>
    <text x="319" y="150" text-anchor="middle" font-size="16" font-weight="600" fill="#161719">leggi la risposta</text>

    <line x1="402" y1="144" x2="432" y2="144" stroke="#838383" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- 3. il rombo (focale) -->
    <polygon points="520,90 606,144 520,198 434,144" fill="#ecd3de" stroke="#a1245a" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="520" y="149" text-anchor="middle" font-size="15" font-weight="700" fill="#a1245a">è una tool call?</text>

    <!-- ramo no: verso destra, terminale -->
    <line x1="606" y1="144" x2="652" y2="144" stroke="#838383" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="629" y="136" text-anchor="middle" font-size="12" font-weight="700" fill="#838383">no</text>
    <rect x="654" y="120" width="128" height="48" rx="24" fill="#161719"/>
    <text x="718" y="142" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">è testo:</text>
    <text x="718" y="159" text-anchor="middle" font-size="12" font-weight="500" fill="#ffbe0b">il turno è finito</text>

    <!-- ramo si: verso il basso -->
    <line x1="520" y1="198" x2="520" y2="230" stroke="#a1245a" stroke-width="2" marker-end="url(#arr-b)"/>
    <text x="532" y="220" font-size="12" font-weight="700" fill="#a1245a">sì</text>

    <!-- 4. esegui il tool -->
    <rect x="450" y="232" width="140" height="48" rx="8" fill="#fff2ce" stroke="#ffbe0b"/>
    <text x="520" y="262" text-anchor="middle" font-size="16" font-weight="600" fill="#161719">esegui il tool</text>

    <line x1="590" y1="256" x2="618" y2="256" stroke="#838383" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- 5. appendi il risultato alla finestra (la riga [tool], in teal) -->
    <rect x="620" y="232" width="162" height="48" rx="8" fill="#d1efea" stroke="#1ab197"/>
    <text x="701" y="251" text-anchor="middle" font-size="15" font-weight="600" fill="#161719">appendi il risultato</text>
    <text x="701" y="270" text-anchor="middle" font-size="13" font-weight="500" fill="#0e7c6a">alla finestra</text>

    <!-- freccia di ritorno (focale) -->
    <path d="M782 256 H800 V44 H109 V116" fill="none" stroke="#a1245a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr-b)"/>
    <rect x="384" y="30" width="146" height="26" rx="13" fill="#ffffff" stroke="#a1245a" stroke-width="1.5"/>
    <text x="457" y="48" text-anchor="middle" font-size="13" font-weight="700" fill="#a1245a">giro successivo</text>
  </g>

  <!-- ===== lo pseudocodice ===== -->
  <g id="pseudocodice">
    <rect x="828" y="44" width="300" height="196" rx="8" fill="#161719"/>
    <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="14" fill="#ffffff">
      <text x="846" y="80"><tspan fill="#ffbe0b">while</tspan> <tspan fill="#ffbe0b">not</tspan> <tspan fill="#7fe0cd">done</tspan>:</text>
      <text x="880" y="112">risposta = modello(<tspan fill="#7fe0cd">finestra</tspan>)</text>
      <text x="880" y="144"><tspan fill="#ffbe0b">if</tspan> risposta.vuole_un_tool:</text>
      <text x="914" y="176"><tspan fill="#7fe0cd">finestra</tspan> += <tspan fill="#7fe0cd">esegui</tspan>(risposta)</text>
      <text x="880" y="208"><tspan fill="#ffbe0b">else</tspan>: <tspan fill="#7fe0cd">done</tspan> = <tspan fill="#ffbe0b">True</tspan></text>
    </g>
    <text x="828" y="266" font-size="13" font-weight="400" fill="#838383">lo stesso flusso, in cinque righe</text>
    <text x="828" y="286" font-size="12" font-weight="400" fill="#838383">tutto il resto dell'harness sta in tre parole:</text>
    <text x="828" y="304" font-size="12" font-weight="600" fill="#0e7c6a">finestra · esegui · done</text>
  </g>
</svg>
