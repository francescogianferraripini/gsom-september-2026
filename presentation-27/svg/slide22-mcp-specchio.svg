<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Lo stesso sequence diagram due volte: senza MCP la funzione cerca_ordine è codice dell'harness, riscritto per ogni prodotto; con MCP sta in un server MCP fuori dall'harness, raggiunto con tools/list al giro zero e tools/call al momento della chiamata. La colonna del modello è identica nei due pannelli</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#161719"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#838383"/></marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b8860b"/></marker>
  </defs>

  <line x1="380" y1="12" x2="380" y2="432" stroke="#dee2e6"/>

  <!-- per il modello, uguale -->
  <path d="M24 66 q0 -8 8 -8 H232 q8 0 8 -8 q0 8 8 8 H436 q8 0 8 8" fill="none" stroke="#a1245a" stroke-width="2" stroke-linecap="round"/>
  <text x="240" y="46" text-anchor="middle" font-size="12" font-weight="700" fill="#a1245a">per il modello, uguale: stessa definizione, stesso tool_use, stesso tool_result</text>

  <!-- ===== SENZA MCP ===== -->
  <text x="12" y="20" font-size="12" font-weight="700" letter-spacing="1.6" fill="#a1245a">SENZA MCP</text>
  <rect x="10" y="70" width="60" height="26" rx="5" fill="#a1245a"/>
  <text x="40" y="88" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">modello</text>

  <rect x="100" y="70" width="200" height="356" rx="6" fill="#f6f6f6" stroke="#161719"/>
  <text x="150" y="88" text-anchor="middle" font-size="11" font-weight="700" fill="#161719">harness</text>
  <rect x="200" y="100" width="90" height="316" rx="5" fill="#fff2ce" stroke="#ffbe0b"/>
  <text x="245" y="116" text-anchor="middle" font-size="10.5" font-weight="700" fill="#161719">cerca_ordine</text>
  <text x="245" y="128" text-anchor="middle" font-size="9.5" fill="#838383">funzione dell'harness</text>
  <rect x="318" y="70" width="52" height="26" rx="5" fill="#ffffff" stroke="#838383" stroke-dasharray="4 3"/>
  <text x="344" y="88" text-anchor="middle" font-size="10.5" font-weight="600" fill="#212529">API</text>

  <g stroke="#838383" stroke-width="1.2">
    <line x1="40" y1="96" x2="40" y2="426"/>
    <line x1="150" y1="96" x2="150" y2="416"/>
    <line x1="245" y1="134" x2="245" y2="410"/>
    <line x1="344" y1="96" x2="344" y2="426" stroke-dasharray="4 3"/>
  </g>

  <g font-size="10" fill="#212529" text-anchor="middle">
    <text x="95" y="150">la finestra, con</text>
    <text x="95" y="161">la definizione</text>
  </g>
  <line x1="148" y1="166" x2="42" y2="166" stroke="#161719" stroke-width="1.2" marker-end="url(#a)"/>

  <text x="95" y="192" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="600" fill="#a1245a">tool_use</text>
  <line x1="42" y1="198" x2="148" y2="198" stroke="#a1245a" stroke-width="1.2" marker-end="url(#a)"/>

  <text x="197" y="224" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="9.5" fill="#212529">cerca_ordine(…)</text>
  <line x1="152" y1="230" x2="243" y2="230" stroke="#161719" stroke-width="1.2" marker-end="url(#a)"/>

  <text x="294" y="256" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="9.5" fill="#212529">GET /orders</text>
  <line x1="247" y1="262" x2="342" y2="262" stroke="#838383" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ag)"/>
  <text x="294" y="288" text-anchor="middle" font-size="9.5" fill="#838383">JSON</text>
  <line x1="342" y1="294" x2="247" y2="294" stroke="#838383" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ag)"/>

  <text x="197" y="320" text-anchor="middle" font-size="9.5" fill="#212529">risultato</text>
  <line x1="243" y1="326" x2="152" y2="326" stroke="#161719" stroke-width="1.2" marker-end="url(#a)"/>

  <rect x="62" y="346" width="66" height="14" rx="3" fill="#d1efea" stroke="#1ab197"/>
  <text x="95" y="357" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="600" fill="#0e7c6a">tool_result</text>
  <line x1="148" y1="366" x2="42" y2="366" stroke="#0e7c6a" stroke-width="1.2" marker-end="url(#a)"/>

  <text x="95" y="392" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="600" fill="#a1245a">text</text>
  <line x1="42" y1="398" x2="148" y2="398" stroke="#a1245a" stroke-width="1.2" marker-end="url(#a)"/>

  <text x="12" y="436" font-size="10.5" font-weight="600" fill="#838383">l'adattatore è codice dell'harness: riscritto per ogni prodotto</text>

  <!-- ===== CON MCP ===== -->
  <text x="392" y="20" font-size="12" font-weight="700" letter-spacing="1.6" fill="#a1245a">CON MCP</text>
  <rect x="390" y="70" width="60" height="26" rx="5" fill="#a1245a"/>
  <text x="420" y="88" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">modello</text>

  <rect x="480" y="70" width="100" height="356" rx="6" fill="#f6f6f6" stroke="#161719"/>
  <text x="530" y="88" text-anchor="middle" font-size="11" font-weight="700" fill="#161719">harness</text>

  <rect x="600" y="70" width="104" height="356" rx="6" fill="#fff2ce" stroke="#ffbe0b" stroke-width="2"/>
  <text x="652" y="86" text-anchor="middle" font-size="10.5" font-weight="700" fill="#161719">server MCP</text>
  <text x="652" y="98" text-anchor="middle" font-size="10" font-weight="600" fill="#161719">«ordini»</text>
  <text x="652" y="110" text-anchor="middle" font-size="9.5" fill="#838383">cerca_ordine sta qui</text>
  <rect x="718" y="70" width="40" height="26" rx="5" fill="#ffffff" stroke="#838383" stroke-dasharray="4 3"/>
  <text x="738" y="88" text-anchor="middle" font-size="10.5" font-weight="600" fill="#212529">API</text>

  <g stroke="#838383" stroke-width="1.2">
    <line x1="420" y1="96" x2="420" y2="426"/>
    <line x1="530" y1="96" x2="530" y2="416"/>
    <line x1="652" y1="116" x2="652" y2="410"/>
    <line x1="738" y1="96" x2="738" y2="426" stroke-dasharray="4 3"/>
  </g>

  <!-- giro zero: tools/list -->
  <text x="591" y="122" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="700" fill="#b8860b">tools/list</text>
  <line x1="532" y1="127" x2="650" y2="127" stroke="#b8860b" stroke-width="1.2" marker-end="url(#am)"/>
  <text x="591" y="139" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="8.5" fill="#212529">{name, description,</text>
  <text x="591" y="148" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="8.5" fill="#212529">input_schema}</text>
  <line x1="650" y1="152" x2="532" y2="152" stroke="#b8860b" stroke-width="1.2" marker-end="url(#am)"/>

  <g font-size="10" fill="#212529" text-anchor="middle">
    <text x="475" y="150">la finestra, con</text>
    <text x="475" y="161">la definizione</text>
  </g>
  <line x1="528" y1="166" x2="422" y2="166" stroke="#161719" stroke-width="1.2" marker-end="url(#a)"/>

  <text x="475" y="192" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="600" fill="#a1245a">tool_use</text>
  <line x1="422" y1="198" x2="528" y2="198" stroke="#a1245a" stroke-width="1.2" marker-end="url(#a)"/>

  <text x="591" y="224" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="700" fill="#b8860b">tools/call</text>
  <line x1="532" y1="230" x2="650" y2="230" stroke="#b8860b" stroke-width="1.2" marker-end="url(#am)"/>

  <text x="695" y="256" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="9.5" fill="#212529">GET</text>
  <line x1="654" y1="262" x2="736" y2="262" stroke="#838383" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ag)"/>
  <text x="695" y="288" text-anchor="middle" font-size="9.5" fill="#838383">JSON</text>
  <line x1="736" y1="294" x2="654" y2="294" stroke="#838383" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ag)"/>

  <text x="591" y="320" text-anchor="middle" font-size="9.5" fill="#212529">← risultato</text>
  <line x1="650" y1="326" x2="532" y2="326" stroke="#b8860b" stroke-width="1.2" marker-end="url(#am)"/>

  <rect x="442" y="346" width="66" height="14" rx="3" fill="#d1efea" stroke="#1ab197"/>
  <text x="475" y="357" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="600" fill="#0e7c6a">tool_result</text>
  <line x1="528" y1="366" x2="422" y2="366" stroke="#0e7c6a" stroke-width="1.2" marker-end="url(#a)"/>

  <text x="475" y="392" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="600" fill="#a1245a">text</text>
  <line x1="422" y1="398" x2="528" y2="398" stroke="#a1245a" stroke-width="1.2" marker-end="url(#a)"/>

  <text x="392" y="436" font-size="10.5" font-weight="600" fill="#838383">l'adattatore sta in un server: scritto una volta, usato da ogni harness</text>
</svg>
