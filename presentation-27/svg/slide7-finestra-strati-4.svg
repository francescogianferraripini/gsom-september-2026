<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 566" width="470" height="566" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>La finestra a strati, tempo 5: i tre strati del prefisso pieni, messaggi vuoto, la colonna dei token riempita: circa 400 per il system prompt, 3.000 per quindici tool, 800 per venti skill, zero messaggi; in tutto circa 4.200 token prima della prima parola</title>

  <text x="12" y="24" font-size="19" font-weight="600" fill="#161719">la finestra al giro zero</text>
  <text x="366" y="24" text-anchor="middle" font-size="17" font-weight="600" fill="#838383">token</text>

  <rect x="12" y="40" width="300" height="468" rx="8" fill="#ffffff" stroke="#161719" stroke-width="1.5"/>
  <rect x="328" y="40" width="76" height="468" rx="8" fill="#f6f6f6" stroke="#838383" stroke-width="1.5"/>

  <!-- i tre strati del prefisso: pieni -->
  <g fill="#d1efea" stroke="#1ab197" stroke-width="1.5">
    <rect x="24" y="52" width="276" height="96" rx="6"/>
    <rect x="24" y="160" width="276" height="96" rx="6"/>
    <rect x="24" y="268" width="276" height="96" rx="6"/>
  </g>
  <g font-size="20" font-weight="600" fill="#0e7c6a">
    <text x="36" y="78">system prompt:</text>
    <text x="36" y="100">ruolo e regole</text>
    <text x="36" y="186">dichiarazione dei tool</text>
    <text x="36" y="294">indice delle skill</text>
  </g>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="14" fill="#212529">
    <text x="36" y="124">Sei l'assistente di Acme…</text>
    <text x="36" y="142">Non promettere mai rimborsi.</text>
    <text x="36" y="212">cerca_ordine</text>
    <text x="36" y="230">crea_ticket</text>
    <text x="36" y="248">… 15 tool</text>
    <text x="36" y="320">- rimborsi-acme — …</text>
    <text x="36" y="338">- risposta-reclami-acme — …</text>
    <text x="36" y="356">… 20 skill</text>
  </g>

  <!-- strato 4: ancora vuoto -->
  <rect x="24" y="376" width="276" height="120" rx="6" fill="none" stroke="#838383" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="36" y="402" font-size="20" font-weight="600" fill="#838383">messaggi</text>
  <text x="162" y="446" text-anchor="middle" font-size="16" font-style="italic" fill="#838383">ancora nessuno</text>

  <!-- la colonna dei token: una barra per strato, proporzionale -->
  <g id="barre" fill="#1ab197">
    <rect x="338" y="132" width="56" height="10" rx="2"/>
    <rect x="338" y="182" width="56" height="68" rx="2"/>
    <rect x="338" y="338" width="56" height="20" rx="2"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="700" fill="#161719">
    <text x="366" y="124">~400</text>
    <text x="366" y="176">~3.000</text>
    <text x="366" y="330">~800</text>
    <text x="366" y="446" fill="#838383">0</text>
  </g>

  <!-- la graffa del prefisso -->
  <path d="M414 52 q10 0 10 10 V198 q0 10 10 10 q-10 0 -10 10 V354 q0 10 -10 10" fill="none" stroke="#1ab197" stroke-width="2" stroke-linecap="round"/>
  <g transform="rotate(-90 446 208)" text-anchor="middle">
    <text x="446" y="204" font-size="15" font-weight="700" fill="#0e7c6a">il prefisso</text>
    <text x="446" y="222" font-size="14" font-weight="500" fill="#0e7c6a">non cambia da un giro all'altro</text>
  </g>

  <!-- il totale: elemento focale -->
  <text x="12" y="538" font-size="19" font-weight="700" fill="#a1245a">~4.200 token, prima della prima parola</text>
  <text x="12" y="558" font-size="15" font-weight="500" fill="#838383">in cache: si ripaga a frazione</text>
</svg>
