<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Due riquadri. Tool deterministico, cerca_ordine: chiamata in ingresso, risultato in uscita sempre lo stesso; due modi di fallire, parametri sbagliati e tool scelto male, con la freccia verso la leva Tool: lo verifica un checker. Tool non deterministico, cerca_documenti, una RAG: due stadi in fila, retrieval e ranking, poi sintesi, ognuno con la propria domanda di valutazione e il proprio strumento, e due frecce verso due leve diverse: KB per il retrieval, Prompt per la sintesi</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#161719"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0e7c6a"/></marker>
  </defs>

  <!-- ===== tool deterministico ===== -->
  <rect x="8" y="8" width="300" height="424" rx="6" fill="#ffffff" stroke="#dee2e6"/>
  <text x="20" y="30" font-size="11" font-weight="700" letter-spacing="0.5" fill="#161719">TOOL DETERMINISTICO</text>
  <text x="20" y="44" font-size="9" fill="#838383">un'API applicativa: fa sempre la stessa cosa</text>

  <line x1="20" y1="120" x2="86" y2="120" stroke="#161719" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="22" y="110" font-size="8.5" fill="#838383">chiamata</text>
  <rect x="90" y="84" width="140" height="72" rx="5" fill="#f6f6f6" stroke="#161719" stroke-width="1.2"/>
  <text x="160" y="112" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" fill="#161719">cerca_ordine</text>
  <text x="160" y="130" text-anchor="middle" font-size="8.5" fill="#6c757d">GET /orders/{id}</text>
  <text x="160" y="144" text-anchor="middle" font-size="8.5" fill="#6c757d">stesso input, stesso output</text>
  <line x1="230" y1="120" x2="296" y2="120" stroke="#161719" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="238" y="110" font-size="8.5" fill="#838383">risultato,</text>
  <text x="238" y="138" font-size="8.5" fill="#838383">sempre lo stesso</text>

  <text x="20" y="196" font-size="10" font-weight="700" fill="#161719">se fallisce, il modello l'ha chiamata male:</text>
  <rect x="20" y="208" width="130" height="30" rx="4" fill="#fbe3ec" stroke="#a1245a"/>
  <text x="85" y="227" text-anchor="middle" font-size="9.5" fill="#a1245a">parametri sbagliati</text>
  <rect x="164" y="208" width="130" height="30" rx="4" fill="#fbe3ec" stroke="#a1245a"/>
  <text x="229" y="227" text-anchor="middle" font-size="9.5" fill="#a1245a">tool scelto male</text>
  <text x="20" y="258" font-size="8.5" font-style="italic" fill="#6c757d">"4471 invece di 004471" · "storico invece di stato"</text>

  <path d="M85 238 v40 h72" fill="none" stroke="#161719" stroke-width="1.2"/>
  <path d="M229 238 v40 h-72" fill="none" stroke="#161719" stroke-width="1.2"/>
  <line x1="157" y1="278" x2="157" y2="300" stroke="#161719" stroke-width="1.2" marker-end="url(#a)"/>
  <rect x="97" y="302" width="120" height="30" rx="4" fill="#d1efea" stroke="#1ab197" stroke-width="1.5"/>
  <text x="157" y="321" text-anchor="middle" font-size="10" font-weight="700" fill="#0e7c6a">leva: Tool</text>
  <text x="157" y="350" text-anchor="middle" font-size="9" fill="#212529">descrizione o schema del tool</text>
  <rect x="60" y="372" width="194" height="40" rx="4" fill="#161719"/>
  <text x="157" y="389" text-anchor="middle" font-size="9" fill="#ffffff">lo verifica un checker</text>
  <text x="157" y="403" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="8.5" fill="#ffbe0b">assert len(id_ordine) == 6</text>

  <!-- ===== tool non deterministico ===== -->
  <rect x="332" y="8" width="360" height="424" rx="6" fill="#ffffff" stroke="#dee2e6"/>
  <text x="344" y="30" font-size="11" font-weight="700" letter-spacing="0.5" fill="#161719">TOOL NON DETERMINISTICO</text>
  <text x="344" y="44" font-size="9" fill="#838383">un tool che è a sua volta AI: la RAG</text>

  <line x1="344" y1="120" x2="380" y2="120" stroke="#161719" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="344" y="110" font-size="8.5" fill="#838383">chiamata</text>
  <rect x="384" y="62" width="290" height="116" rx="6" fill="#f6f6f6" stroke="#161719" stroke-width="1.2"/>
  <text x="529" y="80" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" fill="#161719">cerca_documenti</text>
  <!-- stadio 1 -->
  <rect x="396" y="92" width="120" height="70" rx="4" fill="#ffffff" stroke="#a1245a" stroke-width="1.3"/>
  <text x="456" y="112" text-anchor="middle" font-size="9.5" font-weight="700" fill="#a1245a">1 · retrieval</text>
  <text x="456" y="126" text-anchor="middle" font-size="9.5" font-weight="700" fill="#a1245a">e ranking</text>
  <text x="456" y="146" text-anchor="middle" font-size="8.5" fill="#6c757d">cerca, ordina i documenti</text>
  <line x1="516" y1="127" x2="538" y2="127" stroke="#161719" stroke-width="1.3" marker-end="url(#a)"/>
  <!-- stadio 2 -->
  <rect x="542" y="92" width="120" height="70" rx="4" fill="#ffffff" stroke="#a1245a" stroke-width="1.3"/>
  <text x="602" y="112" text-anchor="middle" font-size="9.5" font-weight="700" fill="#a1245a">2 · sintesi</text>
  <text x="602" y="126" text-anchor="middle" font-size="9.5" font-weight="700" fill="#a1245a">(un modello)</text>
  <text x="602" y="146" text-anchor="middle" font-size="8.5" fill="#6c757d">risponde usando i documenti</text>
  <line x1="674" y1="120" x2="686" y2="120" stroke="#161719" stroke-width="1.3"/>

  <!-- le due domande -->
  <g font-size="9" fill="#212529">
    <text x="344" y="204" font-weight="700">due domande diverse, due misure diverse</text>
    <rect x="384" y="214" width="140" height="92" rx="4" fill="#ffffff" stroke="#dee2e6"/>
    <text x="392" y="232" font-style="italic" fill="#a1245a">ha trovato i documenti</text>
    <text x="392" y="246" font-style="italic" fill="#a1245a">giusti, e li ha messi in cima?</text>
    <text x="392" y="270" font-size="8.5" fill="#6c757d">strumento: confronto con</text>
    <text x="392" y="283" font-size="8.5" fill="#6c757d">i documenti attesi (checker)</text>
    <rect x="536" y="214" width="140" height="92" rx="4" fill="#ffffff" stroke="#dee2e6"/>
    <text x="544" y="232" font-style="italic" fill="#a1245a">li ha usati bene?</text>
    <text x="544" y="270" font-size="8.5" fill="#6c757d">strumento: il giudice</text>
    <text x="544" y="283" font-size="8.5" fill="#6c757d">(Slide 47)</text>
  </g>
  <line x1="454" y1="306" x2="454" y2="330" stroke="#161719" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="606" y1="306" x2="606" y2="330" stroke="#161719" stroke-width="1.2" marker-end="url(#a)"/>
  <rect x="394" y="332" width="120" height="30" rx="4" fill="#d1efea" stroke="#1ab197" stroke-width="1.5"/>
  <text x="454" y="351" text-anchor="middle" font-size="10" font-weight="700" fill="#0e7c6a">leva: KB</text>
  <rect x="546" y="332" width="120" height="30" rx="4" fill="#d1efea" stroke="#1ab197" stroke-width="1.5"/>
  <text x="606" y="351" text-anchor="middle" font-size="10" font-weight="700" fill="#0e7c6a">leva: Prompt</text>
  <text x="454" y="380" text-anchor="middle" font-size="8.5" fill="#212529">un documento in più,</text>
  <text x="454" y="392" text-anchor="middle" font-size="8.5" fill="#212529">un indice migliore</text>
  <text x="606" y="380" text-anchor="middle" font-size="8.5" fill="#212529">il prompt della sintesi,</text>
  <text x="606" y="392" text-anchor="middle" font-size="8.5" fill="#212529">non del retrieval</text>
  <text x="530" y="420" text-anchor="middle" font-size="9" font-style="italic" fill="#838383">si correggono in posti diversi: per questo si misurano separatamente</text>
</svg>
