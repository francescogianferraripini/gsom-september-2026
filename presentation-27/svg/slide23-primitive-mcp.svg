<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 304" width="1140" height="304" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>L'host, cioè l'harness, con l'LLM, l'utente, la finestra a strati in miniatura e due client; a destra due server MCP, ordini locale via stdio e CRM remoto via HTTP, ognuno con tre scomparti: prompts, tools, resources. Il client 1 porta ciascuna primitiva nel suo strato: i prompts nel system prompt, i tools nella dichiarazione dei tool, le resources nei messaggi. Una freccia tratteggiata di elicitation torna dal server verso l'utente</title>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a1245a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1ab197"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4da0d7"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#838383"/></marker>
  </defs>

  <!-- ===== host ===== -->
  <text x="12" y="20" font-size="12.5" font-weight="700" fill="#161719">host <tspan font-weight="500" fill="#838383">(l'harness)</tspan></text>
  <rect x="12" y="28" width="520" height="262" rx="8" fill="#f6f6f6" stroke="#161719"/>

  <rect x="28" y="44" width="100" height="60" rx="6" fill="#a1245a"/>
  <text x="78" y="80" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">LLM</text>

  <!-- l'utente -->
  <circle cx="78" cy="166" r="12" fill="none" stroke="#161719" stroke-width="1.5"/>
  <path d="M56 202 a22 22 0 0 1 44 0" fill="none" stroke="#161719" stroke-width="1.5"/>
  <text x="78" y="220" text-anchor="middle" font-size="11" font-weight="600" fill="#161719">l'utente</text>

  <!-- la finestra a strati, in miniatura -->
  <rect x="150" y="44" width="200" height="224" rx="6" fill="#ffffff" stroke="#161719" stroke-width="1.2"/>
  <g fill="#e9ecef" stroke="#dee2e6">
    <rect x="158" y="52" width="184" height="40" rx="4"/>
    <rect x="158" y="100" width="184" height="40" rx="4"/>
    <rect x="158" y="148" width="184" height="30" rx="4"/>
  </g>
  <rect x="158" y="186" width="184" height="74" rx="4" fill="none" stroke="#838383" stroke-dasharray="4 3"/>
  <g font-size="11" font-weight="600" fill="#838383">
    <text x="166" y="69">system prompt</text>
    <text x="166" y="117">dichiarazione dei tool</text>
    <text x="166" y="167">indice delle skill</text>
    <text x="166" y="203">messaggi</text>
  </g>
  <!-- dove arriva ciascuna primitiva -->
  <g font-size="10" font-weight="700" text-anchor="end">
    <text x="336" y="84" fill="#2f6f99">← prompts</text>
    <text x="336" y="132" fill="#a1245a">← tools</text>
    <text x="336" y="250" fill="#0e7c6a">← resources</text>
  </g>

  <!-- i client -->
  <g fill="#ffffff" stroke="#161719">
    <rect x="420" y="60" width="80" height="36" rx="5"/>
    <rect x="420" y="200" width="80" height="36" rx="5"/>
  </g>
  <g font-size="11" font-weight="600" fill="#212529" text-anchor="middle">
    <text x="460" y="82">client 1</text>
    <text x="460" y="222">client 2</text>
  </g>
  <text x="460" y="120" text-anchor="middle" font-size="9.5" fill="#838383">porta ogni primitiva</text>
  <text x="460" y="132" text-anchor="middle" font-size="9.5" fill="#838383">nel suo strato</text>
  <text x="460" y="258" text-anchor="middle" font-size="9.5" fill="#838383">un client per server</text>

  <!-- le tre frecce dal client 1 alla finestra: tre primitive, tre strati -->
  <path d="M418 68 C 390 68, 380 72, 354 72" fill="none" stroke="#4da0d7" stroke-width="2" marker-end="url(#al)"/>
  <path d="M418 78 C 390 78, 384 120, 354 120" fill="none" stroke="#a1245a" stroke-width="2" marker-end="url(#ab)"/>
  <path d="M418 88 C 392 88, 388 238, 354 238" fill="none" stroke="#1ab197" stroke-width="2" marker-end="url(#at)"/>

  <!-- connessioni client ⇄ server, una per trasporto -->
  <line x1="500" y1="78" x2="700" y2="78" stroke="#161719" stroke-width="1.5" marker-start="url(#ag)" marker-end="url(#ag)"/>
  <text x="600" y="72" text-anchor="middle" font-size="10" font-weight="600" fill="#838383">locale · stdio</text>
  <line x1="500" y1="218" x2="700" y2="218" stroke="#161719" stroke-width="1.5" marker-start="url(#ag)" marker-end="url(#ag)"/>
  <text x="600" y="212" text-anchor="middle" font-size="10" font-weight="600" fill="#838383">remoto · HTTP</text>

  <!-- ===== i server ===== -->
  <g id="server-ordini">
    <rect x="700" y="28" width="428" height="120" rx="8" fill="#fff2ce" stroke="#ffbe0b"/>
    <text x="712" y="48" font-size="12" font-weight="700" fill="#161719">server MCP «ordini»</text>
    <g fill="#ffffff" stroke="#dee2e6">
      <rect x="712" y="58" width="404" height="24" rx="4"/>
      <rect x="712" y="88" width="404" height="24" rx="4"/>
      <rect x="712" y="118" width="404" height="24" rx="4"/>
    </g>
    <g font-size="11" font-weight="700">
      <text x="722" y="75" fill="#2f6f99">prompts</text>
      <text x="722" y="105" fill="#a1245a">tools</text>
      <text x="722" y="135" fill="#0e7c6a">resources</text>
    </g>
    <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="10.5" fill="#212529">
      <text x="820" y="75">analizza-ordine</text>
      <text x="820" y="105">cerca_ordine · crea_ticket</text>
      <text x="820" y="135">scheda cliente · listino</text>
    </g>
  </g>
  <g id="server-crm">
    <rect x="700" y="166" width="428" height="120" rx="8" fill="#fff2ce" stroke="#ffbe0b"/>
    <text x="712" y="186" font-size="12" font-weight="700" fill="#161719">server MCP «CRM»</text>
    <g fill="#ffffff" stroke="#dee2e6">
      <rect x="712" y="196" width="404" height="24" rx="4"/>
      <rect x="712" y="226" width="404" height="24" rx="4"/>
      <rect x="712" y="256" width="404" height="24" rx="4"/>
    </g>
    <g font-size="11" font-weight="700">
      <text x="722" y="213" fill="#2f6f99">prompts</text>
      <text x="722" y="243" fill="#a1245a">tools</text>
      <text x="722" y="273" fill="#0e7c6a">resources</text>
    </g>
    <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="10.5" fill="#212529">
      <text x="820" y="213">riassumi-cliente</text>
      <text x="820" y="243">cerca_cliente · aggiorna_scheda</text>
      <text x="820" y="273">anagrafica · storico contatti</text>
    </g>
  </g>

  <!-- elicitation: dal server, via client, all'utente; corre lungo il fondo dell'host -->
  <path d="M452 96 V 110 H 396 V 273 H 78 V 226" fill="none" stroke="#838383" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ag)"/>
  <text x="240" y="285" text-anchor="middle" font-size="9" font-style="italic" fill="#838383">elicitation: il server chiede un dato all'utente, attraverso il client</text>
</svg>
