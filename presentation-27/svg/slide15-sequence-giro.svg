<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="840" height="440" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Sequence diagram su due giri: il modello, e dentro un unico confine harness il blocco Harness Loop e il registro dei tool con tre funzioni nel runtime (lista_ordini, cerca_ordine, apri_reso) e, fuori, l'API ordini. Nel giro 1 l'harness fa parsing, dispatch verso la funzione cerca_ordine, esecuzione e iniezione; nel giro 2 legge la risposta testuale e chiude il turno</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#161719"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#838383"/></marker>
  </defs>

  <!-- l'harness: il loop e il registro dei tool stanno dentro lo stesso confine -->
  <rect x="238" y="4" width="404" height="432" rx="8" fill="none" stroke="#161719" stroke-width="1.5"/>
  <text x="390" y="9" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.2" fill="#161719" stroke="#ffffff" stroke-width="4" paint-order="stroke">harness</text>

  <!-- il registro dei tool: codice nel runtime dell'harness -->
  <rect x="428" y="14" width="200" height="414" rx="8" fill="#fffbec" stroke="#ffbe0b" stroke-dasharray="6 4"/>
  <text x="528" y="26" text-anchor="middle" font-size="11.5" font-weight="700" fill="#161719">registro dei tool</text>
  <text x="528" y="39" text-anchor="middle" font-size="9.5" font-weight="500" fill="#838383">codice nel runtime dell'harness</text>

  <!-- la funzione, dichiarata nel runtime -->
  <rect x="436" y="48" width="184" height="46" rx="4" fill="#ffffff" stroke="#dee2e6"/>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="9" fill="#212529">
    <text x="443" y="62"><tspan fill="#a1245a" font-weight="700">def</tspan> cerca_ordine(id):</text>
    <text x="443" y="75">  r = api.get(f"/orders/{id}")</text>
    <text x="443" y="88">  <tspan fill="#a1245a" font-weight="700">return</tspan> {stato: …, data: …}</text>
  </g>

  <!-- un altro tool, dormiente -->
  <rect x="436" y="102" width="184" height="28" rx="4" fill="#fff2ce" stroke="#ffbe0b"/>
  <text x="444" y="114" font-size="10" font-weight="700" fill="#495057">tool: lista_ordini</text>
  <text x="444" y="125" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="8.5" fill="#838383">def lista_ordini(cliente): …</text>

  <!-- il tool chiamato: una funzione dell'harness -->
  <rect x="436" y="138" width="184" height="192" rx="6" fill="#fff2ce" stroke="#ffbe0b" stroke-width="1.5"/>
  <text x="528" y="155" text-anchor="middle" font-size="12" font-weight="700" fill="#161719">tool: cerca_ordine</text>
  <text x="528" y="168" text-anchor="middle" font-size="9.5" font-weight="500" fill="#838383">la funzione qui sopra, in esecuzione</text>

  <!-- un altro tool, dormiente -->
  <rect x="436" y="338" width="184" height="28" rx="4" fill="#fff2ce" stroke="#ffbe0b"/>
  <text x="444" y="350" font-size="10" font-weight="700" fill="#495057">tool: apri_reso</text>
  <text x="444" y="361" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="8.5" fill="#838383">def apri_reso(id, motivo): …</text>

  <g font-size="9.5" font-weight="500" fill="#838383" text-anchor="middle">
    <text x="528" y="386">per ogni tool dichiarato al modello,</text>
    <text x="528" y="399">una funzione nel runtime dell'harness</text>
  </g>

  <!-- intestazioni -->
  <rect x="20" y="14" width="100" height="36" rx="6" fill="#a1245a"/>
  <text x="70" y="37" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">modello</text>
  <rect x="250" y="14" width="100" height="36" rx="6" fill="#161719"/>
  <text x="300" y="37" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">Harness Loop</text>
  <rect x="700" y="14" width="120" height="36" rx="6" fill="#ffffff" stroke="#838383" stroke-dasharray="5 4"/>
  <text x="760" y="32" text-anchor="middle" font-size="12" font-weight="600" fill="#212529">API ordini</text>
  <text x="760" y="45" text-anchor="middle" font-size="10" fill="#838383">HTTP</text>

  <!-- linee di vita -->
  <g stroke="#838383" stroke-width="1.5">
    <line x1="70" y1="50" x2="70" y2="430"/>
    <line x1="300" y1="50" x2="300" y2="430"/>
    <line x1="528" y1="176" x2="528" y2="322"/>
    <line x1="760" y1="50" x2="760" y2="430" stroke-dasharray="5 4"/>
  </g>
  <g font-size="10.5" font-style="italic" fill="#9aa0a6">
    <text x="78" y="210">aspetta</text>
    <text x="78" y="318">aspetta</text>
  </g>

  <!-- ===== giro 1 ===== -->
  <text x="20" y="66" font-size="10.5" font-weight="700" letter-spacing="1" fill="#838383">GIRO 1</text>
  <g font-size="11" fill="#212529" text-anchor="middle" stroke="#ffffff" stroke-width="3.5" paint-order="stroke">
    <text x="185" y="70">chiamata: la finestra</text>
    <text x="185" y="82">al giro zero + la domanda</text>
  </g>
  <line x1="298" y1="88" x2="72" y2="88" stroke="#161719" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="185" y="114" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" fill="#a1245a" stroke="#ffffff" stroke-width="3.5" paint-order="stroke">tool_use: cerca_ordine("4471")</text>
  <line x1="72" y1="120" x2="290" y2="120" stroke="#a1245a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="185" y="134" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="10.5" fill="#a1245a" stroke="#ffffff" stroke-width="3.5" paint-order="stroke">stop_reason: tool_use</text>

  <!-- la scatola di attivazione dell'harness: elemento focale -->
  <rect x="292" y="126" width="16" height="196" fill="#dbecf7" stroke="#4da0d7" stroke-width="1.5"/>
  <g font-size="12" font-weight="700" fill="#1f5f86" text-anchor="end" stroke="#ffffff" stroke-width="3.5" paint-order="stroke">
    <text x="284" y="152">① parsing</text>
    <text x="284" y="186">② dispatch</text>
    <text x="284" y="236">③ esecuzione</text>
    <text x="284" y="308">④ iniezione</text>
  </g>

  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" fill="#212529" text-anchor="middle">
    <text x="372" y="164">cerca_ordine(</text>
    <text x="372" y="176">id_ordine="4471")</text>
  </g>
  <line x1="308" y1="182" x2="434" y2="182" stroke="#161719" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="372" y="196" text-anchor="middle" font-size="9.5" font-style="italic" fill="#1f5f86">chiama la funzione</text>

  <text x="690" y="208" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" fill="#212529">GET /orders/4471</text>
  <line x1="622" y1="214" x2="758" y2="214" stroke="#838383" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ag)"/>

  <rect x="636" y="230" width="108" height="16" rx="3" fill="#e9ecef"/>
  <text x="690" y="242" text-anchor="middle" font-size="10.5" font-weight="600" fill="#6c757d">JSON, 5.000 righe</text>
  <line x1="758" y1="250" x2="622" y2="250" stroke="#838383" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ag)"/>

  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" fill="#212529" text-anchor="middle">
    <text x="372" y="270">{stato: "in consegna",</text>
    <text x="372" y="282">data: "6 set"}</text>
  </g>
  <line x1="434" y1="288" x2="310" y2="288" stroke="#161719" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="372" y="300" text-anchor="middle" font-size="10" font-style="italic" fill="#0e7c6a">tradotto per il modello</text>

  <rect x="316" y="306" width="150" height="26" rx="4" fill="#d1efea" stroke="#1ab197"/>
  <text x="391" y="317" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0e7c6a">appende tool_result</text>
  <text x="391" y="328" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0e7c6a">alla finestra</text>

  <!-- ===== giro 2 ===== -->
  <line x1="20" y1="338" x2="420" y2="338" stroke="#838383" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="640" y1="338" x2="840" y2="338" stroke="#838383" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="20" y="354" font-size="10.5" font-weight="700" letter-spacing="1" fill="#838383">GIRO 2</text>
  <g font-size="11" fill="#212529" text-anchor="middle" stroke="#ffffff" stroke-width="3.5" paint-order="stroke">
    <text x="185" y="355">chiamata: la finestra</text>
    <text x="185" y="367">+ tool_use + tool_result</text>
  </g>
  <line x1="298" y1="373" x2="72" y2="373" stroke="#161719" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="185" y="398" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#a1245a" stroke="#ffffff" stroke-width="3.5" paint-order="stroke">text: "…in consegna, arriva il 6."</text>
  <line x1="72" y1="404" x2="290" y2="404" stroke="#a1245a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="185" y="418" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="10.5" fill="#a1245a" stroke="#ffffff" stroke-width="3.5" paint-order="stroke">stop_reason: end_turn</text>

  <rect x="292" y="408" width="16" height="22" fill="#dbecf7" stroke="#4da0d7" stroke-width="1.5"/>
  <text x="316" y="424" font-size="11" font-weight="700" fill="#1f5f86">parsing → è testo: turno finito</text>
</svg>
