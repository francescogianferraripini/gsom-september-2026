<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 566" width="470" height="566" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>La finestra a strati, tempo 4: l'indice delle skill è pieno e in evidenza, i due strati sopra pieni ma attenuati, messaggi ancora vuoto</title>

  <text x="12" y="24" font-size="19" font-weight="600" fill="#161719">la finestra al giro zero</text>
  <text x="366" y="24" text-anchor="middle" font-size="17" font-weight="600" fill="#838383">token</text>

  <rect x="12" y="40" width="300" height="468" rx="8" fill="#ffffff" stroke="#161719" stroke-width="1.5"/>
  <rect x="328" y="40" width="76" height="468" rx="8" fill="none" stroke="#838383" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- strati 1-2: pieni, attenuati -->
  <g fill="#f6f6f6" stroke="#dee2e6" stroke-width="1.5">
    <rect x="24" y="52" width="276" height="96" rx="6"/>
    <rect x="24" y="160" width="276" height="96" rx="6"/>
  </g>
  <g font-size="20" font-weight="600" fill="#838383">
    <text x="36" y="78">system prompt:</text>
    <text x="36" y="100">ruolo e regole</text>
    <text x="36" y="186">dichiarazione dei tool</text>
  </g>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="14" fill="#9aa0a6">
    <text x="36" y="124">Sei l'assistente di Acme…</text>
    <text x="36" y="142">Non promettere mai rimborsi.</text>
    <text x="36" y="212">cerca_ordine</text>
    <text x="52" y="230">name · description</text>
    <text x="52" y="248">input_schema   …</text>
  </g>

  <!-- strato 3: pieno, in evidenza -->
  <rect x="24" y="268" width="276" height="96" rx="6" fill="#d1efea" stroke="#1ab197" stroke-width="2.5"/>
  <text x="36" y="294" font-size="20" font-weight="600" fill="#0e7c6a">indice delle skill</text>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="14" fill="#161719">
    <text x="36" y="320">- rimborsi-acme — …</text>
    <text x="36" y="338">- risposta-reclami-acme — …</text>
  </g>

  <!-- strato 4: vuoto -->
  <rect x="24" y="376" width="276" height="120" rx="6" fill="none" stroke="#838383" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="36" y="402" font-size="20" font-weight="600" fill="#838383">messaggi</text>
  <text x="162" y="446" text-anchor="middle" font-size="16" font-style="italic" fill="#838383">ancora nessuno</text>

  <text x="12" y="542" font-size="17" font-weight="500" fill="#838383">→ chiamata n. 1: non ancora</text>
</svg>
