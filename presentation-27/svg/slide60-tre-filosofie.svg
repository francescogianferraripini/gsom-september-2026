<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 186" width="1140" height="186" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Tre pannelli. smolagents: al posto della pill tool_use in JSON, una pill che contiene tre righe di Python, con la freccia verso un blocco esegui il codice: l'azione è codice. LangGraph: l'anello è sostituito da un grafo di quattro nodi con archi e un rombo di decisione, e un'icona di salvataggio su un nodo, checkpoint: il loop è un grafo, con stato. Agno: l'esoscheletro dentro un contenitore più grande etichettato AgentOS, con tre porte in uscita REST, MCP, chat e un piccolo database: agenti più runtime</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#161719"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a1245a"/></marker>
    <g id="eso">
      <rect x="0" y="0" width="96" height="70" rx="5" fill="#ffffff" stroke="#161719" stroke-width="1.2"/>
      <rect x="4" y="4" width="20" height="62" rx="3" fill="#d1efea" stroke="#1ab197"/>
      <rect x="72" y="4" width="20" height="62" rx="3" fill="#fff2ce" stroke="#ffbe0b"/>
      <rect x="29" y="8" width="38" height="54" rx="6" fill="none" stroke="#4da0d7" stroke-width="1.5"/>
      <rect x="38" y="24" width="20" height="22" rx="2" fill="#a1245a"/>
    </g>
  </defs>
  <g stroke="#dee2e6"><line x1="380" y1="10" x2="380" y2="180"/><line x1="760" y1="10" x2="760" y2="180"/></g>

  <!-- ===== smolagents ===== -->
  <text x="20" y="26" font-size="13" font-weight="700" fill="#161719">smolagents</text>
  <text x="112" y="26" font-size="9.5" fill="#838383">Hugging Face</text>
  <use href="#eso" x="20" y="44"/>
  <text x="68" y="132" text-anchor="middle" font-size="8.5" fill="#838383">il loop è quello</text>
  <!-- la pill con il codice -->
  <rect x="140" y="44" width="150" height="62" rx="8" fill="#a1245a"/>
  <text x="148" y="56" font-size="7.5" fill="#ecd3de">il modello genera, invece del tool_use:</text>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="9" fill="#ffffff">
    <text x="148" y="72">r = cerca("resi 2026")</text>
    <text x="148" y="85">for x in r: leggi(x)</text>
    <text x="148" y="98">print(riassunto)</text>
  </g>
  <line x1="290" y1="75" x2="312" y2="75" stroke="#161719" stroke-width="1.3" marker-end="url(#a)"/>
  <rect x="314" y="54" width="54" height="42" rx="4" fill="#fff2ce" stroke="#ffbe0b"/>
  <text x="341" y="72" text-anchor="middle" font-size="8.5" font-weight="600" fill="#161719">esegui</text>
  <text x="341" y="84" text-anchor="middle" font-size="8.5" font-weight="600" fill="#161719">il codice</text>
  <path d="M341 96 C 341 130, 200 140, 116 110" fill="none" stroke="#0e7c6a" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="230" y="136" text-anchor="middle" font-size="8" fill="#0e7c6a">il risultato rientra</text>
  <text x="20" y="176" font-size="11" font-weight="700" fill="#a1245a">l'azione è codice</text>

  <!-- ===== LangGraph ===== -->
  <text x="400" y="26" font-size="13" font-weight="700" fill="#161719">LangChain / LangGraph</text>
  <!-- il grafo al posto dell'anello -->
  <rect x="400" y="44" width="330" height="96" rx="5" fill="#ffffff" stroke="#161719" stroke-width="1.2"/>
  <rect x="404" y="48" width="20" height="88" rx="3" fill="#d1efea" stroke="#1ab197"/>
  <rect x="706" y="48" width="20" height="88" rx="3" fill="#fff2ce" stroke="#ffbe0b"/>
  <g fill="#ffffff" stroke="#4da0d7" stroke-width="1.5">
    <rect x="440" y="80" width="52" height="24" rx="4"/>
    <rect x="516" y="52" width="52" height="24" rx="4"/>
    <rect x="516" y="108" width="52" height="24" rx="4"/>
    <rect x="640" y="80" width="52" height="24" rx="4"/>
  </g>
  <polygon points="604,72 626,92 604,112 582,92" fill="#ffffff" stroke="#4da0d7" stroke-width="1.5"/>
  <g font-size="8" text-anchor="middle" fill="#161719">
    <text x="466" y="95">modello</text>
    <text x="542" y="67">tool A</text>
    <text x="542" y="123">tool B</text>
    <text x="604" y="95">fine?</text>
    <text x="666" y="95">risposta</text>
  </g>
  <g fill="none" stroke="#4da0d7" stroke-width="1.3" marker-end="url(#a)">
    <path d="M492 88 C 500 70, 504 64, 514 64"/>
    <path d="M492 96 C 500 114, 504 120, 514 120"/>
    <path d="M568 64 C 578 64, 580 80, 588 84"/>
    <path d="M568 120 C 578 120, 580 104, 588 100"/>
    <line x1="626" y1="92" x2="638" y2="92"/>
    <path d="M604 112 C 604 138, 470 138, 466 106"/>
  </g>
  <text x="530" y="146" text-anchor="middle" font-size="7.5" fill="#838383">no: si torna al modello</text>
  <!-- checkpoint -->
  <g transform="translate(428,54)">
    <rect x="0" y="0" width="14" height="14" rx="2" fill="#161719"/>
    <rect x="3" y="1" width="8" height="5" fill="#ffffff"/>
    <rect x="2" y="8" width="10" height="5" fill="#ffffff"/>
  </g>
  <text x="446" y="65" font-size="7.5" font-weight="600" fill="#161719">checkpoint</text>
  <text x="400" y="176" font-size="11" font-weight="700" fill="#a1245a">il loop è un grafo, con stato</text>

  <!-- ===== Agno ===== -->
  <text x="780" y="26" font-size="13" font-weight="700" fill="#161719">Agno</text>
  <rect x="780" y="40" width="340" height="106" rx="6" fill="#f6f6f6" stroke="#161719" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="790" y="54" font-size="9" font-weight="700" letter-spacing="1" fill="#161719">AGENTOS</text>
  <text x="852" y="54" font-size="8" fill="#838383">il runtime, nella tua infrastruttura</text>
  <use href="#eso" x="800" y="64"/>
  <use href="#eso" x="850" y="72" transform="translate(850 72) scale(0.55) translate(-850 -72)"/>
  <text x="826" y="142" text-anchor="middle" font-size="7.5" fill="#838383">agenti, team, workflow</text>
  <!-- database -->
  <g transform="translate(930,84)">
    <ellipse cx="14" cy="4" rx="14" ry="4" fill="#ffffff" stroke="#161719" stroke-width="1"/>
    <path d="M0 4 v22 a14 4 0 0 0 28 0 v-22" fill="#ffffff" stroke="#161719" stroke-width="1"/>
    <path d="M0 15 a14 4 0 0 0 28 0" fill="none" stroke="#161719" stroke-width="1"/>
  </g>
  <text x="944" y="128" text-anchor="middle" font-size="7.5" fill="#838383">memoria, tracce</text>
  <!-- le tre porte -->
  <g fill="#ffffff" stroke="#a1245a" stroke-width="1.3">
    <rect x="1030" y="58" width="60" height="18" rx="3"/>
    <rect x="1030" y="82" width="60" height="18" rx="3"/>
    <rect x="1030" y="106" width="60" height="18" rx="3"/>
  </g>
  <g font-size="8.5" font-weight="700" text-anchor="middle" fill="#a1245a">
    <text x="1060" y="71">REST</text>
    <text x="1060" y="95">MCP</text>
    <text x="1060" y="119">chat</text>
  </g>
  <g stroke="#a1245a" stroke-width="1.2" marker-end="url(#ab)" fill="none">
    <path d="M896 99 C 960 99, 980 67, 1028 67"/>
    <line x1="896" y1="99" x2="1028" y2="91"/>
    <path d="M896 99 C 960 99, 980 115, 1028 115"/>
  </g>
  <line x1="1090" y1="91" x2="1116" y2="91" stroke="#161719" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="780" y="176" font-size="11" font-weight="700" fill="#a1245a">agenti + runtime</text>
</svg>
