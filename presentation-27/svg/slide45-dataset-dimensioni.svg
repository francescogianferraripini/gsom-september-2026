<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>A sinistra una griglia di tre dimensioni: tipo di richiesta, stato dell'ordine, tono del cliente; in ingresso, dalle tracce di prova, una freccia: ispirano i casi. Da una cella per riga partono tre linee che convergono in un caso generato, al centro: la scheda numero 037, rimborso, ordine smarrito, cliente arrabbiato, con la richiesta e, a parte, l'esito giusto secondo l'esperto. A destra la pila dei cento casi: leggibili tutti a mano. Sotto: 4 per 4 per 3 uguale 48 combinazioni, si scelgono le circa 100 che contano</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#161719"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a1245a"/></marker>
  </defs>

  <!-- tracce di prova -->
  <g transform="translate(14,14)">
    <rect x="0" y="0" width="34" height="42" rx="3" fill="#ffffff" stroke="#161719" stroke-width="1.2"/>
    <rect x="6" y="6" width="34" height="42" rx="3" fill="#ffffff" stroke="#161719" stroke-width="1.2"/>
    <g stroke="#adb5bd" stroke-width="1.2"><line x1="12" y1="16" x2="34" y2="16"/><line x1="12" y1="24" x2="34" y2="24"/><line x1="12" y1="32" x2="30" y2="32"/><line x1="12" y1="40" x2="34" y2="40"/></g>
  </g>
  <text x="62" y="30" font-size="10" font-weight="700" fill="#161719">tracce di prova</text>
  <text x="62" y="43" font-size="8.5" fill="#838383">(Slide 44)</text>
  <path d="M62 56 C 80 80, 60 92, 40 100" fill="none" stroke="#161719" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="84" y="80" font-size="9" font-style="italic" fill="#161719">ispirano i casi</text>

  <!-- ===== la griglia delle dimensioni ===== -->
  <text x="14" y="118" font-size="10.5" font-weight="700" fill="#161719">le dimensioni</text>
  <g font-size="9" font-weight="600" fill="#838383">
    <text x="14" y="146">tipo di richiesta</text>
    <text x="14" y="206">stato dell'ordine</text>
    <text x="14" y="266">tono del cliente</text>
  </g>
  <!-- riga 1 -->
  <g font-size="8.5" fill="#212529" text-anchor="middle">
    <rect x="14" y="154" width="60" height="18" rx="3" fill="#f6f6f6" stroke="#dee2e6"/><text x="44" y="166">stato ordine</text>
    <rect x="80" y="154" width="60" height="18" rx="3" fill="#fbe3ec" stroke="#a1245a" stroke-width="1.5"/><text x="110" y="166" font-weight="700" fill="#a1245a">rimborso</text>
    <rect x="146" y="154" width="60" height="18" rx="3" fill="#f6f6f6" stroke="#dee2e6"/><text x="176" y="166">reclamo</text>
    <rect x="212" y="154" width="60" height="18" rx="3" fill="#f6f6f6" stroke="#dee2e6"/><text x="242" y="166">altro</text>
  </g>
  <!-- riga 2 -->
  <g font-size="8.5" fill="#212529" text-anchor="middle">
    <rect x="14" y="214" width="60" height="18" rx="3" fill="#f6f6f6" stroke="#dee2e6"/><text x="44" y="226">in consegna</text>
    <rect x="80" y="214" width="60" height="18" rx="3" fill="#f6f6f6" stroke="#dee2e6"/><text x="110" y="226">consegnato</text>
    <rect x="146" y="214" width="60" height="18" rx="3" fill="#fbe3ec" stroke="#a1245a" stroke-width="1.5"/><text x="176" y="226" font-weight="700" fill="#a1245a">smarrito</text>
    <rect x="212" y="214" width="60" height="18" rx="3" fill="#f6f6f6" stroke="#dee2e6"/><text x="242" y="226">non trovato</text>
  </g>
  <!-- riga 3 -->
  <g font-size="8.5" fill="#212529" text-anchor="middle">
    <rect x="14" y="274" width="60" height="18" rx="3" fill="#f6f6f6" stroke="#dee2e6"/><text x="44" y="286">neutro</text>
    <rect x="80" y="274" width="60" height="18" rx="3" fill="#f6f6f6" stroke="#dee2e6"/><text x="110" y="286">urgente</text>
    <rect x="146" y="274" width="60" height="18" rx="3" fill="#fbe3ec" stroke="#a1245a" stroke-width="1.5"/><text x="176" y="286" font-weight="700" fill="#a1245a">arrabbiato</text>
  </g>
  <!-- le tre linee che convergono -->
  <g fill="none" stroke="#a1245a" stroke-width="1.2">
    <path d="M140 163 C 220 163, 250 120, 318 120"/>
    <path d="M206 223 C 250 223, 270 140, 318 132"/>
    <path d="M206 283 C 260 283, 280 160, 318 144"/>
  </g>

  <!-- ===== il caso ===== -->
  <rect x="318" y="96" width="232" height="230" rx="6" fill="#ffffff" stroke="#161719" stroke-width="1.3"/>
  <rect x="318" y="96" width="232" height="22" rx="6" fill="#161719"/>
  <text x="326" y="111" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="9" fill="#ffffff">#037 · rimborso · smarrito · arrabbiato</text>
  <text x="330" y="140" font-size="9" font-weight="700" fill="#838383">la richiesta</text>
  <rect x="330" y="146" width="208" height="48" rx="4" fill="#f6f6f6" stroke="#dee2e6"/>
  <text x="340" y="165" font-size="9.5" font-style="italic" fill="#212529">"Terza consegna in ritardo,</text>
  <text x="340" y="180" font-size="9.5" font-style="italic" fill="#212529">voglio i soldi indietro"</text>
  <text x="330" y="216" font-size="9" font-weight="700" fill="#0e7c6a">esito giusto (l'esperto)</text>
  <rect x="330" y="222" width="208" height="92" rx="4" fill="#d1efea" stroke="#1ab197"/>
  <g font-size="9.5" fill="#0e7c6a">
    <text x="340" y="240">verifica l'ordine,</text>
    <text x="340" y="256">apre un ticket,</text>
    <text x="340" y="272">non promette rimborsi,</text>
    <text x="340" y="288">risponde con un contatto</text>
    <text x="340" y="304">diretto</text>
  </g>

  <!-- ===== la pila dei cento casi ===== -->
  <g fill="#ffffff" stroke="#161719" stroke-width="1">
    <rect x="600" y="156" width="80" height="100" rx="4"/>
    <rect x="594" y="150" width="80" height="100" rx="4"/>
    <rect x="588" y="144" width="80" height="100" rx="4"/>
    <rect x="582" y="138" width="80" height="100" rx="4"/>
    <rect x="576" y="132" width="80" height="100" rx="4"/>
  </g>
  <text x="616" y="152" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="9" fill="#161719">#001</text>
  <text x="616" y="186" text-anchor="middle" font-size="9" fill="#838383">…</text>
  <text x="616" y="222" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="9" fill="#161719">#100</text>
  <line x1="550" y1="200" x2="572" y2="200" stroke="#161719" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="628" y="284" text-anchor="middle" font-size="10" font-weight="700" fill="#161719">~100</text>
  <text x="628" y="298" text-anchor="middle" font-size="9" fill="#838383">leggibili tutti</text>
  <text x="628" y="310" text-anchor="middle" font-size="9" fill="#838383">a mano</text>

  <!-- ===== il conto ===== -->
  <line x1="14" y1="352" x2="686" y2="352" stroke="#dee2e6"/>
  <text x="14" y="378" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="10.5" fill="#161719">4 × 4 × 3 = 48 combinazioni</text>
  <text x="240" y="378" font-size="10" fill="#161719">→ si scelgono le ~100 che contano: alcune scritte a mano, altre generate</text>
  <text x="14" y="398" font-size="9" font-style="italic" fill="#838383">le dimensioni danno la copertura, le tracce vere danno il realismo</text>
  <text x="14" y="414" font-size="9" font-style="italic" fill="#838383">vale in contesti semplici: in medicina o in legge un caso inventato è un caso falso</text>
</svg>
