<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Due riquadri. A sinistra, vibe eval: tre giorni; lunedì la domanda A passa, martedì la domanda B fallisce e si corregge, mercoledì B passa ma A, riprovata, fallisce: il fix del martedì ha rotto il lunedì e nessuno lo sa; un punto interrogativo grande: è migliorato? A destra, eval: una griglia fissa di cento casi rieseguita tre volte, con tre risultati 72, 74 e 81 su 100 e una freccia che sale: è migliorato; dieci caselle evidenziate: i casi che nessuno avrebbe provato a mano</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0e7c6a"/></marker>
    <g id="person"><circle cx="0" cy="-10" r="6" fill="#ffffff" stroke="#161719" stroke-width="1.3"/><path d="M-9 8 a9 9 0 0 1 18 0" fill="#ffffff" stroke="#161719" stroke-width="1.3"/></g>
  </defs>

  <!-- ===== VIBE EVAL ===== -->
  <rect x="8" y="8" width="278" height="424" rx="6" fill="#ffffff" stroke="#dee2e6"/>
  <text x="20" y="30" font-size="12" font-weight="700" letter-spacing="1" fill="#a1245a">VIBE EVAL</text>
  <text x="20" y="44" font-size="9" fill="#838383">qualche domanda, si guarda se risponde bene</text>
  <use href="#person" x="34" y="78"/>
  <rect x="52" y="60" width="90" height="28" rx="6" fill="#f6f6f6" stroke="#dee2e6"/>
  <text x="97" y="78" text-anchor="middle" font-size="9" font-style="italic" fill="#6c757d">"proviamo…"</text>

  <!-- i tre giorni -->
  <g font-size="10.5" font-weight="700" fill="#161719" text-anchor="middle">
    <text x="62" y="118">lun</text>
    <text x="147" y="118">mar</text>
    <text x="232" y="118">mer</text>
  </g>
  <line x1="20" y1="124" x2="274" y2="124" stroke="#dee2e6"/>
  <!-- riga domanda A -->
  <text x="20" y="150" font-size="9" fill="#838383">domanda A</text>
  <rect x="42" y="158" width="40" height="22" rx="4" fill="#d1efea" stroke="#1ab197"/><text x="62" y="173" text-anchor="middle" font-size="11" font-weight="700" fill="#0e7c6a">✓</text>
  <rect x="212" y="158" width="40" height="22" rx="4" fill="#fbe3ec" stroke="#a1245a" stroke-width="1.5"/><text x="232" y="173" text-anchor="middle" font-size="11" font-weight="700" fill="#a1245a">✗</text>
  <text x="232" y="194" text-anchor="middle" font-size="8" fill="#a1245a">riprovata</text>
  <!-- riga domanda B -->
  <text x="20" y="220" font-size="9" fill="#838383">domanda B</text>
  <rect x="127" y="228" width="40" height="22" rx="4" fill="#fbe3ec" stroke="#a1245a"/><text x="147" y="243" text-anchor="middle" font-size="11" font-weight="700" fill="#a1245a">✗</text>
  <rect x="212" y="228" width="40" height="22" rx="4" fill="#d1efea" stroke="#1ab197"/><text x="232" y="243" text-anchor="middle" font-size="11" font-weight="700" fill="#0e7c6a">✓</text>
  <!-- il fix -->
  <path d="M147 256 v18" fill="none" stroke="#161719" stroke-width="1.2"/>
  <rect x="112" y="274" width="70" height="20" rx="4" fill="#161719"/>
  <text x="147" y="288" text-anchor="middle" font-size="9" fill="#ffffff">si corregge</text>
  <path d="M182 284 C 210 284, 220 262, 226 252" fill="none" stroke="#161719" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- etichetta -->
  <text x="20" y="322" font-size="9.5" font-style="italic" fill="#a1245a">il fix del martedì ha rotto il lunedì,</text>
  <text x="20" y="336" font-size="9.5" font-style="italic" fill="#a1245a">e nessuno lo sa</text>
  <text x="200" y="400" text-anchor="middle" font-size="56" font-weight="700" fill="#a1245a" fill-opacity="0.85">?</text>
  <text x="200" y="422" text-anchor="middle" font-size="10" font-weight="600" fill="#a1245a">è migliorato?</text>

  <!-- ===== EVAL ===== -->
  <rect x="314" y="8" width="278" height="424" rx="6" fill="#ffffff" stroke="#dee2e6"/>
  <text x="326" y="30" font-size="12" font-weight="700" letter-spacing="1" fill="#0e7c6a">EVAL</text>
  <text x="326" y="44" font-size="9" fill="#838383">un insieme fisso di casi, rieseguito</text>
  <use href="#person" x="340" y="78"/>
  <text x="356" y="82" font-size="9" font-style="italic" fill="#6c757d">100 casi, sempre gli stessi</text>

  <!-- la griglia 10×10 -->
  <g fill="#ffffff" stroke="#838383" stroke-width="0.8">
    <rect x="336" y="98" width="12" height="12"/><rect x="351" y="98" width="12" height="12"/><rect x="366" y="98" width="12" height="12"/><rect x="381" y="98" width="12" height="12"/><rect x="396" y="98" width="12" height="12"/><rect x="411" y="98" width="12" height="12"/><rect x="426" y="98" width="12" height="12"/><rect x="441" y="98" width="12" height="12"/><rect x="456" y="98" width="12" height="12"/><rect x="471" y="98" width="12" height="12"/>
    <rect x="336" y="113" width="12" height="12"/><rect x="351" y="113" width="12" height="12"/><rect x="366" y="113" width="12" height="12"/><rect x="381" y="113" width="12" height="12"/><rect x="396" y="113" width="12" height="12"/><rect x="411" y="113" width="12" height="12"/><rect x="426" y="113" width="12" height="12"/><rect x="441" y="113" width="12" height="12"/><rect x="456" y="113" width="12" height="12"/><rect x="471" y="113" width="12" height="12"/>
    <rect x="336" y="128" width="12" height="12"/><rect x="351" y="128" width="12" height="12"/><rect x="366" y="128" width="12" height="12"/><rect x="381" y="128" width="12" height="12"/><rect x="396" y="128" width="12" height="12"/><rect x="411" y="128" width="12" height="12"/><rect x="426" y="128" width="12" height="12"/><rect x="441" y="128" width="12" height="12"/><rect x="456" y="128" width="12" height="12"/><rect x="471" y="128" width="12" height="12"/>
    <rect x="336" y="143" width="12" height="12"/><rect x="351" y="143" width="12" height="12"/><rect x="366" y="143" width="12" height="12"/><rect x="381" y="143" width="12" height="12"/><rect x="396" y="143" width="12" height="12"/><rect x="411" y="143" width="12" height="12"/><rect x="426" y="143" width="12" height="12"/><rect x="441" y="143" width="12" height="12"/><rect x="456" y="143" width="12" height="12"/><rect x="471" y="143" width="12" height="12"/>
    <rect x="336" y="158" width="12" height="12"/><rect x="351" y="158" width="12" height="12"/><rect x="366" y="158" width="12" height="12"/><rect x="381" y="158" width="12" height="12"/><rect x="396" y="158" width="12" height="12"/><rect x="411" y="158" width="12" height="12"/><rect x="426" y="158" width="12" height="12"/><rect x="441" y="158" width="12" height="12"/><rect x="456" y="158" width="12" height="12"/><rect x="471" y="158" width="12" height="12"/>
    <rect x="336" y="173" width="12" height="12"/><rect x="351" y="173" width="12" height="12"/><rect x="366" y="173" width="12" height="12"/><rect x="381" y="173" width="12" height="12"/><rect x="396" y="173" width="12" height="12"/><rect x="411" y="173" width="12" height="12"/><rect x="426" y="173" width="12" height="12"/><rect x="441" y="173" width="12" height="12"/><rect x="456" y="173" width="12" height="12"/><rect x="471" y="173" width="12" height="12"/>
    <rect x="336" y="188" width="12" height="12"/><rect x="351" y="188" width="12" height="12"/><rect x="366" y="188" width="12" height="12"/><rect x="381" y="188" width="12" height="12"/><rect x="396" y="188" width="12" height="12"/><rect x="411" y="188" width="12" height="12"/><rect x="426" y="188" width="12" height="12"/><rect x="441" y="188" width="12" height="12"/><rect x="456" y="188" width="12" height="12"/><rect x="471" y="188" width="12" height="12"/>
    <rect x="336" y="203" width="12" height="12"/><rect x="351" y="203" width="12" height="12"/><rect x="366" y="203" width="12" height="12"/><rect x="381" y="203" width="12" height="12"/><rect x="396" y="203" width="12" height="12"/><rect x="411" y="203" width="12" height="12"/><rect x="426" y="203" width="12" height="12"/><rect x="441" y="203" width="12" height="12"/><rect x="456" y="203" width="12" height="12"/><rect x="471" y="203" width="12" height="12"/>
    <rect x="336" y="218" width="12" height="12"/><rect x="351" y="218" width="12" height="12"/><rect x="366" y="218" width="12" height="12"/><rect x="381" y="218" width="12" height="12"/><rect x="396" y="218" width="12" height="12"/><rect x="411" y="218" width="12" height="12"/><rect x="426" y="218" width="12" height="12"/><rect x="441" y="218" width="12" height="12"/><rect x="456" y="218" width="12" height="12"/><rect x="471" y="218" width="12" height="12"/>
    <rect x="336" y="233" width="12" height="12"/><rect x="351" y="233" width="12" height="12"/><rect x="366" y="233" width="12" height="12"/><rect x="381" y="233" width="12" height="12"/><rect x="396" y="233" width="12" height="12"/><rect x="411" y="233" width="12" height="12"/><rect x="426" y="233" width="12" height="12"/><rect x="441" y="233" width="12" height="12"/><rect x="456" y="233" width="12" height="12"/><rect x="471" y="233" width="12" height="12"/>
  </g>
  <!-- le dieci caselle che nessuno avrebbe provato -->
  <g fill="#fff2ce" stroke="#ffbe0b" stroke-width="1.2">
    <rect x="366" y="128" width="12" height="12"/><rect x="441" y="143" width="12" height="12"/><rect x="336" y="173" width="12" height="12"/><rect x="411" y="188" width="12" height="12"/><rect x="471" y="98" width="12" height="12"/>
    <rect x="396" y="218" width="12" height="12"/><rect x="456" y="233" width="12" height="12"/><rect x="351" y="233" width="12" height="12"/><rect x="426" y="113" width="12" height="12"/><rect x="381" y="158" width="12" height="12"/>
  </g>
  <text x="496" y="106" font-size="9" font-weight="600" fill="#161719">100 casi</text>
  <text x="496" y="120" font-size="8.5" fill="#838383">fissi</text>
  <rect x="494" y="150" width="10" height="10" fill="#fff2ce" stroke="#ffbe0b"/>
  <text x="508" y="159" font-size="8.5" fill="#838383">i casi che</text>
  <text x="496" y="171" font-size="8.5" fill="#838383">nessuno avrebbe</text>
  <text x="496" y="183" font-size="8.5" fill="#838383">provato a mano</text>

  <!-- le tre esecuzioni -->
  <text x="326" y="272" font-size="9" fill="#838383">rieseguita tre volte:</text>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700" fill="#161719">
    <text x="336" y="300">72/100</text>
    <text x="336" y="330">74/100</text>
    <text x="336" y="360">81/100</text>
  </g>
  <g font-size="8.5" fill="#838383">
    <text x="410" y="300">versione 1</text>
    <text x="410" y="330">versione 2 · fix del martedì</text>
    <text x="410" y="360">versione 3 · fix dei cluster</text>
  </g>
  <path d="M530 366 L 560 296" fill="none" stroke="#0e7c6a" stroke-width="2" marker-end="url(#a)"/>
  <text x="556" y="392" text-anchor="middle" font-size="10" font-weight="700" fill="#0e7c6a">è migliorato</text>
  <text x="326" y="412" font-size="9" font-style="italic" fill="#0e7c6a">stessi casi, verdetto ripetibile: si vede la regressione, se c'è</text>
</svg>
