<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>A sinistra due chiamate consecutive con il prefisso identico: K e V sono in cache, riusati e non ricalcolati, e nella seconda chiamata si calcola solo la riga nuova. A destra la stessa coppia con una riga diversa nel system prompt, una data: la cache sparisce e tutta la finestra è da ricalcolare. Piede: i token in cache costano circa il dieci per cento; i token letti dal modello restano il cento per cento</title>
  <defs>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0e7c6a"/></marker>
  </defs>

  <line x1="350" y1="12" x2="350" y2="400" stroke="#dee2e6"/>

  <!-- ===== la cache regge ===== -->
  <text x="12" y="26" font-size="12" font-weight="700" letter-spacing="1.6" fill="#0e7c6a">LA CACHE REGGE</text>
  <text x="12" y="42" font-size="10.5" fill="#838383">stesso prefisso, byte per byte</text>
  <g font-size="11" font-weight="600" fill="#838383" text-anchor="middle">
    <text x="90" y="68">chiamata n</text>
    <text x="260" y="68">chiamata n+1</text>
  </g>

  <!-- area della cache -->
  <rect x="16" y="76" width="318" height="150" rx="6" fill="#e9ecef" stroke="#838383" stroke-dasharray="5 4"/>
  <text transform="rotate(-90 175 185)" x="175" y="185" text-anchor="middle" font-size="9.5" font-weight="600" fill="#6c757d">in cache: K, V già calcolati</text>

  <g id="finestra-n">
    <rect x="28" y="84" width="124" height="290" rx="4" fill="#ffffff" stroke="#161719" stroke-width="1.2"/>
    <rect x="34" y="90" width="112" height="108" rx="3" fill="#d1efea" stroke="#1ab197"/>
    <g font-size="9.5" fill="#0e7c6a">
      <text x="40" y="106" font-weight="700">prefisso</text>
      <text x="40" y="122">system prompt</text>
      <text x="40" y="136">tool</text>
      <text x="40" y="150">indice skill</text>
    </g>
    <rect x="34" y="236" width="112" height="60" rx="3" fill="#f6f6f6" stroke="#dee2e6"/>
    <text x="40" y="252" font-size="9.5" fill="#838383">storia</text>
    <rect x="34" y="302" width="112" height="44" rx="3" fill="#d1efea" stroke="#1ab197" stroke-dasharray="3 2"/>
    <text x="40" y="318" font-size="9.5" fill="#0e7c6a">risultati</text>
  </g>
  <g id="finestra-n1">
    <rect x="198" y="84" width="124" height="290" rx="4" fill="#ffffff" stroke="#161719" stroke-width="1.2"/>
    <rect x="204" y="90" width="112" height="108" rx="3" fill="#d1efea" stroke="#1ab197"/>
    <g font-size="9.5" fill="#0e7c6a">
      <text x="210" y="106" font-weight="700">prefisso</text>
      <text x="210" y="122">system prompt</text>
      <text x="210" y="136">tool</text>
      <text x="210" y="150">indice skill</text>
    </g>
    <rect x="204" y="236" width="112" height="60" rx="3" fill="#f6f6f6" stroke="#dee2e6"/>
    <text x="210" y="252" font-size="9.5" fill="#838383">storia</text>
    <rect x="204" y="302" width="112" height="44" rx="3" fill="#d1efea" stroke="#1ab197" stroke-dasharray="3 2"/>
    <text x="210" y="318" font-size="9.5" fill="#0e7c6a">risultati</text>
    <!-- la riga nuova: solo questa si calcola -->
    <rect x="204" y="352" width="112" height="16" rx="3" fill="#ffffff" stroke="#a1245a" stroke-width="2.5"/>
    <text x="260" y="364" text-anchor="middle" font-size="9.5" font-weight="700" fill="#a1245a">la riga nuova</text>
  </g>
  <line x1="152" y1="110" x2="202" y2="110" stroke="#0e7c6a" stroke-width="2" marker-end="url(#at)"/>
  <text x="177" y="100" text-anchor="middle" font-size="9" font-weight="600" fill="#0e7c6a">riusati</text>
  <text x="260" y="390" text-anchor="middle" font-size="10.5" font-weight="600" fill="#a1245a">solo questo si calcola</text>

  <!-- ===== la cache salta ===== -->
  <text x="370" y="26" font-size="12" font-weight="700" letter-spacing="1.6" fill="#a1245a">LA CACHE SALTA</text>
  <text x="370" y="42" font-size="10.5" fill="#838383">una riga diversa in cima</text>
  <g font-size="11" font-weight="600" fill="#838383" text-anchor="middle">
    <text x="448" y="68">chiamata n</text>
    <text x="618" y="68">chiamata n+1</text>
  </g>

  <g id="finestra-n-b">
    <rect x="386" y="84" width="124" height="290" rx="4" fill="#ffffff" stroke="#161719" stroke-width="1.2"/>
    <rect x="392" y="90" width="112" height="108" rx="3" fill="#d1efea" stroke="#1ab197"/>
    <g font-size="9.5" fill="#0e7c6a">
      <text x="398" y="106" font-weight="700">prefisso</text>
      <text x="398" y="122">system prompt</text>
      <text x="398" y="136">data: 4 set 10:40</text>
      <text x="398" y="150">tool · indice skill</text>
    </g>
    <rect x="392" y="236" width="112" height="60" rx="3" fill="#f6f6f6" stroke="#dee2e6"/>
    <text x="398" y="252" font-size="9.5" fill="#838383">storia</text>
    <rect x="392" y="302" width="112" height="44" rx="3" fill="#d1efea" stroke="#1ab197" stroke-dasharray="3 2"/>
    <text x="398" y="318" font-size="9.5" fill="#0e7c6a">risultati</text>
  </g>
  <g id="finestra-n1-b">
    <rect x="556" y="84" width="124" height="290" rx="4" fill="#ffffff" stroke="#a1245a" stroke-width="2.5"/>
    <rect x="562" y="90" width="112" height="108" rx="3" fill="#fdf1f6" stroke="#a1245a"/>
    <g font-size="9.5" fill="#a1245a">
      <text x="568" y="106" font-weight="700">prefisso</text>
      <text x="568" y="122">system prompt</text>
    </g>
    <rect x="565" y="126" width="106" height="14" rx="2" fill="#fff2ce"/>
    <text x="568" y="136" font-size="9.5" font-weight="700" fill="#161719">data: 4 set 10:41</text>
    <text x="568" y="150" font-size="9.5" fill="#a1245a">tool · indice skill</text>
    <rect x="562" y="236" width="112" height="60" rx="3" fill="#fdf1f6" stroke="#a1245a"/>
    <text x="568" y="252" font-size="9.5" fill="#a1245a">storia</text>
    <rect x="562" y="302" width="112" height="44" rx="3" fill="#fdf1f6" stroke="#a1245a" stroke-dasharray="3 2"/>
    <text x="568" y="318" font-size="9.5" fill="#a1245a">risultati</text>
    <rect x="562" y="352" width="112" height="16" rx="3" fill="#ffffff" stroke="#a1245a" stroke-width="2.5"/>
    <text x="618" y="364" text-anchor="middle" font-size="9.5" font-weight="700" fill="#a1245a">la riga nuova</text>
  </g>
  <text x="533" y="140" text-anchor="middle" font-size="14" font-weight="800" fill="#a1245a">✗</text>
  <text x="618" y="390" text-anchor="middle" font-size="10.5" font-weight="600" fill="#a1245a">tutto da ricalcolare</text>

  <!-- piede -->
  <line x1="12" y1="404" x2="688" y2="404" stroke="#dee2e6"/>
  <text x="12" y="424" font-size="11" fill="#212529"><tspan font-weight="700" fill="#0e7c6a">prezzo</tspan> dei token in cache: ~10% del pieno (sconto ~90%)</text>
  <text x="688" y="424" text-anchor="end" font-size="11" fill="#212529"><tspan font-weight="700" fill="#a1245a">token letti</tspan> dal modello: 100%</text>
</svg>
