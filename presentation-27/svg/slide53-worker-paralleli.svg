<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>In alto la finestra del padre con tre pill affiancate nello stesso giro: ricerca normativa resi, ricerca prassi dei concorrenti, ricerca reclami ricevuti. Al centro tre finestre-figlio affiancate, ognuna con la propria sequenza di giri, di altezze diverse, con una linea del tempo a sinistra: 20 minuti per la più lunga contro una barra tratteggiata in sequenza: 60 minuti; un cartello fra i figli: indipendenti, nessuna freccia fra loro. In basso i tre risultati entrano nel padre in un unico messaggio, e un blocco merge tratteggiato con un avviso: dentro, due frasi che si contraddicono, 30 giorni e 14 giorni: il punto fragile</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#161719"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a1245a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0e7c6a"/></marker>
  </defs>

  <!-- ===== il padre, in alto ===== -->
  <text x="90" y="18" font-size="10.5" font-weight="700" fill="#161719">il padre · un giro solo, tre richieste</text>
  <rect x="90" y="24" width="656" height="52" rx="5" fill="#ffffff" stroke="#161719" stroke-width="1.2"/>
  <text x="98" y="40" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="9" fill="#6c757d">[user] Prepara la nuova policy resi.</text>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="8.5" fill="#ffffff">
    <rect x="98" y="48" width="200" height="16" rx="8" fill="#a1245a"/><text x="104" y="59">→ ricerca("normativa resi")</text>
    <rect x="312" y="48" width="212" height="16" rx="8" fill="#a1245a"/><text x="318" y="59">→ ricerca("prassi dei concorrenti")</text>
    <rect x="538" y="48" width="200" height="16" rx="8" fill="#a1245a"/><text x="544" y="59">→ ricerca("reclami ricevuti")</text>
  </g>

  <!-- ===== i tre figli ===== -->
  <g stroke="#a1245a" stroke-width="1.3" marker-end="url(#ab)" fill="none">
    <line x1="198" y1="64" x2="198" y2="96"/>
    <line x1="418" y1="64" x2="418" y2="96"/>
    <line x1="638" y1="64" x2="638" y2="96"/>
  </g>
  <!-- asse del tempo -->
  <line x1="40" y1="98" x2="40" y2="298" stroke="#161719" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="34" y="200" transform="rotate(-90 34 200)" text-anchor="middle" font-size="9" fill="#161719">il tempo</text>
  <g font-size="8.5" fill="#161719">
    <text x="46" y="106">0</text>
    <text x="46" y="290">20 min</text>
  </g>
  <!-- barra "in sequenza" -->
  <rect x="62" y="98" width="10" height="330" fill="none" stroke="#838383" stroke-dasharray="3 3"/>
  <text x="67" y="270" transform="rotate(-90 67 270)" text-anchor="middle" font-size="8.5" fill="#838383">in sequenza: 60 min</text>
  <!-- figlio 1 -->
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="8">
    <rect x="108" y="98" width="180" height="190" rx="4" fill="#ffffff" stroke="#161719" stroke-width="1.1"/>
    <rect x="113" y="103" width="170" height="18" rx="2" fill="#d1efea" stroke="#1ab197"/><text x="118" y="115" fill="#0e7c6a">ricercatore · cerca_web, leggi</text>
    <rect x="113" y="126" width="110" height="11" rx="5" fill="#a1245a"/><rect x="113" y="141" width="170" height="11" rx="1" fill="#d1efea"/>
    <rect x="113" y="156" width="120" height="11" rx="5" fill="#a1245a"/><rect x="113" y="171" width="170" height="20" rx="1" fill="#d1efea"/>
    <rect x="113" y="195" width="110" height="11" rx="5" fill="#a1245a"/><rect x="113" y="210" width="170" height="20" rx="1" fill="#d1efea"/>
    <text x="198" y="248" text-anchor="middle" font-size="11" fill="#838383">⋯</text>
    <rect x="113" y="258" width="170" height="24" rx="2" fill="#ffffff" stroke="#a1245a" stroke-width="1.2"/><text x="118" y="273" fill="#a1245a">paragrafo: "…30 giorni…"</text>
    <!-- figlio 2 -->
    <rect x="328" y="98" width="180" height="140" rx="4" fill="#ffffff" stroke="#161719" stroke-width="1.1"/>
    <rect x="333" y="103" width="170" height="18" rx="2" fill="#d1efea" stroke="#1ab197"/><text x="338" y="115" fill="#0e7c6a">ricercatore · cerca_web, leggi</text>
    <rect x="333" y="126" width="110" height="11" rx="5" fill="#a1245a"/><rect x="333" y="141" width="170" height="11" rx="1" fill="#d1efea"/>
    <rect x="333" y="156" width="120" height="11" rx="5" fill="#a1245a"/><rect x="333" y="171" width="170" height="20" rx="1" fill="#d1efea"/>
    <rect x="333" y="208" width="170" height="24" rx="2" fill="#ffffff" stroke="#a1245a" stroke-width="1.2"/><text x="338" y="223" fill="#a1245a">paragrafo: "…14 giorni…"</text>
    <text x="418" y="256" text-anchor="middle" font-size="8.5" fill="#838383" font-family="Poppins, sans-serif">finisce prima</text>
    <!-- figlio 3 -->
    <rect x="548" y="98" width="180" height="166" rx="4" fill="#ffffff" stroke="#161719" stroke-width="1.1"/>
    <rect x="553" y="103" width="170" height="18" rx="2" fill="#d1efea" stroke="#1ab197"/><text x="558" y="115" fill="#0e7c6a">ricercatore · cerca_ticket</text>
    <rect x="553" y="126" width="110" height="11" rx="5" fill="#a1245a"/><rect x="553" y="141" width="170" height="20" rx="1" fill="#d1efea"/>
    <rect x="553" y="165" width="120" height="11" rx="5" fill="#a1245a"/><rect x="553" y="180" width="170" height="20" rx="1" fill="#d1efea"/>
    <rect x="553" y="204" width="110" height="11" rx="5" fill="#a1245a"/><rect x="553" y="219" width="170" height="11" rx="1" fill="#d1efea"/>
    <rect x="553" y="234" width="170" height="24" rx="2" fill="#ffffff" stroke="#a1245a" stroke-width="1.2"/><text x="558" y="249" fill="#a1245a">paragrafo: "…12 reclami…"</text>
  </g>
  <!-- cartello -->
  <rect x="290" y="270" width="176" height="20" rx="3" fill="#fff2ce" stroke="#ffbe0b"/>
  <text x="378" y="284" text-anchor="middle" font-size="8.5" font-weight="600" fill="#161719">indipendenti: nessuna freccia fra loro</text>

  <!-- ===== i ritorni e il merge ===== -->
  <g stroke="#0e7c6a" stroke-width="1.3" marker-end="url(#at)" fill="none">
    <path d="M198 288 V314"/>
    <path d="M418 238 V314"/>
    <path d="M638 264 V314"/>
  </g>
  <rect x="90" y="316" width="656" height="30" rx="4" fill="#d1efea" stroke="#1ab197"/>
  <text x="98" y="335" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="9" fill="#0e7c6a">[tool ×3] i tre paragrafi, in un unico messaggio al padre</text>
  <line x1="418" y1="346" x2="418" y2="362" stroke="#161719" stroke-width="1.3" marker-end="url(#a)"/>
  <rect x="90" y="364" width="656" height="66" rx="5" fill="#ffffff" stroke="#a1245a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="100" y="382" font-size="10.5" font-weight="700" fill="#a1245a">merge</text>
  <text x="146" y="382" font-size="10" fill="#a1245a">⚠</text>
  <text x="164" y="382" font-size="9" font-style="italic" fill="#838383">il padre rimette insieme i pezzi: e qui si sbaglia</text>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="9" fill="#212529">
    <text x="100" y="402">… il recesso è di <tspan text-decoration="underline" fill="#a1245a" font-weight="700">30 giorni</tspan> (fonte: normativa 2026) …</text>
    <text x="100" y="418">… i concorrenti applicano <tspan text-decoration="underline" fill="#a1245a" font-weight="700">14 giorni</tspan> (fonte: siti, dati del 2025) …</text>
  </g>
  <text x="736" y="410" text-anchor="end" font-size="9.5" font-weight="700" fill="#a1245a">il punto fragile</text>
</svg>
