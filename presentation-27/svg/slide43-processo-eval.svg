<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 360" width="1140" height="360" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Pipeline di sei tappe: chi giudica, il dataset di test, i cluster di fallimento, checker deterministici, il giudice, in produzione; ognuna con che cosa si fa, che cosa ne esce e il rimando alla slide. Dall'ultima tappa una freccia di ritorno verso la terza: a ogni modifica si rigira tutto. Sopra, due fasce di ownership: l'esperto di dominio sulle tappe 1, 2, 3 e 5; il team di sviluppo dell'agente sulle tappe 4, 5, 6; la tappa 5 sta sotto entrambe. Sotto, la fascia Observability con i quattro sottoblocchi e le tappe che alimentano</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#161719"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a1245a"/></marker>
  </defs>

  <!-- ===== fasce di ownership ===== -->
  <rect x="20" y="22" width="558" height="26" rx="5" fill="#d1efea" stroke="#1ab197"/>
  <rect x="764" y="22" width="170" height="26" rx="5" fill="#d1efea" stroke="#1ab197"/>
  <text x="32" y="40" font-size="11.5" font-weight="700" fill="#0e7c6a">l'esperto di dominio</text>
  <text x="196" y="40" font-size="9.5" font-style="italic" fill="#0e7c6a">costruisce i dataset, decide i pass/fail, valida il giudice</text>
  <text x="849" y="40" text-anchor="middle" font-size="9.5" font-style="italic" fill="#0e7c6a">rientra: valida il giudice</text>
  <rect x="578" y="60" width="542" height="26" rx="5" fill="#dbeaf7" stroke="#4da0d7"/>
  <text x="590" y="78" font-size="11.5" font-weight="700" fill="#1d5f8a">il team di sviluppo dell'agente</text>
  <text x="820" y="78" font-size="9.5" font-style="italic" fill="#1d5f8a">scrive i checker e il giudice, esegue i test, li rigira a ogni modifica</text>
  <text x="849" y="106" text-anchor="middle" font-size="9" font-weight="600" fill="#a1245a">↓ dove i due si incontrano</text>

  <!-- ===== le sei tappe ===== -->
  <g fill="#ffffff" stroke="#161719" stroke-width="1.2">
    <rect x="20" y="118" width="170" height="150" rx="6"/>
    <rect x="206" y="118" width="170" height="150" rx="6"/>
    <rect x="392" y="118" width="170" height="150" rx="6"/>
    <rect x="578" y="118" width="170" height="150" rx="6"/>
    <rect x="950" y="118" width="170" height="150" rx="6"/>
  </g>
  <rect x="761" y="115" width="176" height="156" rx="8" fill="none" stroke="#4da0d7" stroke-width="1.5"/>
  <rect x="764" y="118" width="170" height="150" rx="6" fill="#ffffff" stroke="#1ab197" stroke-width="1.5"/>
  <!-- numeri -->
  <g font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="38" cy="138" r="11" fill="#a1245a"/><text x="38" y="142.5">1</text>
    <circle cx="224" cy="138" r="11" fill="#a1245a"/><text x="224" y="142.5">2</text>
    <circle cx="410" cy="138" r="11" fill="#a1245a"/><text x="410" y="142.5">3</text>
    <circle cx="596" cy="138" r="11" fill="#a1245a"/><text x="596" y="142.5">4</text>
    <circle cx="782" cy="138" r="11" fill="#a1245a"/><text x="782" y="142.5">5</text>
    <circle cx="968" cy="138" r="11" fill="#a1245a"/><text x="968" y="142.5">6</text>
  </g>
  <g font-size="12" font-weight="700" fill="#161719">
    <text x="56" y="143">Chi giudica</text>
    <text x="242" y="143">Il dataset di test</text>
    <text x="428" y="143" font-size="11.5">I cluster di fallimento</text>
    <text x="614" y="143" font-size="11">Checker deterministici</text>
    <text x="800" y="143">Il giudice</text>
    <text x="986" y="143">In produzione</text>
  </g>
  <g font-size="9" fill="#212529">
    <text x="30" y="166">una persona esperta del dominio</text>
    <text x="30" y="178">legge le tracce delle prime prove</text>
    <text x="30" y="190">e dice se sono andate bene</text>
    <text x="216" y="166">~100 casi, anche sintetici,</text>
    <text x="216" y="178">per dimensioni, ispirati</text>
    <text x="216" y="190">dalle tracce di prova</text>
    <text x="402" y="166">si rileggono i fallimenti e si</text>
    <text x="402" y="178">raggruppano per tipo, finché</text>
    <text x="402" y="190">le categorie non finiscono</text>
    <text x="588" y="166">codice che dice pass o fail,</text>
    <text x="588" y="178">dove è verificabile</text>
    <text x="774" y="166">un LLM-as-a-judge, validato</text>
    <text x="774" y="178">contro i giudizi dell'esperto</text>
    <text x="960" y="166">~100 tracce al mese, rilette</text>
    <text x="960" y="178">a mano; il dataset cresce</text>
  </g>
  <g font-size="9" font-weight="700" fill="#0e7c6a">
    <text x="30" y="216">→ un giudizio coerente</text>
    <text x="30" y="228">   su che cosa è «giusto»</text>
    <text x="216" y="216">→ un insieme fisso</text>
    <text x="216" y="228">   su cui rieseguire</text>
    <text x="402" y="216">→ le categorie, e per ciascuna</text>
    <text x="402" y="228">   la leva da tirare</text>
    <text x="588" y="216">→ un punteggio automatico</text>
    <text x="588" y="228">   e ripetibile</text>
    <text x="774" y="216">→ un punteggio anche dove</text>
    <text x="774" y="228">   non c'è un checker</text>
    <text x="960" y="216">→ regressioni scoperte</text>
    <text x="960" y="228">   a ogni modifica</text>
  </g>
  <g font-size="8.5" fill="#838383">
    <text x="30" y="256">Slide 44</text>
    <text x="216" y="256">Slide 45</text>
    <text x="402" y="256">Slide 46 · 48</text>
    <text x="588" y="256">Slide 47</text>
    <text x="774" y="256">Slide 47</text>
    <text x="960" y="256">Slide 49</text>
  </g>
  <!-- frecce fra le tappe -->
  <g stroke="#161719" stroke-width="1.4" marker-end="url(#a)">
    <line x1="190" y1="193" x2="204" y2="193"/>
    <line x1="376" y1="193" x2="390" y2="193"/>
    <line x1="562" y1="193" x2="576" y2="193"/>
    <line x1="748" y1="193" x2="762" y2="193"/>
    <line x1="934" y1="193" x2="948" y2="193"/>
  </g>
  <!-- freccia di ritorno -->
  <path d="M1035 268 v24 h-558 v-22" fill="none" stroke="#a1245a" stroke-width="1.6" marker-end="url(#ab)"/>
  <text x="756" y="308" text-anchor="middle" font-size="10" font-weight="600" fill="#a1245a">a ogni modifica (prompt, modello, tool): si rigira tutto</text>

  <!-- ===== fascia observability ===== -->
  <rect x="20" y="322" width="1100" height="32" rx="5" fill="#f6f6f6" stroke="#161719"/>
  <path d="M20,330 a8,8 0 0 1 8,-8 h140 v32 h-140 a8,8 0 0 1 -8,-8 Z" fill="#161719"/>
  <text x="94" y="343" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1" fill="#ffffff">OBSERVABILITY</text>
  <g fill="#ffffff" stroke="#dee2e6">
    <rect x="184" y="328" width="220" height="20" rx="4"/>
    <rect x="424" y="328" width="220" height="20" rx="4"/>
    <rect x="664" y="328" width="220" height="20" rx="4"/>
    <rect x="904" y="328" width="210" height="20" rx="4"/>
  </g>
  <g font-size="9.5" fill="#212529" text-anchor="middle">
    <text x="294" y="342"><tspan font-weight="700">Tracing</tspan> → alimenta 1 · 3 · 6</text>
    <text x="534" y="342"><tspan font-weight="700">Logging</tspan> → alimenta 1</text>
    <text x="774" y="342"><tspan font-weight="700">Metrics</tspan> → alimenta 6</text>
    <text x="1009" y="342"><tspan font-weight="700">Eval</tspan> → alimenta 4 · 5</text>
  </g>
</svg>
