<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 196" width="1140" height="196" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Il giro 1 della slide 9 del 26: in testa i tre strati del prefisso in forma compatta, poi la domanda dell'utente e la richiesta del modello cerca_ordine(4471) con stop_reason tool_use; a destra, dove stava il giro 2, un riquadro vuoto con un punto interrogativo</title>
  <!-- Ripresa del riquadro «giro 1» di slide9b-tool-call.svg del 26, alla stessa scala (righe da 16px, mono 11.5-12.5). -->

  <!-- giro 1 -->
  <text x="56" y="56" text-anchor="end" font-size="12.5" font-weight="600" fill="#838383">giro 1</text>
  <rect x="68" y="36" width="560" height="140" rx="7" fill="#f6f6f6" stroke="#dee2e6"/>
  <rect x="74" y="47" width="3" height="52" fill="#1ab197"/>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="12.5">
    <text x="84" y="58" fill="#6c757d" font-weight="600">[system]</text><text x="170" y="58" fill="#6c757d">Sei l'assistente di Acme… (ruolo e regole)</text>
    <text x="84" y="76" fill="#6c757d" font-weight="600">[tools]</text><text x="170" y="76" fill="#6c757d">cerca_ordine(id_ordine) — stato di un ordine</text>
    <text x="84" y="94" fill="#6c757d" font-weight="600">[skills]</text><text x="170" y="94" fill="#6c757d">rimborsi-acme · risposta-reclami-acme</text>
    <text x="84" y="112" fill="#161719" font-weight="600">[user]</text><text x="170" y="112" fill="#212529">Dov'è il mio ordine 4471?</text>
  </g>
  <text x="628" y="28" text-anchor="end" font-size="11.5" font-weight="600" fill="#0e7c6a">in testa, compatto: il prefisso della slide 13</text>

  <rect x="76" y="120" width="544" height="18" rx="5" fill="#a1245a"/>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="12.5">
    <text x="84" y="133" fill="#ecd3de">[assistant]</text><text x="170" y="133" fill="#ffffff">→ cerca_ordine("4471")</text>
  </g>
  <rect x="170" y="146" width="176" height="20" rx="4" fill="#ffffff" stroke="#a1245a" stroke-width="1.5"/>
  <text x="178" y="160" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700" fill="#a1245a">stop_reason: tool_use</text>
  <text x="358" y="160" font-size="12" font-weight="500" fill="#838383">il modello si ferma qui, e aspetta</text>

  <!-- giro 2: ancora vuoto -->
  <text x="668" y="56" text-anchor="end" font-size="12.5" font-weight="600" fill="#838383">giro 2</text>
  <rect x="680" y="36" width="392" height="140" rx="7" fill="none" stroke="#838383" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="876" y="128" text-anchor="middle" font-size="64" font-weight="700" fill="#838383">?</text>

  <!-- un solo turno dell'utente -->
  <path d="M 1084 36 C 1090 36 1088 42 1088 42 L 1088 100 C 1088 106 1090 104 1094 106 C 1090 108 1088 106 1088 112 L 1088 170 C 1088 170 1090 176 1084 176" fill="none" stroke="#838383" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text transform="rotate(90 1118 106)" x="1118" y="106" text-anchor="middle" font-size="12.5" font-weight="500" fill="#212529">un solo turno dell'utente</text>
</svg>
