<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>A sinistra l'API con venti parametri e una risposta di cinquemila righe, al centro l'adattatore dentro l'harness, a destra il tool con due parametri e tre campi di risposta; sotto, la variante salva e cerca: il risultato grande va su un file nel sandbox e al modello torna solo il puntatore</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#161719"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0e7c6a"/></marker>
  </defs>

  <!-- ===== l'API ===== -->
  <text x="12" y="22" font-size="12" font-weight="700" letter-spacing="1.6" fill="#a1245a">L'API</text>
  <text x="70" y="22" font-size="10.5" fill="#838383">per un programmatore</text>
  <rect x="12" y="32" width="228" height="104" rx="6" fill="#f6f6f6" stroke="#dee2e6"/>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" fill="#212529">
    <text x="24" y="52" font-weight="700">GET /orders/{id}</text>
    <text x="24" y="72">id, include, expand, locale,</text>
    <text x="24" y="88">currency, fields, sort, page,</text>
    <text x="24" y="104" fill="#9aa0a6">since, until, format, …</text>
    <text x="24" y="124" fill="#838383" font-family="Poppins, system-ui, sans-serif" font-weight="600">…20 parametri</text>
  </g>
  <!-- la risposta che scende oltre il bordo -->
  <path d="M12 156 V150 a6 6 0 0 1 6 -6 H234 a6 6 0 0 1 6 6 V156" fill="none" stroke="#838383"/>
  <line x1="12" y1="156" x2="12" y2="262" stroke="#838383"/>
  <line x1="240" y1="156" x2="240" y2="262" stroke="#838383"/>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" fill="#212529">
    <text x="24" y="166">{ "id": 4471,</text>
    <text x="24" y="182">  "customer": { … },</text>
    <text x="24" y="198" fill="#495057">  "items": [ {…}, {…}, … ],</text>
    <text x="24" y="214" fill="#6c757d">  "shipments": [ … ],</text>
    <text x="24" y="230" fill="#9aa0a6">  "history": [ … ],</text>
    <text x="24" y="246" fill="#c4c8cc">  "audit": [ … ],</text>
    <text x="24" y="262" fill="#dee2e6">  …</text>
  </g>
  <text x="12" y="282" font-size="11.5" font-weight="700" fill="#a1245a">~5.000 righe · ~50.000 token</text>

  <!-- ===== l'adattatore ===== -->
  <line x1="240" y1="90" x2="262" y2="90" stroke="#161719" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="264" y="60" width="112" height="60" rx="8" fill="#161719"/>
  <text x="320" y="86" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">adattatore</text>
  <text x="320" y="103" text-anchor="middle" font-size="10" font-weight="500" fill="#ffbe0b">dentro l'harness</text>
  <line x1="378" y1="90" x2="400" y2="90" stroke="#161719" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="320" y="138" text-anchor="middle" font-size="10.5" fill="#838383">traduce in</text>
  <text x="320" y="152" text-anchor="middle" font-size="10.5" fill="#838383">entrambe le direzioni</text>

  <!-- ===== il tool ===== -->
  <text x="400" y="22" font-size="12" font-weight="700" letter-spacing="1.6" fill="#a1245a">IL TOOL</text>
  <text x="474" y="22" font-size="10.5" fill="#838383">per il modello</text>
  <rect x="400" y="32" width="228" height="104" rx="6" fill="#f6f6f6" stroke="#dee2e6"/>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" fill="#212529">
    <text x="412" y="52" font-weight="700">cerca_ordine(id_ordine)</text>
    <text x="412" y="72" font-family="Poppins, system-ui, sans-serif" fill="#212529">stato di un ordine dato il suo</text>
    <text x="412" y="87" font-family="Poppins, system-ui, sans-serif" fill="#212529">identificativo: usalo quando…</text>
    <text x="412" y="108">id_ordine: string</text>
    <text x="412" y="124" fill="#838383" font-family="Poppins, system-ui, sans-serif" font-weight="600">1 parametro, e dice quando usarlo</text>
  </g>
  <rect x="400" y="150" width="228" height="48" rx="6" fill="#d1efea" stroke="#1ab197"/>
  <text x="412" y="170" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#212529">stato · data · corriere</text>
  <text x="412" y="188" font-size="11.5" font-weight="700" fill="#0e7c6a">~40 token</text>

  <!-- ===== salva e cerca ===== -->
  <line x1="12" y1="300" x2="628" y2="300" stroke="#dee2e6"/>
  <text x="12" y="322" font-size="12" font-weight="700" letter-spacing="1.6" fill="#a1245a">SALVA E CERCA</text>
  <text x="12" y="338" font-size="10.5" fill="#838383">quando il risultato è davvero grande</text>

  <path d="M200 268 C 230 300, 250 330, 264 352" fill="none" stroke="#838383" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="12" y="372" font-size="10.5" fill="#838383">l'harness lo scrive su file, e al modello</text>
  <text x="12" y="386" font-size="10.5" fill="#838383">torna solo il puntatore</text>

  <!-- il file nel sandbox -->
  <path d="M268 332 h44 l16 16 v58 h-60 z" fill="#ffffff" stroke="#161719" stroke-width="1.5"/>
  <path d="M312 332 v16 h16" fill="none" stroke="#161719" stroke-width="1.5"/>
  <g font-size="9.5" fill="#9aa0a6" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace">
    <text x="276" y="362">{ … }</text><text x="276" y="374">{ … }</text><text x="276" y="386">{ … }</text>
  </g>
  <text x="298" y="424" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" fill="#161719">export_4471.json</text>
  <text x="298" y="437" text-anchor="middle" font-size="10" fill="#838383">nel sandbox</text>

  <line x1="330" y1="372" x2="398" y2="372" stroke="#0e7c6a" stroke-width="1.5" marker-end="url(#at)"/>
  <rect x="400" y="336" width="228" height="44" rx="6" fill="#d1efea" stroke="#1ab197"/>
  <text x="410" y="354" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="10.5" fill="#212529"><tspan font-weight="600" fill="#0e7c6a">[tool]</tspan> salvato in export_4471.json</text>
  <text x="410" y="370" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="10.5" fill="#212529">(5.000 righe): cerca con grep</text>
  <rect x="400" y="388" width="228" height="20" rx="5" fill="#a1245a"/>
  <text x="408" y="402" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="10" fill="#ffffff">→ bash("grep stato export_4471.json")</text>
  <text x="400" y="428" font-size="10.5" fill="#0e7c6a" font-weight="600">in finestra entrano solo le righe che contano</text>
</svg>
