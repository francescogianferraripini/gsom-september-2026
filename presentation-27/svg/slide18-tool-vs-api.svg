<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" width="660" height="320" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>A sinistra il tool come lo vede il modello: un parametro, una descrizione che dice quando usarlo, tre campi di risposta; al centro l'adattatore dentro l'harness che orchestra le chiamate; a destra tre API atomiche del sistema (ordini, spedizioni, clienti), venti parametri e cinquemila righe di risposta, che l'adattatore chiama in sequenza e riduce</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#161719"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#838383"/></marker>
  </defs>

  <!-- ===== il tool: per il modello ===== -->
  <text x="12" y="22" font-size="12" font-weight="700" letter-spacing="1.6" fill="#a1245a">IL TOOL</text>
  <text x="86" y="22" font-size="10.5" fill="#838383">per il modello</text>
  <rect x="12" y="32" width="228" height="112" rx="6" fill="#f6f6f6" stroke="#dee2e6"/>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" fill="#212529">
    <text x="24" y="52" font-weight="700">cerca_ordine(id_ordine)</text>
    <text x="24" y="72" font-family="Poppins, system-ui, sans-serif" fill="#212529">stato, data e corriere di un ordine.</text>
    <text x="24" y="87" font-family="Poppins, system-ui, sans-serif" fill="#212529">Usalo quando il cliente chiede dov'è…</text>
    <text x="24" y="110">id_ordine: string</text>
    <text x="24" y="130" fill="#838383" font-family="Poppins, system-ui, sans-serif" font-weight="600">1 parametro, e dice quando usarlo</text>
  </g>
  <rect x="12" y="156" width="228" height="48" rx="6" fill="#d1efea" stroke="#1ab197"/>
  <text x="24" y="176" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#212529">stato · data · corriere</text>
  <text x="24" y="194" font-size="11.5" font-weight="700" fill="#0e7c6a">~40 token</text>
  <text x="12" y="228" font-size="10.5" font-weight="600" fill="#0e7c6a">un tool per compito del modello</text>

  <!-- ===== l'adattatore ===== -->
  <line x1="240" y1="118" x2="262" y2="118" stroke="#161719" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="264" y="88" width="112" height="60" rx="8" fill="#161719"/>
  <text x="320" y="114" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">adattatore</text>
  <text x="320" y="131" text-anchor="middle" font-size="10" font-weight="500" fill="#ffbe0b">dentro l'harness</text>
  <text x="320" y="166" text-anchor="middle" font-size="10.5" fill="#838383">orchestra tre chiamate,</text>
  <text x="320" y="180" text-anchor="middle" font-size="10.5" fill="#838383">tiene tre campi</text>

  <!-- ===== le API: per un programmatore ===== -->
  <text x="400" y="22" font-size="12" font-weight="700" letter-spacing="1.6" fill="#a1245a">LE API</text>
  <text x="458" y="22" font-size="10.5" fill="#838383">atomiche, disperse</text>

  <!-- tre endpoint, chiamati in sequenza -->
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="10.5" fill="#212529">
    <rect x="400" y="32" width="248" height="40" rx="6" fill="#ffffff" stroke="#838383" stroke-dasharray="5 4"/>
    <text x="412" y="48" font-weight="700">① GET /orders/{id}</text>
    <text x="412" y="63" fill="#838383" font-size="9.5">id, include, expand, locale, … 20 parametri</text>

    <rect x="400" y="80" width="248" height="40" rx="6" fill="#ffffff" stroke="#838383" stroke-dasharray="5 4"/>
    <text x="412" y="96" font-weight="700">② GET /shipments?order={id}</text>
    <text x="412" y="111" fill="#838383" font-size="9.5">carrier, status, events, since, …</text>

    <rect x="400" y="128" width="248" height="40" rx="6" fill="#ffffff" stroke="#838383" stroke-dasharray="5 4"/>
    <text x="412" y="144" font-weight="700">③ GET /customers/{cid}</text>
    <text x="412" y="159" fill="#838383" font-size="9.5">solo per sapere il nome sull'etichetta</text>
  </g>
  <!-- le frecce dell'adattatore verso le tre API -->
  <path d="M376 108 H388 V52 H398" fill="none" stroke="#838383" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ag)"/>
  <path d="M376 118 H388 V100 H398" fill="none" stroke="#838383" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ag)"/>
  <path d="M376 128 H388 V148 H398" fill="none" stroke="#838383" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ag)"/>

  <!-- la risposta che scende oltre il bordo -->
  <path d="M400 188 V182 a6 6 0 0 1 6 -6 H642 a6 6 0 0 1 6 6 V188" fill="none" stroke="#838383"/>
  <line x1="400" y1="188" x2="400" y2="288" stroke="#838383"/>
  <line x1="648" y1="188" x2="648" y2="288" stroke="#838383"/>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="10.5" fill="#212529">
    <text x="412" y="198">{ "id": 4471, "customer": { … },</text>
    <text x="412" y="213" fill="#495057">  "items": [ {…}, {…}, … ],</text>
    <text x="412" y="228" fill="#6c757d">  "shipments": [ { "events": [ … ] } ],</text>
    <text x="412" y="243" fill="#9aa0a6">  "history": [ … ],</text>
    <text x="412" y="258" fill="#c4c8cc">  "audit": [ … ],</text>
    <text x="412" y="273" fill="#dee2e6">  …</text>
  </g>
  <text x="400" y="306" font-size="11.5" font-weight="700" fill="#a1245a">tre risposte · ~5.000 righe · ~50.000 token</text>
</svg>
