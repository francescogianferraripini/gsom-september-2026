<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Un anello con quattro tappe in senso orario: tracce di produzione, circa cento al mese lette a mano con l'esperto, dataset e cluster aggiornati, checker e giudice rieseguiti, e si ricomincia. Tre tacche esterne, modifica al prompt, cambio di modello, tool nuovo, entrano nella tappa rieseguiti: ogni modifica rigira la catena. In uscita dall'anello due etichette: regressioni trovate e fix confermati. Al centro un calendario con ogni mese e una persona con un responsabile</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#161719"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a1245a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0e7c6a"/></marker>
  </defs>

  <!-- ===== l'anello ===== -->
  <g fill="none" stroke="#161719" stroke-width="2" marker-end="url(#a)">
    <path d="M470 92 A130 130 0 0 1 528 178"/>
    <path d="M528 262 A130 130 0 0 1 470 348"/>
    <path d="M330 348 A130 130 0 0 1 272 262"/>
    <path d="M272 178 A130 130 0 0 1 330 92"/>
  </g>
  <!-- tappe -->
  <!-- in alto: tracce di produzione -->
  <rect x="320" y="42" width="160" height="50" rx="6" fill="#ffffff" stroke="#161719" stroke-width="1.3"/>
  <text x="400" y="62" text-anchor="middle" font-size="10.5" font-weight="700" fill="#161719">tracce di produzione</text>
  <text x="400" y="78" text-anchor="middle" font-size="8.5" fill="#838383">ogni sessione ne lascia una</text>
  <!-- a destra: lette a mano -->
  <rect x="510" y="178" width="176" height="84" rx="6" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/>
  <text x="598" y="200" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0e7c6a">~100 al mese</text>
  <text x="598" y="216" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0e7c6a">lette a mano</text>
  <text x="598" y="234" text-anchor="middle" font-size="8.5" fill="#0e7c6a">con l'esperto: come nella</text>
  <text x="598" y="247" text-anchor="middle" font-size="8.5" fill="#0e7c6a">Slide 44, ma per sempre</text>
  <!-- in basso: dataset e cluster -->
  <rect x="316" y="348" width="168" height="50" rx="6" fill="#ffffff" stroke="#161719" stroke-width="1.3"/>
  <text x="400" y="368" text-anchor="middle" font-size="10.5" font-weight="700" fill="#161719">dataset e cluster aggiornati</text>
  <text x="400" y="384" text-anchor="middle" font-size="8.5" fill="#838383">i fallimenti nuovi diventano casi nuovi</text>
  <!-- a sinistra: rieseguiti -->
  <rect x="186" y="178" width="172" height="84" rx="6" fill="#ffffff" stroke="#a1245a" stroke-width="2"/>
  <text x="272" y="200" text-anchor="middle" font-size="10.5" font-weight="700" fill="#a1245a">checker e giudice</text>
  <text x="272" y="216" text-anchor="middle" font-size="10.5" font-weight="700" fill="#a1245a">rieseguiti</text>
  <text x="272" y="234" text-anchor="middle" font-size="8.5" fill="#212529">per intero, su tutto</text>
  <text x="272" y="247" text-anchor="middle" font-size="8.5" fill="#212529">il dataset</text>

  <!-- ===== il centro ===== -->
  <g transform="translate(372,190)">
    <rect x="0" y="0" width="30" height="28" rx="3" fill="#ffffff" stroke="#161719" stroke-width="1.2"/>
    <rect x="0" y="0" width="30" height="8" rx="3" fill="#161719"/>
    <g stroke="#adb5bd" stroke-width="1"><line x1="6" y1="14" x2="24" y2="14"/><line x1="6" y1="20" x2="24" y2="20"/></g>
  </g>
  <text x="410" y="210" font-size="9.5" font-weight="700" fill="#161719">ogni mese</text>
  <g transform="translate(387,246)">
    <circle cx="0" cy="-10" r="6" fill="#ffffff" stroke="#161719" stroke-width="1.3"/><path d="M-9 8 a9 9 0 0 1 18 0" fill="#ffffff" stroke="#161719" stroke-width="1.3"/>
  </g>
  <text x="404" y="250" font-size="9.5" font-weight="700" fill="#161719">un responsabile</text>
  <text x="404" y="263" font-size="8" fill="#838383">nel team dell'agente</text>

  <!-- ===== le tre tacche delle modifiche ===== -->
  <g font-size="9.5" font-weight="600" fill="#a1245a" text-anchor="end">
    <text x="128" y="182">modifica al prompt</text>
    <text x="128" y="222">cambio di modello</text>
    <text x="128" y="262">tool nuovo</text>
  </g>
  <g stroke="#a1245a" stroke-width="1.6" marker-end="url(#ab)" fill="none">
    <path d="M134 178 C 160 178, 160 196, 184 196"/>
    <line x1="134" y1="218" x2="184" y2="218"/>
    <path d="M134 258 C 160 258, 160 242, 184 242"/>
  </g>
  <text x="14" y="300" font-size="9.5" font-style="italic" font-weight="600" fill="#a1245a">ogni modifica rigira la catena</text>

  <!-- ===== in uscita ===== -->
  <path d="M230 262 C 230 300, 200 320, 160 330" fill="none" stroke="#0e7c6a" stroke-width="1.5" marker-end="url(#at)"/>
  <path d="M300 262 C 300 310, 260 348, 200 370" fill="none" stroke="#0e7c6a" stroke-width="1.5" marker-end="url(#at)"/>
  <rect x="20" y="318" width="132" height="26" rx="4" fill="#fbe3ec" stroke="#a1245a"/>
  <text x="86" y="335" text-anchor="middle" font-size="9.5" font-weight="700" fill="#a1245a">regressioni trovate</text>
  <rect x="60" y="360" width="132" height="26" rx="4" fill="#d1efea" stroke="#1ab197"/>
  <text x="126" y="377" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0e7c6a">fix confermati</text>
  <text x="20" y="416" font-size="9" fill="#838383">senza il ciclo: si torna al vibe eval (Slide 42)</text>
</svg>
