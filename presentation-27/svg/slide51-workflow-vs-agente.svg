<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Due pannelli. Workflow: un rombo tipo di richiesta con due rami, ciascuno verso una chiamata al modello con un prompt diverso, poi unisci e uscita: l'if è dell'harness, decide una regola, il modello esegue; chaining, routing, deterministico. Agente più subagente: l'esoscheletro padre ha nella lista dei tool, oltre a cerca_ordine, un tool ricerca_approfondita disegnato come un secondo esoscheletro più piccolo, con la propria finestra e i propri tool; una pill burgundy dal padre e una riga tool di ritorno con un paragrafo: è il modello a decidere se, quando e con che compito; il secondo agente è un tool del primo</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#161719"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a1245a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0e7c6a"/></marker>
    <g id="eso">
      <rect x="0" y="0" width="96" height="70" rx="5" fill="#ffffff" stroke="#161719" stroke-width="1.2"/>
      <rect x="4" y="4" width="20" height="62" rx="3" fill="#d1efea" stroke="#1ab197"/>
      <rect x="72" y="4" width="20" height="62" rx="3" fill="#fff2ce" stroke="#ffbe0b"/>
      <rect x="29" y="8" width="38" height="54" rx="6" fill="none" stroke="#4da0d7" stroke-width="1.5"/>
      <rect x="38" y="24" width="20" height="22" rx="2" fill="#a1245a"/>
    </g>
  </defs>
  <line x1="380" y1="10" x2="380" y2="430" stroke="#dee2e6"/>

  <!-- ===== WORKFLOW ===== -->
  <text x="12" y="24" font-size="12" font-weight="700" letter-spacing="1.4" fill="#838383">WORKFLOW</text>
  <text x="12" y="40" font-size="9.5" font-style="italic" fill="#838383">l'harness decide con una regola</text>
  <rect x="120" y="54" width="130" height="26" rx="4" fill="#f6f6f6" stroke="#dee2e6"/>
  <text x="185" y="71" text-anchor="middle" font-size="9.5" fill="#212529">richiesta del cliente</text>
  <line x1="185" y1="80" x2="185" y2="98" stroke="#161719" stroke-width="1.3" marker-end="url(#a)"/>
  <polygon points="185,100 255,138 185,176 115,138" fill="#ffffff" stroke="#161719" stroke-width="1.5"/>
  <text x="185" y="134" text-anchor="middle" font-size="9.5" font-weight="700" fill="#161719">tipo di</text>
  <text x="185" y="148" text-anchor="middle" font-size="9.5" font-weight="700" fill="#161719">richiesta?</text>
  <path d="M115 138 H70 V196" fill="none" stroke="#161719" stroke-width="1.3" marker-end="url(#a)"/>
  <path d="M255 138 H300 V196" fill="none" stroke="#161719" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="88" y="170" font-size="8.5" font-style="italic" fill="#838383">rimborso</text>
  <text x="262" y="170" font-size="8.5" font-style="italic" fill="#838383">reclamo</text>
  <g fill="#ffffff" stroke="#a1245a" stroke-width="1.3">
    <rect x="16" y="198" width="120" height="50" rx="4"/>
    <rect x="240" y="198" width="120" height="50" rx="4"/>
  </g>
  <g font-size="9.5" text-anchor="middle" fill="#212529">
    <text x="76" y="216" font-weight="700">chiamata al modello</text>
    <text x="76" y="232" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="9">prompt A: rimborsi</text>
    <text x="300" y="216" font-weight="700">chiamata al modello</text>
    <text x="300" y="232" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="9">prompt B: reclami</text>
  </g>
  <path d="M76 248 V280 H176" fill="none" stroke="#161719" stroke-width="1.3"/>
  <path d="M300 248 V280 H194" fill="none" stroke="#161719" stroke-width="1.3"/>
  <line x1="185" y1="280" x2="185" y2="296" stroke="#161719" stroke-width="1.3" marker-end="url(#a)"/>
  <rect x="140" y="298" width="90" height="26" rx="4" fill="#f6f6f6" stroke="#dee2e6"/>
  <text x="185" y="315" text-anchor="middle" font-size="9.5" fill="#212529">unisci</text>
  <line x1="185" y1="324" x2="185" y2="342" stroke="#161719" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="185" y="358" text-anchor="middle" font-size="9.5" fill="#838383">uscita</text>
  <text x="185" y="392" text-anchor="middle" font-size="10" font-style="italic" fill="#161719">l'if è dell'harness: decide una regola,</text>
  <text x="185" y="406" text-anchor="middle" font-size="10" font-style="italic" fill="#161719">il modello esegue</text>
  <text x="185" y="428" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="700" fill="#838383">chaining · routing · deterministico</text>

  <!-- ===== AGENTE + SUBAGENTE ===== -->
  <text x="396" y="24" font-size="12" font-weight="700" letter-spacing="1.4" fill="#a1245a">AGENTE + SUBAGENTE</text>
  <text x="396" y="40" font-size="9.5" font-style="italic" fill="#838383">il modello decide se, quando, con che compito</text>
  <!-- il padre -->
  <text x="396" y="62" font-size="9.5" font-weight="700" fill="#161719">l'agente padre</text>
  <rect x="396" y="68" width="214" height="290" rx="6" fill="#ffffff" stroke="#161719" stroke-width="1.3"/>
  <use href="#eso" x="455" y="76"/>
  <!-- la finestra del padre -->
  <rect x="404" y="154" width="198" height="196" rx="4" fill="#ffffff" stroke="#161719" stroke-width="1"/>
  <rect x="408" y="158" width="190" height="60" rx="3" fill="#d1efea" stroke="#1ab197"/>
  <text x="414" y="170" font-size="8.5" font-weight="700" fill="#0e7c6a">prefisso · tool dichiarati</text>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="8.5" fill="#0e7c6a">
    <text x="414" y="186">cerca_ordine(id)</text>
    <text x="414" y="200">crea_ticket(id, testo)</text>
  </g>
  <rect x="410" y="204" width="186" height="12" rx="2" fill="#ffffff" stroke="#a1245a" stroke-width="1"/>
  <text x="414" y="213" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="8.5" font-weight="700" fill="#a1245a">ricerca_approfondita(compito)</text>
  <text x="414" y="236" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="8.5" fill="#6c757d">[user] resi 2026: cosa cambia?</text>
  <rect x="410" y="244" width="186" height="14" rx="7" fill="#a1245a"/>
  <text x="416" y="254" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="8.5" fill="#ffffff">→ ricerca_approfondita("resi")</text>
  <rect x="410" y="266" width="186" height="40" rx="3" fill="#d1efea" stroke="#1ab197"/>
  <text x="416" y="278" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="8.5" fill="#0e7c6a">[tool] Dal 1° marzo 2026 il</text>
  <text x="416" y="290" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="8.5" fill="#0e7c6a">recesso passa da 14 a 30 giorni</text>
  <text x="416" y="302" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="8.5" fill="#0e7c6a">per gli acquisti online (3 fonti)</text>
  <text x="416" y="326" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="8.5" fill="#6c757d">[assistant] Dal 1° marzo …</text>
  <text x="503" y="344" text-anchor="middle" font-size="8" font-style="italic" fill="#838383">nel padre: una richiesta, un paragrafo</text>
  <!-- il figlio -->
  <path d="M596 210 C 626 210, 626 150, 644 150" fill="none" stroke="#a1245a" stroke-width="1.4" marker-end="url(#ab)"/>
  <text x="644" y="72" font-size="9.5" font-weight="700" fill="#161719">il tool è un agente</text>
  <rect x="644" y="78" width="108" height="200" rx="6" fill="#fff2ce" stroke="#ffbe0b" stroke-width="1.3"/>
  <use href="#eso" x="660" y="86" transform="translate(660 86) scale(0.8) translate(-660 -86)"/>
  <rect x="650" y="150" width="96" height="120" rx="3" fill="#ffffff" stroke="#161719" stroke-width="1"/>
  <rect x="654" y="154" width="88" height="40" rx="2" fill="#d1efea" stroke="#1ab197"/>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="7.5" fill="#0e7c6a">
    <text x="658" y="164">sei un ricercatore</text>
    <text x="658" y="176">cerca_web(q)</text>
    <text x="658" y="188">leggi_pagina(url)</text>
  </g>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="7.5" fill="#6c757d">
    <text x="658" y="208">→ cerca_web …</text>
    <text x="658" y="220">[tool] 10 risult.</text>
    <text x="658" y="232">→ leggi_pagina …</text>
    <text x="658" y="244">[tool] 4.000 tok.</text>
    <text x="658" y="256">⋯ ×20 giri</text>
  </g>
  <text x="698" y="292" text-anchor="middle" font-size="8" font-style="italic" fill="#838383">la propria finestra,</text>
  <text x="698" y="304" text-anchor="middle" font-size="8" font-style="italic" fill="#838383">i propri tool</text>
  <path d="M698 278 C 698 320, 650 330, 604 300" fill="none" stroke="#0e7c6a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#at)"/>
  <text x="660" y="338" text-anchor="middle" font-size="8" fill="#0e7c6a">torna un paragrafo</text>

  <text x="566" y="392" text-anchor="middle" font-size="10" font-style="italic" fill="#161719">è il modello a decidere se, quando</text>
  <text x="566" y="406" text-anchor="middle" font-size="10" font-style="italic" fill="#161719">e con che compito</text>
  <text x="566" y="428" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="700" fill="#a1245a">il secondo agente è un tool del primo</text>
</svg>
