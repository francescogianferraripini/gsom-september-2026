<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>L'harness al centro con la finestra a strati; intorno quattro server MCP: ordini con 4 tool, CRM con 50, posta con 12, calendario con 8. Ogni server manda le sue definizioni nello strato della dichiarazione dei tool, con spessore proporzionale; lo strato risulta enorme: circa 13.000 token a ogni giro, prima della domanda. In basso il CRM ridisegnato: 6 tool e circa 900 token, un tool per compito e non per endpoint</title>
  <defs>
    <marker id="mt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1ab197"/></marker>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a1245a"/></marker>
    <marker id="ml" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4da0d7"/></marker>
    <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d99a00"/></marker>
  </defs>

  <!-- ===== l'harness con la finestra ===== -->
  <text x="230" y="22" font-size="12.5" font-weight="700" fill="#161719">harness</text>
  <rect x="230" y="30" width="240" height="304" rx="8" fill="#f6f6f6" stroke="#161719"/>
  <rect x="246" y="44" width="208" height="276" rx="6" fill="#ffffff" stroke="#161719" stroke-width="1.2"/>
  <rect x="254" y="52" width="192" height="26" rx="4" fill="#e9ecef" stroke="#dee2e6"/>
  <text x="262" y="69" font-size="10.5" font-weight="600" fill="#838383">system prompt · ~400</text>

  <!-- lo strato delle dichiarazioni: sproporzionato -->
  <rect x="254" y="84" width="192" height="156" rx="4" fill="#fdf1f6" stroke="#a1245a" stroke-width="1.5"/>
  <text x="262" y="101" font-size="10.5" font-weight="700" fill="#a1245a">dichiarazione dei tool</text>
  <g>
    <rect x="262" y="108" width="9" height="124" fill="#1ab197"/>
    <rect x="271" y="108" width="128" height="124" fill="#a1245a"/>
    <rect x="399" y="108" width="28" height="124" fill="#4da0d7"/>
    <rect x="427" y="108" width="17" height="124" fill="#ffbe0b"/>
  </g>
  <g text-anchor="middle" fill="#ffffff" font-weight="700">
    <text x="335" y="160" font-size="13">CRM</text>
    <text x="335" y="177" font-size="11">50 tool</text>
    <text x="335" y="194" font-size="11">~9.000</text>
  </g>

  <rect x="254" y="246" width="192" height="26" rx="4" fill="#e9ecef" stroke="#dee2e6"/>
  <text x="262" y="263" font-size="10.5" font-weight="600" fill="#838383">indice delle skill · ~800</text>
  <rect x="254" y="278" width="192" height="34" rx="4" fill="none" stroke="#838383" stroke-dasharray="4 3"/>
  <text x="262" y="299" font-size="10.5" font-weight="600" fill="#838383">messaggi · ancora nessuno</text>

  <text x="350" y="354" text-anchor="middle" font-size="12" font-weight="700" fill="#a1245a">~13.000 token a ogni giro, prima della domanda</text>

  <!-- ===== i quattro server ===== -->
  <g id="ordini">
    <rect x="20" y="60" width="150" height="54" rx="6" fill="#fff2ce" stroke="#ffbe0b"/>
    <text x="95" y="82" text-anchor="middle" font-size="11.5" font-weight="700" fill="#161719">server MCP «ordini»</text>
    <text x="95" y="100" text-anchor="middle" font-size="10.5" fill="#212529">4 tool · <tspan font-weight="700" fill="#0e7c6a">~600</tspan> token</text>
    <line x1="170" y1="87" x2="250" y2="112" stroke="#1ab197" stroke-width="1.5" marker-end="url(#mt)"/>
  </g>
  <g id="posta">
    <rect x="20" y="200" width="150" height="54" rx="6" fill="#fff2ce" stroke="#ffbe0b"/>
    <text x="95" y="222" text-anchor="middle" font-size="11.5" font-weight="700" fill="#161719">server MCP «posta»</text>
    <text x="95" y="240" text-anchor="middle" font-size="10.5" fill="#212529">12 tool · <tspan font-weight="700" fill="#2f6f99">~2.000</tspan> token</text>
    <line x1="170" y1="227" x2="250" y2="200" stroke="#4da0d7" stroke-width="4" marker-end="url(#ml)"/>
  </g>
  <g id="crm">
    <rect x="530" y="60" width="150" height="54" rx="6" fill="#fff2ce" stroke="#ffbe0b"/>
    <text x="605" y="82" text-anchor="middle" font-size="11.5" font-weight="700" fill="#161719">server MCP «CRM»</text>
    <text x="605" y="100" text-anchor="middle" font-size="10.5" fill="#212529">50 tool · <tspan font-weight="700" fill="#a1245a">~9.000</tspan> token</text>
    <line x1="530" y1="87" x2="450" y2="112" stroke="#a1245a" stroke-width="11" marker-end="url(#mb)"/>
    <text x="605" y="134" text-anchor="middle" font-size="10.5" font-weight="600" fill="#a1245a">50 endpoint → 50 tool:</text>
    <text x="605" y="148" text-anchor="middle" font-size="10.5" font-weight="600" fill="#a1245a">mappato 1:1</text>
  </g>
  <g id="calendario">
    <rect x="530" y="200" width="150" height="54" rx="6" fill="#fff2ce" stroke="#ffbe0b"/>
    <text x="605" y="222" text-anchor="middle" font-size="11.5" font-weight="700" fill="#161719">server MCP «calendario»</text>
    <text x="605" y="240" text-anchor="middle" font-size="10.5" fill="#212529">8 tool · <tspan font-weight="700" fill="#b8860b">~1.200</tspan> token</text>
    <line x1="530" y1="227" x2="450" y2="200" stroke="#ffbe0b" stroke-width="3" marker-end="url(#ma)"/>
  </g>

  <!-- ===== la versione corretta ===== -->
  <line x1="20" y1="372" x2="680" y2="372" stroke="#dee2e6"/>
  <rect x="20" y="384" width="150" height="48" rx="6" fill="#ffffff" stroke="#1ab197" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="95" y="404" text-anchor="middle" font-size="11" font-weight="700" fill="#161719">«CRM», rifatto</text>
  <text x="95" y="421" text-anchor="middle" font-size="10.5" fill="#212529">6 tool · <tspan font-weight="700" fill="#0e7c6a">~900</tspan> token</text>
  <text x="186" y="402" font-size="11.5" font-weight="600" fill="#0e7c6a">un tool per compito del modello,</text>
  <text x="186" y="418" font-size="11.5" font-weight="600" fill="#0e7c6a">non per endpoint dell'API</text>
  <rect x="440" y="390" width="128" height="12" fill="#ecd3de"/>
  <text x="576" y="400" font-size="10.5" fill="#a1245a">~9.000, prima</text>
  <rect x="440" y="410" width="13" height="12" fill="#1ab197"/>
  <text x="576" y="420" font-size="10.5" fill="#0e7c6a">~900, dopo</text>
</svg>
