<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Quattro momenti. ① i casi falliti sparsi, una trentina di punti con etichette brevi. ② gli stessi punti raggruppati in cinque cluster con nome e conteggio: regola ignorata 11, parametro sbagliato 7, fatto mancante 5, vincolo perso 3, altro 2. ③ la scala delle cinque leve, con una freccia da ogni cluster alla sua leva e il cluster più grande, regola ignorata, in evidenza verso Prompt. ④ una fascia in basso: individuata la leva si applica la correzione e si rimisura, sull'esempio reale NurtureBoss: i cluster contati (conversation-flow 110, handoff 70, rescheduling 60), la riga aggiunta al system prompt sul formato delle date, e le due barre della rimisurazione, dal 33 al 95 per cento</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#838383"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a1245a"/></marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#161719"/></marker>
  </defs>

  <!-- ===== ① i fallimenti sparsi ===== -->
  <text x="12" y="22" font-size="11" font-weight="700" fill="#161719">① i casi falliti</text>
  <text x="12" y="36" font-size="9" fill="#838383">28 su 100, riletti uno per uno</text>
  <g fill="#a1245a" fill-opacity="0.75">
    <circle cx="30" cy="64" r="4"/><circle cx="118" cy="56" r="4"/><circle cx="168" cy="68" r="4"/><circle cx="216" cy="58" r="4"/>
    <circle cx="48" cy="102" r="4"/><circle cx="118" cy="94" r="4"/><circle cx="176" cy="106" r="4"/><circle cx="222" cy="96" r="4"/>
    <circle cx="26" cy="140" r="4"/><circle cx="86" cy="132" r="4"/><circle cx="140" cy="144" r="4"/><circle cx="206" cy="134" r="4"/>
    <circle cx="60" cy="174" r="4"/><circle cx="112" cy="182" r="4"/><circle cx="172" cy="170" r="4"/><circle cx="228" cy="180" r="4"/>
    <circle cx="34" cy="212" r="4"/><circle cx="96" cy="220" r="4"/><circle cx="154" cy="208" r="4"/><circle cx="212" cy="222" r="4"/>
    <circle cx="52" cy="256" r="4"/><circle cx="124" cy="248" r="4"/><circle cx="184" cy="260" r="4"/><circle cx="230" cy="250" r="4"/>
    <circle cx="28" cy="288" r="4"/><circle cx="100" cy="294" r="4"/><circle cx="160" cy="286" r="4"/><circle cx="216" cy="292" r="4"/>
  </g>
  <g font-size="7.5" font-style="italic" fill="#6c757d">
    <text x="38" y="67">"4471 invece di 004471"</text>
    <text x="126" y="59">"promette il rimborso"</text>
    <text x="56" y="105">"non cita il listino"</text>
    <text x="126" y="97">"loop di 12 chiamate"</text>
    <text x="34" y="143">"ignora: mai scusarsi"</text>
    <text x="148" y="147">"data in formato USA"</text>
    <text x="68" y="177">"dimentica il tono"</text>
    <text x="42" y="215">"promette tempi"</text>
    <text x="104" y="223">"documento sbagliato"</text>
    <text x="60" y="259">"tool scelto male"</text>
    <text x="36" y="291">"risposta in inglese"</text>
    <text x="168" y="289">"perde il vincolo"</text>
  </g>

  <!-- ===== si raggruppano ===== -->
  <line x1="248" y1="176" x2="282" y2="176" stroke="#161719" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="265" y="164" text-anchor="middle" font-size="9" font-weight="600" fill="#161719">si</text>
  <text x="265" y="194" text-anchor="middle" font-size="9" font-weight="600" fill="#161719">raggruppano</text>

  <!-- ===== ② i cluster (allineati alle leve) ===== -->
  <text x="300" y="22" font-size="11" font-weight="700" fill="#161719">② i cluster</text>
  <text x="300" y="36" font-size="9" fill="#838383">un nome, un conteggio</text>
  <!-- altro · 2 -> Modello y=70 -->
  <g fill="#a1245a" fill-opacity="0.75"><circle cx="306" cy="70" r="4"/><circle cx="317" cy="70" r="4"/></g>
  <text x="330" y="74" font-size="9.5" fill="#212529">altro · <tspan font-weight="700">2</tspan></text>
  <!-- vincolo perso · 3 -> Harness y=120 -->
  <g fill="#a1245a" fill-opacity="0.75"><circle cx="306" cy="120" r="4"/><circle cx="317" cy="120" r="4"/><circle cx="328" cy="120" r="4"/></g>
  <text x="340" y="124" font-size="9.5" fill="#212529">vincolo perso a metà sessione · <tspan font-weight="700">3</tspan></text>
  <!-- parametro sbagliato · 7 -> Tool y=170 -->
  <g fill="#a1245a" fill-opacity="0.75"><circle cx="306" cy="170" r="4"/><circle cx="317" cy="170" r="4"/><circle cx="328" cy="170" r="4"/><circle cx="339" cy="170" r="4"/><circle cx="350" cy="170" r="4"/><circle cx="361" cy="170" r="4"/><circle cx="372" cy="170" r="4"/></g>
  <text x="384" y="174" font-size="9.5" fill="#212529">parametro sbagliato · <tspan font-weight="700">7</tspan></text>
  <!-- fatto mancante · 5 -> KB y=220 -->
  <g fill="#a1245a" fill-opacity="0.75"><circle cx="306" cy="220" r="4"/><circle cx="317" cy="220" r="4"/><circle cx="328" cy="220" r="4"/><circle cx="339" cy="220" r="4"/><circle cx="350" cy="220" r="4"/></g>
  <text x="362" y="224" font-size="9.5" fill="#212529">fatto mancante · <tspan font-weight="700">5</tspan></text>
  <!-- regola ignorata · 11 -> Prompt y=270 (in evidenza) -->
  <rect x="296" y="252" width="240" height="40" rx="5" fill="#fff2ce" stroke="#ffbe0b" stroke-width="1.5"/>
  <g fill="#a1245a"><circle cx="306" cy="266" r="4"/><circle cx="317" cy="266" r="4"/><circle cx="328" cy="266" r="4"/><circle cx="339" cy="266" r="4"/><circle cx="350" cy="266" r="4"/><circle cx="361" cy="266" r="4"/><circle cx="372" cy="266" r="4"/><circle cx="383" cy="266" r="4"/><circle cx="394" cy="266" r="4"/><circle cx="405" cy="266" r="4"/><circle cx="416" cy="266" r="4"/></g>
  <text x="428" y="270" font-size="9.5" fill="#212529">regola ignorata · <tspan font-weight="700">11</tspan></text>
  <text x="306" y="285" font-size="9" font-weight="700" fill="#a1245a">il più frequente, e il più facile</text>

  <!-- ===== ③ la scala delle leve ===== -->
  <text x="560" y="22" font-size="11" font-weight="700" fill="#161719">③ la leva (Slide 40)</text>
  <g font-size="9.5" font-weight="700" text-anchor="middle">
    <rect x="600" y="56" width="120" height="28" rx="4" fill="#f6f6f6" stroke="#838383" stroke-dasharray="4 3"/><text x="660" y="74" fill="#6c757d">5 · Modello</text>
    <rect x="590" y="106" width="120" height="28" rx="4" fill="#d1efea" stroke="#1ab197"/><text x="650" y="124" fill="#0e7c6a">4 · Harness</text>
    <rect x="580" y="156" width="120" height="28" rx="4" fill="#d1efea" stroke="#1ab197"/><text x="640" y="174" fill="#0e7c6a">3 · Tool</text>
    <rect x="570" y="206" width="120" height="28" rx="4" fill="#d1efea" stroke="#1ab197"/><text x="630" y="224" fill="#0e7c6a">2 · Knowledge base</text>
    <rect x="560" y="256" width="120" height="28" rx="4" fill="#d1efea" stroke="#1ab197" stroke-width="2.5"/><text x="620" y="274" fill="#0e7c6a">1 · Prompt</text>
  </g>
  <!-- frecce cluster -> leva -->
  <g stroke="#838383" stroke-width="1.2" marker-end="url(#a)" fill="none">
    <line x1="372" y1="70" x2="596" y2="70" stroke-dasharray="4 3"/>
    <line x1="520" y1="120" x2="586" y2="120"/>
    <line x1="510" y1="170" x2="576" y2="170"/>
    <line x1="460" y1="220" x2="566" y2="220"/>
  </g>
  <line x1="538" y1="270" x2="556" y2="270" stroke="#a1245a" stroke-width="2.2" marker-end="url(#ab)"/>
  <text x="484" y="66" font-size="8" font-style="italic" fill="#838383">ciò che resta dopo tutto il resto</text>

  <!-- la leva individuata scende nel quarto momento -->
  <line x1="620" y1="286" x2="620" y2="304" stroke="#161719" stroke-width="1.6" marker-end="url(#ak)"/>
  <text x="630" y="300" font-size="8.5" font-weight="700" fill="#161719">è qui che si corregge</text>

  <!-- ===== ④ si corregge, e si rimisura ===== -->
  <rect x="12" y="310" width="736" height="126" rx="6" fill="#ffffff" stroke="#161719" stroke-width="1.2"/>
  <rect x="12" y="310" width="736" height="20" rx="6" fill="#161719"/>
  <text x="22" y="324" font-size="9.5" font-weight="700" fill="#ffffff">④ individuata la leva, si applica la correzione — e si rimisura <tspan font-weight="500" fill="#c4c8cc">· esempio reale: NurtureBoss, assistente per affitti (hamel.dev, Field Guide)</tspan></text>

  <!-- A · i cluster contati, sul caso reale -->
  <text x="22" y="348" font-size="8.5" font-weight="700" fill="#838383">i cluster, contati</text>
  <rect x="18" y="388" width="286" height="19" rx="3" fill="#fff2ce" stroke="#ffbe0b"/>
  <g font-size="8.5">
    <rect x="24" y="356" width="104" height="13" fill="#a1245a" fill-opacity="0.75"/><text x="140" y="366" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" fill="#212529">conversation-flow · <tspan font-weight="700">110</tspan></text>
    <rect x="24" y="374" width="66" height="13" fill="#a1245a" fill-opacity="0.75"/><text x="140" y="384" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" fill="#212529">handoff · <tspan font-weight="700">70</tspan></text>
    <rect x="24" y="392" width="57" height="13" fill="#a1245a"/><text x="140" y="402" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" fill="#212529"><tspan font-weight="700">rescheduling · 60</tspan></text>
  </g>
  <text x="22" y="422" font-size="8.5" font-style="italic" fill="#838383">tre categorie, oltre il 60% dei problemi</text>

  <!-- A -> B -->
  <line x1="308" y1="397" x2="322" y2="397" stroke="#161719" stroke-width="1.4" marker-end="url(#ak)"/>

  <!-- B · la correzione, sulla leva -->
  <text x="330" y="348" font-size="8.5" font-weight="700" fill="#838383">la correzione, sulla leva: il prompt</text>
  <rect x="330" y="356" width="190" height="49" rx="4" fill="#f6f6f6" stroke="#dee2e6"/>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="8" fill="#212529">
    <text x="338" y="370"><tspan font-weight="700" fill="#0e7c6a">+</tspan> Le date vanno sempre</text>
    <text x="338" y="382">  espresse in formato</text>
    <text x="338" y="394">  europeo: gg/mm/aaaa.</text>
  </g>
  <text x="330" y="422" font-size="8.5" font-style="italic" fill="#0e7c6a">una riga aggiunta al system prompt</text>

  <!-- B -> C -->
  <line x1="524" y1="380" x2="538" y2="380" stroke="#161719" stroke-width="1.4" marker-end="url(#ak)"/>

  <!-- C · la rimisurazione -->
  <text x="546" y="348" font-size="8.5" font-weight="700" fill="#838383">si rilancia il dataset, e si rimisura</text>
  <g font-size="8.5" fill="#6c757d">
    <text x="546" y="369">prima</text>
    <text x="546" y="393">dopo</text>
  </g>
  <rect x="582" y="359" width="51" height="13" fill="#a1245a" fill-opacity="0.75"/>
  <text x="639" y="369" font-size="8.5" font-weight="700" fill="#a1245a">33%</text>
  <rect x="582" y="383" width="147" height="13" fill="#1ab197"/>
  <text x="697" y="393" font-size="8.5" font-weight="700" fill="#ffffff">95%</text>
  <text x="540" y="422" font-size="8" font-style="italic" fill="#0e7c6a">senza la seconda misura non si sa se è servita</text>
</svg>
