<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>A sinistra la finestra a strati, corta: prefisso, storia e tre righe puntatore al posto dei risultati grandi. A destra il filesystem del sandbox con i tre file e le dimensioni reali; frecce scrive e rilegge quando serve. In basso la linea del tempo con la sessione di oggi e quella di domani: la finestra muore, i file attraversano il taglio</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#161719"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0e7c6a"/></marker>
    <g id="doc">
      <path d="M0 0 h30 l12 12 v40 h-42 z" fill="#ffffff" stroke="#161719" stroke-width="1.3"/>
      <path d="M30 0 v12 h12" fill="none" stroke="#161719" stroke-width="1.3"/>
    </g>
  </defs>

  <!-- ===== la finestra: i puntatori ===== -->
  <text x="12" y="24" font-size="12" font-weight="700" fill="#161719">la finestra</text>
  <rect x="12" y="32" width="250" height="220" rx="5" fill="#ffffff" stroke="#161719" stroke-width="1.2"/>
  <rect x="18" y="38" width="238" height="44" rx="3" fill="#d1efea" stroke="#1ab197"/>
  <text x="26" y="64" font-size="10.5" font-weight="700" fill="#0e7c6a">prefisso</text>
  <rect x="18" y="88" width="238" height="44" rx="3" fill="#f6f6f6" stroke="#dee2e6"/>
  <text x="26" y="106" font-size="10.5" font-weight="600" fill="#838383">storia</text>
  <text x="26" y="122" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="9" fill="#6c757d">[user] … [assistant] …</text>
  <g fill="#d1efea" stroke="#1ab197">
    <rect x="18" y="142" width="238" height="20" rx="3"/>
    <rect x="18" y="168" width="238" height="20" rx="3"/>
    <rect x="18" y="194" width="238" height="20" rx="3"/>
  </g>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="9" fill="#212529">
    <text x="26" y="156">ordini_08.json · 12.480 righe · grep</text>
    <text x="26" y="182">contratto.md · 40 pagine · head</text>
    <text x="26" y="208">piano.md · scritto dal modello</text>
  </g>
  <text x="137" y="238" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0e7c6a">in finestra: i puntatori</text>

  <!-- ===== il filesystem del sandbox ===== -->
  <text x="430" y="24" font-size="12" font-weight="700" fill="#161719">il filesystem del sandbox</text>
  <rect x="430" y="32" width="258" height="220" rx="5" fill="#f6f6f6" stroke="#838383" stroke-dasharray="6 4"/>
  <use href="#doc" x="446" y="44"/>
  <text x="500" y="62" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="600" fill="#161719">ordini_08.json</text>
  <text x="500" y="78" font-size="10" fill="#838383">~90.000 token</text>
  <use href="#doc" x="446" y="114"/>
  <text x="500" y="132" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="600" fill="#161719">contratto.md</text>
  <text x="500" y="148" font-size="10" fill="#838383">~30.000 token</text>
  <use href="#doc" x="446" y="184"/>
  <text x="500" y="202" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="600" fill="#161719">piano.md</text>
  <text x="500" y="218" font-size="10" fill="#838383">~400 token</text>

  <!-- frecce scrive / rilegge -->
  <line x1="262" y1="150" x2="442" y2="70" stroke="#161719" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="262" y1="178" x2="442" y2="140" stroke="#161719" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="262" y1="204" x2="442" y2="210" stroke="#161719" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="352" y="96" text-anchor="middle" font-size="10" font-weight="600" fill="#161719">scrive →</text>
  <path d="M442 228 C 400 250, 320 250, 264 214" fill="none" stroke="#0e7c6a" stroke-width="1.5" marker-end="url(#at)"/>
  <text x="352" y="264" text-anchor="middle" font-size="10" font-weight="600" fill="#0e7c6a">← rilegge quando serve</text>
  <rect x="256" y="270" width="200" height="16" rx="4" fill="#a1245a"/>
  <text x="356" y="282" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="9" fill="#ffffff">→ bash("grep … ordini_08.json")</text>

  <!-- ===== la linea del tempo: due sessioni ===== -->
  <g font-size="11" font-weight="700" fill="#161719">
    <text x="12" y="318">sessione di oggi</text>
    <text x="370" y="318">sessione di domani</text>
  </g>
  <rect x="12" y="326" width="318" height="34" rx="4" fill="#ffffff" stroke="#161719" stroke-width="1.2"/>
  <rect x="18" y="332" width="120" height="22" rx="2" fill="#d1efea"/>
  <rect x="144" y="332" width="180" height="22" rx="2" fill="#f6f6f6"/>
  <text x="234" y="347" text-anchor="middle" font-size="9.5" fill="#838383">la finestra di oggi</text>
  <rect x="370" y="326" width="318" height="34" rx="4" fill="#ffffff" stroke="#161719" stroke-width="1.2"/>
  <rect x="376" y="332" width="120" height="22" rx="2" fill="#d1efea"/>
  <text x="592" y="347" text-anchor="middle" font-size="9.5" font-style="italic" fill="#838383">riparte vuota</text>
  <!-- il taglio -->
  <path d="M350 300 l-6 12 l12 12 l-12 12 l12 12 l-12 12 l12 12 l-6 12" fill="none" stroke="#a1245a" stroke-width="2"/>
  <text x="350" y="410" text-anchor="middle" font-size="10.5" font-weight="700" fill="#a1245a">la finestra muore, i file restano</text>
  <!-- i file, sotto entrambe -->
  <rect x="12" y="368" width="676" height="26" rx="4" fill="#fff2ce" stroke="#ffbe0b"/>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="9.5" fill="#161719">
    <text x="24" y="385">ordini_08.json</text>
    <text x="140" y="385">contratto.md</text>
    <text x="240" y="385">piano.md</text>
  </g>
  <text x="676" y="385" text-anchor="end" font-size="9.5" font-weight="600" fill="#161719">i file attraversano il taglio</text>
</svg>
