<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1054 555" width="1054" height="555" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Modello standard e modello di reasoning a confronto: i token di ragionamento interposti prima della risposta</title>
  <defs>
    <marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#838383"/>
    </marker>
    <marker id="ah-burg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a1245a"/>
    </marker>
  </defs>

  <g id="domanda">
    <rect x="14" y="222" width="220" height="136" rx="8" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/>
    <rect x="14" y="222" width="3" height="136" fill="#838383"/>
    <text x="36" y="258" font-size="14" font-weight="700" fill="#838383" letter-spacing="1.2">DOMANDA</text>
    <text x="36" y="296" font-size="22" font-weight="600" fill="#161719">un problemino</text>
    <text x="36" y="324" font-size="22" font-weight="600" fill="#161719">logico</text>
  </g>

  <g id="spine" fill="none" stroke="#838383" stroke-width="2">
    <path d="M234 290 H262"/>
    <path d="M262 110 V450"/>
  </g>

  <g id="corsia-standard">
    <text x="300" y="34" font-size="15" font-weight="700" fill="#838383" letter-spacing="1.2">MODELLO STANDARD</text>
    <path d="M262 110 H420" fill="none" stroke="#838383" stroke-width="2" marker-end="url(#ah-grey)"/>
    <text x="341" y="96" font-size="15" font-weight="500" fill="#838383" text-anchor="middle">immediata</text>
    <rect x="430" y="60" width="180" height="100" rx="8" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/>
    <text x="520" y="118" font-size="22" font-weight="600" fill="#161719" text-anchor="middle">risposta</text>
    <g stroke="#838383" stroke-width="3" stroke-linecap="round">
      <path d="M436 184 L452 200"/>
      <path d="M452 184 L436 200"/>
    </g>
    <text x="466" y="199" font-size="17" font-weight="500" fill="#838383">sbagliata</text>
  </g>

  <g id="corsia-reasoning">
    <text x="300" y="372" font-size="15" font-weight="700" fill="#a1245a" letter-spacing="1.2">MODELLO DI REASONING</text>
    <path d="M262 450 H292" fill="none" stroke="#a1245a" stroke-width="2.5" marker-end="url(#ah-burg)"/>

    <rect x="300" y="396" width="482" height="108" rx="8" fill="#ecd3de" stroke="#a1245a" stroke-width="2.5" stroke-dasharray="9 6"/>
    <text x="324" y="440" font-size="21" font-weight="700" fill="#161719">token di ragionamento</text>
    <text x="324" y="470" font-size="19" font-weight="400" fill="#212529">prova, verifica, correggi…</text>

    <path d="M786 450 H846" fill="none" stroke="#a1245a" stroke-width="2.5" marker-end="url(#ah-burg)"/>
    <rect x="852" y="400" width="190" height="100" rx="8" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/>
    <text x="947" y="458" font-size="22" font-weight="600" fill="#161719" text-anchor="middle">risposta</text>
    <path d="M856 524 L864 532 L878 516" fill="none" stroke="#a1245a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="890" y="531" font-size="17" font-weight="600" fill="#a1245a">corretta</text>
  </g>

  <g id="nota">
    <rect x="300" y="508" width="3" height="32" fill="#a1245a"/>
    <text x="316" y="531" font-size="16" font-weight="500" fill="#838383">occupano contesto e si pagano — ma non sono la risposta</text>
  </g>
</svg>
