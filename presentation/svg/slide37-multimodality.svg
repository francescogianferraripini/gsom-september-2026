<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 820" width="1260" height="820" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Multimodalita: il percorso del testo e quello dell'immagine convergono nello stesso spazio delle idee, dove la parola gatto e la foto di un gatto occupano posizioni vicinissime</title>
  <defs>
    <pattern id="grid-idee" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1.4" fill="#dee2e6"/>
    </pattern>
    <marker id="ah-grey" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#838383"/>
    </marker>
    <marker id="ah-burgundy" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#a1245a"/>
    </marker>
    <g id="gatto">
      <path d="M32 22 L27 3 L46 14 Z" fill="#212529"/>
      <path d="M68 22 L73 3 L54 14 Z" fill="#212529"/>
      <circle cx="50" cy="34" r="21" fill="#212529"/>
      <path d="M31 48 C22 62 20 80 24 94 L76 94 C80 80 78 62 69 48 Z" fill="#212529"/>
      <path d="M74 92 C93 88 96 68 86 58" fill="none" stroke="#212529" stroke-width="7" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- ============ PERCORSO SUPERIORE: TESTO ============ -->
  <g id="percorso-testo">
    <text x="40" y="122" font-size="14" font-weight="600" letter-spacing="2" fill="#838383">TESTO</text>

    <rect x="40" y="150" width="160" height="90" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
    <text x="120" y="205" text-anchor="middle" font-size="27" font-weight="600" fill="#212529">gatto</text>

    <line x1="204" y1="195" x2="240" y2="195" stroke="#838383" stroke-width="2" marker-end="url(#ah-grey)"/>

    <rect x="248" y="150" width="170" height="90" rx="8" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/>
    <text x="333" y="203" text-anchor="middle" font-size="21" font-weight="600" fill="#212529">tokenizer</text>

    <line x1="422" y1="195" x2="458" y2="195" stroke="#838383" stroke-width="2" marker-end="url(#ah-grey)"/>

    <g id="colonna-testo" stroke="#dee2e6" stroke-width="1">
      <rect x="466" y="125" width="46" height="28" fill="#ecd3de"/>
      <rect x="466" y="153" width="46" height="28" fill="#ecd3de"/>
      <rect x="466" y="181" width="46" height="28" fill="#ecd3de"/>
      <rect x="466" y="209" width="46" height="28" fill="#ecd3de"/>
      <rect x="466" y="237" width="46" height="28" fill="#ecd3de"/>
    </g>
    <text x="489" y="290" text-anchor="middle" font-size="17" font-weight="500" fill="#838383">embedding</text>
  </g>

  <!-- ============ PERCORSO INFERIORE: IMMAGINE ============ -->
  <g id="percorso-immagine">
    <text x="40" y="442" font-size="14" font-weight="600" letter-spacing="2" fill="#838383">IMMAGINE</text>

    <rect x="40" y="470" width="160" height="160" rx="8" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/>
    <use href="#gatto" transform="translate(60 490) scale(1.2)"/>

    <line x1="204" y1="550" x2="240" y2="550" stroke="#838383" stroke-width="2" marker-end="url(#ah-grey)"/>

    <rect x="248" y="470" width="160" height="160" rx="8" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/>
    <use href="#gatto" transform="translate(268 490) scale(1.2)"/>
    <g id="griglia-patch" stroke="#ffffff" stroke-width="2.5" opacity="0.95">
      <line x1="301.3" y1="470" x2="301.3" y2="630"/>
      <line x1="354.7" y1="470" x2="354.7" y2="630"/>
      <line x1="248" y1="523.3" x2="408" y2="523.3"/>
      <line x1="248" y1="576.7" x2="408" y2="576.7"/>
    </g>
    <rect x="248" y="470" width="160" height="160" rx="8" fill="none" stroke="#838383" stroke-width="1.5"/>
    <g id="griglia-patch-hairline" stroke="#838383" stroke-width="1">
      <line x1="301.3" y1="470" x2="301.3" y2="630"/>
      <line x1="354.7" y1="470" x2="354.7" y2="630"/>
      <line x1="248" y1="523.3" x2="408" y2="523.3"/>
      <line x1="248" y1="576.7" x2="408" y2="576.7"/>
    </g>
    <text x="328" y="656" text-anchor="middle" font-size="17" font-weight="600" fill="#838383">patch</text>

    <line x1="412" y1="550" x2="448" y2="550" stroke="#838383" stroke-width="2" marker-end="url(#ah-grey)"/>

    <g id="colonne-immagine" stroke="#dee2e6" stroke-width="1" fill="#ecd3de">
      <rect x="456" y="480" width="16" height="140"/>
      <rect x="477" y="480" width="16" height="140"/>
      <rect x="498" y="480" width="16" height="140"/>
      <rect x="519" y="480" width="16" height="140"/>
      <rect x="540" y="480" width="16" height="140"/>
      <rect x="561" y="480" width="16" height="140"/>
      <rect x="582" y="480" width="16" height="140"/>
      <rect x="603" y="480" width="16" height="140"/>
      <rect x="624" y="480" width="16" height="140"/>
    </g>
    <text x="548" y="656" text-anchor="middle" font-size="17" font-weight="500" fill="#838383">un embedding per patch</text>
  </g>

  <!-- ============ PIANO DELLO SPAZIO DELLE IDEE ============ -->
  <g id="piano">
    <rect x="712" y="30" width="536" height="760" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
    <rect x="712" y="30" width="536" height="760" rx="8" fill="url(#grid-idee)"/>
    <text x="740" y="70" font-size="14" font-weight="600" letter-spacing="2" fill="#838383">SPAZIO DELLE IDEE</text>
    <text x="1220" y="774" text-anchor="end" font-size="14" font-weight="400" fill="#838383">proiezione 2D di uno spazio a migliaia di dimensioni</text>
  </g>

  <!-- ============ CONVERGENZA ============ -->
  <g id="frecce-convergenza" fill="none" stroke="#a1245a" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-burgundy)">
    <path d="M520 195 C620 195 660 236 770 282"/>
    <path d="M648 550 C716 550 716 420 774 330"/>
  </g>

  <g id="nuvola-gatto">
    <ellipse cx="936" cy="300" rx="150" ry="106" fill="#ecd3de" stroke="#a1245a" stroke-width="1.5" stroke-dasharray="5 5"/>
    <circle cx="906" cy="278" r="8" fill="#a1245a"/>
    <text x="906" y="252" text-anchor="middle" font-size="21" font-weight="600" fill="#a1245a">&#171;gatto&#187; (parola)</text>
    <circle cx="944" cy="312" r="8" fill="#a1245a"/>
    <text x="944" y="348" text-anchor="middle" font-size="21" font-weight="600" fill="#a1245a">gatto (immagine)</text>
  </g>

  <g id="contrasto-parigi">
    <line x1="1024" y1="378" x2="1122" y2="590" stroke="#838383" stroke-width="1" stroke-dasharray="5 5"/>
    <text x="1010" y="500" font-size="15" font-weight="400" fill="#838383">molto lontano</text>
    <circle cx="1136" cy="614" r="7" fill="#212529"/>
    <text x="1136" y="646" text-anchor="middle" font-size="21" font-weight="600" fill="#212529">Parigi</text>
  </g>

  <g id="callout">
    <rect x="740" y="682" width="480" height="76" rx="8" fill="#161719"/>
    <rect x="740" y="682" width="4" height="76" fill="#ffbe0b"/>
    <text x="768" y="716" font-size="19" font-weight="600" fill="#ffffff">due mezzi diversi, stessa posizione</text>
    <text x="768" y="742" font-size="14" font-weight="400" fill="#838383">il significato non dipende dal formato di partenza</text>
  </g>
</svg>
