<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" width="1080" height="720" role="img"
     font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Gradient descent: la valle dell'errore percorsa con passi piccoli e decrescenti, dal modello che sbaglia molto al modello addestrato</title>

  <!-- COMPOSIZIONE RIUSABILE (slide 44, fine-tuning).
       Il profilo della valle e' l'id "profilo-valle": non modificarlo.
       Il minimo principale e' a (640, 560), ball finale della sequenza.
       A destra del minimo la curva risale (massimo locale ~x=850, y=458) e presenta
       una conca secondaria poco profonda intorno a x=900-960 (y ~ 481-494):
       e' li' che la slide 44 innestera' la discesa secondaria verso la valletta laterale
       (nuovo gruppo da aggiungere, es. id="discesa-fine-tuning", partendo da (640,560)).
       Non occupare con testo la fascia x 700-1050 / y 300-460: e' riservata a quell'evoluzione. -->

  <defs>
    <marker id="freccia-passo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a1245a"/>
    </marker>
  </defs>

  <g id="assi">
    <path id="area-valle" d="M120 58 C133.3 80 173.3 149.7 200 190 C226.7 230.3 255 270.3 280 300 C305 329.7 326.7 346.7 350 368 C373.3 389.3 395 406.3 420 428 C445 449.7 475 479 500 498 C525 517 548.3 531.7 570 542 C591.7 552.3 608.3 559 630 560 C651.7 561 675 559.3 700 548 C725 536.7 755 507 780 492 C805 477 828.3 459 850 458 C871.7 457 891.7 480 910 486 C928.3 492 936.7 506 960 494 C983.3 482 1035 427.3 1050 414 L1050 668 L120 668 Z" fill="#f6f6f6"/>
    <path d="M88 20 L88 668 L1058 668" fill="none" stroke="#dee2e6" stroke-width="2"/>
    <path d="M88 14 L82 30 L94 30 Z" fill="#dee2e6"/>
    <path d="M1064 668 L1048 662 L1048 674 Z" fill="#dee2e6"/>
    <text x="575" y="700" text-anchor="middle" font-size="19" font-weight="500" fill="#212529">configurazione dei pesi</text>
    <text transform="translate(44 344) rotate(-90)" text-anchor="middle" font-size="19" font-weight="500" fill="#212529">errore (loss)</text>
  </g>

  <!-- profilo della valle: elemento di supporto, non focale -->
  <path id="profilo-valle" d="M120 58 C133.3 80 173.3 149.7 200 190 C226.7 230.3 255 270.3 280 300 C305 329.7 326.7 346.7 350 368 C373.3 389.3 395 406.3 420 428 C445 449.7 475 479 500 498 C525 517 548.3 531.7 570 542 C591.7 552.3 608.3 559 630 560 C651.7 561 675 559.3 700 548 C725 536.7 755 507 780 492 C805 477 828.3 459 850 458 C871.7 457 891.7 480 910 486 C928.3 492 936.7 506 960 494 C983.3 482 1035 427.3 1050 414"
        fill="none" stroke="#838383" stroke-width="2" stroke-linecap="round"/>

  <!-- ELEMENTO FOCALE: la sequenza dei passetti, piccoli e decrescenti -->
  <g id="sequenza-passi">
    <g stroke="#a1245a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#freccia-passo)">
      <line x1="163.7" y1="129.3" x2="295.1" y2="313.1"/>
      <line x1="316.3" y1="336.8" x2="407.2" y2="416.8"/>
      <line x1="431.3" y1="437.8" x2="492.2" y2="490.6"/>
      <line x1="517.7" y1="509.7" x2="550.6" y2="530.5"/>
      <line x1="578.9" y1="545.3" x2="589.3" y2="549.6"/>
      <line x1="617.5" y1="557.2" x2="625.5" y2="558.6" stroke-width="2"/>
    </g>
    <g fill="#a1245a">
      <circle id="passo-1" cx="155" cy="117.1" r="8"/>
      <circle id="passo-2" cx="305" cy="326.9" r="8"/>
      <circle id="passo-3" cx="420" cy="428" r="8"/>
      <circle id="passo-4" cx="505" cy="501.7" r="8"/>
      <circle id="passo-5" cx="565" cy="539.6" r="8"/>
      <circle id="passo-6" cx="605" cy="556" r="8"/>
      <circle id="minimo" cx="640" cy="560" r="11" fill="#ffffff" stroke="#a1245a" stroke-width="5"/>
    </g>
  </g>

  <g id="etichetta-inizio">
    <line x1="167" y1="114" x2="192" y2="112" stroke="#838383" stroke-width="1.5"/>
    <text x="202" y="112" font-size="21" font-weight="600" fill="#161719">modello all&#8217;inizio:</text>
    <text x="202" y="137" font-size="19" font-weight="400" fill="#212529">sbaglia molto</text>
  </g>

  <g id="etichetta-passo">
    <path d="M312 528 C334 510 344 446 376 391" fill="none" stroke="#a1245a" stroke-width="1.5"/>
    <rect x="138" y="530" width="3" height="62" fill="#a1245a"/>
    <text x="154" y="555" font-size="21" font-weight="600" fill="#a1245a">un passetto nella direzione</text>
    <text x="154" y="581" font-size="21" font-weight="600" fill="#a1245a">che riduce l&#8217;errore</text>
  </g>

  <g id="etichetta-addestrato">
    <line x1="640" y1="576" x2="640" y2="594" stroke="#a1245a" stroke-width="1.5"/>
    <text x="640" y="620" text-anchor="middle" font-size="21" font-weight="600" fill="#161719">modello addestrato</text>
  </g>
</svg>
