<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 800" width="1160" height="800" role="img">
  <title>Attention: ogni token emette una domanda Q e una chiave K; la domanda di "calcio" trova l'affinità più alta nella chiave di "portiere"</title>

  <defs>
    <style>
      .sans { font-family: Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Menlo, Monaco, Consolas, monospace; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 1.6px; }
    </style>
  </defs>

  <!-- ============ FRASE IN TOKEN ============ -->
  <g id="frase">
    <text class="sans eyebrow" x="24" y="55" fill="#838383">LA FRASE</text>

    <g>
      <rect x="140" y="24" width="57"  height="52" rx="8" fill="#f6f6f6" stroke="#dee2e6"/>
      <rect x="207" y="24" width="133" height="52" rx="8" fill="#f6f6f6" stroke="#dee2e6"/>
      <rect x="350" y="24" width="95"  height="52" rx="8" fill="#f6f6f6" stroke="#dee2e6"/>
      <rect x="455" y="24" width="57"  height="52" rx="8" fill="#f6f6f6" stroke="#dee2e6"/>
      <rect x="522" y="24" width="108" height="52" rx="8" fill="#a1245a"/>
      <rect x="640" y="24" width="45"  height="52" rx="8" fill="#f6f6f6" stroke="#dee2e6"/>
      <rect x="695" y="24" width="45"  height="52" rx="8" fill="#f6f6f6" stroke="#dee2e6"/>

      <text class="mono" x="168.5" y="57" font-size="21" fill="#212529" text-anchor="middle">Il</text>
      <text class="mono" x="273.5" y="57" font-size="21" fill="#212529" text-anchor="middle">portiere</text>
      <text class="mono" x="397.5" y="57" font-size="21" fill="#212529" text-anchor="middle">diede</text>
      <text class="mono" x="483.5" y="57" font-size="21" fill="#212529" text-anchor="middle">un</text>
      <text class="mono" x="576"   y="57" font-size="21" fill="#ffffff" text-anchor="middle">calcio</text>
      <text class="mono" x="662.5" y="57" font-size="21" fill="#838383" text-anchor="middle">e</text>
      <text class="mono" x="717.5" y="57" font-size="21" fill="#838383" text-anchor="middle">…</text>
    </g>

    <text class="sans" x="800" y="43" font-size="15" font-weight="500" fill="#212529">Ogni token emette due vettori diversi:</text>
    <text class="sans" x="800" y="67" font-size="15" font-weight="400" fill="#838383">una domanda Q e una chiave K.</text>
  </g>

  <!-- ============ INTESTAZIONI COLONNE ============ -->
  <g id="intestazioni">
    <text class="sans eyebrow" x="24"  y="150" fill="#a1245a">DOMANDA — Q</text>
    <text class="sans"         x="24"  y="176" font-size="15" fill="#838383">emessa dal token evidenziato</text>
    <text class="sans eyebrow" x="720" y="150" fill="#838383">CHIAVI — K</text>
    <text class="sans"         x="720" y="176" font-size="15" fill="#838383">esposte dagli altri token</text>
  </g>

  <!-- ============ CONNETTORE calcio -> Q ============ -->
  <g id="emissione-q">
    <path d="M576 82 C576 200, 430 236, 268 306" fill="none" stroke="#a1245a" stroke-width="2.5"/>
    <path d="M268 306 L288 293 L285 313 Z" fill="#a1245a"/>
  </g>

  <!-- ============ FUMETTO DOMANDA (Q) ============ -->
  <g id="card-q">
    <rect x="24" y="330" width="396" height="170" rx="8" fill="#ffffff" stroke="#a1245a" stroke-width="2"/>
    <circle cx="66" cy="374" r="19" fill="#a1245a"/>
    <text class="sans" x="66" y="381" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">Q</text>
    <text class="mono" x="98" y="381" font-size="19" fill="#a1245a">calcio</text>
    <line x1="52" y1="406" x2="392" y2="406" stroke="#ecd3de" stroke-width="1.5"/>
    <text class="sans" x="52" y="440" font-size="19" font-weight="500" fill="#212529">cerco: chi compie l'azione,</text>
    <text class="sans" x="52" y="468" font-size="19" font-weight="500" fill="#212529">in che ambito</text>
  </g>

  <!-- ============ LINEE DI PRODOTTO SCALARE ============ -->
  <g id="linee">
    <line x1="424" y1="415" x2="716" y2="244" stroke="#a1245a" stroke-width="3"/>
    <line x1="424" y1="415" x2="716" y2="362" stroke="#838383" stroke-width="2"/>
    <line x1="424" y1="415" x2="716" y2="480" stroke="#838383" stroke-width="1.5" stroke-dasharray="5 4"/>
    <line x1="424" y1="415" x2="716" y2="598" stroke="#838383" stroke-width="1.5" stroke-dasharray="5 4"/>
    <circle cx="424" cy="415" r="6" fill="#a1245a"/>
  </g>

  <!-- ============ SIMBOLI PRODOTTO SCALARE ============ -->
  <g id="dot-product">
    <circle cx="555" cy="338" r="15" fill="#ffffff" stroke="#a1245a" stroke-width="2.5"/>
    <text class="sans" x="555" y="349" font-size="34" font-weight="700" fill="#a1245a" text-anchor="middle">·</text>

    <circle cx="555" cy="391" r="14" fill="#ffffff" stroke="#dee2e6" stroke-width="1.5"/>
    <text class="sans" x="555" y="402" font-size="32" font-weight="700" fill="#838383" text-anchor="middle">·</text>

    <circle cx="555" cy="444" r="14" fill="#ffffff" stroke="#dee2e6" stroke-width="1.5"/>
    <text class="sans" x="555" y="455" font-size="32" font-weight="700" fill="#838383" text-anchor="middle">·</text>

    <circle cx="555" cy="497" r="14" fill="#ffffff" stroke="#dee2e6" stroke-width="1.5"/>
    <text class="sans" x="555" y="508" font-size="32" font-weight="700" fill="#838383" text-anchor="middle">·</text>
  </g>

  <!-- ============ INDICATORI DI AFFINITÀ ============ -->
  <g id="affinita">
    <!-- portiere: alta -->
    <rect x="583" y="257" width="112" height="42" fill="#ffffff"/>
    <text class="sans" x="593" y="274" font-size="13" font-weight="700" fill="#a1245a">AFFINITÀ ALTA</text>
    <rect x="593" y="283" width="88" height="9" rx="4.5" fill="#ecd3de"/>
    <rect x="593" y="283" width="80" height="9" rx="4.5" fill="#a1245a"/>

    <!-- diede: media -->
    <rect x="583" y="345" width="112" height="42" fill="#ffffff"/>
    <text class="sans" x="593" y="362" font-size="13" font-weight="700" fill="#838383">MEDIA</text>
    <rect x="593" y="371" width="88" height="9" rx="4.5" fill="#e9ecef"/>
    <rect x="593" y="371" width="44" height="9" rx="4.5" fill="#838383"/>

    <!-- un: ~0 -->
    <rect x="583" y="434" width="112" height="42" fill="#ffffff"/>
    <text class="sans" x="593" y="451" font-size="13" font-weight="700" fill="#838383">≈ 0</text>
    <rect x="593" y="460" width="88" height="9" rx="4.5" fill="#e9ecef"/>
    <rect x="593" y="460" width="6" height="9" rx="3" fill="#838383"/>

    <!-- Il: ~0 -->
    <rect x="583" y="522" width="112" height="42" fill="#ffffff"/>
    <text class="sans" x="593" y="539" font-size="13" font-weight="700" fill="#838383">≈ 0</text>
    <rect x="593" y="548" width="88" height="9" rx="4.5" fill="#e9ecef"/>
    <rect x="593" y="548" width="5" height="9" rx="2.5" fill="#838383"/>
  </g>

  <!-- ============ TARGHETTE CHIAVE (K) ============ -->
  <g id="chiavi">
    <!-- portiere (focale) -->
    <rect x="720" y="200" width="416" height="88" rx="8" fill="#ecd3de" stroke="#a1245a" stroke-width="2"/>
    <rect x="742" y="229" width="30" height="30" rx="6" fill="#a1245a"/>
    <text class="sans" x="757" y="250" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">K</text>
    <text class="mono" x="790" y="238" font-size="19" fill="#a1245a">portiere</text>
    <text class="sans" x="790" y="264" font-size="17" font-weight="500" fill="#212529">“persona, sport”</text>

    <!-- diede -->
    <rect x="720" y="318" width="416" height="88" rx="8" fill="#f6f6f6" stroke="#dee2e6"/>
    <rect x="742" y="347" width="30" height="30" rx="6" fill="#838383"/>
    <text class="sans" x="757" y="368" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">K</text>
    <text class="mono" x="790" y="356" font-size="19" fill="#212529">diede</text>
    <text class="sans" x="790" y="382" font-size="17" font-weight="500" fill="#838383">“azione, passato”</text>

    <!-- un -->
    <rect x="720" y="436" width="416" height="88" rx="8" fill="#f6f6f6" stroke="#dee2e6"/>
    <rect x="742" y="465" width="30" height="30" rx="6" fill="#838383"/>
    <text class="sans" x="757" y="486" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">K</text>
    <text class="mono" x="790" y="474" font-size="19" fill="#212529">un</text>
    <text class="sans" x="790" y="500" font-size="17" font-weight="500" fill="#838383">“articolo”</text>

    <!-- Il -->
    <rect x="720" y="554" width="416" height="88" rx="8" fill="#f6f6f6" stroke="#dee2e6"/>
    <rect x="742" y="583" width="30" height="30" rx="6" fill="#838383"/>
    <text class="sans" x="757" y="604" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">K</text>
    <text class="mono" x="790" y="592" font-size="19" fill="#212529">Il</text>
    <text class="sans" x="790" y="618" font-size="17" font-weight="500" fill="#838383">“articolo”</text>
  </g>

  <!-- ============ CALLOUT ============ -->
  <g id="callout">
    <rect x="24" y="698" width="1112" height="76" rx="8" fill="#161719"/>
    <rect x="46" y="714" width="3.5" height="44" fill="#ffbe0b"/>
    <text class="sans" x="68" y="732" font-size="17" font-weight="500" fill="#ffffff">Il punteggio di attenzione è il prodotto scalare fra la domanda di <tspan class="mono" fill="#ffbe0b">calcio</tspan> e la chiave di ogni token.</text>
    <text class="sans" x="68" y="758" font-size="17" font-weight="400" fill="#dee2e6">Vince <tspan class="mono" fill="#ffbe0b">portiere</tspan>: è da lì che <tspan class="mono" fill="#ffffff">calcio</tspan> prenderà più informazione.</text>
  </g>
</svg>
