<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="1120" height="700" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Softmax: da affinità grezze a budget di ascolto che somma a 100%</title>
  <defs>
    <marker id="arrGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#838383"/>
    </marker>
  </defs>

  <!-- ============ PANNELLO SINISTRO: punteggi grezzi ============ -->
  <g id="pannello-grezzi">
    <text x="12" y="44" font-size="17" font-weight="700" fill="#838383" letter-spacing="1.6">PUNTEGGI GREZZI</text>
    <rect x="12" y="60" width="418" height="560" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>

    <!-- portiere: 3.1 -->
    <text x="150" y="228" text-anchor="end" font-size="21" font-weight="600" fill="#212529">portiere</text>
    <rect x="165" y="202" width="165" height="36" rx="4" fill="#dee2e6"/>
    <text x="402" y="228" text-anchor="end" font-size="21" font-weight="600" fill="#838383">3.1</text>

    <!-- diede: 1.4 -->
    <text x="150" y="308" text-anchor="end" font-size="21" font-weight="500" fill="#212529">diede</text>
    <rect x="165" y="282" width="74.5" height="36" rx="4" fill="#dee2e6"/>
    <text x="402" y="308" text-anchor="end" font-size="21" font-weight="500" fill="#838383">1.4</text>

    <!-- un: 0.2 -->
    <text x="150" y="388" text-anchor="end" font-size="21" font-weight="500" fill="#212529">un</text>
    <rect x="165" y="362" width="10.6" height="36" rx="3" fill="#dee2e6"/>
    <text x="402" y="388" text-anchor="end" font-size="21" font-weight="500" fill="#838383">0.2</text>

    <!-- Il: 0.1 -->
    <text x="150" y="468" text-anchor="end" font-size="21" font-weight="500" fill="#212529">Il</text>
    <rect x="165" y="442" width="5.3" height="36" rx="2" fill="#dee2e6"/>
    <text x="402" y="468" text-anchor="end" font-size="21" font-weight="500" fill="#838383">0.1</text>

    <line x1="42" y1="512" x2="402" y2="512" stroke="#dee2e6" stroke-width="1"/>
    <text x="42" y="546" font-size="15" font-weight="500" fill="#838383">affinit&#224; grezze &#8212; scala arbitraria</text>
    <text x="42" y="574" font-size="15" font-weight="500" fill="#838383">i divari restano moderati</text>
  </g>

  <!-- ============ BLOCCO CENTRALE: softmax ============ -->
  <g id="softmax">
    <line x1="438" y1="340" x2="464" y2="340" stroke="#838383" stroke-width="2" marker-end="url(#arrGrey)"/>
    <rect x="472" y="296" width="176" height="88" rx="8" fill="#161719"/>
    <rect x="472" y="296" width="3" height="88" fill="#ffbe0b"/>
    <text x="560" y="334" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace">softmax</text>
    <text x="560" y="356" text-anchor="middle" font-size="13" font-weight="500" fill="#838383">normalizza</text>
    <text x="560" y="373" text-anchor="middle" font-size="13" font-weight="500" fill="#838383">e amplifica</text>
    <line x1="656" y1="340" x2="682" y2="340" stroke="#838383" stroke-width="2" marker-end="url(#arrGrey)"/>
  </g>

  <!-- ============ PANNELLO DESTRO: budget di ascolto ============ -->
  <g id="pannello-budget">
    <text x="690" y="44" font-size="17" font-weight="700" fill="#a1245a" letter-spacing="1.6">BUDGET DI ASCOLTO</text>
    <rect x="690" y="60" width="418" height="560" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>

    <!-- bracket totale -->
    <path d="M742 110 h-10 v460 h10" fill="none" stroke="#a1245a" stroke-width="2.5" stroke-linecap="square"/>
    <text x="726" y="340" text-anchor="middle" font-size="21" font-weight="700" fill="#a1245a" transform="rotate(-90 726 340)">100%</text>

    <!-- barra impilata -->
    <g id="barra">
      <rect x="760" y="110" width="120" height="348.8" fill="#a1245a"/>
      <rect x="760" y="458.8" width="120" height="64.4" fill="#ecd3de" stroke="#ffffff" stroke-width="1.5"/>
      <rect x="760" y="523.2" width="120" height="18.4" fill="#ecd3de" stroke="#ffffff" stroke-width="1.5"/>
      <rect x="760" y="541.6" width="120" height="18.4" fill="#ecd3de" stroke="#ffffff" stroke-width="1.5"/>
      <rect x="760" y="110" width="120" height="450" fill="none" stroke="#dee2e6" stroke-width="1"/>
    </g>

    <!-- etichette -->
    <line x1="888" y1="284" x2="920" y2="284" stroke="#dee2e6" stroke-width="1"/>
    <text x="930" y="278" font-size="21" font-weight="600" fill="#212529">portiere</text>
    <text x="930" y="304" font-size="21" font-weight="700" fill="#a1245a">78%</text>

    <polyline points="888,491 906,491 906,480 920,480" fill="none" stroke="#dee2e6" stroke-width="1"/>
    <text x="930" y="486" font-size="19" font-weight="500" fill="#212529">diede<tspan font-weight="600" fill="#838383" dx="10">14%</tspan></text>

    <polyline points="888,532 906,532 906,518 920,518" fill="none" stroke="#dee2e6" stroke-width="1"/>
    <text x="930" y="524" font-size="19" font-weight="500" fill="#212529">un<tspan font-weight="600" fill="#838383" dx="10">4%</tspan></text>

    <polyline points="888,551 906,551 906,556 920,556" fill="none" stroke="#dee2e6" stroke-width="1"/>
    <text x="930" y="562" font-size="19" font-weight="500" fill="#212529">Il<tspan font-weight="600" fill="#838383" dx="10">4%</tspan></text>

    <text x="760" y="596" font-size="15" font-weight="500" fill="#838383">un solo token si prende quasi tutta l&#8217;attenzione</text>
  </g>

  <!-- ============ CALLOUT TOTALE ============ -->
  <g id="callout">
    <rect x="690" y="636" width="418" height="52" rx="8" fill="#161719"/>
    <rect x="690" y="636" width="3" height="52" fill="#ffbe0b"/>
    <text x="714" y="668" font-size="19" font-weight="600" fill="#ffffff">Il budget somma sempre a 100</text>
  </g>
</svg>
