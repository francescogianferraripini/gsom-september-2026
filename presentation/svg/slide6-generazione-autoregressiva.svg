<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img">
  <title>La generazione autoregressiva: il contesto cresce di un token alla volta fino al token di STOP</title>

  <g id="legenda" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <rect x="160" y="18" width="226" height="32" rx="8" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/>
    <text x="273" y="39" text-anchor="middle" font-size="15" font-weight="500" fill="#212529">context (input al modello)</text>
    <rect x="402" y="18" width="203" height="32" rx="8" fill="#a1245a"/>
    <text x="503.5" y="39" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">token generato (output)</text>
  </g>

  <g id="graffa">
    <path d="M 134 72 C 128 72 130 78 130 84 L 130 240 C 130 246 128 249 122 251 C 128 253 130 256 130 262 L 130 418 C 130 424 128 430 134 430"
          fill="none" stroke="#838383" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text transform="rotate(-90 88 251)" x="88" y="251" text-anchor="middle"
          font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="15" font-weight="500" fill="#212529">il contesto cresce di un token per volta</text>
  </g>

  <g id="pila" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="17">

    <g id="riga-1">
      <rect x="160" y="72" width="64" height="36" rx="8" fill="none" stroke="#dee2e6" stroke-width="1" stroke-dasharray="4 4"/>
      <text x="192" y="95" text-anchor="middle" font-size="13" fill="#838383" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">vuoto</text>
      <rect x="229" y="72" width="46" height="36" rx="8" fill="#a1245a"/>
      <text x="252" y="96" text-anchor="middle" fill="#ffffff">Il</text>
    </g>

    <g id="riga-2">
      <rect x="160" y="118" width="46" height="36" rx="8" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/>
      <text x="183" y="142" text-anchor="middle" fill="#212529">Il</text>
      <rect x="211" y="118" width="77" height="36" rx="8" fill="#a1245a"/>
      <text x="249.5" y="142" text-anchor="middle" fill="#ffffff">gatto</text>
    </g>

    <g id="riga-3">
      <rect x="160" y="164" width="108" height="36" rx="8" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/>
      <text x="214" y="188" text-anchor="middle" fill="#212529">Il gatto</text>
      <rect x="273" y="164" width="36" height="36" rx="8" fill="#a1245a"/>
      <text x="291" y="188" text-anchor="middle" fill="#ffffff">è</text>
    </g>

    <g id="riga-4">
      <rect x="160" y="210" width="128" height="36" rx="8" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/>
      <text x="224" y="234" text-anchor="middle" fill="#212529">Il gatto è</text>
      <rect x="293" y="210" width="57" height="36" rx="8" fill="#a1245a"/>
      <text x="321.5" y="234" text-anchor="middle" fill="#ffffff">sul</text>
    </g>

    <g id="riga-5">
      <rect x="160" y="256" width="169" height="36" rx="8" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/>
      <text x="244.5" y="280" text-anchor="middle" fill="#212529">Il gatto è sul</text>
      <rect x="334" y="256" width="87" height="36" rx="8" fill="#a1245a"/>
      <text x="377.5" y="280" text-anchor="middle" fill="#ffffff">tavolo</text>
    </g>

    <g id="riga-6">
      <rect x="160" y="302" width="240" height="36" rx="8" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/>
      <text x="280" y="326" text-anchor="middle" fill="#212529">Il gatto è sul tavolo</text>
      <rect x="405" y="302" width="36" height="36" rx="8" fill="#a1245a"/>
      <text x="423" y="326" text-anchor="middle" fill="#ffffff">e</text>
    </g>

    <g id="riga-7">
      <rect x="160" y="348" width="261" height="36" rx="8" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/>
      <text x="290.5" y="372" text-anchor="middle" fill="#212529">Il gatto è sul tavolo e</text>
      <rect x="426" y="348" width="77" height="36" rx="8" fill="#a1245a"/>
      <text x="464.5" y="372" text-anchor="middle" fill="#ffffff">dorme</text>
    </g>

    <g id="riga-8">
      <rect x="160" y="394" width="322" height="36" rx="8" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/>
      <text x="321" y="418" text-anchor="middle" fill="#212529">Il gatto è sul tavolo e dorme</text>
      <rect x="487" y="394" width="36" height="36" rx="8" fill="#a1245a"/>
      <text x="505" y="418" text-anchor="middle" fill="#ffffff">.</text>
      <line x1="523" y1="412" x2="533" y2="412" stroke="#838383" stroke-width="1.5"/>
      <rect x="533" y="394" width="78" height="36" rx="8" fill="#161719"/>
      <rect x="533" y="400" width="3" height="24" fill="#ffbe0b"/>
      <text x="576" y="417" text-anchor="middle" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
            font-size="15" font-weight="700" letter-spacing="1" fill="#ffbe0b">STOP</text>
    </g>
  </g>

  <text x="160" y="462" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="13" font-weight="400" fill="#838383">ogni riga è una passata completa del modello: stessi pesi, contesto più lungo</text>

  <g id="loop" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <rect x="700" y="72" width="390" height="358" rx="8" fill="none" stroke="#dee2e6" stroke-width="1"/>
    <rect x="699" y="84" width="3" height="334" fill="#a1245a"/>

    <text x="716" y="104" font-size="13" font-weight="600" letter-spacing="1.2" fill="#838383">IL LOOP DI GENERAZIONE</text>

    <rect x="746" y="124" width="220" height="52" rx="8" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/>
    <text x="856" y="157" text-anchor="middle" font-size="19" font-weight="600" fill="#212529">contesto</text>
    <circle cx="724" cy="150" r="13" fill="#ffffff" stroke="#a1245a" stroke-width="1.5"/>
    <text x="724" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#a1245a">1</text>

    <line x1="856" y1="176" x2="856" y2="196" stroke="#a1245a" stroke-width="2.5"/>
    <polygon points="856,204 850,195 862,195" fill="#a1245a"/>

    <rect x="746" y="204" width="220" height="52" rx="8" fill="#161719"/>
    <text x="856" y="237" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">LLM</text>
    <circle cx="724" cy="230" r="13" fill="#ffffff" stroke="#a1245a" stroke-width="1.5"/>
    <text x="724" y="235" text-anchor="middle" font-size="13" font-weight="700" fill="#a1245a">2</text>

    <line x1="856" y1="256" x2="856" y2="276" stroke="#a1245a" stroke-width="2.5"/>
    <polygon points="856,284 850,275 862,275" fill="#a1245a"/>

    <rect x="746" y="284" width="220" height="52" rx="8" fill="#a1245a"/>
    <text x="856" y="317" text-anchor="middle" font-size="19" font-weight="600" fill="#ffffff">token generato</text>
    <circle cx="724" cy="310" r="13" fill="#ffffff" stroke="#a1245a" stroke-width="1.5"/>
    <text x="724" y="315" text-anchor="middle" font-size="13" font-weight="700" fill="#a1245a">3</text>

    <path d="M 966 310 H 1016 V 150 H 976" fill="none" stroke="#a1245a" stroke-width="2" stroke-dasharray="6 5"/>
    <polygon points="966,150 976,144 976,156" fill="#a1245a"/>
    <circle cx="1016" cy="230" r="13" fill="#ffffff" stroke="#a1245a" stroke-width="1.5"/>
    <text x="1016" y="235" text-anchor="middle" font-size="13" font-weight="700" fill="#a1245a">4</text>
    <text transform="rotate(-90 1044 230)" x="1044" y="230" text-anchor="middle" font-size="13" font-weight="500" fill="#212529">appeso al contesto</text>

    <path d="M 757.75 375.18 A 7.5 7.5 0 1 1 752 372.5" fill="none" stroke="#a1245a" stroke-width="2" stroke-linecap="round"/>
    <polygon points="757,372.5 751.5,369.3 751.5,375.7" fill="#a1245a"/>
    <text x="770" y="385" font-size="15" font-weight="500" fill="#212529">si ripete fino al token di STOP</text>
  </g>
</svg>
