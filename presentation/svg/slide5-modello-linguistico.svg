<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1172 542" width="1172" height="542" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Che cos'è un modello linguistico: dallo stesso LLM, due distribuzioni di probabilità sul prossimo token</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#838383"/>
    </marker>
  </defs>

  <g id="contesti">
    <text x="12" y="73" font-size="13" font-weight="600" letter-spacing="1.2" fill="#838383">CONTESTO</text>
    <rect x="12" y="81" width="340" height="64" rx="8" fill="#f6f6f6" stroke="#dee2e6"/>
    <text x="32" y="119" font-size="18" fill="#212529" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace">La capitale della Francia è …</text>

    <text x="12" y="359" font-size="13" font-weight="600" letter-spacing="1.2" fill="#838383">CONTESTO</text>
    <rect x="12" y="367" width="340" height="64" rx="8" fill="#f6f6f6" stroke="#dee2e6"/>
    <text x="32" y="405" font-size="18" fill="#212529" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace">Il gatto è …</text>
  </g>

  <g id="connettori" fill="none" stroke="#838383" stroke-width="2" marker-end="url(#arrow)">
    <path d="M352,113 C388,113 384,216 412,216"/>
    <path d="M352,399 C388,399 384,296 412,296"/>
    <path d="M570,216 C606,216 619,113 647,113"/>
    <path d="M570,296 C606,296 619,399 647,399"/>
  </g>

  <g id="llm">
    <rect x="420" y="156" width="150" height="200" rx="8" fill="#a1245a"/>
    <text x="495" y="250" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">LLM</text>
    <text x="495" y="284" font-size="13" font-weight="500" fill="#ecd3de" text-anchor="middle">stesso modello,</text>
    <text x="495" y="302" font-size="13" font-weight="500" fill="#ecd3de" text-anchor="middle">stessi pesi</text>
  </g>

  <g id="distribuzione-bassa-entropia">
    <rect x="660" y="12" width="500" height="202" rx="8" fill="#ffffff" stroke="#dee2e6"/>
    <text x="676" y="40" font-size="13" font-weight="600" letter-spacing="1.2" fill="#838383">PROBABILITÀ DEL PROSSIMO TOKEN</text>
    <line x1="676" y1="178" x2="1144" y2="178" stroke="#dee2e6"/>

    <rect x="790" y="71" width="60" height="107" fill="#a1245a"/>
    <text x="820" y="63" font-size="13" font-weight="600" fill="#a1245a" text-anchor="middle">97%</text>
    <text x="820" y="199" font-size="17" fill="#212529" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace">Parigi</text>

    <rect x="880" y="176" width="60" height="2" fill="#a1245a"/>
    <text x="910" y="168" font-size="13" font-weight="600" fill="#838383" text-anchor="middle">2%</text>
    <text x="910" y="199" font-size="17" fill="#838383" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace">una</text>

    <rect x="970" y="177" width="60" height="1" fill="#a1245a"/>
    <text x="1000" y="169" font-size="13" font-weight="600" fill="#838383" text-anchor="middle">1%</text>
    <text x="1000" y="199" font-size="17" fill="#838383" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace">sede</text>

    <text x="660" y="240" font-size="17" fill="#838383"><tspan font-weight="600" fill="#a1245a">bassa entropia</tspan>: il seguito è quasi obbligato</text>
  </g>

  <g id="distribuzione-alta-entropia">
    <rect x="660" y="298" width="500" height="202" rx="8" fill="#ffffff" stroke="#dee2e6"/>
    <text x="676" y="326" font-size="13" font-weight="600" letter-spacing="1.2" fill="#838383">PROBABILITÀ DEL PROSSIMO TOKEN</text>
    <line x1="676" y1="464" x2="1144" y2="464" stroke="#dee2e6"/>

    <rect x="700" y="431" width="60" height="33" fill="#1ab197"/>
    <text x="730" y="423" font-size="13" font-weight="600" fill="#838383" text-anchor="middle">30%</text>
    <text x="730" y="485" font-size="17" fill="#212529" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace">sul</text>

    <rect x="790" y="440" width="60" height="24" fill="#1ab197"/>
    <text x="820" y="432" font-size="13" font-weight="600" fill="#838383" text-anchor="middle">22%</text>
    <text x="820" y="485" font-size="17" fill="#212529" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace">un</text>

    <rect x="880" y="447" width="60" height="17" fill="#1ab197"/>
    <text x="910" y="439" font-size="13" font-weight="600" fill="#838383" text-anchor="middle">15%</text>
    <text x="910" y="485" font-size="17" fill="#212529" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace">morbido</text>

    <rect x="970" y="451" width="60" height="13" fill="#1ab197"/>
    <text x="1000" y="443" font-size="13" font-weight="600" fill="#838383" text-anchor="middle">12%</text>
    <text x="1000" y="485" font-size="17" fill="#212529" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace">nero</text>

    <rect x="1060" y="455" width="60" height="9" fill="#1ab197"/>
    <text x="1090" y="447" font-size="13" font-weight="600" fill="#838383" text-anchor="middle">8%</text>
    <text x="1090" y="485" font-size="17" fill="#212529" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace">stanco</text>

    <text x="660" y="526" font-size="17" fill="#838383"><tspan font-weight="600" fill="#1ab197">alta entropia</tspan>: molti seguiti plausibili</text>
  </g>
</svg>
