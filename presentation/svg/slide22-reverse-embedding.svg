<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1408 880" width="1408" height="880" role="img">
  <title>Reverse embedding: dal vettore finale ai token, tramite confronto col vocabolario, logits e softmax</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#838383"/>
    </marker>
    <marker id="arFocus" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#a1245a"/>
    </marker>
  </defs>

  <g font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

    <!-- titolo -->
    <text x="16" y="44" font-size="27" font-weight="700" fill="#161719">Reverse embedding: dal vettore finale ai token</text>

    <!-- eyebrow di stadio -->
    <g font-size="13" font-weight="700" fill="#838383" letter-spacing="1.4">
      <text x="16" y="104">1 · EMBEDDING FINALE</text>
      <text x="272" y="104">2 · CONFRONTO COL VOCABOLARIO</text>
      <text x="612" y="104">3 · LOGITS</text>
      <text x="838" y="104">4 · SOFTMAX E DISTRIBUZIONE</text>
    </g>

    <!-- ============ STADIO 1: vettore ============ -->
    <g id="stadio1">
      <rect x="16" y="134" width="120" height="398" rx="8" fill="#f6f6f6" stroke="#dee2e6"/>
      <g stroke="#dee2e6" stroke-width="1">
        <line x1="16" y1="184" x2="136" y2="184"/>
        <line x1="16" y1="233" x2="136" y2="233"/>
        <line x1="16" y1="283" x2="136" y2="283"/>
        <line x1="16" y1="332" x2="136" y2="332"/>
        <line x1="16" y1="382" x2="136" y2="382"/>
        <line x1="16" y1="431" x2="136" y2="431"/>
        <line x1="16" y1="481" x2="136" y2="481"/>
      </g>
      <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="16" fill="#212529" text-anchor="middle">
        <text x="76" y="164">0.42</text>
        <text x="76" y="214">&#8722;1.07</text>
        <text x="76" y="263">0.88</text>
        <text x="76" y="313">2.31</text>
        <text x="76" y="362">&#8722;0.15</text>
        <text x="76" y="412">0.63</text>
        <text x="76" y="461">&#8722;0.94</text>
        <text x="76" y="511">1.20</text>
      </g>
      <text x="16" y="584" font-size="13" fill="#838383">dopo tutti i blocchi, per il contesto</text>
      <text x="16" y="604" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="14" fill="#212529">Il gatto &#232;</text>
    </g>

    <!-- ============ connettori prodotto scalare ============ -->
    <g id="prodotti" stroke="#838383" stroke-width="1.5" fill="none">
      <line x1="136" y1="333" x2="266" y2="158" marker-end="url(#ar)"/>
      <line x1="136" y1="333" x2="266" y2="228" marker-end="url(#ar)"/>
      <line x1="136" y1="333" x2="266" y2="298" marker-end="url(#ar)"/>
      <line x1="136" y1="333" x2="266" y2="368" marker-end="url(#ar)"/>
      <line x1="136" y1="333" x2="266" y2="438" marker-end="url(#ar)"/>
      <line x1="136" y1="333" x2="266" y2="508" marker-end="url(#ar)"/>
    </g>
    <g>
      <circle cx="204" cy="245.5" r="11" fill="#ffffff"/>
      <circle cx="204" cy="280.5" r="11" fill="#ffffff"/>
      <circle cx="204" cy="315.5" r="11" fill="#ffffff"/>
      <circle cx="204" cy="350.5" r="11" fill="#ffffff"/>
      <circle cx="204" cy="385.5" r="11" fill="#ffffff"/>
      <circle cx="204" cy="420.5" r="11" fill="#ffffff"/>
      <g font-size="30" font-weight="700" fill="#161719" text-anchor="middle">
        <text x="204" y="254">&#183;</text>
        <text x="204" y="289">&#183;</text>
        <text x="204" y="324">&#183;</text>
        <text x="204" y="359">&#183;</text>
        <text x="204" y="394">&#183;</text>
        <text x="204" y="429">&#183;</text>
      </g>
      <text x="204" y="562" font-size="13" fill="#838383" text-anchor="middle">&#183; prodotto scalare</text>
    </g>

    <!-- ============ STADIO 2: vocabolario ============ -->
    <g id="stadio2">
      <g fill="#ffffff" stroke="#dee2e6">
        <rect x="272" y="130" width="276" height="56" rx="8"/>
        <rect x="272" y="200" width="276" height="56" rx="8"/>
        <rect x="272" y="270" width="276" height="56" rx="8"/>
        <rect x="272" y="340" width="276" height="56" rx="8"/>
        <rect x="272" y="410" width="276" height="56" rx="8"/>
      </g>
      <rect x="272" y="480" width="276" height="56" rx="8" fill="#f6f6f6" stroke="#dee2e6" stroke-dasharray="5 5"/>
      <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="17" fill="#161719">
        <text x="294" y="164">sul</text>
        <text x="294" y="234">un</text>
        <text x="294" y="304">morbido</text>
        <text x="294" y="374">nero</text>
        <text x="294" y="444">Parigi</text>
      </g>
      <text x="294" y="514" font-size="14" fill="#838383">&#8230; ~100.000 righe</text>
      <g fill="#dee2e6">
        <rect x="430" y="154" width="18" height="8" rx="4"/><rect x="454" y="154" width="18" height="8" rx="4"/><rect x="478" y="154" width="18" height="8" rx="4"/><rect x="502" y="154" width="18" height="8" rx="4"/><rect x="526" y="154" width="18" height="8" rx="4"/>
        <rect x="430" y="224" width="18" height="8" rx="4"/><rect x="454" y="224" width="18" height="8" rx="4"/><rect x="478" y="224" width="18" height="8" rx="4"/><rect x="502" y="224" width="18" height="8" rx="4"/><rect x="526" y="224" width="18" height="8" rx="4"/>
        <rect x="430" y="294" width="18" height="8" rx="4"/><rect x="454" y="294" width="18" height="8" rx="4"/><rect x="478" y="294" width="18" height="8" rx="4"/><rect x="502" y="294" width="18" height="8" rx="4"/><rect x="526" y="294" width="18" height="8" rx="4"/>
        <rect x="430" y="364" width="18" height="8" rx="4"/><rect x="454" y="364" width="18" height="8" rx="4"/><rect x="478" y="364" width="18" height="8" rx="4"/><rect x="502" y="364" width="18" height="8" rx="4"/><rect x="526" y="364" width="18" height="8" rx="4"/>
        <rect x="430" y="434" width="18" height="8" rx="4"/><rect x="454" y="434" width="18" height="8" rx="4"/><rect x="478" y="434" width="18" height="8" rx="4"/><rect x="502" y="434" width="18" height="8" rx="4"/><rect x="526" y="434" width="18" height="8" rx="4"/>
      </g>
      <text x="272" y="584" font-size="13" fill="#838383">ogni riga: un token e il suo vettore</text>
    </g>

    <!-- vocabolario -> logits -->
    <g stroke="#838383" stroke-width="1.5" fill="none">
      <line x1="548" y1="158" x2="606" y2="158" marker-end="url(#ar)"/>
      <line x1="548" y1="228" x2="606" y2="228" marker-end="url(#ar)"/>
      <line x1="548" y1="298" x2="606" y2="298" marker-end="url(#ar)"/>
      <line x1="548" y1="368" x2="606" y2="368" marker-end="url(#ar)"/>
      <line x1="548" y1="438" x2="606" y2="438" marker-end="url(#ar)"/>
    </g>

    <!-- ============ STADIO 3: logits ============ -->
    <g id="stadio3">
      <g fill="#ffffff" stroke="#dee2e6">
        <rect x="612" y="136" width="172" height="44" rx="8"/>
        <rect x="612" y="206" width="172" height="44" rx="8"/>
        <rect x="612" y="276" width="172" height="44" rx="8"/>
        <rect x="612" y="346" width="172" height="44" rx="8"/>
      </g>
      <rect x="612" y="416" width="172" height="44" rx="8" fill="#f6f6f6" stroke="#dee2e6"/>
      <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="15" fill="#212529">
        <text x="630" y="164">sul</text>
        <text x="630" y="234">un</text>
        <text x="630" y="304">morbido</text>
        <text x="630" y="374">nero</text>
        <text x="630" y="444" fill="#838383">Parigi</text>
      </g>
      <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="17" font-weight="700" fill="#161719" text-anchor="end">
        <text x="766" y="164">4.2</text>
        <text x="766" y="234">3.9</text>
        <text x="766" y="304">3.5</text>
        <text x="766" y="374">3.3</text>
        <text x="766" y="444" fill="#838383">&#8722;3.1</text>
      </g>
      <text x="612" y="584" font-size="13" fill="#838383">logits &#8212; affinit&#224; grezze</text>
    </g>

    <!-- logits -> softmax -->
    <g stroke="#838383" stroke-width="1.5" fill="none">
      <line x1="784" y1="158" x2="832" y2="320" marker-end="url(#ar)"/>
      <line x1="784" y1="228" x2="832" y2="328" marker-end="url(#ar)"/>
      <line x1="784" y1="298" x2="832" y2="333" marker-end="url(#ar)"/>
      <line x1="784" y1="368" x2="832" y2="338" marker-end="url(#ar)"/>
      <line x1="784" y1="438" x2="832" y2="346" marker-end="url(#ar)"/>
    </g>

    <!-- ============ STADIO 4: softmax + distribuzione ============ -->
    <g id="softmax">
      <rect x="838" y="258" width="148" height="150" rx="8" fill="#ffffff" stroke="#dee2e6"/>
      <text x="912" y="306" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="21" font-weight="700" fill="#161719" text-anchor="middle">softmax</text>
      <g font-size="13" fill="#838383" text-anchor="middle">
        <text x="912" y="338">la stessa macchina</text>
        <text x="912" y="358">del budget</text>
        <text x="912" y="378">di ascolto</text>
      </g>
    </g>
    <line x1="986" y1="333" x2="1030" y2="333" stroke="#a1245a" stroke-width="3" marker-end="url(#arFocus)"/>

    <g id="distribuzione">
      <rect x="1040" y="142" width="240" height="30" rx="4" fill="#a1245a"/>
      <rect x="1040" y="186" width="176" height="30" rx="4" fill="#ecd3de"/>
      <rect x="1040" y="230" width="120" height="30" rx="4" fill="#ecd3de"/>
      <rect x="1040" y="274" width="96" height="30" rx="4" fill="#ecd3de"/>
      <rect x="1040" y="318" width="64" height="30" rx="4" fill="#ecd3de"/>
      <rect x="1040" y="362" width="32" height="30" rx="4" fill="#dee2e6"/>
      <rect x="1040" y="406" width="24" height="30" rx="4" fill="#dee2e6"/>
      <rect x="1040" y="450" width="16" height="30" rx="4" fill="#dee2e6"/>
      <rect x="1040" y="494" width="12" height="30" rx="4" fill="#dee2e6"/>
      <g font-family="&apos;SFMono-Regular&apos;, Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="700" text-anchor="end">
        <text x="1268" y="162" fill="#ffffff">30%</text>
        <text x="1204" y="206" fill="#161719">22%</text>
        <text x="1148" y="250" fill="#161719">15%</text>
        <text x="1124" y="294" fill="#161719">12%</text>
        <text x="1092" y="338" fill="#161719">8%</text>
      </g>
      <g font-family="&apos;SFMono-Regular&apos;, Menlo, Monaco, Consolas, monospace" font-size="15" fill="#212529">
        <text x="1294" y="162">sul</text>
        <text x="1230" y="206">un</text>
        <text x="1174" y="250">morbido</text>
        <text x="1150" y="294">nero</text>
        <text x="1118" y="338">stanco</text>
      </g>
      <text x="1040" y="584" font-size="13" fill="#838383">distribuzione di probabilit&#224;</text>
      <text x="1040" y="604" font-size="13" fill="#838383">sul token successivo</text>
    </g>

    <!-- ============ blocchi di chiusura ============ -->
    <g id="simmetria">
      <rect x="16" y="670" width="684" height="186" rx="8" fill="#f6f6f6"/>
      <rect x="16" y="670" width="4" height="186" rx="2" fill="#a1245a"/>
      <text x="48" y="712" font-size="19" font-weight="700" fill="#161719">Simmetria ingresso / uscita</text>
      <g font-size="15" fill="#212529">
        <text x="48" y="748">All&#8217;ingresso ogni token diventa un vettore.</text>
        <text x="48" y="776">In uscita il percorso si inverte: il vettore finale viene</text>
        <text x="48" y="804">confrontato con il vocabolario e torna a essere token.</text>
      </g>
    </g>

    <g id="callout">
      <rect x="730" y="670" width="666" height="186" rx="8" fill="#161719"/>
      <rect x="730" y="670" width="4" height="186" rx="2" fill="#ffbe0b"/>
      <text x="762" y="712" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="700" fill="#ffbe0b">Parigi: &#8722;3.1</text>
      <g font-size="15" fill="#ffffff">
        <text x="762" y="748">L&#8217;affinit&#224; non seleziona soltanto: pu&#242; anche escludere.</text>
        <text x="762" y="776">Un logit negativo spinge il token in fondo alla distribuzione,</text>
        <text x="762" y="804">e dopo la softmax la sua probabilit&#224; &#232; quasi zero.</text>
      </g>
    </g>

  </g>
</svg>
