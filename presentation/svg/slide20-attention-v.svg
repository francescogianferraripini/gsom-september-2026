<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 732" width="1140" height="732" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Attention, la V: i pacchi-value pesati dal contesto consegnano informazione al token calcio, che si sposta in direzioni opposte nello spazio delle idee</title>
  <defs>
    <pattern id="grid-idee" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1.4" fill="#dee2e6"/>
    </pattern>
    <marker id="ah-burgundy" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#a1245a"/>
    </marker>
  </defs>

  <g id="eyebrow">
    <text x="32" y="30" font-size="14" font-weight="600" letter-spacing="2" fill="#838383">LA CONSEGNA</text>
    <text x="560" y="30" text-anchor="end" font-size="13" font-weight="400" fill="#838383">dimensione del pacco = peso di attenzione</text>
    <text x="592" y="30" font-size="14" font-weight="600" letter-spacing="2" fill="#838383">LO SPAZIO DELLE IDEE</text>
    <text x="1128" y="30" text-anchor="end" font-size="13" font-weight="400" fill="#838383">il contesto sposta il token</text>
  </g>

  <!-- ============ SCENA 1 ============ -->
  <g id="scena-1">
    <rect x="12" y="44" width="548" height="330" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
    <text x="32" y="72" font-size="13" font-weight="600" letter-spacing="1.6" fill="#838383">FRASE 1</text>

    <g id="linee-1" fill="none" stroke-linecap="round">
      <line x1="110" y1="122" x2="377" y2="248" stroke="#dee2e6" stroke-width="1.2"/>
      <line x1="317" y1="122" x2="377" y2="248" stroke="#dee2e6" stroke-width="1.2"/>
      <line x1="432.5" y1="122" x2="377" y2="248" stroke="#dee2e6" stroke-width="1.2"/>
      <line x1="261.5" y1="122" x2="377" y2="248" stroke="#838383" stroke-width="1.5"/>
      <line x1="179" y1="122" x2="377" y2="248" stroke="#a1245a" stroke-width="2.5"/>
    </g>

    <g id="token-1" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="15">
      <rect x="92" y="88" width="36" height="34" rx="6" fill="#f6f6f6" stroke="#dee2e6"/>
      <text x="110" y="110" text-anchor="middle" fill="#212529">Il</text>
      <rect x="134" y="88" width="90" height="34" rx="6" fill="#f6f6f6" stroke="#dee2e6"/>
      <text x="179" y="110" text-anchor="middle" fill="#212529">portiere</text>
      <rect x="230" y="88" width="63" height="34" rx="6" fill="#f6f6f6" stroke="#dee2e6"/>
      <text x="261.5" y="110" text-anchor="middle" fill="#212529">diede</text>
      <rect x="299" y="88" width="36" height="34" rx="6" fill="#f6f6f6" stroke="#dee2e6"/>
      <text x="317" y="110" text-anchor="middle" fill="#212529">un</text>
      <rect x="341" y="88" width="72" height="34" rx="6" fill="#ecd3de" stroke="#a1245a"/>
      <text x="377" y="110" text-anchor="middle" fill="#a1245a">calcio</text>
      <rect x="419" y="88" width="27" height="34" rx="6" fill="#f6f6f6" stroke="#dee2e6"/>
      <text x="432.5" y="110" text-anchor="middle" fill="#212529">e</text>
      <rect x="452" y="88" width="27" height="34" rx="6" fill="#f6f6f6" stroke="#dee2e6"/>
      <text x="465.5" y="110" text-anchor="middle" fill="#838383">&#8230;</text>
    </g>

    <g id="pesi-1" font-size="13">
      <text x="179" y="82" text-anchor="middle" font-weight="700" fill="#a1245a">78%</text>
      <text x="261.5" y="82" text-anchor="middle" font-weight="600" fill="#838383">14%</text>
    </g>

    <g id="pacchi-1">
      <rect x="185.5" y="155" width="10" height="10" rx="2" fill="#dee2e6"/>
      <rect x="330.1" y="155" width="10" height="10" rx="2" fill="#dee2e6"/>
      <rect x="410.8" y="155" width="10" height="10" rx="2" fill="#dee2e6"/>
      <rect x="329.4" y="197" width="26" height="26" rx="4" fill="#ecd3de" stroke="#a1245a" stroke-width="1.5"/>
      <rect x="240.1" y="150" width="56" height="56" rx="4" fill="#a1245a"/>
      <text x="268.1" y="183" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">value</text>
    </g>

    <g id="somma-1">
      <circle cx="377" cy="264" r="16" fill="#ffffff" stroke="#838383" stroke-width="1.5"/>
      <text x="377" y="272" text-anchor="middle" font-size="22" font-weight="600" fill="#212529">+</text>
      <line x1="377" y1="280" x2="377" y2="296" stroke="#a1245a" stroke-width="2.5" marker-end="url(#ah-burgundy)"/>
    </g>

    <g id="esito-1">
      <rect x="302" y="300" width="150" height="50" rx="8" fill="#161719"/>
      <rect x="302" y="300" width="4" height="50" fill="#ffbe0b"/>
      <text x="322" y="322" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="17" fill="#ffffff">calcio</text>
      <text x="322" y="340" font-size="13" font-weight="400" fill="#838383">arricchito dal contesto</text>
    </g>
  </g>

  <!-- ============ SCENA 2 ============ -->
  <g id="scena-2">
    <rect x="12" y="390" width="548" height="330" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
    <text x="32" y="418" font-size="13" font-weight="600" letter-spacing="1.6" fill="#838383">FRASE 2</text>

    <g id="linee-2" fill="none" stroke-linecap="round">
      <line x1="60.5" y1="468" x2="431" y2="594" stroke="#dee2e6" stroke-width="1.2"/>
      <line x1="107" y1="468" x2="431" y2="594" stroke="#dee2e6" stroke-width="1.2"/>
      <line x1="153.5" y1="468" x2="431" y2="594" stroke="#dee2e6" stroke-width="1.2"/>
      <line x1="260" y1="468" x2="431" y2="594" stroke="#dee2e6" stroke-width="1.2"/>
      <line x1="371" y1="468" x2="431" y2="594" stroke="#dee2e6" stroke-width="1.2"/>
      <line x1="486.5" y1="468" x2="431" y2="594" stroke="#dee2e6" stroke-width="1.2"/>
      <line x1="315.5" y1="468" x2="431" y2="594" stroke="#838383" stroke-width="1.5"/>
      <line x1="209" y1="468" x2="431" y2="594" stroke="#a1245a" stroke-width="2.5"/>
    </g>

    <g id="token-2" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="15">
      <rect x="38" y="434" width="45" height="34" rx="6" fill="#f6f6f6" stroke="#dee2e6"/>
      <text x="60.5" y="456" text-anchor="middle" fill="#212529">Per</text>
      <rect x="89" y="434" width="36" height="34" rx="6" fill="#f6f6f6" stroke="#dee2e6"/>
      <text x="107" y="456" text-anchor="middle" fill="#212529">le</text>
      <rect x="131" y="434" width="45" height="34" rx="6" fill="#f6f6f6" stroke="#dee2e6"/>
      <text x="153.5" y="456" text-anchor="middle" fill="#212529">mie</text>
      <rect x="182" y="434" width="54" height="34" rx="6" fill="#f6f6f6" stroke="#dee2e6"/>
      <text x="209" y="456" text-anchor="middle" fill="#212529">ossa</text>
      <rect x="242" y="434" width="36" height="34" rx="6" fill="#f6f6f6" stroke="#dee2e6"/>
      <text x="260" y="456" text-anchor="middle" fill="#212529">ho</text>
      <rect x="284" y="434" width="63" height="34" rx="6" fill="#f6f6f6" stroke="#dee2e6"/>
      <text x="315.5" y="456" text-anchor="middle" fill="#212529">preso</text>
      <rect x="353" y="434" width="36" height="34" rx="6" fill="#f6f6f6" stroke="#dee2e6"/>
      <text x="371" y="456" text-anchor="middle" fill="#212529">il</text>
      <rect x="395" y="434" width="72" height="34" rx="6" fill="#ecd3de" stroke="#a1245a"/>
      <text x="431" y="456" text-anchor="middle" fill="#a1245a">calcio</text>
      <rect x="473" y="434" width="27" height="34" rx="6" fill="#f6f6f6" stroke="#dee2e6"/>
      <text x="486.5" y="456" text-anchor="middle" fill="#212529">e</text>
      <rect x="506" y="434" width="27" height="34" rx="6" fill="#f6f6f6" stroke="#dee2e6"/>
      <text x="519.5" y="456" text-anchor="middle" fill="#838383">&#8230;</text>
    </g>

    <g id="pacchi-2">
      <rect x="137.7" y="491" width="10" height="10" rx="2" fill="#dee2e6"/>
      <rect x="173.9" y="491" width="10" height="10" rx="2" fill="#dee2e6"/>
      <rect x="210.1" y="491" width="10" height="10" rx="2" fill="#dee2e6"/>
      <rect x="293.0" y="491" width="10" height="10" rx="2" fill="#dee2e6"/>
      <rect x="379.3" y="491" width="10" height="10" rx="2" fill="#dee2e6"/>
      <rect x="469.2" y="491" width="10" height="10" rx="2" fill="#dee2e6"/>
      <rect x="383.1" y="543" width="38" height="38" rx="4" fill="#ecd3de" stroke="#a1245a" stroke-width="1.5"/>
      <rect x="292" y="503" width="56" height="56" rx="4" fill="#a1245a"/>
      <text x="320" y="536" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">value</text>
    </g>

    <g id="somma-2">
