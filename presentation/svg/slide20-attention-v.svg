      <text x="376" y="686" font-size="13" font-weight="400" fill="#838383">arricchito dal contesto</text>
    </g>
  </g>

  <!-- ============ SPAZIO DELLE IDEE ============ -->
  <g id="piano">
    <rect x="580" y="44" width="548" height="676" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
    <rect x="580" y="44" width="548" height="676" rx="8" fill="url(#grid-idee)"/>
  </g>

  <g id="cluster-sport">
    <ellipse cx="945" cy="203" rx="155" ry="105" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1" stroke-dasharray="5 5"/>
    <text x="945" y="86" text-anchor="middle" font-size="13" font-weight="600" letter-spacing="1.6" fill="#838383">SPORT</text>
    <circle cx="872" cy="163" r="7" fill="#212529"/>
    <text x="872" y="189" text-anchor="middle" font-size="19" font-weight="600" fill="#212529">pallone</text>
    <circle cx="1010" cy="166" r="7" fill="#212529"/>
    <text x="1010" y="192" text-anchor="middle" font-size="19" font-weight="600" fill="#212529">rigore</text>
    <circle cx="935" cy="228" r="7" fill="#212529"/>
    <text x="935" y="254" text-anchor="middle" font-size="19" font-weight="600" fill="#212529">partita</text>
  </g>

  <g id="cluster-minerali">
    <ellipse cx="960" cy="573" rx="160" ry="110" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1" stroke-dasharray="5 5"/>
    <text x="960" y="704" text-anchor="middle" font-size="13" font-weight="600" letter-spacing="1.6" fill="#838383">MINERALI / SALUTE</text>
    <circle cx="883" cy="533" r="7" fill="#212529"/>
    <text x="883" y="559" text-anchor="middle" font-size="19" font-weight="600" fill="#212529">ferro</text>
    <circle cx="1035" cy="536" r="7" fill="#212529"/>
    <text x="1035" y="562" text-anchor="middle" font-size="19" font-weight="600" fill="#212529">vitamina D</text>
    <circle cx="950" cy="603" r="7" fill="#212529"/>
    <text x="950" y="629" text-anchor="middle" font-size="19" font-weight="600" fill="#212529">ossa</text>
  </g>

  <g id="spostamenti" stroke="#a1245a" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#ah-burgundy)">
    <line x1="683" y1="378" x2="828" y2="281"/>
    <line x1="683.2" y1="397.6" x2="835.5" y2="494.1"/>
  </g>

  <g id="token-ambiguo">
    <circle cx="668" cy="388" r="9" fill="#a1245a"/>
    <text x="668" y="348" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="19" fill="#a1245a">calcio</text>
    <text x="668" y="370" text-anchor="middle" font-size="13" font-weight="400" fill="#838383">(ambiguo)</text>
  </g>

  <g id="etichette-frasi">
    <rect x="718" y="317" width="76" height="24" rx="6" fill="#ffffff" stroke="#dee2e6"/>
    <text x="756" y="334" text-anchor="middle" font-size="14" font-weight="600" fill="#a1245a">frase 1</text>
    <rect x="721" y="434" width="76" height="24" rx="6" fill="#ffffff" stroke="#dee2e6"/>
    <text x="759" y="451" text-anchor="middle" font-size="14" font-weight="600" fill="#a1245a">frase 2</text>
  </g>

  <g id="callout">
    <rect x="592" y="618" width="196" height="86" rx="8" fill="#161719"/>
    <rect x="592" y="618" width="4" height="86" fill="#ffbe0b"/>
    <text x="612" y="648" font-size="13" font-weight="600" fill="#ffffff">lo stesso token,</text>
    <text x="612" y="668" font-size="13" font-weight="600" fill="#ffffff">spostato in direzioni</text>
    <text x="612" y="688" font-size="13" font-weight="600" fill="#ffffff">opposte dal contesto</text>
  </g>
</svg>
