<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img">
  <title>Il meccanismo dell'RLHF: gli umani confrontano due risposte alla stessa domanda e marcano la preferita; da quei confronti si addestra il reward model, che assegna il punteggio con cui il modello aggiorna i pesi</title>

  <!-- La vignetta del golfista con la mira NON sta piu' qui: e' la slide 11.
       Teneva stretto il meccanismo a meno di un terzo della larghezza, e i testi
       delle due risposte risultavano sotto il minimo leggibile del deck. -->

  <defs><marker id="fg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#838383"/></marker><marker id="fb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#a1245a"/></marker></defs>
  <text x="20" y="30" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#161719">UMANI</text>
  <text x="20" y="52" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#838383">confrontano due risposte alla stessa domanda, e marcano la preferita</text>
  <text x="20" y="84" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#838383" letter-spacing="1.2">LA DOMANDA</text>
  <rect x="20" y="92" width="600" height="42" rx="8" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/>
  <text x="40" y="119" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="19" font-weight="400" fill="#212529">Come posso aumentare le vendite?</text>
  <rect x="20" y="150" width="600" height="100" rx="8" fill="#ffffff" stroke="#a1245a" stroke-width="2"/>
  <circle cx="52" cy="180" r="16" fill="#a1245a" stroke="#a1245a" stroke-width="2"/>
  <text x="52" y="186" text-anchor="middle" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#ffffff">A</text>
  <text x="80" y="178" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#212529">Puoi agire su tre leve: acquisire nuovi clienti,</text>
  <text x="80" y="202" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#212529">aumentare il valore medio per cliente, migliorare</text>
  <text x="80" y="226" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#212529">la retention. Vuoi approfondirne una?</text>
  <rect x="20" y="262" width="600" height="100" rx="8" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/>
  <circle cx="52" cy="292" r="16" fill="#ffffff" stroke="#dee2e6" stroke-width="2"/>
  <text x="52" y="298" text-anchor="middle" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#838383">B</text>
  <text x="80" y="290" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#838383">E quante persone lavorano nella tua azienda?</text>
  <text x="80" y="314" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#838383">Il settore è B2B o B2C? In quale mercato</text>
  <text x="80" y="338" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#838383">operate?</text>
  <path d="M24 392 L34 403 L52 380" fill="none" stroke="#a1245a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="66" y="400" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#a1245a">A scelta</text>
  <line x1="640" y1="60" x2="640" y2="410" stroke="#dee2e6" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="626" y1="230" x2="686" y2="230" stroke="#838383" stroke-width="2" marker-end="url(#fg)"/>
  <text x="700" y="224" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#838383">le preferenze</text>
  <text x="700" y="242" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#838383">addestrano…</text>
  <rect x="700" y="60" width="380" height="130" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <rect x="700" y="78" width="4" height="94" rx="0" fill="#a1245a"/>
  <text x="726" y="104" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#a1245a">reward model</text>
  <text x="726" y="132" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#838383">impara a prevedere quale risposta</text>
  <text x="726" y="152" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#838383">preferirebbero gli umani</text>
  <line x1="890" y1="190" x2="890" y2="266" stroke="#a1245a" stroke-width="3" marker-end="url(#fb)"/>
  <text x="910" y="218" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#a1245a">reward</text>
  <text x="910" y="240" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#838383">stesso metodo: gradient descent —</text>
  <text x="910" y="258" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#838383">cambia solo il punteggio</text>
  <rect x="700" y="276" width="380" height="130" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="726" y="320" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#161719">modello</text>
  <text x="726" y="348" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#838383">aggiorna i pesi, un passo alla volta</text>
  <path d="M1040 372 A 26 26 0 1 1 1026 360" fill="none" stroke="#838383" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fg)"/>
  <rect x="20" y="430" width="1060" height="106" rx="8" fill="#161719"/>
  <rect x="21" y="448" width="4" height="70" rx="0" fill="#ffbe0b"/>
  <text x="48" y="476" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" fill="#ffffff">il punteggio non arriva dagli umani: arriva dal reward model.</text>
  <text x="48" y="508" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#dee2e6">gli umani sono due passi a monte — confrontano risposte, e da quei confronti si addestra il modello che assegna il reward.</text>
</svg>
