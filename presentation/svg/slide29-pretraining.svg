<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 838" width="1140" height="838" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Il ciclo di pretraining: il modello prevede il prossimo token, confronta con la verità e aggiusta tutte le matrici</title>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#838383"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#a1245a"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ffbe0b"/>
    </marker>
  </defs>

  <!-- ============ TAPPA 1 — il testo vero ============ -->
  <g id="tappa1">
    <rect x="96" y="16" width="488" height="334" rx="8" fill="#ffffff" stroke="#dee2e6"/>
    <text x="120" y="52" font-size="13" font-weight="600" fill="#838383" letter-spacing="1.6">TAPPA 1</text>
    <text x="120" y="84" font-size="21" font-weight="700" fill="#161719">il testo vero</text>
    <text x="120" y="112" font-size="15" font-weight="400" fill="#838383">un frammento qualsiasi del corpus</text>

    <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="19">
      <rect x="124" y="136" width="46" height="44" rx="8" fill="#f6f6f6" stroke="#dee2e6"/>
      <text x="147" y="164" fill="#161719" text-anchor="middle">Il</text>
      <rect x="178" y="136" width="86" height="44" rx="8" fill="#f6f6f6" stroke="#dee2e6"/>
      <text x="221" y="164" fill="#161719" text-anchor="middle">gatto</text>
      <rect x="272" y="136" width="42" height="44" rx="8" fill="#f6f6f6" stroke="#dee2e6"/>
      <text x="293" y="164" fill="#161719" text-anchor="middle">è</text>
      <rect x="322" y="136" width="66" height="44" rx="8" fill="#161719"/>
      <rect x="396" y="136" width="88" height="44" rx="8" fill="#161719"/>
    </g>

    <path d="M322 192 L322 200 L484 200 L484 192" fill="none" stroke="#838383" stroke-width="1"/>
    <text x="403" y="222" font-size="14" font-weight="500" fill="#838383" text-anchor="middle">nascosto</text>

    <rect x="120" y="252" width="440" height="76" rx="8" fill="#f6f6f6"/>
    <rect x="120" y="252" width="3" height="76" fill="#a1245a"/>
    <text x="144" y="285" font-size="17" font-weight="600" fill="#161719">il compito: indovinare il token</text>
    <text x="144" y="310" font-size="17" font-weight="600" fill="#161719">che viene dopo</text>
  </g>

  <!-- freccia tappa 1 -> tappa 2 -->
  <line x1="588" y1="183" x2="632" y2="183" stroke="#838383" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- ============ TAPPA 2 — la previsione ============ -->
  <g id="tappa2">
    <rect x="640" y="16" width="488" height="334" rx="8" fill="#ffffff" stroke="#dee2e6"/>
    <text x="664" y="52" font-size="13" font-weight="600" fill="#838383" letter-spacing="1.6">TAPPA 2</text>
    <text x="664" y="84" font-size="21" font-weight="700" fill="#161719">la previsione</text>
    <text x="664" y="112" font-size="15" font-weight="400" fill="#838383">la distribuzione di probabilità sul prossimo token</text>

    <rect x="664" y="206" width="100" height="56" rx="8" fill="#161719"/>
    <text x="714" y="240" font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle">modello</text>

    <line x1="766" y1="234" x2="790" y2="234" stroke="#838383" stroke-width="1.5"/>
    <line x1="790" y1="150" x2="790" y2="318" stroke="#838383" stroke-width="1.5"/>
    <g stroke="#838383" stroke-width="1.5" marker-end="url(#ag)">
      <line x1="790" y1="154" x2="804" y2="154"/>
      <line x1="790" y1="194" x2="804" y2="194"/>
      <line x1="790" y1="234" x2="804" y2="234"/>
      <line x1="790" y1="274" x2="804" y2="274"/>
      <line x1="790" y1="314" x2="804" y2="314"/>
    </g>

    <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="15" fill="#212529">
      <text x="812" y="159">sul</text>
      <text x="812" y="199">un</text>
      <text x="812" y="239">morbido</text>
      <text x="812" y="279">nero</text>
      <text x="812" y="319">stanco</text>
    </g>
    <g fill="#dee2e6">
      <rect x="890" y="142" width="160" height="24" rx="4"/>
      <rect x="890" y="182" width="117" height="24" rx="4"/>
      <rect x="890" y="222" width="80" height="24" rx="4"/>
      <rect x="890" y="262" width="64" height="24" rx="4"/>
      <rect x="890" y="302" width="43" height="24" rx="4"/>
    </g>
    <g font-size="13" font-weight="500" fill="#838383">
      <text x="1060" y="159">30%</text>
      <text x="1017" y="199">22%</text>
      <text x="980" y="239">15%</text>
      <text x="964" y="279">12%</text>
      <text x="943" y="319">8%</text>
    </g>
  </g>

  <!-- freccia tappa 2 -> tappa 3 -->
  <line x1="884" y1="354" x2="884" y2="386" stroke="#838383" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- ============ TAPPA 3 — il confronto ============ -->
  <g id="tappa3">
    <rect x="640" y="392" width="488" height="356" rx="8" fill="#ffffff" stroke="#dee2e6"/>
    <text x="664" y="424" font-size="13" font-weight="600" fill="#838383" letter-spacing="1.6">TAPPA 3</text>
    <text x="664" y="456" font-size="21" font-weight="700" fill="#161719">il confronto</text>

    <rect x="664" y="472" width="440" height="86" rx="8" fill="#161719"/>
    <rect x="664" y="472" width="3" height="86" fill="#ffbe0b"/>
    <text x="688" y="506" font-size="17" font-weight="700" fill="#ffbe0b">cross-entropy:</text>
    <text x="688" y="534" font-size="16" font-weight="400" fill="#ffffff">quanta probabilità hai dato alla verità?</text>

    <line x1="884" y1="562" x2="884" y2="586" stroke="#ffbe0b" stroke-width="2" marker-end="url(#am)"/>

    <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="15" fill="#212529">
      <text x="672" y="612">sul</text>
      <text x="672" y="650">un</text>
      <text x="672" y="686">morbido</text>
    </g>
    <rect x="772" y="590" width="200" height="30" rx="4" fill="#a1245a"/>
    <text x="960" y="611" font-size="15" font-weight="600" fill="#ffffff" text-anchor="end">30%</text>
    <rect x="772" y="632" width="146" height="24" rx="4" fill="#dee2e6"/>
    <text x="928" y="650" font-size="13" font-weight="500" fill="#838383">22%</text>
    <rect x="772" y="668" width="100" height="24" rx="4" fill="#dee2e6"/>
    <text x="882" y="686" font-size="13" font-weight="500" fill="#838383">15%</text>

    <text x="990" y="580" font-size="13" font-weight="500" fill="#838383">token vero</text>
    <rect x="990" y="590" width="106" height="36" rx="8" fill="#ecd3de" stroke="#a1245a" stroke-width="1.5"/>
    <text x="1043" y="616" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="19" fill="#a1245a" text-anchor="middle">sul</text>

    <text x="664" y="724" font-size="15" font-weight="400" fill="#838383">la barra giusta deve salire, tutte le altre devono scendere</text>
  </g>

  <!-- ============ TAPPA 4 — la correzione ============ -->
  <g id="tappa4">
    <rect x="96" y="392" width="488" height="356" rx="8" fill="#ffffff" stroke="#dee2e6"/>
    <text x="120" y="424" font-size="13" font-weight="600" fill="#838383" letter-spacing="1.6">TAPPA 4</text>
    <text x="120" y="456" font-size="21" font-weight="700" fill="#161719">la correzione</text>
    <text x="120" y="480" font-size="15" font-weight="400" fill="#838383">l'aggiustamento tocca tutti i pesi, non un archivio</text>

    <rect x="120" y="492" width="440" height="196" rx="8" fill="#161719"/>
    <text x="144" y="526" font-size="17" font-weight="600" fill="#ffffff">modello</text>

    <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="14" fill="#dee2e6" text-anchor="middle">
      <text x="200" y="552">embedding</text>
      <text x="340" y="552">Q K V</text>
      <text x="480" y="552">rilevatori</text>
    </g>

    <g fill="#f6f6f6">
      <!-- embedding -->
      <rect x="163" y="562" width="22" height="22" rx="2"/><rect x="189" y="562" width="22" height="22" rx="2" fill="#ffbe0b"/><rect x="215" y="562" width="22" height="22" rx="2"/>
      <rect x="163" y="588" width="22" height="22" rx="2"/><rect x="189" y="588" width="22" height="22" rx="2"/><rect x="215" y="588" width="22" height="22" rx="2" fill="#ffbe0b"/>
      <rect x="163" y="614" width="22" height="22" rx="2" fill="#ffbe0b"/><rect x="189" y="614" width="22" height="22" rx="2"/><rect x="215" y="614" width="22" height="22" rx="2"/>
      <!-- Q K V -->
      <rect x="303" y="562" width="22" height="22" rx="2" fill="#ffbe0b"/><rect x="329" y="562" width="22" height="22" rx="2"/><rect x="355" y="562" width="22" height="22" rx="2"/>
      <rect x="303" y="588" width="22" height="22" rx="2"/><rect x="329" y="588" width="22" height="22" rx="2" fill="#ffbe0b"/><rect x="355" y="588" width="22" height="22" rx="2"/>
      <rect x="303" y="614" width="22" height="22" rx="2"/><rect x="329" y="614" width="22" height="22" rx="2"/><rect x="355" y="614" width="22" height="22" rx="2" fill="#ffbe0b"/>
      <!-- rilevatori -->
      <rect x="443" y="562" width="22" height="22" rx="2"/><rect x="469" y="562" width="22" height="22" rx="2"/><rect x="495" y="562" width="22" height="22" rx="2" fill="#ffbe0b"/>
      <rect x="443" y="588" width="22" height="22" rx="2" fill="#ffbe0b"/><rect x="469" y="588" width="22" height="22" rx="2"/><rect x="495" y="588" width="22" height="22" rx="2"/>
      <rect x="443" y="614" width="22" height="22" rx="2"/><rect x="469" y="614" width="22" height="22" rx="2" fill="#ffbe0b"/><rect x="495" y="614" width="22" height="22" rx="2"/>
    </g>

    <line x1="200" y1="664" x2="480" y2="664" stroke="#ffbe0b" stroke-width="2"/>
    <g stroke="#ffbe0b" stroke-width="2" marker-end="url(#am)">
      <line x1="200" y1="664" x2="200" y2="642"/>
      <line x1="340" y1="664" x2="340" y2="642"/>
      <line x1="480" y1="664" x2="480" y2="642"/>
    </g>
  </g>

  <!-- freccia focale: gradient descent, dalla tappa 3 alla tappa 4 -->
  <path d="M884 752 L884 812 L340 812 L340 696" fill="none" stroke="#a1245a" stroke-width="3" stroke-linejoin="round" marker-end="url(#ar)"/>
  <text x="612" y="796" font-size="17" font-weight="600" fill="#a1245a" text-anchor="middle">gradient descent: aggiusta di poco tutte le matrici</text>

  <!-- chiusura del ciclo: dalla tappa 4 alla tappa 1 -->
  <path d="M92 560 L52 560 L52 120 L92 120" fill="none" stroke="#838383" stroke-width="2" stroke-linejoin="round" marker-end="url(#ag)"/>
  <rect x="14" y="294" width="76" height="72" fill="#ffffff"/>
  <g font-size="14" font-weight="500" fill="#838383" text-anchor="middle">
    <text x="52" y="316">si ripete</text>
    <text x="52" y="336">trilioni</text>
    <text x="52" y="356">di volte</text>
  </g>
</svg>
