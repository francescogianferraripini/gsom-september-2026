<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="1120" height="700">
  <title>La tokenizzazione: parole comuni diventano un token ciascuna, le parole rare vengono spezzate in frammenti presi da un vocabolario fisso</title>

  <defs>
    <marker id="tipGrigio" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#838383"/>
    </marker>
    <marker id="tipBurgundy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a1245a"/>
    </marker>
  </defs>

  <g font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

    <!-- ============ RIGA 1: parole comuni ============ -->
    <g id="riga-comune">
      <text x="343" y="46" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="22" fill="#838383">Il gatto è sul tavolo</text>
      <line x1="343" y1="58" x2="343" y2="84" stroke="#838383" stroke-width="1.5" marker-end="url(#tipGrigio)"/>

      <g>
        <rect x="40" y="92" width="90" height="76" rx="8" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/>
        <rect x="134" y="92" width="150" height="76" rx="8" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/>
        <rect x="288" y="92" width="80" height="76" rx="8" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/>
        <rect x="372" y="92" width="110" height="76" rx="8" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/>
        <rect x="486" y="92" width="160" height="76" rx="8" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/>
      </g>

      <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="30" fill="#212529" text-anchor="middle">
        <text x="85" y="141">Il</text>
        <text x="209" y="141">gatto</text>
        <text x="328" y="141">è</text>
        <text x="427" y="141">sul</text>
        <text x="566" y="141">tavolo</text>
      </g>

      <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="17" fill="#838383" text-anchor="middle">
        <text x="85" y="194">243</text>
        <text x="209" y="194">28741</text>
        <text x="328" y="194">1105</text>
        <text x="427" y="194">3387</text>
        <text x="566" y="194">9152</text>
      </g>

      <rect x="700" y="98" width="3" height="62" fill="#dee2e6"/>
      <text x="722" y="137" font-size="22" font-weight="500" fill="#838383">parole comuni: un token ciascuna</text>
    </g>

    <!-- ============ RIGA 2: parola rara (elemento focale) ============ -->
    <g id="riga-rara">
      <text x="357" y="268" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="22" fill="#161719">elettroencefalogramma</text>
      <line x1="357" y1="280" x2="357" y2="306" stroke="#a1245a" stroke-width="2.5" marker-end="url(#tipBurgundy)"/>

      <g>
        <rect x="40" y="314" width="190" height="76" rx="8" fill="#ecd3de" stroke="#a1245a" stroke-width="1.5"/>
        <rect x="242" y="314" width="200" height="76" rx="8" fill="#ecd3de" stroke="#a1245a" stroke-width="1.5"/>
        <rect x="454" y="314" width="220" height="76" rx="8" fill="#ecd3de" stroke="#a1245a" stroke-width="1.5"/>
      </g>

      <!-- tacche di spezzatura -->
      <g stroke="#a1245a" stroke-width="2" stroke-linecap="round">
        <line x1="236" y1="326" x2="236" y2="378"/>
        <line x1="448" y1="326" x2="448" y2="378"/>
      </g>

      <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="30" fill="#161719" text-anchor="middle">
        <text x="135" y="363">elettro</text>
        <text x="342" y="363">encefal</text>
        <text x="564" y="363">ogramma</text>
      </g>

      <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="17" fill="#a1245a" text-anchor="middle">
        <text x="135" y="416">11621</text>
        <text x="342" y="416">45093</text>
        <text x="564" y="416">30818</text>
      </g>

      <rect x="700" y="320" width="3" height="62" fill="#a1245a"/>
      <text x="722" y="359" font-size="22" font-weight="600" fill="#a1245a">parola rara: spezzata in frammenti</text>
    </g>

    <!-- ============ FRECCIA DAL VOCABOLARIO ============ -->
    <line x1="357" y1="522" x2="357" y2="442" stroke="#838383" stroke-width="2" marker-end="url(#tipGrigio)"/>
    <text x="380" y="490" font-size="13" fill="#838383">i token provengono da qui</text>

    <!-- ============ VOCABOLARIO ============ -->
    <g id="vocabolario">
      <rect x="40" y="530" width="634" height="150" rx="8" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/>

      <g fill="#ffffff" stroke="#dee2e6" stroke-width="1">
        <rect x="56" y="548" width="56" height="22" rx="4"/>
        <rect x="120" y="548" width="56" height="22" rx="4"/>
        <rect x="184" y="548" width="56" height="22" rx="4"/>
        <rect x="248" y="548" width="56" height="22" rx="4"/>
        <rect x="312" y="548" width="56" height="22" rx="4"/>
        <rect x="376" y="548" width="56" height="22" rx="4"/>
        <rect x="440" y="548" width="56" height="22" rx="4"/>
        <rect x="504" y="548" width="56" height="22" rx="4"/>
        <rect x="568" y="548" width="56" height="22" rx="4"/>

        <rect x="56" y="578" width="56" height="22" rx="4"/>
        <rect x="120" y="578" width="56" height="22" rx="4"/>
        <rect x="184" y="578" width="56" height="22" rx="4"/>
        <rect x="248" y="578" width="56" height="22" rx="4"/>
        <rect x="312" y="578" width="56" height="22" rx="4"/>
        <rect x="376" y="578" width="56" height="22" rx="4"/>
        <rect x="440" y="578" width="56" height="22" rx="4"/>
        <rect x="504" y="578" width="56" height="22" rx="4"/>
        <rect x="568" y="578" width="56" height="22" rx="4"/>
      </g>

      <!-- i frammenti della parola rara, dentro il vocabolario -->
      <g fill="#ecd3de" stroke="#a1245a" stroke-width="1">
        <rect x="120" y="548" width="56" height="22" rx="4"/>
        <rect x="376" y="548" width="56" height="22" rx="4"/>
        <rect x="504" y="578" width="56" height="22" rx="4"/>
      </g>

      <text x="357" y="646" text-anchor="middle" font-size="22" font-weight="600" fill="#161719">vocabolario fisso: ~100.000 token</text>
    </g>

  </g>
</svg>
