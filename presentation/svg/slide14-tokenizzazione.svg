, Menlo, Monaco, Consolas, monospace" font-size="9.5" fill="#a1245a" text-anchor="middle" font-weight="400">30818</text><path d="M 607.7777777777778 180 L 607.7777777777778 162" fill="none" stroke="#b0b6bc" stroke-width="1.3" marker-end="url(#a)"/><text x="30" y="206" textLength="640" lengthAdjust="spacingAndGlyphs" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="27" fill="#212529">Il gatto ha un elettroencefalogramma</text><line x1="421.11111111111114" y1="184" x2="421.11111111111114" y2="212" stroke="#a1245a" stroke-width="1.8"/><line x1="545.5555555555555" y1="184" x2="545.5555555555555" y2="212" stroke="#a1245a" stroke-width="1.8"/><rect x="20" y="226" width="660" height="82" rx="8" fill="#161719" stroke="none" stroke-width="1.0"/><text x="44" y="262" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="19" fill="#e0a500" text-anchor="start" font-weight="700">11621</text><text x="118" y="261" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#c9ccd1" text-anchor="start" font-weight="400">e non</text><text x="158" y="262" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="15" fill="#8a8f96" text-anchor="start" font-weight="400">e l e t t r o</text><line x1="156" y1="257" x2="272" y2="257" stroke="#8a8f96" stroke-width="1.4"/><text x="44" y="288" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#8a8f96" text-anchor="start" font-weight="400">dentro la tessera le lettere spariscono</text><text x="316" y="250" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#ffffff" text-anchor="start" font-weight="400">È per questo che a un modello riesce difficile contare le</text><text x="316" y="267" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#ffffff" text-anchor="start" font-weight="400">lettere di una parola: le lettere, lui, non le ha mai viste.</text><text x="316" y="290" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#e0a500" text-anchor="start" font-weight="700">D'ora in poi diremo: token.</text></svg>