t x="316" y="313" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#ffffff" text-anchor="start" font-weight="400">lettere di una parola: le lettere, lui, non le ha mai viste.</text><text x="316" y="336" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#e0a500" text-anchor="start" font-weight="700">D'ora in poi diremo: token.</text></g></svg>