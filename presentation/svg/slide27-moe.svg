<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 886 656" width="886" height="656" role="img">
  <title>Mixture of Experts: il router attiva solo 2 esperti su 8 per ogni token in transito</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0.5 L10 5 L0 9.5 z" fill="#838383"/>
    </marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0.5 L10 5 L0 9.5 z" fill="#a1245a"/>
    </marker>
    <clipPath id="clipE3"><rect x="290" y="190" width="228" height="56" rx="8"/></clipPath>
    <clipPath id="clipE6"><rect x="290" y="394" width="228" height="56" rx="8"/></clipPath>
    <clipPath id="clipCallout"><rect x="150" y="604" width="580" height="42" rx="8"/></clipPath>
  </defs>

  <g font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

    <!-- ============ INGRESSO: embedding in transito ============ -->
    <g id="ingresso">
      <rect x="44" y="258" width="32" height="124" rx="8" fill="#f6f6f6" stroke="#dee2e6"/>
      <g stroke="#dee2e6" stroke-width="1">
        <line x1="44" y1="289" x2="76" y2="289"/>
        <line x1="44" y1="320" x2="76" y2="320"/>
        <line x1="44" y1="351" x2="76" y2="351"/>
      </g>
      <text x="60" y="404" text-anchor="middle" font-size="13" font-weight="500" fill="#212529">embedding</text>
      <text x="60" y="421" text-anchor="middle" font-size="13" font-weight="500" fill="#838383">in transito</text>
    </g>
    <line x1="80" y1="320" x2="112" y2="320" stroke="#838383" stroke-width="1.5" marker-end="url(#ar)"/>

    <!-- ============ ROUTER ============ -->
    <g id="router">
      <rect x="118" y="288" width="104" height="64" rx="8" fill="#ffffff" stroke="#a1245a" stroke-width="2"/>
      <text x="170" y="326" text-anchor="middle" font-size="19" font-weight="700" fill="#a1245a">router</text>
      <text x="170" y="376" text-anchor="middle" font-size="13" font-weight="500" fill="#838383">sceglie chi lavora</text>
    </g>

    <!-- candidati non scelti: tracce spente -->
    <g stroke="#dee2e6" stroke-width="1" stroke-dasharray="3 3" fill="none">
      <path d="M222 320 C 252 320, 256 82, 284 82"/>
      <path d="M222 320 C 252 320, 256 150, 284 150"/>
      <path d="M222 320 C 252 320, 256 286, 284 286"/>
      <path d="M222 320 C 252 320, 256 354, 284 354"/>
      <path d="M222 320 C 252 320, 256 490, 284 490"/>
      <path d="M222 320 C 252 320, 256 558, 284 558"/>
    </g>

    <!-- instradamento attivo -->
    <g stroke="#a1245a" stroke-width="2.5" fill="none" marker-end="url(#arp)">
      <path d="M222 320 C 252 320, 256 218, 282 218"/>
      <path d="M222 320 C 252 320, 256 422, 282 422"/>
    </g>

    <!-- ============ SCHIERA DEGLI ESPERTI ============ -->
    <text x="404" y="38" text-anchor="middle" font-size="13" font-weight="500" fill="#838383">ogni esperto: un fully connected pi&#249; piccolo</text>

    <g id="esperti">
      <!-- esperto 1 (spento) -->
      <rect x="290" y="54" width="228" height="56" rx="8" fill="#f6f6f6" stroke="#dee2e6"/>
      <g stroke="#dee2e6" stroke-width="0.8" fill="#dee2e6">
        <line x1="308" y1="68" x2="336" y2="68"/><line x1="308" y1="68" x2="336" y2="82"/><line x1="308" y1="68" x2="336" y2="96"/>
        <line x1="308" y1="82" x2="336" y2="68"/><line x1="308" y1="82" x2="336" y2="82"/><line x1="308" y1="82" x2="336" y2="96"/>
        <line x1="308" y1="96" x2="336" y2="68"/><line x1="308" y1="96" x2="336" y2="82"/><line x1="308" y1="96" x2="336" y2="96"/>
        <circle cx="308" cy="68" r="2.6"/><circle cx="308" cy="82" r="2.6"/><circle cx="308" cy="96" r="2.6"/>
        <circle cx="336" cy="68" r="2.6"/><circle cx="336" cy="82" r="2.6"/><circle cx="336" cy="96" r="2.6"/>
      </g>
      <text x="356" y="88" font-size="17" font-weight="500" fill="#838383">esperto 1</text>

      <!-- esperto 2 (spento) -->
      <rect x="290" y="122" width="228" height="56" rx="8" fill="#f6f6f6" stroke="#dee2e6"/>
      <g stroke="#dee2e6" stroke-width="0.8" fill="#dee2e6">
        <line x1="308" y1="136" x2="336" y2="136"/><line x1="308" y1="136" x2="336" y2="150"/><line x1="308" y1="136" x2="336" y2="164"/>
        <line x1="308" y1="150" x2="336" y2="136"/><line x1="308" y1="150" x2="336" y2="150"/><line x1="308" y1="150" x2="336" y2="164"/>
        <line x1="308" y1="164" x2="336" y2="136"/><line x1="308" y1="164" x2="336" y2="150"/><line x1="308" y1="164" x2="336" y2="164"/>
        <circle cx="308" cy="136" r="2.6"/><circle cx="308" cy="150" r="2.6"/><circle cx="308" cy="164" r="2.6"/>
        <circle cx="336" cy="136" r="2.6"/><circle cx="336" cy="150" r="2.6"/><circle cx="336" cy="164" r="2.6"/>
      </g>
      <text x="356" y="156" font-size="17" font-weight="500" fill="#838383">esperto 2</text>

      <!-- esperto 3 (ATTIVO) -->
      <rect x="290" y="190" width="228" height="56" rx="8" fill="#ecd3de" stroke="#a1245a" stroke-width="2"/>
      <rect x="290" y="190" width="4" height="56" fill="#a1245a" clip-path="url(#clipE3)"/>
      <g stroke="#a1245a" stroke-width="1" fill="#a1245a">
        <line x1="308" y1="204" x2="336" y2="204"/><line x1="308" y1="204" x2="336" y2="218"/><line x1="308" y1="204" x2="336" y2="232"/>
        <line x1="308" y1="218" x2="336" y2="204"/><line x1="308" y1="218" x2="336" y2="218"/><line x1="308" y1="218" x2="336" y2="232"/>
        <line x1="308" y1="232" x2="336" y2="204"/><line x1="308" y1="232" x2="336" y2="218"/><line x1="308" y1="232" x2="336" y2="232"/>
        <circle cx="308" cy="204" r="2.8"/><circle cx="308" cy="218" r="2.8"/><circle cx="308" cy="232" r="2.8"/>
        <circle cx="336" cy="204" r="2.8"/><circle cx="336" cy="218" r="2.8"/><circle cx="336" cy="232" r="2.8"/>
      </g>
      <text x="356" y="224" font-size="17" font-weight="700" fill="#a1245a">esperto 3</text>

      <!-- esperto 4 (spento) -->
      <rect x="290" y="258" width="228" height="56" rx="8" fill="#f6f6f6" stroke="#dee2e6"/>
      <g stroke="#dee2e6" stroke-width="0.8" fill="#dee2e6">
        <line x1="308" y1="272" x2="336" y2="272"/><line x1="308" y1="272" x2="336" y2="286"/><line x1="308" y1="272" x2="336" y2="300"/>
        <line x1="308" y1="286" x2="336" y2="272"/><line x1="308" y1="286" x2="336" y2="286"/><line x1="308" y1="286" x2="336" y2="300"/>
        <line x1="308" y1="300" x2="336" y2="272"/><line x1="308" y1="300" x2="336" y2="286"/><line x1="308" y1="300" x2="336" y2="300"/>
        <circle cx="308" cy="272" r="2.6"/><circle cx="308" cy="286" r="2.6"/><circle cx="308" cy="300" r="2.6"/>
        <circle cx="336" cy="272" r="2.6"/><circle cx="336" cy="286" r="2.6"/><circle cx="336" cy="300" r="2.6"/>
      </g>
      <text x="356" y="292" font-size="17" font-weight="500" fill="#838383">esperto 4</text>

      <!-- esperto 5 (spento) -->
      <rect x="290" y="326" width="228" height="56" rx="8" fill="#f6f6f6" stroke="#dee2e6"/>
      <g stroke="#dee2e6" stroke-width="0.8" fill="#dee2e6">
        <line x1="308" y1="340" x2="336" y2="340"/><line x1="308" y1="340" x2="336" y2="354"/><line x1="308" y1="340" x2="336" y2="368"/>
        <line x1="308" y1="354" x2="336" y2="340"/><line x1="308" y1="354" x2="336" y2="354"/><line x1="308" y1="354" x2="336" y2="368"/>
        <line x1="308" y1="368" x2="336" y2="340"/><line x1="308" y1="368" x2="336" y2="354"/><line x1="308" y1="368" x2="336" y2="368"/>
        <circle cx="308" cy="340" r="2.6"/><circle cx="308" cy="354" r="2.6"/><circle cx="308" cy="368" r="2.6"/>
        <circle cx="336" cy="340" r="2.6"/><circle cx="336" cy="354" r="2.6"/><circle cx="336" cy="368" r="2.6"/>
      </g>
      <text x="356" y="360" font-size="17" font-weight="500" fill="#838383">esperto 5</text>

      <!-- esperto 6 (ATTIVO) -->
      <rect x="290" y="394" width="228" height="56" rx="8" fill="#ecd3de" stroke="#a1245a" stroke-width="2"/>
      <rect x="290" y="394" width="4" height="56" fill="#a1245a" clip-path="url(#clipE6)"/>
      <g stroke="#a1245a" stroke-width="1" fill="#a1245a">
        <line x1="308" y1="408" x2="336" y2="408"/><line x1="308" y1="408" x2="336" y2="422"/><line x1="308" y1="408" x2="336" y2="436"/>
        <line x1="308" y1="422" x2="336" y2="408"/><line x1="308" y1="422" x2="336" y2="422"/><line x1="308" y1="422" x2="336" y2="436"/>
        <line x1="308" y1="436" x2="336" y2="408"/><line x1="308" y1="436" x2="336" y2="422"/><line x1="308" y1="436" x2="336" y2="436"/>
        <circle cx="308" cy="408" r="2.8"/><circle cx="308" cy="422" r="2.8"/><circle cx="308" cy="436" r="2.8"/>
        <circle cx="336" cy="408" r="2.8"/><circle cx="336" cy="422" r="2.8"/><circle cx="336" cy="436" r="2.8"/>
      </g>
      <text x="356" y="428" font-size="17" font-weight="700" fill="#a1245a">esperto 6</text>

      <!-- esperto 7 (spento) -->
      <rect x="290" y="462" width="228" height="56" rx="8" fill="#f6f6f6" stroke="#dee2e6"/>
      <g stroke="#dee2e6" stroke-width="0.8" fill="#dee2e6">
        <line x1="308" y1="476" x2="336" y2="476"/><line x1="308" y1="476" x2="336" y2="490"/><line x1="308" y1="476" x2="336" y2="504"/>
        <line x1="308" y1="490" x2="336" y2="476"/><line x1="308" y1="490" x2="336" y2="490"/><line x1="308" y1="490" x2="336" y2="504"/>
        <line x1="308" y1="504" x2="336" y2="476"/><line x1="308" y1="504" x2="336" y2="490"/><line x1="308" y1="504" x2="336" y2="504"/>
        <circle cx="308" cy="476" r="2.6"/><circle cx="308" cy="490" r="2.6"/><circle cx="308" cy="504" r="2.6"/>
        <circle cx="336" cy="476" r="2.6"/><circle cx="336" cy="490" r="2.6"/><circle cx="336" cy="504" r="2.6"/>
      </g>
      <text x="356" y="496" font-size="17" font-weight="500" fill="#838383">esperto 7</text>

      <!-- esperto 8 (spento) -->
      <rect x="290" y="530" width="228" height="56" rx="8" fill="#f6f6f6" stroke="#dee2e6"/>
      <g stroke="#dee2e6" stroke-width="0.8" fill="#dee2e6">
        <line x1="308" y1="544" x2="336" y2="544"/><line x1="308" y1="544" x2="336" y2="558"/><line x1="308" y1="544" x2="336" y2="572"/>
        <line x1="308" y1="558" x2="336" y2="544"/><line x1="308" y1="558" x2="336" y2="558"/><line x1="308" y1="558" x2="336" y2="572"/>
        <line x1="308" y1="572" x2="336" y2="544"/><line x1="308" y1="572" x2="336" y2="558"/><line x1="308" y1="572" x2="336" y2="572"/>
        <circle cx="308" cy="544" r="2.6"/><circle cx="308" cy="558" r="2.6"/><circle cx="308" cy="572" r="2.6"/>
        <circle cx="336" cy="544" r="2.6"/><circle cx="336" cy="558" r="2.6"/><circle cx="336" cy="572" r="2.6"/>
      </g>
      <text x="356" y="564" font-size="17" font-weight="500" fill="#838383">esperto 8</text>
    </g>

    <!-- ============ CONVERGENZA ============ -->
    <g stroke="#a1245a" stroke-width="2.5" fill="none" marker-end="url(#arp)">
      <path d="M518 218 C 566 218, 570 320, 598 320"/>
      <path d="M518 422 C 566 422, 570 320, 598 320"/>
    </g>
    <circle cx="620" cy="320" r="18" fill="#ffffff" stroke="#a1245a" stroke-width="2"/>
    <text x="620" y="327" text-anchor="middle" font-size="21" font-weight="700" fill="#a1245a">+</text>
    <line x1="638" y1="320" x2="790" y2="320" stroke="#a1245a" stroke-width="2.5" marker-end="url(#arp)"/>

    <!-- ============ USCITA ============ -->
    <g id="uscita">
      <rect x="796" y="258" width="32" height="124" rx="8" fill="#ecd3de" stroke="#a1245a" stroke-width="1.5"/>
      <g stroke="#a1245a" stroke-width="0.8" opacity="0.5">
        <line x1="796" y1="289" x2="828" y2="289"/>
        <line x1="796" y1="320" x2="828" y2="320"/>
        <line x1="796" y1="351" x2="828" y2="351"/>
      </g>
      <text x="812" y="404" text-anchor="middle" font-size="13" font-weight="500" fill="#212529">vettore</text>
      <text x="812" y="421" text-anchor="middle" font-size="13" font-weight="500" fill="#838383">in uscita</text>
    </g>

    <!-- ============ DIDASCALIA ============ -->
    <g id="didascalia">
      <rect x="150" y="604" width="580" height="42" rx="8" fill="#161719"/>
      <rect x="150" y="604" width="4" height="42" fill="#ffbe0b" clip-path="url(#clipCallout)"/>
      <text x="444" y="630" text-anchor="middle" font-size="15" font-weight="500" fill="#ffffff">parametri totali: tutti gli esperti &#8212; lavoro per token: solo 2</text>
    </g>
  </g>
</svg>
