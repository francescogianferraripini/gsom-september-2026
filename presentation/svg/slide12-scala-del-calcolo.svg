<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 482" width="1060" height="482" role="img" aria-label="Tre gradini dall'alto: riga per colonna, vettore per matrice, matrice per matrice"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#b0b6bc"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#a1245a"/></marker><marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1ab197"/></marker><pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1.6" cy="1.6" r="1.1" fill="#e4e7ea"/></pattern></defs><rect width="1060" height="482" fill="#ffffff"/><text x="0" y="22" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8.5" fill="#a1245a" text-anchor="start" font-weight="700" letter-spacing="0.13em">LIVELLO 1</text><text x="82" y="22" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="12.5" fill="#212529" text-anchor="start" font-weight="600">vettore · vettore = numero</text><rect x="68.0" y="69" width="22" height="22" rx="2.8600000000000003" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="90.0" y="69" width="22" height="22" rx="2.8600000000000003" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="112.0" y="69" width="22" height="22" rx="2.8600000000000003" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="134.0" y="69" width="22" height="22" rx="2.8600000000000003" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><text x="178" y="86" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#838383" text-anchor="middle" font-weight="600">·</text><rect x="207.0" y="32" width="22" height="22" rx="2.8600000000000003" fill="#d1efea" stroke="#1ab197" stroke-width="1.1"/><rect x="207.0" y="54" width="22" height="22" rx="2.8600000000000003" fill="#d1efea" stroke="#1ab197" stroke-width="1.1"/><rect x="207.0" y="76" width="22" height="22" rx="2.8600000000000003" fill="#d1efea" stroke="#1ab197" stroke-width="1.1"/><rect x="207.0" y="98" width="22" height="22" rx="2.8600000000000003" fill="#d1efea" stroke="#1ab197" stroke-width="1.1"/><text x="262" y="86" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="#838383" text-anchor="middle" font-weight="400">=</text><rect x="294" y="69" width="78" height="22" rx="4" fill="#ffffff" stroke="#a1245a" stroke-width="1.4"/><text x="333" y="85" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="14" fill="#a1245a" text-anchor="middle" font-weight="700">0,83</text><text x="112" y="136" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#838383" text-anchor="middle" font-weight="400">una riga</text><text x="218" y="136" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#838383" text-anchor="middle" font-weight="400">per una colonna</text><text x="560" y="78" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#212529" text-anchor="start" font-weight="600">Una riga per una colonna: in uscita un solo numero,</text><text x="560" y="92" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#838383" text-anchor="start" font-weight="400">quanto i due vettori sono allineati.</text><text x="0" y="168" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8.5" fill="#a1245a" text-anchor="start" font-weight="700" letter-spacing="0.13em">LIVELLO 2</text><text x="82" y="168" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="12.5" fill="#a1245a" text-anchor="start" font-weight="600">vettore × matrice = vettore</text><rect x="68.0" y="217.0" width="22" height="22" rx="2.8600000000000003" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="90.0" y="217.0" width="22" height="22" rx="2.8600000000000003" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="112.0" y="217.0" width="22" height="22" rx="2.8600000000000003" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="134.0" y="217.0" width="22" height="22" rx="2.8600000000000003" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><text x="178" y="233.0" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="#838383" text-anchor="middle" font-weight="400">×</text><rect x="206" y="184" width="22" height="22" rx="2.2" fill="#f6f6f6" stroke="#838383" stroke-width="0.7"/><rect x="228" y="184" width="22" height="22" rx="2.2" fill="#f6f6f6" stroke="#838383" stroke-width="0.7"/><rect x="250" y="184" width="22" height="22" rx="2.2" fill="#f6f6f6" stroke="#838383" stroke-width="0.7"/><rect x="206" y="206" width="22" height="22" rx="2.2" fill="#f6f6f6" stroke="#838383" stroke-width="0.7"/><rect x="228" y="206" width="22" height="22" rx="2.2" fill="#f6f6f6" stroke="#838383" stroke-width="0.7"/><rect x="250" y="206" width="22" height="22" rx="2.2" fill="#f6f6f6" stroke="#838383" stroke-width="0.7"/><rect x="206" y="228" width="22" height="22" rx="2.2" fill="#f6f6f6" stroke="#838383" stroke-width="0.7"/><rect x="228" y="228" width="22" height="22" rx="2.2" fill="#f6f6f6" stroke="#838383" stroke-width="0.7"/><rect x="250" y="228" width="22" height="22" rx="2.2" fill="#f6f6f6" stroke="#838383" stroke-width="0.7"/><rect x="206" y="250" width="22" height="22" rx="2.2" fill="#f6f6f6" stroke="#838383" stroke-width="0.7"/><rect x="228" y="250" width="22" height="22" rx="2.2" fill="#f6f6f6" stroke="#838383" stroke-width="0.7"/><rect x="250" y="250" width="22" height="22" rx="2.2" fill="#f6f6f6" stroke="#838383" stroke-width="0.7"/><rect x="203.5" y="181.5" width="71" height="93" rx="3" fill="none" stroke="#838383" stroke-width="1.3"/><text x="298" y="233.0" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="#838383" text-anchor="middle" font-weight="400">=</text><rect x="329.0" y="217.0" width="22" height="22" rx="2.8600000000000003" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="351.0" y="217.0" width="22" height="22" rx="2.8600000000000003" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="373.0" y="217.0" width="22" height="22" rx="2.8600000000000003" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><path d="M 340.0 239.0 C 340.0 261.0 217.0 294 217.0 277" fill="none" stroke="#a1245a" stroke-width="1.0" marker-end="url(#ab)" opacity="0.75"/><path d="M 362.0 239.0 C 362.0 261.0 239.0 294 239.0 277" fill="none" stroke="#a1245a" stroke-width="1.0" marker-end="url(#ab)" opacity="0.75"/><path d="M 384.0 239.0 C 384.0 261.0 261.0 294 261.0 277" fill="none" stroke="#a1245a" stroke-width="1.0" marker-end="url(#ab)" opacity="0.75"/><text x="206" y="306" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#838383" text-anchor="start" font-weight="400">ogni colonna della matrice è una colonna come quella del livello 1:</text><text x="206" y="318" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#838383" text-anchor="start" font-weight="400">lo stesso prodotto scalare, fatto 3 volte in un colpo solo</text><text x="560" y="211.0" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#212529" text-anchor="start" font-weight="600">Moltiplicare per una matrice significa interrogare</text><text x="560" y="225.0" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#212529" text-anchor="start" font-weight="600">una batteria di rilevatori, tutti insieme.</text><text x="560" y="245.0" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#a1245a" text-anchor="start" font-weight="400">Ogni cella in uscita è l'allineamento con un rilevatore:</text><text x="560" y="259.0" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#838383" text-anchor="start" font-weight="400">è la stessa forma delle matrici Q, K e V dell'attention.</text><text x="0" y="348" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8.5" fill="#a1245a" text-anchor="start" font-weight="700" letter-spacing="0.13em">LIVELLO 3</text><text x="82" y="348" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="12.5" fill="#212529" text-anchor="start" font-weight="600">matrice × matrice = matrice</text><rect x="68.0" y="375.0" width="22" height="22" rx="2.8600000000000003" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="90.0" y="375.0" width="22" height="22" rx="2.8600000000000003" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="112.0" y="375.0" width="22" height="22" rx="2.8600000000000003" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="134.0" y="375.0" width="22" height="22" rx="2.8600000000000003" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="68.0" y="397.0" width="22" height="22" rx="2.8600000000000003" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="90.0" y="397.0" width="22" height="22" rx="2.8600000000000003" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="112.0" y="397.0" width="22" height="22" rx="2.8600000000000003" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="134.0" y="397.0" width="22" height="22" rx="2.8600000000000003" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="68.0" y="419.0" width="22" height="22" rx="2.8600000000000003" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="90.0" y="419.0" width="22" height="22" rx=