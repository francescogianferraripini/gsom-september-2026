<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 470" width="1060" height="470" role="img" aria-label="Tre gradini dal basso: prodotto scalare, vettore per matrice, matrice per matrice"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#b0b6bc"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#a1245a"/></marker><marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1ab197"/></marker><pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1.6" cy="1.6" r="1.1" fill="#e4e7ea"/></pattern></defs><rect width="1060" height="470" fill="#ffffff"/><text x="0" y="400" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8.5" fill="#a1245a" text-anchor="start" font-weight="700" letter-spacing="0.13em">LIVELLO 1</text><text x="82" y="400" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="12.5" fill="#212529" text-anchor="start" font-weight="600">vettore · vettore = numero</text><rect x="60.0" y="414" width="26" height="26" rx="3.38" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="86.0" y="414" width="26" height="26" rx="3.38" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="112.0" y="414" width="26" height="26" rx="3.38" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="138.0" y="414" width="26" height="26" rx="3.38" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><text x="178" y="432" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#838383" text-anchor="middle" font-weight="600">·</text><rect x="192.0" y="414" width="26" height="26" rx="3.38" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="218.0" y="414" width="26" height="26" rx="3.38" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="244.0" y="414" width="26" height="26" rx="3.38" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="270.0" y="414" width="26" height="26" rx="3.38" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><text x="310" y="432" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="#838383" text-anchor="middle" font-weight="400">=</text><rect x="342" y="414" width="78" height="26" rx="4" fill="#ffffff" stroke="#a1245a" stroke-width="1.4"/><text x="381" y="432" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="14" fill="#a1245a" text-anchor="middle" font-weight="700">0,83</text><text x="560" y="425" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#212529" text-anchor="start" font-weight="600">Due vettori si incontrano e producono un solo numero:</text><text x="560" y="439" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#838383" text-anchor="start" font-weight="400">quanto sono allineati.</text><text x="0" y="208" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8.5" fill="#a1245a" text-anchor="start" font-weight="700" letter-spacing="0.13em">LIVELLO 2</text><text x="82" y="208" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="12.5" fill="#a1245a" text-anchor="start" font-weight="600">vettore × matrice = vettore</text><rect x="60.0" y="263.0" width="26" height="26" rx="3.38" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="86.0" y="263.0" width="26" height="26" rx="3.38" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="112.0" y="263.0" width="26" height="26" rx="3.38" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="138.0" y="263.0" width="26" height="26" rx="3.38" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><text x="178" y="281.0" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="#838383" text-anchor="middle" font-weight="400">×</text><rect x="206" y="224" width="26" height="26" rx="2.6" fill="#f6f6f6" stroke="#838383" stroke-width="0.7"/><rect x="232" y="224" width="26" height="26" rx="2.6" fill="#f6f6f6" stroke="#838383" stroke-width="0.7"/><rect x="258" y="224" width="26" height="26" rx="2.6" fill="#f6f6f6" stroke="#838383" stroke-width="0.7"/><rect x="206" y="250" width="26" height="26" rx="2.6" fill="#f6f6f6" stroke="#838383" stroke-width="0.7"/><rect x="232" y="250" width="26" height="26" rx="2.6" fill="#f6f6f6" stroke="#838383" stroke-width="0.7"/><rect x="258" y="250" width="26" height="26" rx="2.6" fill="#f6f6f6" stroke="#838383" stroke-width="0.7"/><rect x="206" y="276" width="26" height="26" rx="2.6" fill="#f6f6f6" stroke="#838383" stroke-width="0.7"/><rect x="232" y="276" width="26" height="26" rx="2.6" fill="#f6f6f6" stroke="#838383" stroke-width="0.7"/><rect x="258" y="276" width="26" height="26" rx="2.6" fill="#f6f6f6" stroke="#838383" stroke-width="0.7"/><rect x="206" y="302" width="26" height="26" rx="2.6" fill="#f6f6f6" stroke="#838383" stroke-width="0.7"/><rect x="232" y="302" width="26" height="26" rx="2.6" fill="#f6f6f6" stroke="#838383" stroke-width="0.7"/><rect x="258" y="302" width="26" height="26" rx="2.6" fill="#f6f6f6" stroke="#838383" stroke-width="0.7"/><rect x="203.5" y="221.5" width="83" height="109" rx="3" fill="none" stroke="#838383" stroke-width="1.3"/><text x="314" y="281.0" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="#838383" text-anchor="middle" font-weight="400">=</text><rect x="343.0" y="263.0" width="26" height="26" rx="3.38" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="369.0" y="263.0" width="26" height="26" rx="3.38" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="395.0" y="263.0" width="26" height="26" rx="3.38" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><path d="M 356.0 289.0 C 356.0 315.0 219.0 354 219.0 333" fill="none" stroke="#a1245a" stroke-width="1.0" marker-end="url(#ab)" opacity="0.75"/><path d="M 382.0 289.0 C 382.0 315.0 245.0 354 245.0 333" fill="none" stroke="#a1245a" stroke-width="1.0" marker-end="url(#ab)" opacity="0.75"/><path d="M 408.0 289.0 C 408.0 315.0 271.0 354 271.0 333" fill="none" stroke="#a1245a" stroke-width="1.0" marker-end="url(#ab)" opacity="0.75"/><text x="206" y="372" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#838383" text-anchor="start" font-weight="400">3 colonne = 3 rilevatori, lunghi 4 come il vettore in ingresso</text><text x="560" y="259.0" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#212529" text-anchor="start" font-weight="600">Moltiplicare per una matrice significa interrogare</text><text x="560" y="273.0" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#212529" text-anchor="start" font-weight="600">una batteria di rilevatori, tutti insieme.</text><text x="560" y="293.0" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#a1245a" text-anchor="start" font-weight="400">Ogni cella in uscita è l'allineamento con un rilevatore:</text><text x="560" y="307.0" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#838383" text-anchor="start" font-weight="400">è la stessa forma delle matrici Q, K e V dell'attention.</text><text x="0" y="28" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8.5" fill="#a1245a" text-anchor="start" font-weight="700" letter-spacing="0.13em">LIVELLO 3</text><text x="82" y="28" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="12.5" fill="#212529" text-anchor="start" font-weight="600">matrice × matrice = matrice</text><rect x="60.0" y="57.0" width="26" height="26" rx="3.38" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="86.0" y="57.0" width="26" height="26" rx="3.38" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="112.0" y="57.0" width="26" height="26" rx="3.38" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="138.0" y="57.0" width="26" height="26" rx="3.38" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="60.0" y="83.0" width="26" height="26" rx="3.38" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="86.0" y="83.0" width="26" height="26" rx="3.38" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="112.0" y="83.0" width="26" height="26" rx="3.38" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="138.0" y="83.0" width="26" height="26" rx="3.38" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="60.0" y="109.0" width="26" height="26" rx="3.38" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="86.0" y="109.0" width="26" height="26" rx="3.38" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="112.0" y="109.0" width="26" height="26" rx="3.38" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="138.0" y="109.0" width="26" height="26" rx="3.38" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><text x="178" y="92" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="#838383" text-anchor="middle" font-weight="400">×</text><rect x="206" y="44" width="26" height="26" rx="2.6" fill="#f6f6f6" stroke="#838383" stroke-width="0.7"/><rect x="232" y="44" width="26" height="26" rx="2.6" fill="#f6f6f6" stroke="#838383" stroke-width="0.7"/><rect x="258" y="44" width="26" height="26" rx="2.6" fill="#f6f6f6" stroke="#838383" stroke-width="0.7"/><rect x="206" y="70" width="26" height="26" rx="2.6" fill="#f6f6f6" stroke="#838383" stroke-width="0.7"/><rect x="232" y="70" width="26" height="26" rx="2.6" fill="#f6f6f6" stroke="#838383" stroke-width="0.7"/><rect x="258" y="70" width="26" height="26" rx="2.6" fill="#f6f6f6" stroke="#838383" stroke-width="0.7"/><rect x="206" y="96" width="26" height="26" rx="2.6" fill="#f6f6f6" stroke="#838383" stroke-width="0.7"/><rect x="232" y="96" width="26" height="26" rx="2.6" fill="#f6f6f6" stroke="#838383" stroke-width="0.7"/><rect x="258" y="96" width="26" height="26" rx="2.6" fill="#f6f6f6" stroke="#838383" stroke-width="0.7"/><rect x="206" y="122" width="26" height="26" rx="2.6" fill="#f6f6f6" stroke="#838383" stroke-width="0.7"/><rect x="232" y="122" width="26" height="26" rx="2.6" fill="#f6f6f6" stroke="#838383" stroke-width="0.7"/><rect x="258" y="122" width="26" height="26" rx="2.6" fill="#f6f6f6" stroke="#838383" stroke-width="0.7"/><rect x="203.5" y="41.5" width="83" height="109" rx="3" fill="none" stroke="#838383" stroke-width="1.3"/><text x="314" y="92" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="#838383" text-anchor="middle" font-weight="400">=</text><rect x="343.0" y="57.0" width="26" height="26" rx="3.38" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="369.0" y="57.0" width="26" height="26" rx="3.38" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="395.0" y="57.0" width="26" height="26" rx="3.38" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="343.0" y="83.0" width="26" height="26" rx="3.38" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="369.0" y="83.0" width="26" height="26" rx="3.38" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="395.0" y="83.0" width="26" height="26" rx="3.38" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="343.0" y="109.0" width="26" height="26" rx="3.38" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="369.0" y="109.0" width="26" height="26" rx="3.38" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><rect x="395.0" y="109.0" width="26" height="26" rx="3.38" fill="#d1efea" stroke="#1ab197" stroke-width="1.3"/><text x="60" y="168" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#838383" text-anchor="start" font-weight="400">molti vettori insieme — per esempio tutti i token della frase</text><text x="560" y="86" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#212529" text-anchor="start" font-weight="600">La stessa batteria, interrogata da ogni vettore.</text><text x="560" y="100" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#838383" text-anchor="start" font-weight="400">È quello che succede a ogni strato, per ogni token.</text><line x1="0" y1="384" x2="1060" y2="384" stroke="#eef0f2" stroke-width="1"/><line x1="0" y1="190" x2="1060" y2="190" stroke="#eef0f2" stroke-width="1"/></svg>