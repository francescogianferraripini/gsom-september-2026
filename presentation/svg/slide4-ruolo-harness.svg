<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" role="img">
  <title>Il ruolo dell'harness: l'anello simbolico che racchiude l'LLM</title>

  <g id="titolo" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <rect x="12" y="20" width="3" height="60" fill="#161719"/>
    <text x="30" y="47" font-size="27" font-weight="700" fill="#161719">Harness</text>
    <text x="30" y="73" font-size="17" font-weight="400" fill="#838383">l'esoscheletro (simbolico)</text>
  </g>

  <g id="connettori" stroke="#838383" stroke-width="1.5">
    <line x1="450" y1="210" x2="450" y2="256"/>
    <line x1="450" y1="500" x2="450" y2="546"/>
    <line x1="208" y1="378" x2="272" y2="378"/>
    <line x1="628" y1="378" x2="692" y2="378"/>
  </g>

  <g id="anello" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="600" fill="#212529" text-anchor="middle">
    <rect x="16" y="100" width="284" height="102" rx="8" fill="#f6f6f6" stroke="#dee2e6"/>
    <text x="158" y="144">Context Initialization</text>
    <text x="158" y="171">&amp; Management</text>

    <rect x="308" y="100" width="284" height="102" rx="8" fill="#f6f6f6" stroke="#dee2e6"/>
    <text x="450" y="158">Memory Management</text>

    <rect x="600" y="100" width="284" height="102" rx="8" fill="#f6f6f6" stroke="#dee2e6"/>
    <text x="742" y="158">Loop</text>

    <rect x="692" y="210" width="192" height="336" rx="8" fill="#f6f6f6" stroke="#dee2e6"/>
    <text x="788" y="366">Tool Calling</text>
    <text x="788" y="393">Execution</text>

    <rect x="454" y="554" width="430" height="102" rx="8" fill="#f6f6f6" stroke="#dee2e6"/>
    <text x="669" y="612">Skills access</text>

    <rect x="16" y="554" width="430" height="102" rx="8" fill="#f6f6f6" stroke="#dee2e6"/>
    <text x="231" y="612">Execution Sandbox</text>

    <rect x="16" y="210" width="192" height="336" rx="8" fill="#f6f6f6" stroke="#dee2e6"/>
    <text x="112" y="385">Logging</text>
  </g>

  <g id="centro" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    <rect x="272" y="256" width="356" height="244" rx="8" fill="#a1245a"/>
    <text x="450" y="372" font-size="52" font-weight="700" fill="#ffffff">LLM</text>
    <text x="450" y="410" font-size="17" font-weight="500" fill="#ecd3de">il cervello (neuro)</text>
  </g>

  <text x="12" y="694" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#838383">L'LLM non tocca il mondo: ogni interazione passa dall'anello deterministico che lo racchiude.</text>
</svg>
