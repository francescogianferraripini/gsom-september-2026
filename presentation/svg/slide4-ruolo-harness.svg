<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 714" width="1000" height="714" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Il ruolo dell'harness: le tre aree dell'esoscheletro (context management, agentic loop management, environment management) che racchiudono l'LLM</title>

  <!-- ===== Categoria 1 - Context management (teal) ===== -->
  <g id="cat-context">
    <rect x="12" y="12" width="322" height="648" rx="8" fill="#d1efea" stroke="#1ab197"/>
    <path d="M12,20 a8,8 0 0 1 8,-8 h306 a8,8 0 0 1 8,8 v36 H12 Z" fill="#1ab197"/>
    <text x="173" y="40" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="1" fill="#ffffff">CONTEXT MANAGEMENT</text>

    <g fill="#ffffff" stroke="#dee2e6">
      <rect x="24" y="68" width="298" height="134" rx="8"/>
      <rect x="24" y="216" width="298" height="134" rx="8"/>
      <rect x="24" y="364" width="298" height="134" rx="8"/>
      <rect x="24" y="512" width="298" height="134" rx="8"/>
    </g>

    <g text-anchor="middle" font-size="18" font-weight="500" fill="#212529">
      <text x="173" y="141">Context Initialization</text>
      <text x="173" y="276">Context Optimization</text>
      <text x="173" y="301">(compaction, pruning, etc.)</text>
      <text x="173" y="437">Memory management</text>
      <text x="173" y="585">Skill management</text>
    </g>
  </g>

  <!-- ===== Categoria 2 - Agentic loop management (light blue) ===== -->
  <g id="cat-loop">
    <rect x="340" y="12" width="320" height="648" rx="8" fill="#dbecf7" stroke="#4da0d7"/>
    <path d="M340,20 a8,8 0 0 1 8,-8 h304 a8,8 0 0 1 8,8 v36 H340 Z" fill="#4da0d7"/>
    <text x="500" y="40" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="1" fill="#ffffff">AGENTIC LOOP MANAGEMENT</text>

    <g id="loop-ring">
      <rect x="354" y="192" width="292" height="330" rx="14" fill="none" stroke="#4da0d7" stroke-width="2.5"/>
      <polygon points="492,183 510,192 492,201" fill="#4da0d7"/>
      <polygon points="508,513 490,522 508,531" fill="#4da0d7"/>
    </g>

    <g id="centro" text-anchor="middle">
      <rect x="380" y="226" width="240" height="262" rx="8" fill="#a1245a"/>
      <text x="500" y="346" font-size="58" font-weight="700" fill="#ffffff">LLM</text>
      <text x="500" y="388" font-size="19" font-weight="500" fill="#ecd3de">il cervello (neuro)</text>
    </g>
  </g>

  <!-- ===== Categoria 3 - Environment management (amber) ===== -->
  <g id="cat-environment">
    <rect x="666" y="12" width="322" height="648" rx="8" fill="#fff2ce" stroke="#ffbe0b"/>
    <path d="M666,20 a8,8 0 0 1 8,-8 h306 a8,8 0 0 1 8,8 v36 H666 Z" fill="#ffbe0b"/>
    <text x="827" y="40" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="1" fill="#161719">ENVIRONMENT MANAGEMENT</text>

    <g fill="#ffffff" stroke="#dee2e6">
      <rect x="678" y="68" width="298" height="160" rx="8"/>
      <rect x="678" y="277" width="298" height="160" rx="8"/>
      <rect x="678" y="486" width="298" height="160" rx="8"/>
    </g>

    <g text-anchor="middle" font-size="18" font-weight="500" fill="#212529">
      <text x="827" y="142">Tool Calling execution</text>
      <text x="827" y="167">and response management</text>
      <text x="827" y="363">Execution Sandbox</text>
      <text x="827" y="572">Skill execution management</text>
    </g>
  </g>

  <text x="12" y="700" font-size="17" font-weight="400" fill="#838383">L'LLM non tocca il mondo: ogni interazione passa dall'anello deterministico che lo racchiude.</text>
</svg>
