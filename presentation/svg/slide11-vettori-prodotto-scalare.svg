<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 675" width="1080" height="675" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Vettori e prodotto scalare: la doppia natura del vettore e i tre casi di sovrapposizione</title>
  <defs>
    <marker id="ahDark" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#161719"/>
    </marker>
    <marker id="ahBurg" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#a1245a"/>
    </marker>
  </defs>

  <line x1="375" y1="86" x2="375" y2="620" stroke="#dee2e6" stroke-width="1"/>

  <!-- ===== Parte sinistra: la doppia natura ===== -->
  <g id="doppia-natura">
    <text x="24" y="102" font-size="15" font-weight="600" letter-spacing="1.6" fill="#838383">LA DOPPIA NATURA</text>

    <rect x="24" y="130" width="324" height="86" rx="8" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/>
    <line x1="25.5" y1="138" x2="25.5" y2="208" stroke="#a1245a" stroke-width="3"/>
    <text x="190" y="175" text-anchor="middle" font-size="23" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" fill="#161719">[0.8, −1.3, 2.1, …]</text>
    <text x="190" y="200" text-anchor="middle" font-size="14" fill="#838383">una lista di numeri</text>

    <text x="190" y="272" text-anchor="middle" font-size="40" font-weight="700" fill="#a1245a">≡</text>
    <text x="190" y="302" text-anchor="middle" font-size="15" font-weight="500" fill="#838383">stessa cosa, vista in due modi</text>

    <rect x="24" y="326" width="324" height="294" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
    <line x1="50" y1="570" x2="322" y2="570" stroke="#dee2e6" stroke-width="1"/>
    <line x1="80" y1="596" x2="80" y2="352" stroke="#dee2e6" stroke-width="1"/>
    <line x1="80" y1="500" x2="322" y2="500" stroke="#dee2e6" stroke-width="1" stroke-dasharray="3 5"/>
    <line x1="180" y1="570" x2="180" y2="352" stroke="#dee2e6" stroke-width="1" stroke-dasharray="3 5"/>
    <line x1="280" y1="570" x2="280" y2="352" stroke="#dee2e6" stroke-width="1" stroke-dasharray="3 5"/>
    <line x1="80" y1="570" x2="278" y2="406" stroke="#a1245a" stroke-width="3" marker-end="url(#ahBurg)"/>
    <circle cx="80" cy="570" r="3.5" fill="#161719"/>
    <text x="190" y="606" text-anchor="middle" font-size="14" fill="#838383">una freccia con direzione e lunghezza</text>
  </g>

  <!-- ===== Parte destra: tre casi ===== -->
  <g id="tre-casi">
    <text x="400" y="102" font-size="15" font-weight="600" letter-spacing="1.6" fill="#838383">IL PRODOTTO SCALARE MISURA LA SOVRAPPOSIZIONE</text>

    <!-- pannello 1: affini -->
    <g id="pannello-affini">
      <rect x="400" y="130" width="210" height="470" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
      <path d="M505,330 L560,330 A55,55 0 0,0 556.68,311.19 Z" fill="#ecd3de"/>
      <line x1="505" y1="330" x2="585" y2="330" stroke="#161719" stroke-width="2.5" marker-end="url(#ahDark)"/>
      <line x1="505" y1="330" x2="580.5" y2="302.6" stroke="#a1245a" stroke-width="3" marker-end="url(#ahBurg)"/>
      <circle cx="505" cy="330" r="3.5" fill="#161719"/>
      <text x="574" y="323" text-anchor="middle" font-size="13" fill="#838383">20°</text>
      <text x="505" y="442" text-anchor="middle" font-size="26" font-weight="700" fill="#161719">affini</text>
      <text x="505" y="500" text-anchor="middle" font-size="15" fill="#838383">prodotto scalare</text>
      <text x="505" y="535" text-anchor="middle" font-size="25" font-weight="700" fill="#a1245a">alto</text>
    </g>

    <!-- pannello 2: estranei -->
    <g id="pannello-estranei">
      <rect x="629" y="130" width="210" height="470" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
      <path d="M748,330 L748,316 L734,316" fill="none" stroke="#838383" stroke-width="1.5"/>
      <line x1="734" y1="330" x2="814" y2="330" stroke="#161719" stroke-width="2.5" marker-end="url(#ahDark)"/>
      <line x1="734" y1="330" x2="734" y2="250" stroke="#a1245a" stroke-width="3" marker-end="url(#ahBurg)"/>
      <circle cx="734" cy="330" r="3.5" fill="#161719"/>
      <text x="758" y="308" font-size="13" fill="#838383">90°</text>
      <text x="734" y="442" text-anchor="middle" font-size="26" font-weight="700" fill="#161719">estranei</text>
      <text x="734" y="500" text-anchor="middle" font-size="15" fill="#838383">prodotto scalare</text>
      <text x="734" y="535" text-anchor="middle" font-size="25" font-weight="700" fill="#838383">≈ 0</text>
    </g>

    <!-- pannello 3: opposti -->
    <g id="pannello-opposti">
      <rect x="858" y="130" width="210" height="470" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
      <path d="M1003,330 A40,40 0 0,0 923.6,323.05" fill="none" stroke="#838383" stroke-width="1.5"/>
      <line x1="963" y1="330" x2="1043" y2="330" stroke="#161719" stroke-width="2.5" marker-end="url(#ahDark)"/>
      <line x1="963" y1="330" x2="884.2" y2="316.3" stroke="#a1245a" stroke-width="3" marker-end="url(#ahBurg)"/>
      <circle cx="963" cy="330" r="3.5" fill="#161719"/>
      <text x="963" y="281" text-anchor="middle" font-size="13" fill="#838383">170°</text>
      <text x="963" y="442" text-anchor="middle" font-size="26" font-weight="700" fill="#161719">opposti</text>
      <text x="963" y="500" text-anchor="middle" font-size="15" fill="#838383">prodotto scalare</text>
      <text x="963" y="535" text-anchor="middle" font-size="25" font-weight="700" fill="#161719">negativo</text>
    </g>

    <text x="734" y="648" text-anchor="middle" font-size="17" font-weight="500" fill="#838383">più i due vettori puntano nella stessa direzione, più il prodotto scalare cresce</text>
  </g>
</svg>
