  <path d="M 394 62 C 400 62 398 68 398 68 L 398 189 C 398 195 400 193 404 195 C 400 197 398 195 398 201 L 398 322 C 398 322 400 328 394 328" fill="none" stroke="#838383" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text transform="rotate(90 428 195)" x="428" y="195" text-anchor="middle" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500" fill="#212529">il contesto cresce di un token per volta</text>
  <text x="12" y="346" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#838383">ogni riga è una passata completa del modello: stessi pesi, contesto più lungo</text>
  <rect x="630" y="62" width="460" height="60" rx="7" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/><text x="618" y="82" text-anchor="end" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#838383">turno 1</text><text x="646" y="81.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">[system]</text><text x="708.2" y="81.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">Sei un assistente utile.</text><text x="646" y="97.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#161719">[user]</text><text x="694.4" y="97.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#212529">Ciao, chi sei?</text><rect x="638" y="102" width="444" height="16" rx="5" fill="#a1245a"/><text x="646" y="113.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#ecd3de">[assistant]</text><text x="728.9" y="113.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#ffffff">Sono un assistente AI.</text><rect x="630" y="128" width="460" height="92" rx="7" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/><text x="618" y="148" text-anchor="end" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#838383">turno 2</text><text x="646" y="147.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">[system]</text><text x="708.2" y="147.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">Sei un assistente utile.</text><text x="646" y="163.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">[user]</text><text x="694.4" y="163.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">Ciao, chi sei?</text><text x="646" y="179.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">[assistant]</text><text x="728.9" y="179.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">Sono un assistente AI.</text><text x="646" y="195.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#161719">[user]</text><text x="694.4" y="195.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#212529">Spiegami cosa sono i transformer</text><rect x="638" y="200" width="444" height="16" rx="5" fill="#a1245a"/><text x="646" y="211.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#ecd3de">[assistant]</text><text x="728.9" y="211.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#ffffff">Un'architettura del 2017…</text><rect x="630" y="226" width="460" height="124" rx="7" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/><text x="618" y="246" text-anchor="end" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#838383">turno 3</text><text x="646" y="245.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">[system]</text><text x="708.2" y="245.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">Sei un assistente utile.</text><text x="646" y="261.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">[user]</text><text x="694.4" y="261.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">Ciao, chi sei?</text><text x="646" y="277.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">[assistant]</text><text x="728.9" y="277.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">Sono un assistente AI.</text><text x="646" y="293.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">[user]</text><text x="694.4" y="293.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">Spiegami cosa sono i transformer</text><text x="646" y="309.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">[assistant]</text><text x="728.9" y="309.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9aa0a6">Un'architettura del 2017…</text><text x="646" y="325.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#161719">[user]</text><text x="694.4" y="325.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#212529">E l'attention come funziona?</text><rect x="638" y="330" width="444" height="16" rx="5" fill="#a1245a"/><text x="646" y="341.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#ecd3de">[assistant]</text><text x="728.9" y="341.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400" fill="#ffffff">È il meccanismo che pesa