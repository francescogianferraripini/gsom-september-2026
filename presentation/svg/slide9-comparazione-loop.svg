  <text x="78.5" y="217" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="400" fill="#212529">Il gatto è sul</text>
  <rect x="149" y="198" width="67" height="28" rx="7" fill="#a1245a"/>
  <text x="182.5" y="217" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="400" fill="#ffffff">tavolo</text>
