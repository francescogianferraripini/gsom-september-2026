  <rect x="267" y="300" width="28" height="28" rx="7" fill="#a1245a"/>
  <text x="281" y="319" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="400" fill="#ffffff">.</text>
