<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 356" width="1140" height="356" role="img">
  <title>Comparazione fra il 1° loop (la generazione: un token appeso al contesto) e il 2° loop (la conversazione: un turno appeso alla storia, rispedita per intero — system prompt compreso — a ogni chiamata)</title>

  <!-- La meta sinistra riprende la pila della slide 6. La meta destra e il turno di conversazione,
       col system prompt in testa a ogni payload: e' quello il senso di "rispedita per intero". -->

  <text x="12" y="26" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#a1245a" letter-spacing="1.6">IL 1° LOOP — LA GENERAZIONE</text><text x="12" y="47" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#838383">l'unità che si aggiunge è il token</text>
  <text x="575" y="26" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#a1245a" letter-spacing="1.6">IL 2° LOOP — LA CONVERSAZIONE</text><text x="575" y="47" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#838383">l'unità che si aggiunge è il turno</text>
