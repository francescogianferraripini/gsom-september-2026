<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img">
  <title>Due grafici a confronto: la conversazione pura fa crescere il contesto in modo lineare, mentre ogni tool call deposita il suo risultato e lo fa crescere a scalini</title>

  <!-- Adattata da slide27-context-rot.svg del deck gsom-april-2026, riportata alla palette
       e ai font di questo deck: quella di aprile importava Poppins da Google Fonts (qui il
       font e' gia' incluso in locale) e usava grigi generici. -->

  <text x="210" y="30" text-anchor="middle" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#212529">CONVERSAZIONE PURA</text><text x="210" y="48" text-anchor="middle" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#838383">cresce solo di quello che vi dite</text><line x1="62" y1="257.5" x2="400" y2="257.5" stroke="#eef0f2" stroke-width="1"/><line x1="62" y1="195" x2="400" y2="195" stroke="#eef0f2" stroke-width="1"/><line x1="62" y1="132.5" x2="400" y2="132.5" stroke="#eef0f2" stroke-width="1"/><line x1="62" y1="70" x2="400" y2="70" stroke="#eef0f2" stroke-width="1"/><line x1="62" y1="320" x2="400" y2="320" stroke="#dee2e6" stroke-width="1.4"/><line x1="62" y1="320" x2="62" y2="70" stroke="#dee2e6" stroke-width="1.4"/><polyline points="62.0,320.0 95.8,306.2 129.6,292.5 163.4,278.8 197.2,265.0 231.0,251.2 264.8,237.5 298.6,223.8 332.4,210.0 366.2,196.2 400.0,182.5" fill="none" stroke="#1ab197" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><text x="210" y="348" text-anchor="middle" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#838383">turni della conversazione</text><text x="62" y="372" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#1ab197">crescita lineare, e lenta</text>
  <text x="670" y="30" text-anchor="middle" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#212529">CON I TOOL</text><text x="670" y="48" text-anchor="middle" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#838383">ogni risultato resta nel contesto</text><line x1="522" y1="257.5" x2="860" y2="257.5" stroke="#eef0f2" stroke-width="1"/><line x1="522" y1="195" x2="860" y2="195" stroke="#eef0f2" stroke-width="1"/><line x1="522" y1="132.5" x2="860" y2="132.5" stroke="#eef0f2" stroke-width="1"/><line x1="522" y1="70" x2="860" y2="70" stroke="#eef0f2" stroke-width="1"/><line x1="522" y1="320" x2="860" y2="320" stroke="#dee2e6" stroke-width="1.4"/><line x1="522" y1="320" x2="522" y2="70" stroke="#dee2e6" stroke-width="1.4"/><polyline points="522.0,320.0 555.8,306.2 555.8,270.0 589.6,270.0 623.4,256.2 623.4,220.0 657.2,220.0 691.0,206.2 691.0,170.0 724.8,170.0 758.6,156.2 758.6,120.0 792.4,120.0 826.2,106.2 826.2,70.0 860.0,70.0" fill="none" stroke="#a1245a" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><text x="670" y="348" text-anchor="middle" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#838383">turni della conversazione</text><text x="522" y="372" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#a1245a">a scalini, e molto più ripida</text>
  <line x1="460" y1="20" x2="460" y2="380" stroke="#dee2e6" stroke-width="1" stroke-dasharray="4 4"/>
  <text transform="rotate(-90 14 200)" x="14" y="200" text-anchor="middle" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#838383">token nel contesto</text>
</svg>
