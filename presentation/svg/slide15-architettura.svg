<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1197 367" width="1197" height="367" role="img">
  <title>Architettura di un LLM decoder-only: dal testo in input alla distribuzione di probabilità sul prossimo token</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0.5 L10 5 L0 9.5 z" fill="#838383"/>
    </marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0.5 L10 5 L0 9.5 z" fill="#a1245a"/>
    </marker>
  </defs>

  <g transform="translate(8.5,-99.5)"
     font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

    <!-- 1. INPUT -->
    <g id="input">
      <text x="52" y="200" text-anchor="middle" font-size="13" font-weight="600" letter-spacing="1.2" fill="#838383">INPUT</text>
      <rect x="4" y="213" width="96" height="54" rx="8" fill="#ffffff" stroke="#dee2e6"/>
      <text x="52" y="245" text-anchor="middle" font-size="13.5" fill="#161719"
            font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace">Il gatto è</text>
    </g>
    <line x1="100" y1="240" x2="112" y2="240" stroke="#838383" stroke-width="1.5" marker-end="url(#ar)"/>

    <!-- 2. TOKENIZER -->
    <g id="tokenizer">
      <rect x="112" y="213" width="82" height="54" rx="8" fill="#ffffff" stroke="#dee2e6"/>
      <text x="153" y="245" text-anchor="middle" font-size="13.5" font-weight="600" fill="#161719">Tokenizer</text>
    </g>
    <line x1="194" y1="240" x2="206" y2="240" stroke="#838383" stroke-width="1.5" marker-end="url(#ar)"/>

    <!-- token, tessere separate -->
    <g id="token">
      <rect x="206" y="196" width="54" height="24" rx="6" fill="#f6f6f6" stroke="#dee2e6"/>
      <text x="233" y="212.5" text-anchor="middle" font-size="13" fill="#212529"
            font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace">Il</text>
      <rect x="206" y="228" width="54" height="24" rx="6" fill="#f6f6f6" stroke="#dee2e6"/>
      <text x="233" y="244.5" text-anchor="middle" font-size="13" fill="#212529"
            font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace">gatto</text>
      <rect x="206" y="260" width="54" height="24" rx="6" fill="#f6f6f6" stroke="#dee2e6"/>
      <text x="233" y="276.5" text-anchor="middle" font-size="13" fill="#212529"
            font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace">è</text>
      <text x="233" y="303" text-anchor="middle" font-size="13" fill="#838383">token</text>
    </g>
    <line x1="260" y1="240" x2="272" y2="240" stroke="#838383" stroke-width="1.5" marker-end="url(#ar)"/>

    <!-- 3. EMBEDDING -->
    <g id="embedding">
      <rect x="272" y="213" width="88" height="54" rx="8" fill="#ffffff" stroke="#dee2e6"/>
      <text x="316" y="245" text-anchor="middle" font-size="13.5" font-weight="600" fill="#161719">Embedding</text>
      <line x1="316" y1="308" x2="316" y2="269" stroke="#838383" stroke-width="1.5" marker-end="url(#ar)"/>
      <text x="316" y="323" text-anchor="middle" font-size="13" fill="#838383">+ positional encoding</text>
    </g>
    <line x1="360" y1="240" x2="372" y2="240" stroke="#838383" stroke-width="1.5" marker-end="url(#ar)"/>

    <!-- vettori -->
    <g id="vettori">
      <rect x="372" y="206" width="14" height="68" rx="7" fill="#ecd3de"/>
      <rect x="391" y="206" width="14" height="68" rx="7" fill="#ecd3de"/>
      <rect x="410" y="206" width="14" height="68" rx="7" fill="#ecd3de"/>
      <g stroke="#ffffff" stroke-width="1.5">
        <line x1="372" y1="223" x2="386" y2="223"/><line x1="372" y1="240" x2="386" y2="240"/><line x1="372" y1="257" x2="386" y2="257"/>
        <line x1="391" y1="223" x2="405" y2="223"/><line x1="391" y1="240" x2="405" y2="240"/><line x1="391" y1="257" x2="405" y2="257"/>
        <line x1="410" y1="223" x2="424" y2="223"/><line x1="410" y1="240" x2="424" y2="240"/><line x1="410" y1="257" x2="424" y2="257"/>
      </g>
      <text x="398" y="303" text-anchor="middle" font-size="13" fill="#838383">vettori</text>
    </g>
    <line x1="424" y1="240" x2="438" y2="240" stroke="#838383" stroke-width="1.5" marker-end="url(#ar)"/>

    <!-- 4. BLOCCO TRANSFORMER (focale) -->
    <g id="blocco-transformer">
      <rect x="442" y="172" width="412" height="236" rx="8" fill="#ffffff" stroke="#dee2e6"/>
      <rect x="440" y="176" width="412" height="236" rx="8" fill="#ffffff" stroke="#dee2e6"/>
      <rect x="438" y="180" width="412" height="236" rx="8" fill="#ffffff" stroke="#a1245a" stroke-width="2"/>

      <!-- canale centrale / residuo -->
      <line x1="438" y1="240" x2="850" y2="240" stroke="#a1245a" stroke-width="3"/>
      <text x="556" y="230" text-anchor="middle" font-size="13" fill="#838383">skip connection</text>
      <text x="748" y="230" text-anchor="middle" font-size="13" fill="#838383">skip connection</text>

      <!-- diramazione verso attention -->
      <circle cx="460" cy="240" r="4" fill="#a1245a"/>
      <path d="M460 240 L460 369 L474 369" fill="none" stroke="#838383" stroke-width="1.5" marker-end="url(#ar)"/>
      <path d="M632 369 L652 369 L652 255" fill="none" stroke="#838383" stroke-width="1.5" marker-end="url(#ar)"/>

      <!-- sottoblocco A: masked multi head attention -->
      <rect x="474" y="274" width="158" height="130" rx="8" fill="#f6f6f6" stroke="#dee2e6"/>
      <text x="553" y="296" text-anchor="middle" font-size="13" font-weight="600" fill="#161719">Masked multi-head</text>
      <text x="553" y="312" text-anchor="middle" font-size="13" font-weight="600" fill="#161719">attention</text>
      <text x="553" y="333" text-anchor="middle" font-size="13" fill="#838383">teste</text>
      <g stroke="#838383" stroke-width="1">
        <line x1="484" y1="369" x2="500" y2="345"/><line x1="484" y1="369" x2="500" y2="361"/>
        <line x1="484" y1="369" x2="500" y2="377"/><line x1="484" y1="369" x2="500" y2="393"/>
        <line x1="606" y1="345" x2="622" y2="369"/><line x1="606" y1="361" x2="622" y2="369"/>
        <line x1="606" y1="377" x2="622" y2="369"/><line x1="606" y1="393" x2="622" y2="369"/>
      </g>
      <g fill="#ecd3de">
        <rect x="500" y="340" width="106" height="10" rx="5"/>
        <rect x="500" y="356" width="106" height="10" rx="5"/>
        <rect x="500" y="372" width="106" height="10" rx="5"/>
        <rect x="500" y="388" width="106" height="10" rx="5"/>
      </g>

      <!-- nodo somma A -->
      <circle cx="652" cy="240" r="13" fill="#ffffff" stroke="#a1245a" stroke-width="2"/>
      <text x="652" y="246" text-anchor="middle" font-size="17" font-weight="700" fill="#a1245a">+</text>

      <!-- diramazione verso fully connected -->
      <circle cx="672" cy="240" r="4" fill="#a1245a"/>
      <path d="M672 240 L672 369 L688 369" fill="none" stroke="#838383" stroke-width="1.5" marker-end="url(#ar)"/>
      <path d="M810 369 L824 369 L824 255" fill="none" stroke="#838383" stroke-width="1.5" marker-end="url(#ar)"/>

      <!-- sottoblocco B: fully connected -->
      <rect x="688" y="343" width="122" height="52" rx="8" fill="#f6f6f6" stroke="#dee2e6"/>
      <text x="749" y="373.5" text-anchor="middle" font-size="13" font-weight="600" fill="#161719">Fully connected</text>

      <!-- nodo somma B -->
      <circle cx="824" cy="240" r="13" fill="#ffffff" stroke="#a1245a" stroke-width="2"/>
      <text x="824" y="246" text-anchor="middle" font-size="17" font-weight="700" fill="#a1245a">+</text>

      <!-- etichetta del contenitore -->
      <rect x="519" y="426" width="250" height="28" rx="8" fill="#a1245a"/>
      <text x="644" y="444.5" text-anchor="middle" font-size="13.5" font-weight="600" fill="#ffffff">blocco transformer — ripetuto ×N</text>
    </g>

    <!-- 5 6. LOGITS + SOFTMAX -->
    <path d="M850 240 L856 240 L856 192 L862 192" fill="none" stroke="#838383" stroke-width="1.5" marker-end="url(#ar)"/>
    <g id="logits">
      <rect x="862" y="142" width="96" height="100" rx="8" fill="#ffffff" stroke="#dee2e6"/>
      <text x="910" y="168" text-anchor="middle" font-size="13" fill="#212529">matrice di</text>
      <text x="910" y="185" text-anchor="middle" font-size="13" fill="#212529">reverse</text>
      <text x="910" y="202" text-anchor="middle" font-size="13" fill="#212529">embedding</text>
      <text x="910" y="225" text-anchor="middle" font-size="13.5" font-weight="600" fill="#161719">→ logits</text>
    </g>
    <line x1="910" y1="242" x2="910" y2="264" stroke="#838383" stroke-width="1.5" marker-end="url(#ar)"/>
    <g id="softmax">
      <rect x="862" y="264" width="96" height="48" rx="8" fill="#ffffff" stroke="#dee2e6"/>
      <text x="910" y="293" text-anchor="middle" font-size="14" fill="#161719"
            font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace">softmax</text>
    </g>
    <path d="M958 288 L964 288 L964 240 L970 240" fill="none" stroke="#a1245a" stroke-width="2" marker-end="url(#arp)"/>

    <!-- 7. USCITA: distribuzione (focale) -->
    <g id="uscita">
      <rect x="970" y="112" width="206" height="298" rx="8" fill="#ffffff" stroke="#dee2e6"/>
      <rect x="970" y="150" width="3" height="222" fill="#a1245a"/>
      <text x="988" y="140" font-size="13" font-weight="600" letter-spacing="1.2" fill="#838383">PROSSIMO TOKEN</text>

      <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="13">
        <!-- sul 30% -->
        <text x="1044" y="174.5" text-anchor="end" fill="#212529">sul</text>
        <rect x="1050" y="162" width="82" height="16" rx="3" fill="#a1245a"/>
        <text x="1166" y="174.5" text-anchor="end" fill="#838383">30%</text>
        <!-- un 22% -->
        <text x="1044" y="200.5" text-anchor="end" fill="#212529">un</text>
        <rect x="1050" y="188" width="60" height="16" rx="3" fill="#a1245a"/>
        <text x="1166" y="200.5" text-anchor="end" fill="#838383">22%</text>
        <!-- morbido 15% -->
        <text x="1044" y="226.5" text-anchor="end" fill="#212529">morbido</text>
        <rect x="1050" y="214" width="41" height="16" rx="3" fill="#a1245a"/>
        <text x="1166" y="226.5" text-anchor="end" fill="#838383">15%</text>
        <!-- nero 12% -->
        <text x="1044" y="252.5" text-anchor="end" fill="#212529">nero</text>
        <rect x="1050" y="240" width="33" height="16" rx="3" fill="#a1245a"/>
        <text x="1166" y="252.5" text-anchor="end" fill="#838383">12%</text>
        <!-- stanco 8% -->
        <text x="1044" y="278.5" text-anchor="end" fill="#212529">stanco</text>
        <rect x="1050" y="266" width="22" height="16" rx="3" fill="#a1245a"/>
        <text x="1166" y="278.5" text-anchor="end" fill="#838383">8%</text>
      </g>
      <!-- coda della distribuzione -->
      <g fill="#ecd3de">
        <rect x="1050" y="292" width="14" height="16" rx="3"/>
        <rect x="1050" y="318" width="8" height="16" rx="3"/>
        <rect x="1050" y="344" width="5" height="16" rx="3"/>
        <rect x="1050" y="370" width="3" height="16" rx="3"/>
      </g>

      <text x="1073" y="430" text-anchor="middle" font-size="13" fill="#838383">distribuzione di probabilità</text>
    </g>

  </g>
</svg>
