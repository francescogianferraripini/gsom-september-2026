<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 400" width="650" height="400" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>La denormalizzazione di proposito: a sinistra le tre tabelle transazionali corrieri, contratti e sedi, collegate da id_corriere, ognuna con la riga di SpedFast; una freccia ETL porta a destra alla dimensione dim_corriere, dove SpedFast sta in due righe con le date di validita, standard fino al 28 febbraio 2026 ed espresso dal primo marzo 2026: due righe, una storia</title>
  <defs>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a1245a"/></marker>
  </defs>

  <text x="111" y="24" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.8" fill="#838383">TRANSAZIONALE</text>

  <!-- le tre tabelle normalizzate -->
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11">
    <g>
      <rect x="16" y="40" width="190" height="58" rx="6" fill="#ffffff" stroke="#dee2e6"/>
      <path d="M16 46 a6,6 0 0 1 6,-6 h178 a6,6 0 0 1 6,6 v16 h-190 z" fill="#f6f6f6"/>
      <path d="M16 62 h190 M16 80 h190 M111 62 v36" stroke="#dee2e6"/>
      <text x="24" y="56" font-family="Poppins, sans-serif" font-size="12.5" font-weight="700" fill="#161719">corrieri</text>
      <text x="24" y="75" font-weight="700" fill="#838383">id_corriere</text><text x="119" y="75" font-weight="700" fill="#838383">nome</text>
      <text x="24" y="93" fill="#212529">7</text><text x="119" y="93" fill="#212529">SpedFast</text>
    </g>
    <g>
      <rect x="16" y="154" width="190" height="58" rx="6" fill="#ffffff" stroke="#dee2e6"/>
      <path d="M16 160 a6,6 0 0 1 6,-6 h178 a6,6 0 0 1 6,6 v16 h-190 z" fill="#f6f6f6"/>
      <path d="M16 176 h190 M16 194 h190 M111 176 v36" stroke="#dee2e6"/>
      <text x="24" y="170" font-family="Poppins, sans-serif" font-size="12.5" font-weight="700" fill="#161719">contratti</text>
      <text x="24" y="189" font-weight="700" fill="#838383">id_corriere</text><text x="119" y="189" font-weight="700" fill="#838383">tipo</text>
      <text x="24" y="207" fill="#212529">7</text><text x="119" y="207" fill="#212529">standard</text>
    </g>
    <g>
      <rect x="16" y="268" width="190" height="58" rx="6" fill="#ffffff" stroke="#dee2e6"/>
      <path d="M16 274 a6,6 0 0 1 6,-6 h178 a6,6 0 0 1 6,6 v16 h-190 z" fill="#f6f6f6"/>
      <path d="M16 290 h190 M16 308 h190 M111 290 v36" stroke="#dee2e6"/>
      <text x="24" y="284" font-family="Poppins, sans-serif" font-size="12.5" font-weight="700" fill="#161719">sedi</text>
      <text x="24" y="303" font-weight="700" fill="#838383">id_corriere</text><text x="119" y="303" font-weight="700" fill="#838383">citta</text>
      <text x="24" y="321" fill="#212529">7</text><text x="119" y="321" fill="#212529">Milano</text>
    </g>
  </g>

  <!-- la chiave che le lega -->
  <g stroke="#838383" stroke-width="1.2" fill="none">
    <path d="M224 69 V297"/>
    <path d="M206 69 h18 M206 183 h18 M206 297 h18"/>
  </g>
  <text x="230" y="100" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" fill="#838383">id_corriere</text>

  <!-- l'ETL -->
  <path d="M254 180 H318" stroke="#a1245a" stroke-width="3" fill="none" marker-end="url(#mb)"/>
  <text x="286" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#a1245a">ETL</text>

  <!-- la dimensione -->
  <text x="484" y="68" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.8" fill="#838383">ANALITICO</text>
  <text x="484" y="92" text-anchor="middle" font-size="11.5" fill="#838383">una riga larga: tutti gli attributi, più la storia</text>

  <g id="dim">
    <rect x="330" y="104" width="308" height="108" rx="8" fill="#ffffff" stroke="#a1245a" stroke-width="2"/>
    <path d="M330 112 a8,8 0 0 1 8,-8 h292 a8,8 0 0 1 8,8 v18 h-308 z" fill="#ecd3de"/>
    <path d="M330 130 h308" stroke="#a1245a"/>
    <text x="484" y="123" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="13.5" font-weight="700" fill="#a1245a">dim_corriere</text>
    <rect x="330" y="130" width="308" height="22" fill="#f6f6f6"/>
    <path d="M386 130 v82 M442 130 v82 M488 130 v82 M563 130 v82 M330 152 h308 M330 182 h308" stroke="#dee2e6" fill="none"/>
    <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700" fill="#838383" text-anchor="middle">
      <text x="358" y="145">nome</text><text x="414" y="145">tipo</text><text x="465" y="145">sede</text><text x="525" y="145">valido_dal</text><text x="600" y="145">valido_al</text>
    </g>
    <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" fill="#212529" text-anchor="middle">
      <text x="358" y="171">SpedFast</text><text x="414" y="171">standard</text><text x="465" y="171">Milano</text><text x="525" y="171">2024-01-01</text>
      <text x="600" y="171" fill="#a1245a" font-weight="700">2026-02-28</text>
      <text x="358" y="201">SpedFast</text>
      <text x="414" y="201" fill="#a1245a" font-weight="700">espresso</text>
      <text x="465" y="201">Milano</text>
      <text x="525" y="201" fill="#a1245a" font-weight="700">2026-03-01</text>
      <text x="600" y="201" fill="#a1245a" font-weight="700">—</text>
    </g>
    <rect x="331" y="152" width="306" height="60" fill="none" stroke="#a1245a" stroke-width="2.5"/>
  </g>

  <path d="M484 214 V230" stroke="#a1245a" stroke-width="2" fill="none"/>
  <text x="484" y="248" text-anchor="middle" font-size="14" font-weight="700" fill="#a1245a">due righe, una storia</text>
  <g text-anchor="middle" font-size="11.5" fill="#838383">
    <text x="484" y="280">le spedizioni di febbraio restano agganciate</text>
    <text x="484" y="298">alla riga standard: il passato non si riscrive</text>
  </g>
</svg>
