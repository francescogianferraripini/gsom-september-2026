<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 344" width="650" height="344" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>La trasformazione di forma: a sinistra le fonti, un database transazionale di tabelle normalizzate legate da molte join, con la colonna data_prevista della tabella spedizioni evidenziata; al centro il blocco ETL che ricompone, calcola, integra e storicizza; a destra il data warehouse disegnato come stella, con fatto_spedizioni al centro e tre dimensioni; in fondo i consumatori disegnati, il report dei ritardi, la dashboard della direzione e l'agente con il tool esegui_sql. Un'onda burgundy parte dalla colonna evidenziata e arriva a tutti e tre: se cambia questa, si rompono questi</title>
  <defs>
    <marker id="mb21" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a1245a"/></marker>
  </defs>

  <g text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="1.6" fill="#838383">
    <text x="88" y="20">FONTI</text>
    <text x="240" y="20">TRASFORMAZIONE</text>
    <text x="394" y="20">DATA WAREHOUSE</text>
    <text x="576" y="20">CONSUMATORI</text>
  </g>

  <!-- ═══ fonti: il transazionale, tante tabelle e tante join ═══ -->
  <g stroke="#838383" stroke-width="1.1" fill="#ffffff">
    <g fill="none" stroke="#b4b8bc">
      <path d="M62 66 H96"/><path d="M40 82 V126"/><path d="M128 70 V120"/><path d="M84 148 H104"/>
      <path d="M40 152 V206"/><path d="M74 216 H116"/><path d="M150 148 V196"/><path d="M100 226 H140"/>
    </g>
    <rect x="8" y="52" width="54" height="30" rx="3"/><rect x="8.7" y="52.7" width="52.6" height="9" fill="#e9ecef" stroke="none"/>
    <rect x="96" y="54" width="64" height="30" rx="3"/><rect x="96.7" y="54.7" width="62.6" height="9" fill="#e9ecef" stroke="none"/>
    <rect x="12" y="126" width="56" height="30" rx="3"/><rect x="12.7" y="126.7" width="54.6" height="9" fill="#e9ecef" stroke="none"/>
    <rect x="8" y="206" width="60" height="30" rx="3"/><rect x="8.7" y="206.7" width="58.6" height="9" fill="#e9ecef" stroke="none"/>
    <rect x="116" y="196" width="66" height="30" rx="3"/><rect x="116.7" y="196.7" width="64.6" height="9" fill="#e9ecef" stroke="none"/>
    <rect x="140" y="248" width="52" height="30" rx="3"/><rect x="140.7" y="248.7" width="50.6" height="9" fill="#e9ecef" stroke="none"/>
  </g>
  <!-- la tabella che conta: spedizioni -->
  <rect x="80" y="120" width="118" height="62" rx="4" fill="#ffffff" stroke="#838383" stroke-width="1.3"/>
  <path d="M84 120 h110 a4 4 0 0 1 4 4 v13 h-118 v-13 a4 4 0 0 1 4 -4 z" fill="#e9ecef"/>
  <text x="88" y="133" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="700" fill="#212529">spedizioni</text>
  <rect x="80.5" y="152" width="117" height="15" fill="#ecd3de"/>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="9.5" fill="#212529">
    <text x="88" y="149">id_ordine</text>
    <text x="88" y="164" font-weight="700" fill="#a1245a">data_prevista</text>
    <text x="88" y="179">data_consegna</text>
  </g>

  <!-- ═══ ETL ═══ -->
  <rect x="216" y="128" width="66" height="104" rx="8" fill="#f4f4f5" stroke="#dee2e6"/>
  <text x="249" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#161719">ETL</text>
  <g text-anchor="middle" font-size="9" fill="#838383">
    <text x="249" y="174">ricompone</text><text x="249" y="188">calcola</text>
    <text x="249" y="202">integra</text><text x="249" y="216">storicizza</text>
  </g>

  <!-- ═══ data warehouse: la stella ═══ -->
  <g stroke="#a1245a" stroke-width="1.2" fill="none">
    <path d="M348 96 L372 142 M448 96 L424 142 M396 236 V204"/>
  </g>
  <g fill="#ffffff" stroke="#838383" stroke-width="1.1">
    <rect x="306" y="62" width="86" height="34" rx="4"/><rect x="400" y="62" width="86" height="34" rx="4"/>
    <rect x="352" y="236" width="88" height="34" rx="4"/>
  </g>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="9.5" fill="#212529" text-anchor="middle">
    <text x="349" y="83">dim_corriere</text><text x="443" y="83">dim_cliente</text><text x="396" y="257">dim_data</text>
  </g>
  <rect x="340" y="142" width="112" height="62" rx="4" fill="#ecd3de" stroke="#a1245a" stroke-width="1.6"/>
  <text x="396" y="160" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="700" fill="#a1245a">fatto_spedizioni</text>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="9" fill="#212529" text-anchor="middle">
    <text x="396" y="176">importo</text><text x="396" y="190">giorni_ritardo</text>
  </g>
  <text x="396" y="286" text-anchor="middle" font-size="9.5" fill="#838383">owner: team logistica</text>

  <!-- ═══ consumatori, disegnati ═══ -->
  <!-- report: un foglio con le barre -->
  <g transform="translate(534,46)">
    <path d="M0 0 H50 L64 14 V72 H0 Z" fill="#ffffff" stroke="#838383" stroke-width="1.1"/>
    <path d="M50 0 V14 H64" fill="none" stroke="#838383" stroke-width="1.1"/>
    <g fill="#a1245a"><rect x="12" y="46" width="8" height="16"/><rect x="26" y="34" width="8" height="28"/><rect x="40" y="42" width="8" height="20"/></g>
    <path d="M8 62 H56" stroke="#838383" stroke-width="1"/>
  </g>
  <text x="576" y="134" text-anchor="middle" font-size="10.5" font-weight="600" fill="#161719">report ritardi</text>

  <!-- dashboard: uno schermo con i riquadri -->
  <g transform="translate(528,156)">
    <rect x="0" y="0" width="96" height="58" rx="4" fill="#ffffff" stroke="#838383" stroke-width="1.1"/>
    <rect x="8" y="8" width="34" height="18" rx="2" fill="#f1e3ea" stroke="none"/>
    <rect x="50" y="8" width="38" height="18" rx="2" fill="#f1e3ea" stroke="none"/>
    <path d="M8 48 L24 38 L38 44 L54 30 L72 36 L88 26" fill="none" stroke="#a1245a" stroke-width="1.6"/>
    <path d="M40 58 H56 M48 58 V64" fill="none" stroke="#838383" stroke-width="1.1"/>
    <path d="M36 66 H60" fill="none" stroke="#838383" stroke-width="1.6"/>
  </g>
  <text x="576" y="238" text-anchor="middle" font-size="10.5" font-weight="600" fill="#161719">dashboard direzione</text>

  <!-- l'agente, con il suo tool -->
  <g transform="translate(576,262)">
    <circle cx="0" cy="10" r="7" fill="#161719"/>
    <path d="M-13 36 A13 13 0 0 1 13 36 Z" fill="#161719"/>
  </g>
  <rect x="522" y="306" width="108" height="22" rx="7" fill="#a1245a"/>
  <text x="576" y="321" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="700" fill="#ffffff">esegui_sql</text>

  <!-- ═══ l'onda: se cambia questa, si rompono questi ═══ -->
  <g stroke="#a1245a" stroke-width="2" fill="none" marker-end="url(#mb21)">
    <path d="M200 160 H212"/>
    <path d="M284 178 H334"/>
    <path d="M454 168 C486 168 486 90 514 88"/>
    <path d="M454 176 C486 176 490 186 522 186"/>
    <path d="M454 186 C486 186 486 290 516 294"/>
  </g>
  <text x="330" y="330" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a1245a">se cambia questa, si rompono questi</text>
</svg>
