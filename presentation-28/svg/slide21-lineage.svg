<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 372" width="650" height="372" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Tre mondi separati, ognuno nel suo riquadro. A sinistra le fonti: le tabelle normalizzate del transazionale, ordini e spedizioni legate per chiave, con la colonna data_prevista in evidenza. In mezzo, fuori dai riquadri, il blocco ETL che ricompone, calcola, integra e storicizza. Al centro il data warehouse: la stella dim_corriere, fatto_spedizioni con le chiavi esterne e la misura giorni_ritardo, dim_data. A destra i consumatori disegnati: il report dei ritardi, la dashboard della direzione, l'agente con il tool esegui_sql. Una linea burgundy parte dalla colonna in evidenza, attraversa l'ETL e il fatto e raggiunge tutti e tre i consumatori: se cambia questa, si rompono questi</title>
  <defs>
    <marker id="mb21" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a1245a"/></marker>
    <marker id="mg21" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#838383"/></marker>
  </defs>

  <!-- ═══ i tre riquadri: tre sistemi diversi ═══ -->
  <g fill="#fafafa" stroke="#e0e2e5">
    <rect x="8" y="26" width="228" height="306" rx="10"/>
    <rect x="322" y="26" width="198" height="306" rx="10"/>
    <rect x="532" y="26" width="110" height="306" rx="10"/>
  </g>
  <g text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="1.6" fill="#838383">
    <text x="122" y="18">FONTI · IL TRANSAZIONALE</text>
    <text x="421" y="18">DATA WAREHOUSE</text>
    <text x="587" y="18">CONSUMATORI</text>
  </g>

  <!-- ═══ fonti ═══ -->
  <g id="t-ordini">
    <rect x="24" y="60" width="180" height="73" rx="8" fill="#ffffff" stroke="#dee2e6"/>
    <path d="M24 68 a8,8 0 0 1 8,-8 h164 a8,8 0 0 1 8,8 v14 h-180 z" fill="#f0f0f1"/>
    <path d="M24 82 h180" stroke="#dee2e6"/>
    <text x="114" y="76" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700" fill="#161719">ordini</text>
    <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" fill="#212529">
      <text x="34" y="98">id_ordine</text><text x="34" y="115">id_cliente</text><text x="34" y="132">data_ordine</text>
    </g>
    <text x="194" y="98" text-anchor="end" font-size="10" font-weight="700" fill="#838383">PK</text>
  </g>
  <path d="M36 133 V213 H42" fill="none" stroke="#838383" stroke-width="1.4" marker-end="url(#mg21)"/>
  <g id="t-spedizioni">
    <rect x="44" y="165" width="180" height="90" rx="8" fill="#ffffff" stroke="#dee2e6"/>
    <path d="M44 173 a8,8 0 0 1 8,-8 h164 a8,8 0 0 1 8,8 v14 h-180 z" fill="#f0f0f1"/>
    <rect x="44.5" y="222" width="179" height="17" fill="#ecd3de" opacity="0.55"/>
    <path d="M44 187 h180" stroke="#dee2e6"/>
    <rect x="44" y="165" width="180" height="90" rx="8" fill="none" stroke="#dee2e6"/>
    <text x="134" y="181" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700" fill="#161719">spedizioni</text>
    <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" fill="#212529">
      <text x="54" y="203">id_spedizione</text><text x="54" y="220">id_ordine</text>
      <text x="54" y="237" fill="#a1245a" font-weight="700">data_prevista</text>
      <text x="54" y="254">data_consegna</text>
    </g>
    <g font-size="10" font-weight="700" fill="#838383" text-anchor="end">
      <text x="214" y="203">PK</text><text x="214" y="220">FK</text>
    </g>
  </g>
  <text x="24" y="282" font-size="10" fill="#838383">…e altre venti, legate per chiave</text>

  <!-- ═══ ETL: in mezzo, fuori dai riquadri ═══ -->
  <rect x="250" y="152" width="62" height="104" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  <text x="281" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#161719">ETL</text>
  <g text-anchor="middle" font-size="9" fill="#838383">
    <text x="281" y="200">ricompone</text><text x="281" y="214">calcola</text><text x="281" y="228">integra</text><text x="281" y="242">storicizza</text>
  </g>

  <!-- ═══ data warehouse: la stella ═══ -->
  <g stroke="#a1245a" stroke-width="2" fill="none">
    <path d="M421 104 V142"/><path d="M421 232 V270"/>
  </g>
  <g id="dim-corriere">
    <rect x="334" y="48" width="174" height="56" rx="8" fill="#ffffff" stroke="#dee2e6"/>
    <path d="M334 56 a8,8 0 0 1 8,-8 h158 a8,8 0 0 1 8,8 v14 h-174 z" fill="#f0f0f1"/>
    <path d="M334 70 h174" stroke="#dee2e6"/>
    <text x="421" y="64" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700" fill="#161719">dim_corriere</text>
    <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" fill="#212529">
      <text x="344" y="86">nome</text><text x="344" y="101">tipo</text>
    </g>
  </g>
  <g id="fatto">
    <rect x="334" y="142" width="174" height="90" rx="8" fill="#ffffff" stroke="#a1245a" stroke-width="2"/>
    <path d="M334 150 a8,8 0 0 1 8,-8 h158 a8,8 0 0 1 8,8 v14 h-174 z" fill="#ecd3de"/>
    <path d="M334 164 h174" stroke="#a1245a"/>
    <text x="421" y="158" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700" fill="#a1245a">fatto_spedizioni</text>
    <path d="M343 205 V219" stroke="#a1245a" stroke-width="3"/>
    <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11">
      <text x="344" y="182" fill="#212529">id_corriere</text><text x="344" y="199" fill="#212529">id_data</text>
      <text x="350" y="217" fill="#a1245a" font-weight="700">giorni_ritardo</text>
    </g>
    <g font-size="10" font-weight="700" fill="#838383" text-anchor="end">
      <text x="498" y="182">FK</text><text x="498" y="199">FK</text>
    </g>
  </g>
  <text x="508" y="250" text-anchor="end" font-size="9.5" fill="#838383">owner: team logistica</text>
  <g id="dim-data">
    <rect x="334" y="270" width="174" height="56" rx="8" fill="#ffffff" stroke="#dee2e6"/>
    <path d="M334 278 a8,8 0 0 1 8,-8 h158 a8,8 0 0 1 8,8 v14 h-174 z" fill="#f0f0f1"/>
    <path d="M334 292 h174" stroke="#dee2e6"/>
    <text x="421" y="286" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700" fill="#161719">dim_data</text>
    <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" fill="#212529">
      <text x="344" y="308">giorno</text><text x="344" y="323">mese</text>
    </g>
  </g>

  <!-- ═══ consumatori ═══ -->
  <g transform="translate(557,48)">
    <path d="M0 0 H46 L60 14 V68 H0 Z" fill="#ffffff" stroke="#838383" stroke-width="1.1"/>
    <path d="M46 0 V14 H60" fill="none" stroke="#838383" stroke-width="1.1"/>
    <g fill="#a1245a"><rect x="10" y="44" width="7" height="14"/><rect x="23" y="33" width="7" height="25"/><rect x="36" y="40" width="7" height="18"/></g>
    <path d="M6 58 H52" stroke="#838383" stroke-width="1"/>
  </g>
  <text x="587" y="132" text-anchor="middle" font-size="10" font-weight="600" fill="#161719">report ritardi</text>

  <g transform="translate(544,156)">
    <rect x="0" y="0" width="86" height="52" rx="4" fill="#ffffff" stroke="#838383" stroke-width="1.1"/>
    <rect x="7" y="7" width="30" height="16" rx="2" fill="#f1e3ea"/>
    <rect x="44" y="7" width="34" height="16" rx="2" fill="#f1e3ea"/>
    <path d="M7 43 L21 34 L34 39 L48 27 L64 32 L79 23" fill="none" stroke="#a1245a" stroke-width="1.6"/>
    <path d="M35 52 H51 M43 52 V58" fill="none" stroke="#838383" stroke-width="1.1"/>
    <path d="M31 60 H55" fill="none" stroke="#838383" stroke-width="1.6"/>
  </g>
  <text x="587" y="232" text-anchor="middle" font-size="10" font-weight="600" fill="#161719">dashboard</text>
  <text x="587" y="245" text-anchor="middle" font-size="10" font-weight="600" fill="#161719">direzione</text>

  <g transform="translate(587,262)">
    <circle cx="0" cy="9" r="6.5" fill="#161719"/>
    <path d="M-12 32 A12 12 0 0 1 12 32 Z" fill="#161719"/>
  </g>
  <rect x="540" y="302" width="94" height="21" rx="7" fill="#a1245a"/>
  <text x="587" y="316" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="9" font-weight="700" fill="#ffffff">esegui_sql</text>

  <!-- ═══ l'onda: dalla colonna che cambia fino ai tre consumatori ═══ -->
  <g stroke="#a1245a" stroke-width="2" fill="none" marker-end="url(#mb21)">
    <path d="M226 237 H246"/>
    <path d="M314 190 H330"/>
    <path d="M510 190 H536"/>
    <path d="M522 190 V80 H551"/>
    <path d="M522 190 V284 H551"/>
  </g>
  <text x="325" y="356" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a1245a">se cambia questa, si rompono questi</text>
</svg>
