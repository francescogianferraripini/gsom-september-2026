<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 450" width="650" height="450" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>La trasformazione di forma: a sinistra le fonti, le tabelle normalizzate del transazionale (ordini e spedizioni, legate per chiave, con la colonna data_prevista in evidenza) e altre venti dietro; al centro il blocco ETL che ricompone, calcola, integra e storicizza; a destra il data warehouse come stella, fatto_spedizioni con le chiavi esterne e la misura giorni_ritardo fra dim_corriere e dim_data; in basso i consumatori disegnati, il report dei ritardi, la dashboard della direzione e l'agente con il tool esegui_sql. Una linea burgundy parte dalla colonna in evidenza e arriva a tutti e tre: se cambia questa, si rompono questi</title>
  <defs>
    <marker id="mb21" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a1245a"/></marker>
    <marker id="mg21" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#838383"/></marker>
  </defs>

  <g text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="1.6" fill="#838383">
    <text x="118" y="18">FONTI · IL TRANSAZIONALE</text>
    <text x="307" y="18">TRASFORMAZIONE</text>
    <text x="509" y="18">DATA WAREHOUSE</text>
    <text x="325" y="338">CONSUMATORI</text>
  </g>

  <!-- ═══ fonti: tabelle normalizzate, legate per chiave ═══ -->
  <g id="t-ordini">
    <rect x="14" y="28" width="176" height="73" rx="8" fill="#ffffff" stroke="#dee2e6"/>
    <path d="M14 36 a8,8 0 0 1 8,-8 h160 a8,8 0 0 1 8,8 v14 h-176 z" fill="#f6f6f6"/>
    <path d="M14 50 h176" stroke="#dee2e6"/>
    <text x="102" y="44" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700" fill="#161719">ordini</text>
    <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" fill="#212529">
      <text x="24" y="66">id_ordine</text><text x="24" y="83">id_cliente</text><text x="24" y="100">data_ordine</text>
    </g>
    <text x="180" y="66" text-anchor="end" font-size="10" font-weight="700" fill="#838383">PK</text>
  </g>
  <path d="M30 101 V187 H42" fill="none" stroke="#838383" stroke-width="1.4" marker-end="url(#mg21)"/>
  <g id="t-spedizioni">
    <rect x="44" y="132" width="196" height="90" rx="8" fill="#ffffff" stroke="#dee2e6"/>
    <path d="M44 140 a8,8 0 0 1 8,-8 h180 a8,8 0 0 1 8,8 v14 h-196 z" fill="#f6f6f6"/>
    <rect x="44.5" y="192" width="195" height="17" fill="#ecd3de" opacity="0.55"/>
    <path d="M44 154 h196" stroke="#dee2e6"/>
    <rect x="44" y="132" width="196" height="90" rx="8" fill="none" stroke="#dee2e6"/>
    <text x="142" y="148" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700" fill="#161719">spedizioni</text>
    <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" fill="#212529">
      <text x="54" y="170">id_spedizione</text><text x="54" y="187">id_ordine</text>
      <text x="54" y="204" fill="#a1245a" font-weight="700">data_prevista</text>
      <text x="54" y="221">data_consegna</text>
    </g>
    <g font-size="10" font-weight="700" fill="#838383" text-anchor="end">
      <text x="230" y="170">PK</text><text x="230" y="187">FK</text>
    </g>
  </g>
  <text x="14" y="246" font-size="10" fill="#838383">…e altre venti, legate per chiave</text>

  <!-- ═══ ETL ═══ -->
  <rect x="272" y="110" width="70" height="104" rx="8" fill="#f4f4f5" stroke="#dee2e6"/>
  <text x="307" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#161719">ETL</text>
  <g text-anchor="middle" font-size="9" fill="#838383">
    <text x="307" y="158">ricompone</text><text x="307" y="172">calcola</text><text x="307" y="186">integra</text><text x="307" y="200">storicizza</text>
  </g>

  <!-- ═══ data warehouse: la stella, nel formato della slide 16 ═══ -->
  <g stroke="#a1245a" stroke-width="2" fill="none">
    <path d="M452 84 V122"/><path d="M540 212 V248"/>
  </g>
  <g id="dim-corriere">
    <rect x="386" y="28" width="170" height="56" rx="8" fill="#ffffff" stroke="#dee2e6"/>
    <path d="M386 36 a8,8 0 0 1 8,-8 h154 a8,8 0 0 1 8,8 v14 h-170 z" fill="#f6f6f6"/>
    <path d="M386 50 h170" stroke="#dee2e6"/>
    <text x="471" y="44" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700" fill="#161719">dim_corriere</text>
    <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" fill="#212529">
      <text x="396" y="66">nome</text><text x="396" y="81">tipo</text>
    </g>
  </g>
  <g id="fatto">
    <rect x="406" y="122" width="206" height="90" rx="8" fill="#ffffff" stroke="#a1245a" stroke-width="2"/>
    <path d="M406 130 a8,8 0 0 1 8,-8 h190 a8,8 0 0 1 8,8 v14 h-206 z" fill="#ecd3de"/>
    <path d="M406 144 h206" stroke="#a1245a"/>
    <text x="509" y="138" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="700" fill="#a1245a">fatto_spedizioni</text>
    <path d="M415 185 V199" stroke="#a1245a" stroke-width="3"/>
    <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11">
      <text x="416" y="162" fill="#212529">id_corriere</text><text x="416" y="179" fill="#212529">id_data</text>
      <text x="422" y="197" fill="#a1245a" font-weight="700">giorni_ritardo</text>
    </g>
    <g font-size="10" font-weight="700" fill="#838383" text-anchor="end">
      <text x="602" y="162">FK</text><text x="602" y="179">FK</text>
    </g>
  </g>
  <text x="520" y="228" text-anchor="end" font-size="9.5" fill="#838383">owner: team logistica</text>
  <g id="dim-data">
    <rect x="460" y="248" width="170" height="56" rx="8" fill="#ffffff" stroke="#dee2e6"/>
    <path d="M460 256 a8,8 0 0 1 8,-8 h154 a8,8 0 0 1 8,8 v14 h-170 z" fill="#f6f6f6"/>
    <path d="M460 270 h170" stroke="#dee2e6"/>
    <text x="545" y="264" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700" fill="#161719">dim_data</text>
    <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" fill="#212529">
      <text x="470" y="286">giorno</text><text x="470" y="301">mese</text>
    </g>
  </g>

  <!-- ═══ l'onda: dalla colonna che cambia fino ai consumatori ═══ -->
  <g stroke="#a1245a" stroke-width="2" fill="none" marker-end="url(#mb21)">
    <path d="M242 200 H268"/>
    <path d="M344 162 H400"/>
    <path d="M545 304 V318 H152 V352"/>
    <path d="M330 318 V358"/>
    <path d="M506 318 V352"/>
  </g>
  <text x="14" y="314" font-size="11.5" font-weight="700" fill="#a1245a">se cambia questa, si rompono questi</text>

  <!-- ═══ consumatori, disegnati ═══ -->
  <g transform="translate(120,356)">
    <path d="M0 0 H50 L64 14 V72 H0 Z" fill="#ffffff" stroke="#838383" stroke-width="1.1"/>
    <path d="M50 0 V14 H64" fill="none" stroke="#838383" stroke-width="1.1"/>
    <g fill="#a1245a"><rect x="12" y="46" width="8" height="16"/><rect x="26" y="34" width="8" height="28"/><rect x="40" y="42" width="8" height="20"/></g>
    <path d="M8 62 H56" stroke="#838383" stroke-width="1"/>
  </g>
  <text x="152" y="446" text-anchor="middle" font-size="10.5" font-weight="600" fill="#161719">report ritardi</text>

  <g transform="translate(282,362)">
    <rect x="0" y="0" width="96" height="58" rx="4" fill="#ffffff" stroke="#838383" stroke-width="1.1"/>
    <rect x="8" y="8" width="34" height="18" rx="2" fill="#f1e3ea"/>
    <rect x="50" y="8" width="38" height="18" rx="2" fill="#f1e3ea"/>
    <path d="M8 48 L24 38 L38 44 L54 30 L72 36 L88 26" fill="none" stroke="#a1245a" stroke-width="1.6"/>
    <path d="M40 58 H56 M48 58 V64" fill="none" stroke="#838383" stroke-width="1.1"/>
    <path d="M36 66 H60" fill="none" stroke="#838383" stroke-width="1.6"/>
  </g>
  <text x="330" y="446" text-anchor="middle" font-size="10.5" font-weight="600" fill="#161719">dashboard direzione</text>

  <g transform="translate(506,356)">
    <circle cx="0" cy="10" r="7" fill="#161719"/>
    <path d="M-13 36 A13 13 0 0 1 13 36 Z" fill="#161719"/>
  </g>
  <rect x="452" y="400" width="108" height="22" rx="7" fill="#a1245a"/>
  <text x="506" y="415" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="700" fill="#ffffff">esegui_sql</text>
  <text x="506" y="446" text-anchor="middle" font-size="10.5" font-weight="600" fill="#161719">l'agente</text>
</svg>
