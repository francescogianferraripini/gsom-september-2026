<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 400" width="650" height="400" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Matrice due per due del dato strutturato: sulle righe la forma (relazionale, document JSON), sulle colonne il fine (transazionale, analitico); la cella relazionale per analitico, il data warehouse vendite, e in evidenza con l'etichetta qui entra l'agente, e una freccia la collega alla cella relazionale per transazionale</title>
  <defs>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#838383"/></marker>
  </defs>

  <!-- assi -->
  <text x="386" y="20" text-anchor="middle" font-size="12" font-weight="600" fill="#838383">il fine</text>
  <text x="14" y="226" transform="rotate(-90 14 226)" text-anchor="middle" font-size="12" font-weight="600" fill="#838383">la forma</text>
  <g text-anchor="middle" font-size="14" font-weight="700" fill="#161719">
    <text x="258" y="42">transazionale</text>
    <text x="514" y="42">analitico</text>
  </g>
  <g text-anchor="end" font-size="13" font-weight="700" fill="#161719">
    <text x="126" y="130">relazionale</text>
    <text x="126" y="300">document</text>
    <text x="126" y="317">(JSON)</text>
  </g>

  <!-- cella relazionale x transazionale -->
  <rect x="134" y="56" width="248" height="140" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  <text x="150" y="120" font-size="14" font-weight="700" fill="#161719">il DB degli ordini</text>
  <text x="150" y="142" font-size="12" fill="#838383">dietro <tspan font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#212529">cerca_ordine</tspan></text>

  <!-- cella document x transazionale -->
  <rect x="134" y="236" width="248" height="140" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  <text x="150" y="300" font-size="14" font-weight="700" fill="#161719">il carrello e il profilo cliente</text>
  <text x="150" y="322" font-size="12" fill="#838383">un JSON per cliente, nell'e-commerce</text>

  <!-- cella document x analitico -->
  <rect x="390" y="236" width="248" height="140" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  <text x="406" y="288" font-size="14" font-weight="700" fill="#161719">gli eventi di navigazione</text>
  <text x="406" y="306" font-size="14" font-weight="700" fill="#161719">e i log</text>
  <text x="406" y="328" font-size="12" fill="#838383">un JSON per evento, letti a lotti</text>

  <!-- cella relazionale x analitico: elemento focale -->
  <rect x="390" y="56" width="248" height="140" rx="8" fill="#ecd3de" stroke="#a1245a" stroke-width="2.5"/>
  <text x="406" y="108" font-size="14" font-weight="700" fill="#161719">il data warehouse vendite</text>
  <text x="406" y="130" font-size="12" fill="#212529">fatti e dimensioni (sezione 3)</text>
  <rect x="406" y="146" width="118" height="24" rx="8" fill="#a1245a"/>
  <text x="465" y="162" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">qui entra l'agente</text>

  <!-- la struttura deriva dal transazionale -->
  <path d="M258 196 V214 H514 V198" fill="none" stroke="#838383" stroke-width="1.5" marker-end="url(#mg)"/>
  <text x="386" y="230" text-anchor="middle" font-size="11.5" font-weight="500" fill="#838383">la struttura deriva da qui</text>
</svg>
