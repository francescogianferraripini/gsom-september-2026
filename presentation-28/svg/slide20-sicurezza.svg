<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 360" width="650" height="360" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>La sicurezza analitica a tre livelli: la tabella fatto_spedizioni disegnata tre volte, con il lucchetto sull'intera tabella, con la colonna importo mascherata e con le sole righe della Lombardia accese per il responsabile di zona; sotto, l'agente con utenza tecnica vede tutto, con un segno di errore, mentre l'agente che interroga con l'identita di Marco vede solo la Lombardia, con un segno di conferma</title>
  <defs>
    <marker id="mbd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a1245a"/></marker>
    <g id="ok">
      <circle r="8" fill="#d1efea" stroke="#1ab197" stroke-width="1.5"/>
      <path d="M-3.6 0 L-1.2 2.8 L3.8 -3" fill="none" stroke="#1ab197" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="no">
      <circle r="8" fill="#ecd3de" stroke="#a1245a" stroke-width="1.5"/>
      <path d="M-3.2 -3.2 L3.2 3.2 M3.2 -3.2 L-3.2 3.2" fill="none" stroke="#a1245a" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="agente">
      <rect x="-20" y="-16" width="40" height="36" rx="10" fill="#f6f6f6" stroke="#161719" stroke-width="1.5"/>
      <circle cx="-8" cy="2" r="3.5" fill="#161719"/><circle cx="8" cy="2" r="3.5" fill="#161719"/>
      <path d="M0 -16 V-24" stroke="#161719" stroke-width="1.5"/><circle cx="0" cy="-27" r="3" fill="#161719"/>
    </g>
  </defs>

  <g text-anchor="middle" font-size="14" font-weight="700" fill="#161719">
    <text x="109" y="42">tabella</text>
    <text x="321" y="42">colonna</text>
    <text x="533" y="42" fill="#a1245a">riga</text>
  </g>

  <!-- livello tabella -->
  <g id="liv-tabella" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" text-anchor="middle">
    <rect x="12" y="54" width="194" height="98" rx="6" fill="#ffffff" stroke="#dee2e6"/>
    <rect x="12.5" y="54.5" width="193" height="21.5" fill="#f6f6f6"/>
    <path d="M12 76 h194 M12 95 h194 M12 114 h194 M12 133 h194 M78 54 v98 M140 54 v98" stroke="#dee2e6"/>
    <g font-weight="700" fill="#838383"><text x="45" y="69">regione</text><text x="109" y="69">corriere</text><text x="173" y="69">importo</text></g>
    <g fill="#212529">
      <text x="45" y="89">Lombardia</text><text x="109" y="89">SpedFast</text><text x="173" y="89">1.240 €</text>
      <text x="45" y="108">Lazio</text><text x="109" y="108">PostaPro</text><text x="173" y="108">890 €</text>
      <text x="45" y="127">Lombardia</text><text x="109" y="127">SpedFast</text><text x="173" y="127">2.100 €</text>
      <text x="45" y="146">Veneto</text><text x="109" y="146">Corr.Nord</text><text x="173" y="146">760 €</text>
    </g>
    <g>
      <path d="M186 56 a7,7 0 0 1 14,0 v5" fill="none" stroke="#161719" stroke-width="2"/>
      <rect x="182" y="61" width="22" height="17" rx="3" fill="#161719"/>
      <circle cx="193" cy="69" r="2.4" fill="#ffffff"/>
    </g>
  </g>
  <text x="109" y="174" text-anchor="middle" font-size="11.5" fill="#838383">chi può leggere e chi no</text>

  <!-- livello colonna -->
  <g id="liv-colonna" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" text-anchor="middle">
    <rect x="224" y="54" width="194" height="98" rx="6" fill="#ffffff" stroke="#dee2e6"/>
    <rect x="224.5" y="54.5" width="193" height="21.5" fill="#f6f6f6"/>
    <path d="M224 76 h194 M224 95 h194 M224 114 h194 M224 133 h194 M290 54 v98 M352 54 v98" stroke="#dee2e6"/>
    <g font-weight="700" fill="#838383"><text x="257" y="69">regione</text><text x="321" y="69">corriere</text><text x="385" y="69">importo</text></g>
    <g fill="#212529">
      <text x="257" y="89">Lombardia</text><text x="321" y="89">SpedFast</text>
      <text x="257" y="108">Lazio</text><text x="321" y="108">PostaPro</text>
      <text x="257" y="127">Lombardia</text><text x="321" y="127">SpedFast</text>
      <text x="257" y="146">Veneto</text><text x="321" y="146">Corr.Nord</text>
    </g>
    <rect x="353" y="77" width="64" height="74" fill="#161719"/>
    <g fill="#ffffff" font-size="12" font-weight="700">
      <text x="385" y="90">•••</text><text x="385" y="109">•••</text><text x="385" y="128">•••</text><text x="385" y="147">•••</text>
    </g>
  </g>
  <text x="321" y="174" text-anchor="middle" font-size="11.5" fill="#838383">importo mascherato, la query gira</text>

  <!-- livello riga -->
  <g id="liv-riga" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" text-anchor="middle">
    <rect x="436" y="54" width="194" height="98" rx="6" fill="#ffffff" stroke="#a1245a" stroke-width="2.5"/>
    <rect x="437" y="55" width="192" height="21" fill="#f6f6f6"/>
    <rect x="437" y="76" width="192" height="19" fill="#ecd3de"/>
    <rect x="437" y="114" width="192" height="19" fill="#ecd3de"/>
    <path d="M436 76 h194 M436 95 h194 M436 114 h194 M436 133 h194 M502 54 v98 M564 54 v98" stroke="#dee2e6"/>
    <g font-weight="700" fill="#838383"><text x="469" y="69">regione</text><text x="533" y="69">corriere</text><text x="597" y="69">importo</text></g>
    <g fill="#a1245a" font-weight="700">
      <text x="469" y="89">Lombardia</text><text x="533" y="89">SpedFast</text><text x="597" y="89">1.240 €</text>
      <text x="469" y="127">Lombardia</text><text x="533" y="127">SpedFast</text><text x="597" y="127">2.100 €</text>
    </g>
    <g fill="#212529" opacity="0.28">
      <text x="469" y="108">Lazio</text><text x="533" y="108">PostaPro</text><text x="597" y="108">890 €</text>
      <text x="469" y="146">Veneto</text><text x="533" y="146">Corr.Nord</text><text x="597" y="146">760 €</text>
    </g>
  </g>
  <text x="533" y="174" text-anchor="middle" font-size="11.5" font-weight="600" fill="#a1245a">responsabile Lombardia</text>

  <path d="M533 210 V186" stroke="#a1245a" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#mbd)"/>

  <!-- con quale identita interroga l'agente -->
  <g id="agente-tecnico">
    <rect x="14" y="216" width="302" height="114" rx="8" fill="#ffffff" stroke="#dee2e6"/>
    <use href="#agente" x="54" y="272"/>
    <text x="90" y="266" font-size="13" font-weight="700" fill="#161719">agente (utenza tecnica)</text>
    <text x="90" y="288" font-size="11.5" fill="#838383">vede tutte e tre le tabelle piene</text>
    <g transform="translate(288,244) scale(1.3)"><use href="#no"/></g>
  </g>

  <g id="agente-marco">
    <rect x="334" y="216" width="302" height="114" rx="8" fill="#f6f6f6" stroke="#a1245a" stroke-width="2.5"/>
    <path d="M340 228 V318" stroke="#a1245a" stroke-width="3"/>
    <use href="#agente" x="382" y="272"/>
    <text x="418" y="258" font-size="13" font-weight="700" fill="#161719">agente come Marco</text>
    <text x="418" y="278" font-size="11.5" fill="#838383">(responsabile Lombardia)</text>
    <text x="418" y="298" font-size="11.5" font-weight="600" fill="#a1245a">vede solo le righe della Lombardia</text>
    <g transform="translate(608,244) scale(1.3)"><use href="#ok"/></g>
  </g>
</svg>
