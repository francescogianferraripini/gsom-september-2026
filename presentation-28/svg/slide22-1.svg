<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 330" width="650" height="330" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Primo tempo: arriva una richiesta, "voglio il ritardo medio per regione", e da essa nasce una pipeline che parte dal transazionale, passa da un ETL e finisce in un report con il suo numero, 3,8 giorni. Funziona, in una settimana</title>
  <defs>
    <marker id="m22" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#838383"/></marker>
    <marker id="m22b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a1245a"/></marker>
  </defs>

  <!-- il transazionale: la fonte di tutte le pipeline -->
  <text x="62" y="150" text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="1.4" fill="#838383">IL TRANSAZIONALE</text>
  <g stroke="#838383" stroke-width="1.1" fill="#ffffff">
    <g fill="none" stroke="#b4b8bc"><path d="M52 178 H72"/><path d="M34 190 V214"/><path d="M92 192 V216"/><path d="M60 228 H80"/></g>
    <rect x="8" y="162" width="44" height="24" rx="3"/><rect x="8.7" y="162.7" width="42.6" height="7" fill="#e9ecef" stroke="none"/>
    <rect x="72" y="166" width="48" height="24" rx="3"/><rect x="72.7" y="166.7" width="46.6" height="7" fill="#e9ecef" stroke="none"/>
    <rect x="12" y="214" width="48" height="24" rx="3"/><rect x="12.7" y="214.7" width="46.6" height="7" fill="#e9ecef" stroke="none"/>
    <rect x="72" y="216" width="44" height="24" rx="3"/><rect x="72.7" y="216.7" width="42.6" height="7" fill="#e9ecef" stroke="none"/>
  </g>

  <!-- la richiesta -->
  <g transform="translate(150,40)">
    <circle cx="8" cy="8" r="6.5" fill="#161719"/><path d="M-4 30 A12 12 0 0 1 20 30 Z" fill="#161719"/>
  </g>
  <rect x="182" y="38" width="256" height="26" rx="8" fill="#f4f4f5" stroke="#dee2e6"/>
  <text x="194" y="55" font-size="11" fill="#212529">"voglio il ritardo medio per regione"</text>

  <!-- la pipeline che nasce -->
  <path d="M120 196 C160 196 170 140 196 134" fill="none" stroke="#838383" stroke-width="1.4" marker-end="url(#m22)"/>
  <rect x="200" y="120" width="52" height="28" rx="7" fill="#f4f4f5" stroke="#dee2e6"/>
  <text x="226" y="139" text-anchor="middle" font-size="10.5" font-weight="700" fill="#161719">ETL</text>
  <path d="M256 134 H282" fill="none" stroke="#838383" stroke-width="1.4" marker-end="url(#m22)"/>
  <rect x="288" y="116" width="150" height="36" rx="4" fill="#ffffff" stroke="#838383" stroke-width="1.1"/>
  <g fill="#a1245a"><rect x="300" y="136" width="7" height="8"/><rect x="311" y="128" width="7" height="16"/><rect x="322" y="132" width="7" height="12"/></g>
  <text x="344" y="132" font-size="9.5" fill="#838383">ritardo medio</text>
  <text x="344" y="146" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700" fill="#161719">3,8</text>
  <text x="288" y="166" font-size="9.5" fill="#838383">funziona, in una settimana</text>
</svg>
