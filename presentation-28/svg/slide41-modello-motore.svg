<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 400" width="650" height="400" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Il grafo è un modello, non un motore: in alto il grafo Acme con il nodo Fattura aggiunto tratteggiato senza toccare il resto; al centro lo stesso modello dentro tre motori diversi, Neo4j, Postgres o DuckDB e il data vault; in basso la regola: somme allo star schema, relazioni al grafo, testi al documentale</title>

  <defs>
    <marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#838383"/></marker>
  </defs>

  <!-- ===== il grafo Acme, e ciò che si aggiunge ===== -->
  <g stroke="#838383" stroke-width="1.4" fill="none" marker-end="url(#a-grey)">
    <path d="M86 62 L112 62"/>
    <path d="M182 62 L208 62"/>
    <path d="M314 62 L292 62"/>
    <path d="M150 102 L150 82"/>
  </g>
  <path d="M331 112 L275 78" stroke="#838383" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#a-grey)"/>

  <g fill="#ffffff" stroke="#838383" stroke-width="1.5">
    <ellipse cx="56" cy="62" rx="30" ry="14"/>
    <ellipse cx="150" cy="62" rx="32" ry="14"/>
    <ellipse cx="250" cy="62" rx="36" ry="14"/>
    <ellipse cx="352" cy="62" rx="38" ry="14"/>
    <ellipse cx="150" cy="116" rx="34" ry="14"/>
  </g>
  <ellipse cx="350" cy="124" rx="34" ry="14" fill="#f6f6f6" stroke="#838383" stroke-width="1.5" stroke-dasharray="5 4"/>

  <g font-size="11.5" font-weight="600" fill="#161719" text-anchor="middle">
    <text x="56" y="66">Rossi</text>
    <text x="150" y="66">ordine</text>
    <text x="250" y="66">corriere</text>
    <text x="352" y="66">contratto</text>
    <text x="150" y="120">reclamo</text>
    <text x="350" y="128">Fattura</text>
  </g>
  <text x="312" y="96" font-size="11.5" font-weight="700" fill="#838383">FATTURA</text>
  <text x="400" y="128" font-size="12.5" font-style="italic" fill="#838383">aggiunto senza toccare il resto</text>

  <!-- ===== lo stesso modello, tre motori ===== -->
  <text x="325" y="158" font-size="13.5" font-weight="700" fill="#a1245a" text-anchor="middle">lo stesso modello</text>
  <path d="M40 186 v-6 q0 -8 8 -8 H317 q8 0 8 -8 q0 8 8 8 H602 q8 0 8 8 v6" fill="none" stroke="#a1245a" stroke-width="1.5"/>

  <g fill="#ffffff" stroke="#dee2e6">
    <rect x="12" y="190" width="198" height="126" rx="8"/>
    <rect x="226" y="190" width="198" height="126" rx="8"/>
    <rect x="440" y="190" width="198" height="126" rx="8"/>
  </g>

  <g text-anchor="middle">
    <g font-size="13" font-weight="700" fill="#161719">
      <text x="111" y="218">Neo4j</text>
      <text x="325" y="218">Postgres / DuckDB</text>
      <text x="539" y="218">data vault</text>
    </g>
    <g font-size="12" fill="#212529">
      <text x="111" y="238">Cypher</text>
      <text x="325" y="238">tabelle nodi + archi</text>
      <text x="539" y="238">hub + link + satelliti</text>
    </g>
    <g font-size="11.5" fill="#838383">
      <text x="111" y="256">adiacenza senza indice</text>
      <text x="325" y="256">query ricorsive</text>
    </g>
  </g>

  <!-- la stessa mini-figura del grafo dentro i tre riquadri -->
  <g stroke="#a1245a" stroke-width="1.3" fill="none">
    <path d="M77 290 L100 276 L124 292 L146 277 M100 276 L146 277"/>
    <path d="M291 290 L314 276 L338 292 L360 277 M314 276 L360 277"/>
    <path d="M505 290 L528 276 L552 292 L574 277 M528 276 L574 277"/>
  </g>
  <g fill="#a1245a">
    <circle cx="77" cy="290" r="5"/><circle cx="100" cy="276" r="5"/><circle cx="124" cy="292" r="5"/><circle cx="146" cy="277" r="5"/>
    <circle cx="291" cy="290" r="5"/><circle cx="314" cy="276" r="5"/><circle cx="338" cy="292" r="5"/><circle cx="360" cy="277" r="5"/>
    <circle cx="505" cy="290" r="5"/><circle cx="528" cy="276" r="5"/><circle cx="552" cy="292" r="5"/><circle cx="574" cy="277" r="5"/>
  </g>

  <!-- ===== ogni forma per le sue domande ===== -->
  <g fill="#f6f6f6" stroke="#dee2e6">
    <rect x="12" y="336" width="198" height="48" rx="8"/>
    <rect x="440" y="336" width="198" height="48" rx="8"/>
  </g>
  <rect x="226" y="336" width="198" height="48" rx="8" fill="#ecd3de" stroke="#a1245a" stroke-width="2"/>
  <g text-anchor="middle" font-size="12">
    <text x="111" y="357" fill="#212529">somme e metriche</text>
    <text x="111" y="374" font-weight="700" fill="#161719">→ star schema</text>
    <text x="325" y="357" fill="#a1245a">relazioni e percorsi</text>
    <text x="325" y="374" font-weight="700" fill="#a1245a">→ grafo</text>
    <text x="539" y="357" fill="#212529">testi e clausole</text>
    <text x="539" y="374" font-weight="700" fill="#161719">→ documentale</text>
  </g>
</svg>
