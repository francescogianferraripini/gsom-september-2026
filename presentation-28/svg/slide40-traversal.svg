<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 400" width="650" height="400" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Percorrere un grafo: a sinistra il relazionale, dove ogni passo è una join in più e il lavoro cresce a ogni passo; a destra il grafo, dove i vicini, i vicini dei vicini e i contratti si raggiungono a costo piatto</title>

  <defs>
    <marker id="a-bur" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a1245a"/></marker>
  </defs>

  <line x1="325" y1="44" x2="325" y2="362" stroke="#dee2e6" stroke-width="1"/>

  <!-- ===================== relazionale ===================== -->
  <text x="160" y="30" font-size="14.5" font-weight="700" fill="#161719" text-anchor="middle">relazionale</text>

  <g>
    <rect x="16" y="48" width="134" height="46" rx="8" fill="#ffffff" stroke="#dee2e6"/>
    <line x1="16" y1="71" x2="150" y2="71" stroke="#dee2e6"/>
    <text x="24" y="65" font-size="12.5" font-weight="700" fill="#161719">nodi</text>
    <text x="24" y="87" font-size="11.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" fill="#212529">id · etichetta</text>

    <rect x="166" y="48" width="134" height="46" rx="8" fill="#ffffff" stroke="#dee2e6"/>
    <line x1="166" y1="71" x2="300" y2="71" stroke="#dee2e6"/>
    <text x="174" y="65" font-size="12.5" font-weight="700" fill="#161719">archi</text>
    <text x="174" y="87" font-size="11.5" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" fill="#212529">da · a · tipo</text>
  </g>

  <text x="160" y="130" font-size="12.5" fill="#212529" text-anchor="middle">ogni passo è una join fra archi e nodi</text>

  <g fill="#f6f6f6" stroke="#838383" stroke-width="1.4">
    <rect x="16" y="240" width="92" height="40" rx="8"/>
    <rect x="114" y="204" width="92" height="76" rx="8"/>
    <rect x="212" y="168" width="92" height="112" rx="8"/>
  </g>
  <g font-size="11.5" font-weight="600" fill="#161719" text-anchor="middle">
    <text x="62" y="272">1 join</text>
    <text x="160" y="272">2 join</text>
    <text x="258" y="272">3 join</text>
  </g>
  <text x="62" y="257" font-size="11" fill="#838383" text-anchor="middle">2 M righe lette</text>
  <g font-size="12.5" font-weight="600" fill="#161719" text-anchor="middle">
    <text x="62" y="300">1 passo</text>
    <text x="160" y="300">2 passi</text>
    <text x="258" y="300">3 passi</text>
  </g>
  <text x="160" y="332" font-size="12.5" font-style="italic" fill="#838383" text-anchor="middle">ogni passo rilegge la tabella</text>

  <!-- ===================== grafo ===================== -->
  <text x="476" y="30" font-size="14.5" font-weight="700" fill="#a1245a" text-anchor="middle">grafo</text>

  <g fill="none" stroke="#dee2e6" stroke-width="1" stroke-dasharray="4 4">
    <circle cx="476" cy="190" r="44"/>
    <circle cx="476" cy="190" r="82"/>
    <circle cx="476" cy="190" r="120"/>
  </g>

  <g stroke="#a1245a" stroke-width="1.5" fill="none">
    <path d="M498.6 198.2 L509.6 202.9"/>
    <path d="M525 209.4 L545.4 215.6"/>
    <path d="M560.9 220.3 L580.9 228.3"/>
    <path d="M476 214 L476 226"/>
    <path d="M476 242 L476 264"/>
    <path d="M476 280 L476 302"/>
    <path d="M453.4 198.2 L442.4 202.9"/>
    <path d="M427 209.4 L406.6 215.6"/>
    <path d="M391.1 220.3 L371.1 228.3"/>
  </g>

  <g fill="#ffffff" stroke="#a1245a" stroke-width="1.8">
    <circle cx="517.3" cy="205" r="8"/>
    <circle cx="476" cy="234" r="8"/>
    <circle cx="434.7" cy="205" r="8"/>
    <circle cx="553.1" cy="218" r="8"/>
    <circle cx="476" cy="272" r="8"/>
    <circle cx="398.9" cy="218" r="8"/>
    <circle cx="588.8" cy="231" r="8"/>
    <circle cx="476" cy="310" r="8"/>
    <circle cx="363.2" cy="231" r="8"/>
  </g>

  <circle cx="476" cy="190" r="24" fill="#ecd3de" stroke="#a1245a" stroke-width="2.5"/>
  <text x="476" y="194" font-size="12.5" font-weight="700" fill="#a1245a" text-anchor="middle">Rossi</text>

  <g font-size="12.5" font-weight="600" fill="#161719" text-anchor="middle">
    <text x="476" y="141">1 passo = i vicini</text>
    <text x="476" y="101">2 passi</text>
    <text x="476" y="63">3 passi</text>
  </g>
  <g font-size="12" fill="#212529">
    <text x="490" y="238">ordini</text>
    <text x="490" y="276">corrieri</text>
    <text x="490" y="314">contratti</text>
  </g>

  <text x="476" y="332" font-size="12.5" font-weight="600" fill="#161719" text-anchor="middle">nodi toccati</text>
  <g fill="#ecd3de" stroke="#a1245a" stroke-width="1.5">
    <rect x="372" y="338" width="56" height="20" rx="6"/>
    <rect x="448" y="338" width="56" height="20" rx="6"/>
    <rect x="524" y="338" width="56" height="20" rx="6"/>
  </g>
  <g font-size="11.5" font-weight="600" fill="#a1245a" text-anchor="middle">
    <text x="400" y="352">~10</text>
    <text x="476" y="352">~30</text>
    <text x="552" y="352">~90</text>
  </g>
</svg>
