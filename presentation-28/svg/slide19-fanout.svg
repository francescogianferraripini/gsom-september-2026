<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 707 150" width="707" height="150" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Il fanout: a sinistra tre righe di fatto_spedizioni e tre righe di fatto_reclami unite prima di aggregare si incrociano in nove combinazioni, e l'importo esce tre volte; a destra ogni fatto e aggregato per conto suo nei due totali somma degli importi e numero di reclami, uniti poi in una riga sola</title>
  <defs>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#838383"/></marker>
  </defs>

  <!-- pannello sinistro: join fra fatti -->
  <g id="fanout">
    <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" fill="#838383" text-anchor="middle">
      <text x="62" y="24">fatto_spedizioni</text>
      <text x="208" y="24">fatto_reclami</text>
    </g>
    <g stroke="#a1245a" stroke-width="1.2" opacity="0.7">
      <path d="M100 44 H170 M100 44 L170 70 M100 44 L170 96"/>
      <path d="M100 70 L170 44 M100 70 H170 M100 70 L170 96"/>
      <path d="M100 96 L170 44 M100 96 L170 70 M100 96 H170"/>
    </g>
    <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" text-anchor="middle" fill="#212529">
      <rect x="24" y="34" width="76" height="20" rx="4" fill="#ffffff" stroke="#dee2e6"/><text x="62" y="48">spedizione</text>
      <rect x="24" y="60" width="76" height="20" rx="4" fill="#ffffff" stroke="#dee2e6"/><text x="62" y="74">spedizione</text>
      <rect x="24" y="86" width="76" height="20" rx="4" fill="#ffffff" stroke="#dee2e6"/><text x="62" y="100">spedizione</text>
      <rect x="170" y="34" width="76" height="20" rx="4" fill="#ffffff" stroke="#dee2e6"/><text x="208" y="48">reclamo</text>
      <rect x="170" y="60" width="76" height="20" rx="4" fill="#ffffff" stroke="#dee2e6"/><text x="208" y="74">reclamo</text>
      <rect x="170" y="86" width="76" height="20" rx="4" fill="#ffffff" stroke="#dee2e6"/><text x="208" y="100">reclamo</text>
    </g>
    <rect x="258" y="57" width="84" height="26" rx="6" fill="#ecd3de" stroke="#a1245a"/>
    <text x="300" y="74" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a1245a">importo × 3</text>
    <text x="176" y="132" text-anchor="middle" font-size="12" font-weight="600" fill="#a1245a">3 × 3 = 9 righe: l'importo esce 3 volte</text>
  </g>

  <path d="M353 18 V138" stroke="#dee2e6"/>

  <!-- pannello destro: join fra aggregati -->
  <g id="aggregati">
    <g font-size="11" fill="#838383" text-anchor="middle">
      <text x="438" y="24">3 spedizioni</text>
      <text x="438" y="68">3 reclami</text>
    </g>
    <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" text-anchor="middle" fill="#212529">
      <rect x="372" y="32" width="40" height="18" rx="4" fill="#ffffff" stroke="#dee2e6"/><text x="392" y="45">sped.</text>
      <rect x="418" y="32" width="40" height="18" rx="4" fill="#ffffff" stroke="#dee2e6"/><text x="438" y="45">sped.</text>
      <rect x="464" y="32" width="40" height="18" rx="4" fill="#ffffff" stroke="#dee2e6"/><text x="484" y="45">sped.</text>
      <rect x="372" y="76" width="40" height="18" rx="4" fill="#ffffff" stroke="#dee2e6"/><text x="392" y="89">recl.</text>
      <rect x="418" y="76" width="40" height="18" rx="4" fill="#ffffff" stroke="#dee2e6"/><text x="438" y="89">recl.</text>
      <rect x="464" y="76" width="40" height="18" rx="4" fill="#ffffff" stroke="#dee2e6"/><text x="484" y="89">recl.</text>
    </g>
    <g stroke="#838383" stroke-width="1.5" fill="none" marker-end="url(#mg)">
      <path d="M508 41 H520"/>
      <path d="M508 85 H520"/>
    </g>
    <g text-anchor="middle" font-size="11.5" font-weight="600" fill="#161719">
      <rect x="524" y="30" width="76" height="22" rx="5" fill="#f6f6f6" stroke="#dee2e6"/><text x="562" y="45">Σ importo</text>
      <rect x="524" y="74" width="76" height="22" rx="5" fill="#f6f6f6" stroke="#dee2e6"/><text x="562" y="89">n reclami</text>
    </g>
    <g stroke="#a1245a" stroke-width="2" fill="none">
      <path d="M600 41 L616 57"/>
      <path d="M600 85 L616 69"/>
    </g>
    <rect x="618" y="51" width="76" height="24" rx="6" fill="#ecd3de" stroke="#a1245a" stroke-width="2"/>
    <text x="656" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#a1245a">1 riga</text>
    <text x="531" y="132" text-anchor="middle" font-size="12" font-weight="600" fill="#a1245a">2 totali, 1 riga</text>
  </g>
</svg>
