      <path d="M488 208 L384 282 M488 208 L436 282 M488 208 L540 282 M488 208 L592 282"/>
      <path d="M488 208 L488 282"/>
    </g>
    <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700" fill="#a1245a" text-anchor="middle">
