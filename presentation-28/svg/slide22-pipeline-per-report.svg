      <rect x="414" y="250" width="44" height="24" rx="4" fill="#ffffff" stroke="#dee2e6"/><text x="436" y="266">3,8</text>
      <rect x="466" y="250" width="44" height="24" rx="4" fill="#ffffff" stroke="#dee2e6"/><text x="488" y="266">3,8</text>
      <rect x="518" y="250" width="44" height="24" rx="4" fill="#ffffff" stroke="#dee2e6"/><text x="540" y="266">3,8</text>
      <rect x="570" y="250" width="44" height="24" rx="4" fill="#ffffff" stroke="#dee2e6"/><text x="592" y="266">3,8</text>
      <rect x="362" y="282" width="44" height="24" rx="4" fill="#ffffff" stroke="#dee2e6"/><text x="384" y="298">3,8</text>
      <rect x="414" y="282" width="44" height="24" rx="4" fill="#ffffff" stroke="#dee2e6"/><text x="436" y="298">3,8</text>
      <rect x="466" y="282" width="44" height="24" rx="4" fill="#ffffff" stroke="#dee2e6"/><text x="488" y="298">3,8</text>
      <rect x="518" y="282" width="44" height="24" rx="4" fill="#ffffff" stroke="#dee2e6"/><text x="540" y="298">3,8</text>
      <rect x="570" y="282" width="44" height="24" rx="4" fill="#ffffff" stroke="#dee2e6"/><text x="592" y="298">3,8</text>
    </g>
    <text x="488" y="340" text-anchor="middle" font-size="13.5" font-weight="700" fill="#161719">1 pipeline · 1 definizione · 10 lettori</text>
