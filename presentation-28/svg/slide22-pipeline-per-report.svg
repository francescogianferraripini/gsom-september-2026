      <rect x="76" y="190" width="24" height="50" rx="4" fill="#ecd3de" stroke="#a1245a" stroke-width="2"/>
      <text x="88" y="209">2</text><text x="88" y="230" font-weight="700" fill="#a1245a">3,8</text>
      <rect x="154" y="190" width="24" height="50" rx="4" fill="#ecd3de" stroke="#a1245a" stroke-width="2"/>
