<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 400" width="650" height="400" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>L'antipattern della pipeline per report: a sinistra dal cilindro transazionale partono dieci pipeline parallele, da ETL 1 a ETL 10, ognuna con la sua tabella finale da report_1 a report_10, e tre di esse portano tre ritardi medi diversi, 3,8 · 3,2 · 4,1, per dieci pipeline e dieci definizioni; a destra una sola pipeline porta a fatto_spedizioni e da li dieci report leggono tutti lo stesso 3,8, per una pipeline, una definizione, dieci lettori</title>

  <path d="M325 16 V356" stroke="#dee2e6"/>

  <!-- una pipeline per report -->
  <g id="antipattern">
    <text x="179" y="26" text-anchor="middle" font-size="13.5" font-weight="700" fill="#161719">«una pipeline per report»</text>
    <path d="M104 52 v32 a58,11 0 0 0 116,0 v-32" fill="#ffffff" stroke="#dee2e6"/>
    <ellipse cx="162" cy="52" rx="58" ry="11" fill="#f6f6f6" stroke="#dee2e6"/>
    <text x="162" y="79" text-anchor="middle" font-size="11.5" fill="#212529">transazionale</text>

