      <rect x="180" y="122" width="24" height="28" rx="4" fill="#f6f6f6" stroke="#dee2e6"/><text x="192" y="141">6</text>
      <rect x="206" y="122" width="24" height="28" rx="4" fill="#f6f6f6" stroke="#dee2e6"/><text x="218" y="141">7</text>
