      <text x="244" y="209">8</text><text x="244" y="230" font-weight="700" fill="#a1245a">4,1</text>
    </g>
    <text x="46" y="219" text-anchor="end" font-size="11.5" font-weight="700" fill="#838383">report</text>

    <text x="179" y="268" text-anchor="middle" font-size="11" fill="#838383">ETL 1 … ETL 10 → report_1 … report_10</text>
    <text x="179" y="298" text-anchor="middle" font-size="12" font-weight="600" fill="#a1245a">tre «ritardo medio» diversi</text>
    <text x="179" y="340" text-anchor="middle" font-size="13.5" font-weight="700" fill="#161719">10 pipeline · 10 definizioni</text>
  </g>

  <!-- una stella, dieci report -->
  <g id="stella">
    <text x="488" y="26" text-anchor="middle" font-size="13.5" font-weight="700" fill="#161719">«una stella, dieci report»</text>
