    <ellipse cx="488" cy="52" rx="58" ry="11" fill="#f6f6f6" stroke="#dee2e6"/>
    <text x="488" y="79" text-anchor="middle" font-size="11.5" fill="#212529">transazionale</text>

    <g stroke="#a1245a" stroke-width="2.5" fill="none">
      <path d="M488 95 V118"/>
      <path d="M488 150 V174"/>
