<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 707 400" width="707" height="400" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Tre pattern agentici, un solo lettore: la fascia dello spettro con Text2SQL, GraphRAG e RAG agentic search; il modello che sceglie fra tre tool (esegui_sql, cerca_documenti, percorri_grafo) dalle loro descrizioni, e sotto ciascuno la forma di conoscenza che legge: la stella, i documenti, il grafo</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#838383"/></marker>
  </defs>

  <text x="12" y="13" font-size="11" font-weight="700" letter-spacing="1" fill="#838383">LA FASCIA DEI PATTERN AGENTICI, ACCESA</text>

  <!-- fascia dello spettro -->
  <g>
    <rect x="12" y="22" width="683" height="32" rx="8" fill="#ecd3de" stroke="#a1245a" stroke-width="1.5"/>
    <line x1="239" y1="22" x2="239" y2="54" stroke="#a1245a" stroke-width="1"/>
    <line x1="466" y1="22" x2="466" y2="54" stroke="#a1245a" stroke-width="1"/>
    <g font-size="14" font-weight="600" fill="#a1245a" text-anchor="middle">
      <text x="125" y="43">Text2SQL</text>
      <text x="352" y="43">GraphRAG</text>
      <text x="580" y="43">RAG · agentic search</text>
    </g>
  </g>

  <!-- il modello -->
  <rect x="283" y="66" width="140" height="34" rx="8" fill="#a1245a"/>
  <text x="353" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">modello</text>

  <!-- frecce verso i tre tool -->
  <g fill="none" stroke="#838383" stroke-width="1.5" marker-end="url(#a)">
    <path d="M320 100 C280 112 200 108 132 120"/>
    <path d="M353 100 L353 120"/>
    <path d="M386 100 C426 112 506 108 574 120"/>
  </g>

  <!-- ===== tool 1 ===== -->
  <g>
    <rect x="12" y="124" width="219" height="166" rx="8" fill="#f6f6f6" stroke="#dee2e6"/>
    <text x="24" y="145" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="12.5"><tspan font-weight="700" fill="#a1245a">name:</tspan> <tspan fill="#161719" font-weight="600">esegui_sql</tspan></text>
    <line x1="22" y1="156" x2="221" y2="156" stroke="#dee2e6"/>
    <text x="24" y="170" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="700" fill="#a1245a">description:</text>
    <rect x="22" y="176" width="199" height="76" rx="4" fill="#ecd3de"/>
    <rect x="22" y="176" width="3" height="76" fill="#a1245a"/>
    <g font-size="11.5" fill="#212529">
      <text x="34" y="192">Esegue una query SQL sul</text>
      <text x="34" y="206">data warehouse vendite e</text>
      <text x="34" y="220">logistica. Lo schema è nel</text>
      <text x="34" y="234">system prompt. Usalo per</text>
      <text x="34" y="248">totali, confronti, andamenti.</text>
    </g>
    <text x="24" y="272" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5"><tspan font-weight="700" fill="#a1245a">input:</tspan> <tspan fill="#212529">query: string</tspan></text>
  </g>
  <!-- miniatura: la stella -->
  <g>
    <g fill="none" stroke="#838383" stroke-width="1.2">
      <line x1="121" y1="326" x2="121" y2="314"/>
      <line x1="102" y1="348" x2="86" y2="356"/>
      <line x1="141" y1="348" x2="157" y2="356"/>
    </g>
    <rect x="95" y="326" width="53" height="22" rx="4" fill="#ecd3de" stroke="#a1245a" stroke-width="1.5"/>
    <text x="121" y="341" text-anchor="middle" font-size="11" font-weight="700" fill="#a1245a">fatto</text>
    <g fill="#ffffff" stroke="#838383" stroke-width="1.2">
      <rect x="99" y="296" width="45" height="18" rx="4"/>
      <rect x="41" y="352" width="45" height="18" rx="4"/>
      <rect x="157" y="352" width="45" height="18" rx="4"/>
    </g>
    <g font-size="11" fill="#495057" text-anchor="middle">
      <text x="121" y="309">dim</text>
      <text x="63" y="365">dim</text>
      <text x="179" y="365">dim</text>
    </g>
  </g>
  <text x="121" y="390" text-anchor="middle" font-size="11.5" fill="#838383">le tabelle (sez. 3)</text>

  <!-- ===== tool 2 ===== -->
  <g>
    <rect x="244" y="124" width="219" height="166" rx="8" fill="#f6f6f6" stroke="#dee2e6"/>
    <text x="256" y="145" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="12.5"><tspan font-weight="700" fill="#a1245a">name:</tspan> <tspan fill="#161719" font-weight="600">cerca_documenti</tspan></text>
    <line x1="254" y1="156" x2="453" y2="156" stroke="#dee2e6"/>
    <text x="256" y="170" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="700" fill="#a1245a">description:</text>
    <rect x="254" y="176" width="199" height="76" rx="4" fill="#ecd3de"/>
    <rect x="254" y="176" width="3" height="76" fill="#a1245a"/>
    <g font-size="11.5" fill="#212529">
      <text x="266" y="206">Cerca nei contratti, nelle</text>
      <text x="266" y="220">policy e nei reclami. Usalo</text>
      <text x="266" y="234">per clausole, regole, casi.</text>
    </g>
    <text x="256" y="272" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5"><tspan font-weight="700" fill="#a1245a">input:</tspan> <tspan fill="#212529">query: string</tspan></text>
    <text x="256" y="285" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#212529">       filtri: {tipo, corriere, anno}</text>
  </g>
  <!-- miniatura: la pila di documenti -->
  <g>
    <g fill="#ffffff" stroke="#838383" stroke-width="1.2">
      <rect x="326" y="300" width="88" height="24" rx="4"/>
      <rect x="318" y="320" width="88" height="24" rx="4"/>
      <rect x="310" y="340" width="88" height="24" rx="4"/>
    </g>
    <g stroke="#dee2e6" stroke-width="2">
      <line x1="318" y1="350" x2="380" y2="350"/>
      <line x1="318" y1="357" x2="366" y2="357"/>
    </g>
  </g>
  <text x="353" y="390" text-anchor="middle" font-size="11.5" fill="#838383">i documenti (sez. 4)</text>

  <!-- ===== tool 3 ===== -->
  <g>
    <rect x="476" y="124" width="219" height="166" rx="8" fill="#f6f6f6" stroke="#dee2e6"/>
    <text x="488" y="145" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="12.5"><tspan font-weight="700" fill="#a1245a">name:</tspan> <tspan fill="#161719" font-weight="600">percorri_grafo</tspan></text>
    <line x1="486" y1="156" x2="685" y2="156" stroke="#dee2e6"/>
    <text x="488" y="170" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="700" fill="#a1245a">description:</text>
    <rect x="486" y="176" width="199" height="76" rx="4" fill="#ecd3de"/>
    <rect x="486" y="176" width="3" height="76" fill="#a1245a"/>
    <g font-size="11.5" fill="#212529">
      <text x="498" y="206">Trova come sono collegati</text>
      <text x="498" y="220">clienti, ordini, corrieri e</text>
      <text x="498" y="234">contratti.</text>
    </g>
    <text x="488" y="272" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5"><tspan font-weight="700" fill="#a1245a">input:</tspan> <tspan fill="#212529">pattern: string</tspan></text>
  </g>
  <!-- miniatura: il grafo -->
  <g>
    <g stroke="#838383" stroke-width="1.2">
      <line x1="556" y1="306" x2="612" y2="300"/>
      <line x1="556" y1="306" x2="585" y2="340"/>
      <line x1="612" y1="300" x2="585" y2="340"/>
      <line x1="585" y1="340" x2="549" y2="356"/>
      <line x1="585" y1="340" x2="621" y2="352"/>
    </g>
    <g fill="#ffffff" stroke="#838383" stroke-width="1.5">
      <circle cx="556" cy="306" r="9"/>
      <circle cx="612" cy="300" r="9"/>
      <circle cx="549" cy="356" r="9"/>
      <circle cx="621" cy="352" r="9"/>
    </g>
    <circle cx="585" cy="340" r="10" fill="#ecd3de" stroke="#a1245a" stroke-width="1.8"/>
  </g>
  <text x="585" y="390" text-anchor="middle" font-size="11.5" fill="#838383">i grafi (sez. 5)</text>
</svg>
