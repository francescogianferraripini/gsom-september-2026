<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 420" width="650" height="420" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>L'ontologia a due livelli: l'ontologia cross e i domini logistica e amministrazione, con le definizioni delle classi e le tre mappature della classe Corriere</title>

  <defs>
    <marker id="o-gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#838383"/>
    </marker>
    <marker id="o-bu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a1245a"/>
    </marker>
  </defs>

  <!-- ==================== ontologia cross ==================== -->
  <g id="cross">
    <rect x="8" y="14" width="634" height="76" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1.5"/>
    <text x="20" y="32" font-size="11" font-weight="700" fill="#838383">ontologia cross</text>

    <g fill="#ffffff" stroke="#161719" stroke-width="1.5">
      <ellipse cx="110" cy="62" rx="52" ry="15"/>
      <ellipse cx="260" cy="62" rx="52" ry="15"/>
      <ellipse cx="410" cy="62" rx="52" ry="15"/>
      <ellipse cx="560" cy="62" rx="52" ry="15"/>
    </g>
    <g font-size="12.5" font-weight="600" fill="#161719" text-anchor="middle">
      <text x="110" y="67">Fornitore</text>
      <text x="260" y="67">Cliente</text>
      <text x="410" y="67">Ordine</text>
      <text x="560" y="67">Prodotto</text>
    </g>

    <g stroke="#838383" stroke-width="1.5" marker-end="url(#o-gr)">
      <line x1="314" y1="62" x2="354" y2="62"/>
      <line x1="464" y1="62" x2="504" y2="62"/>
    </g>
    <g font-size="11" fill="#212529" text-anchor="middle">
      <text x="335" y="54">ordina</text>
      <text x="485" y="54">contiene</text>
    </g>
  </g>

  <!-- ==================== dominio logistica ==================== -->
  <g id="logistica">
    <rect x="8" y="112" width="430" height="184" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1.5"/>
    <text x="34" y="130" font-size="11" font-weight="700" fill="#838383">dominio logistica</text>

    <!-- proprietà di Spedizione -->
    <rect x="62" y="140" width="104" height="54" rx="6" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/>
    <g font-size="11" fill="#212529">
      <text x="72" y="158">data prevista</text>
      <text x="72" y="172">data consegna</text>
      <text x="72" y="186">importo</text>
    </g>
    <line x1="166" y1="164" x2="176" y2="163" stroke="#838383" stroke-width="1"/>

    <!-- classi -->
    <ellipse cx="230" cy="162" rx="54" ry="17" fill="#ffffff" stroke="#161719" stroke-width="1.5"/>
    <text x="230" y="167" text-anchor="middle" font-size="12.5" font-weight="600" fill="#161719">Spedizione</text>

    <ellipse cx="352" cy="162" rx="42" ry="17" fill="#ffffff" stroke="#161719" stroke-width="1.5"/>
    <text x="352" y="167" text-anchor="middle" font-size="12.5" font-weight="600" fill="#161719">Ritardo</text>

    <ellipse cx="352" cy="232" rx="42" ry="17" fill="#ffffff" stroke="#161719" stroke-width="1.5"/>
    <text x="352" y="237" text-anchor="middle" font-size="12.5" font-weight="600" fill="#161719">Penale</text>

    <ellipse cx="230" cy="250" rx="48" ry="17" fill="#ffffff" stroke="#161719" stroke-width="1.5"/>
    <text x="230" y="255" text-anchor="middle" font-size="12.5" font-weight="600" fill="#161719">Contratto</text>

    <!-- Corriere: classe focale -->
    <ellipse cx="88" cy="250" rx="46" ry="17" fill="#ecd3de" stroke="#a1245a" stroke-width="2.5"/>
    <text x="88" y="255" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a1245a">Corriere</text>

    <!-- relazioni interne -->
    <line x1="286" y1="162" x2="306" y2="162" stroke="#838383" stroke-width="1.5" marker-end="url(#o-gr)"/>
    <text x="296" y="154" text-anchor="middle" font-size="11" fill="#212529">ha</text>

    <line x1="352" y1="181" x2="352" y2="211" stroke="#838383" stroke-width="1.5" marker-end="url(#o-gr)"/>
    <text x="360" y="200" font-size="11" fill="#212529">attiva</text>

    <line x1="182" y1="250" x2="138" y2="250" stroke="#838383" stroke-width="1.5" marker-end="url(#o-gr)"/>
    <text x="160" y="242" text-anchor="middle" font-size="11" fill="#212529">vincola</text>

    <path d="M230 179 L230 204 L88 204 L88 231" fill="none" stroke="#838383" stroke-width="1.5" marker-end="url(#o-gr)"/>
    <text x="150" y="218" text-anchor="middle" font-size="11" fill="#212529">consegnata da</text>
  </g>

  <!-- ==================== dominio amministrazione ==================== -->
  <g id="amministrazione">
    <rect x="450" y="112" width="192" height="110" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1.5"/>
    <text x="462" y="130" font-size="11" font-weight="700" fill="#838383">dominio amministrazione</text>

    <ellipse cx="546" cy="158" rx="42" ry="15" fill="#ffffff" stroke="#161719" stroke-width="1.5"/>
    <text x="546" y="163" text-anchor="middle" font-size="12.5" font-weight="600" fill="#161719">Fattura</text>

    <ellipse cx="546" cy="198" rx="54" ry="15" fill="#ffffff" stroke="#161719" stroke-width="1.5"/>
    <text x="546" y="203" text-anchor="middle" font-size="12.5" font-weight="600" fill="#161719">Nota di credito</text>
  </g>

  <!-- ==================== archi fra livelli e fra domini ==================== -->
  <g id="archi" fill="none" stroke="#a1245a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#o-bu)">
    <path d="M42 246 C 12 236, 12 128, 76 82"/>
    <path d="M268 148 C 300 130, 340 100, 398 80"/>
    <path d="M396 228 C 440 222, 474 202, 514 176"/>
  </g>
  <g font-size="11" font-weight="600" fill="#a1245a">
    <text x="52" y="106">⊂ è un</text>
    <text x="348" y="104" text-anchor="middle">di</text>
    <text x="416" y="240" text-anchor="middle">riduce</text>
  </g>

  <!-- ==================== definizioni ==================== -->
  <g id="def-corriere">
    <rect x="450" y="232" width="192" height="104" rx="8" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/>
    <rect x="450" y="232" width="3" height="104" fill="#a1245a"/>
    <text x="462" y="250" font-size="12.5" font-weight="700" fill="#a1245a">Corriere</text>
    <text x="630" y="250" text-anchor="end" font-size="11" fill="#838383">owner: acquisti</text>
    <g font-size="11" font-style="italic" fill="#212529">
      <text x="462" y="270">«azienda che effettua la</text>
      <text x="462" y="284">consegna di una spedizione</text>
      <text x="462" y="298">per conto di Acme»</text>
    </g>
    <text x="462" y="316" font-size="11" font-weight="700" fill="#838383">sinonimi</text>
    <text x="462" y="330" font-size="11" fill="#212529">vettore, trasportatore</text>
  </g>

  <g id="def-ritardo">
    <rect x="450" y="344" width="192" height="74" rx="8" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/>
    <rect x="450" y="344" width="3" height="74" fill="#a1245a"/>
    <text x="462" y="362" font-size="12.5" font-weight="700" fill="#a1245a">Ritardo</text>
    <text x="630" y="362" text-anchor="end" font-size="11" fill="#838383">owner: logistica</text>
    <g font-size="11" font-style="italic" fill="#212529">
      <text x="462" y="382">«giorni lavorativi fra data</text>
      <text x="462" y="396">prevista e consegna, festivi</text>
      <text x="462" y="410">esclusi»</text>
    </g>
  </g>

  <!-- ==================== le tre mappature di Corriere ==================== -->
  <g id="mappature">
    <g fill="none" stroke="#a1245a" stroke-width="2.5" marker-end="url(#o-bu)">
      <path d="M84 268 C 80 300, 78 318, 78 330"/>
      <path d="M100 266 C 150 300, 190 330, 208 348"/>
      <path d="M110 262 C 220 290, 300 310, 344 330"/>
    </g>

    <!-- tabella -->
    <g id="mini-tabella">
      <rect x="14" y="336" width="128" height="58" rx="6" fill="#ffffff" stroke="#161719" stroke-width="1.2"/>
      <path d="M14 356 L14 342 A6 6 0 0 1 20 336 L136 336 A6 6 0 0 1 142 342 L142 356 Z" fill="#f6f6f6"/>
      <line x1="14" y1="356" x2="142" y2="356" stroke="#dee2e6" stroke-width="1"/>
      <line x1="14" y1="375" x2="142" y2="375" stroke="#dee2e6" stroke-width="1"/>
      <text x="24" y="350" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="700" fill="#161719">dim_corriere</text>
      <text x="24" y="369" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" fill="#212529">id_corriere</text>
      <text x="134" y="369" text-anchor="end" font-size="11" font-weight="700" fill="#a1245a">PK</text>
      <text x="24" y="388" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" fill="#212529">nome</text>
      <text x="78" y="410" text-anchor="middle" font-size="11" font-style="italic" fill="#838383">tabella</text>
    </g>

    <!-- nodo -->
    <g id="mini-nodo">
      <ellipse cx="250" cy="364" rx="60" ry="22" fill="#ffffff" stroke="#161719" stroke-width="1.5"/>
      <text x="250" y="369" text-anchor="middle" font-size="12.5" font-weight="600" fill="#161719">Corriere #17</text>
      <text x="250" y="410" text-anchor="middle" font-size="11" font-style="italic" fill="#838383">nodo del grafo</text>
    </g>

    <!-- entità nel documento -->
    <g id="mini-doc">
      <rect x="340" y="336" width="98" height="58" rx="4" fill="#ffffff" stroke="#161719" stroke-width="1.2"/>
      <g stroke="#dee2e6" stroke-width="1.5">
        <line x1="350" y1="346" x2="428" y2="346"/>
        <line x1="350" y1="380" x2="424" y2="380"/>
        <line x1="350" y1="388" x2="404" y2="388"/>
      </g>
      <rect x="350" y="354" width="72" height="18" rx="4" fill="#ecd3de"/>
      <text x="386" y="367" text-anchor="middle" font-size="11" font-weight="600" fill="#a1245a">il Vettore</text>
      <text x="389" y="410" text-anchor="middle" font-size="11" font-style="italic" fill="#838383">entità nel contratto</text>
    </g>
  </g>
</svg>
