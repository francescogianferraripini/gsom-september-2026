<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 764 400" width="764" height="400" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Community detection: il grafo delle entità si divide in tre comunità, un modello scrive un rapporto per ciascuna, e la domanda globale viene mappata sui tre rapporti e ridotta a un istogramma motivo per corriere</title>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#838383"/></marker>
  </defs>

  <!-- ============ le comunità nel grafo delle entità ============ -->
  <g id="comunita">
    <rect x="4" y="142" width="234" height="222" rx="16" fill="none" stroke="#838383" stroke-width="1.2" stroke-dasharray="6 4"/>
    <text x="4" y="380" font-size="11.5" font-weight="600" fill="#838383">livello 1</text>

    <rect x="10" y="32" width="222" height="100" rx="24" fill="#ecd3de" stroke="#a1245a" stroke-width="1.5"/>
    <text x="14" y="26" font-size="11.5" font-weight="700" fill="#a1245a">comunità A</text>
    <g stroke="#a1245a" stroke-width="1" fill="none" opacity="0.75">
      <path d="M34 60 L120 52 L176 68 M34 60 L96 84 L140 110 M44 106 L96 84 M140 110 L200 106 M176 68 L200 106 M120 52 L96 84"/>
    </g>
    <g fill="#a1245a">
      <circle cx="34" cy="60" r="5"/><circle cx="120" cy="52" r="5"/><circle cx="176" cy="68" r="5"/>
      <circle cx="44" cy="106" r="5"/><circle cx="96" cy="84" r="4"/><circle cx="140" cy="110" r="4"/><circle cx="200" cy="106" r="4"/>
    </g>
    <g font-size="11.5" font-weight="600" fill="#161719">
      <text x="43" y="64">SpedFast</text>
      <text x="129" y="56">ritardi</text>
      <text x="185" y="72">penale</text>
      <text x="53" y="110">Lombardia</text>
    </g>

    <rect x="10" y="150" width="222" height="94" rx="24" fill="#d1efea" stroke="#1ab197" stroke-width="1.5"/>
    <text x="18" y="169" font-size="11.5" font-weight="700" fill="#1ab197">comunità B</text>
    <g stroke="#1ab197" stroke-width="1" fill="none" opacity="0.75">
      <path d="M36 196 L120 186 L186 206 M36 196 L70 224 L146 228 M120 186 L146 228 L186 206"/>
    </g>
    <g fill="#1ab197">
      <circle cx="36" cy="196" r="5"/><circle cx="120" cy="186" r="5"/><circle cx="186" cy="206" r="5"/>
      <circle cx="70" cy="224" r="4"/><circle cx="146" cy="228" r="4"/>
    </g>
    <g font-size="11.5" font-weight="600" fill="#161719">
      <text x="45" y="200">PostaPro</text>
      <text x="129" y="190">danni</text>
      <text x="195" y="210">resi</text>
    </g>

    <rect x="10" y="262" width="222" height="94" rx="24" fill="#dcecf7" stroke="#4da0d7" stroke-width="1.5"/>
    <text x="18" y="281" font-size="11.5" font-weight="700" fill="#4da0d7">comunità C</text>
    <g stroke="#4da0d7" stroke-width="1" fill="none" opacity="0.75">
      <path d="M40 308 L150 300 L196 318 M40 308 L60 340 L120 336 L196 318 M150 300 L210 292"/>
    </g>
    <g fill="#4da0d7">
      <circle cx="40" cy="308" r="5"/><circle cx="150" cy="300" r="5"/><circle cx="60" cy="340" r="5"/>
      <circle cx="196" cy="318" r="4"/><circle cx="120" cy="336" r="4"/><circle cx="210" cy="292" r="4"/>
    </g>
    <g font-size="11.5" font-weight="600" fill="#161719">
      <text x="49" y="312">Corriere Nord</text>
      <text x="159" y="304">resi</text>
      <text x="69" y="344">buoni</text>
    </g>
  </g>

  <!-- ============ il modello che scrive i rapporti ============ -->
  <g id="modello">
    <g fill="none" stroke="#838383" stroke-width="1.5" marker-end="url(#a1)">
      <path d="M232 72 C 252 72, 256 30, 294 30"/>
      <path d="M232 190 C 252 190, 256 34, 294 34"/>
      <path d="M232 300 C 252 300, 256 38, 294 38"/>
    </g>
    <rect x="300" y="14" width="170" height="40" rx="8" fill="#a1245a"/>
    <text x="313" y="31" font-size="11.5" font-weight="700" fill="#ffffff">modello:</text>
    <text x="313" y="46" font-size="12" font-weight="500" fill="#ffffff">scrivi il rapporto</text>
    <path d="M385 54 L385 60 L286 60 L286 333" fill="none" stroke="#838383" stroke-width="1.5"/>
    <g fill="none" stroke="#838383" stroke-width="1.5" marker-end="url(#a1)">
      <line x1="286" y1="113" x2="296" y2="113"/>
      <line x1="286" y1="223" x2="296" y2="223"/>
      <line x1="286" y1="333" x2="296" y2="333"/>
    </g>
  </g>

  <!-- ============ i tre rapporti ============ -->
  <g id="rapporti">
    <g fill="#ffffff" stroke="#dee2e6" stroke-width="1.2">
      <rect x="300" y="66" width="170" height="94" rx="8"/>
      <rect x="300" y="176" width="170" height="94" rx="8"/>
      <rect x="300" y="286" width="170" height="94" rx="8"/>
    </g>
    <rect x="301" y="74" width="3" height="78" fill="#a1245a"/>
    <rect x="301" y="184" width="3" height="78" fill="#1ab197"/>
    <rect x="301" y="294" width="3" height="78" fill="#4da0d7"/>
    <g font-size="12.5" font-weight="700" fill="#161719">
      <text x="313" y="90">rapporto A</text>
      <text x="313" y="200">rapporto B</text>
      <text x="313" y="310">rapporto C</text>
    </g>
    <g font-size="11.5" fill="#212529">
      <text x="313" y="110">SpedFast</text>
      <text x="313" y="127">61% dei reclami: ritardi</text>
      <text x="313" y="144">penale 2% · Lombardia</text>
      <text x="313" y="220">PostaPro</text>
      <text x="313" y="237">pacchi danneggiati</text>
      <text x="313" y="254">resi</text>
      <text x="313" y="330">Corriere Nord</text>
      <text x="313" y="347">resi</text>
      <text x="313" y="364">buoni del 10%</text>
    </g>
  </g>

  <!-- ============ la domanda globale: map ============ -->
  <g id="domanda">
    <rect x="506" y="14" width="250" height="46" rx="8" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1.2"/>
    <g font-size="11.5" font-weight="600" fill="#161719">
      <text x="518" y="32">di che cosa si lamentano</text>
      <text x="518" y="49">di più i clienti?</text>
    </g>
    <g fill="none" stroke="#838383" stroke-width="1.5" marker-end="url(#a1)">
      <path d="M506 28 C 486 28, 480 88, 474 111"/>
      <path d="M506 38 C 484 60, 478 180, 474 221"/>
      <path d="M506 48 C 482 84, 476 280, 474 331"/>
    </g>
    <text x="500" y="72" font-size="11.5" font-weight="700" fill="#838383" text-anchor="end" paint-order="stroke" stroke="#ffffff" stroke-width="4">map</text>
  </g>

  <!-- ============ le tre risposte parziali, e il reduce ============ -->
  <g id="risposte">
    <g fill="#ffffff" stroke="#dee2e6" stroke-width="1.2">
      <rect x="506" y="80" width="250" height="30" rx="8"/>
      <rect x="506" y="116" width="250" height="30" rx="8"/>
      <rect x="506" y="152" width="250" height="30" rx="8"/>
    </g>
    <rect x="507" y="86" width="3" height="18" fill="#a1245a"/>
    <rect x="507" y="122" width="3" height="18" fill="#1ab197"/>
    <rect x="507" y="158" width="3" height="18" fill="#4da0d7"/>
    <g font-size="11.5" fill="#212529">
      <text x="519" y="99">A: ritardi, 61% dei reclami</text>
      <text x="519" y="135">B: pacchi danneggiati</text>
      <text x="519" y="171">C: resi, e i buoni del 10%</text>
    </g>
    <line x1="631" y1="182" x2="631" y2="194" stroke="#838383" stroke-width="1.5" marker-end="url(#a1)"/>
    <rect x="506" y="198" width="250" height="34" rx="8" fill="#161719"/>
    <rect x="509" y="204" width="3" height="22" fill="#ffbe0b"/>
    <text x="520" y="219" font-size="11.5" font-weight="600" fill="#ffffff"><tspan fill="#ffbe0b" font-weight="700">reduce:</tspan> fonde le tre risposte</text>
    <line x1="631" y1="232" x2="631" y2="244" stroke="#838383" stroke-width="1.5" marker-end="url(#a1)"/>
  </g>

  <!-- ============ l'istogramma motivo x corriere, ora pieno ============ -->
  <g id="istogramma">
    <text x="506" y="262" font-size="11.5" font-weight="700" fill="#161719">motivo × corriere</text>
    <line x1="508" y1="352" x2="748" y2="352" stroke="#dee2e6" stroke-width="1.2"/>
    <g>
      <rect x="512" y="276" width="18" height="76" fill="#a1245a"/>
      <rect x="532" y="318" width="18" height="34" fill="#1ab197"/>
      <rect x="552" y="330" width="18" height="22" fill="#4da0d7"/>
      <rect x="596" y="334" width="18" height="18" fill="#a1245a"/>
      <rect x="616" y="326" width="18" height="26" fill="#1ab197"/>
      <rect x="636" y="294" width="18" height="58" fill="#4da0d7"/>
      <rect x="680" y="338" width="18" height="14" fill="#a1245a"/>
      <rect x="700" y="308" width="18" height="44" fill="#1ab197"/>
      <rect x="720" y="332" width="18" height="20" fill="#4da0d7"/>
    </g>
    <g font-size="11.5" fill="#212529" text-anchor="middle">
      <text x="541" y="366">ritardi</text>
      <text x="625" y="366">danni</text>
      <text x="709" y="366">mancanti</text>
    </g>
    <g font-size="11" fill="#212529">
      <rect x="512" y="378" width="9" height="9" fill="#a1245a"/>
      <text x="525" y="386">SpedFast</text>
      <rect x="584" y="378" width="9" height="9" fill="#1ab197"/>
      <text x="597" y="386">Corriere Nord</text>
      <rect x="674" y="378" width="9" height="9" fill="#4da0d7"/>
      <text x="687" y="386">PostaPro</text>
    </g>
  </g>
</svg>
