<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 400" width="650" height="400" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Il limite della search: a sinistra la domanda sui motivi dei reclami e l'indice che restituisce cinque chunk sparsi su quattromila; a destra, tratteggiato, l'istogramma motivo per corriere che sarebbe la risposta e che nessun chunk contiene; in mezzo una freccia barrata</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#161719"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#838383"/></marker>
  </defs>

  <!-- ===== a sinistra: la domanda e i cinque chunk ===== -->
  <text x="12" y="14" font-size="11" font-weight="700" letter-spacing="1" fill="#838383">LA DOMANDA</text>
  <rect x="12" y="20" width="250" height="56" rx="8" fill="#f6f6f6" stroke="#dee2e6"/>
  <g font-size="11.5" fill="#212529">
    <text x="24" y="44">di che cosa si lamentano di più</text>
    <text x="24" y="60">i clienti, e con quali corrieri?</text>
  </g>
  <line x1="137" y1="78" x2="137" y2="94" stroke="#161719" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="62" y="98" width="150" height="32" rx="8" fill="#ffffff" stroke="#161719" stroke-width="1.2"/>
  <text x="137" y="118" text-anchor="middle" font-size="12" font-weight="600" fill="#161719">indice (sez. 4)</text>
  <line x1="137" y1="132" x2="137" y2="146" stroke="#161719" stroke-width="1.5" marker-end="url(#a)"/>

  <g>
    <rect x="12" y="150" width="250" height="26" rx="6" fill="#f6f6f6" stroke="#dee2e6"/>
    <rect x="12" y="182" width="250" height="26" rx="6" fill="#f6f6f6" stroke="#dee2e6"/>
    <rect x="12" y="214" width="250" height="26" rx="6" fill="#f6f6f6" stroke="#dee2e6"/>
    <rect x="12" y="246" width="250" height="26" rx="6" fill="#f6f6f6" stroke="#dee2e6"/>
    <rect x="12" y="278" width="250" height="26" rx="6" fill="#f6f6f6" stroke="#dee2e6"/>
    <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#212529">
      <text x="24" y="167">#88 ritardo</text>
      <text x="24" y="199">#412 pacco danneggiato</text>
      <text x="24" y="231">#903 ritardo</text>
      <text x="24" y="263">#1201 mancante</text>
      <text x="24" y="295">#77 ritardo</text>
    </g>
  </g>
  <g font-size="12" font-weight="600" fill="#838383">
    <text x="12" y="326">cinque su quattromila:</text>
    <text x="12" y="342">non è una risposta</text>
  </g>

  <!-- ===== in mezzo: la freccia barrata ===== -->
  <g font-size="11.5" font-weight="600" fill="#a1245a" text-anchor="middle">
    <text x="308" y="168">la search</text>
    <text x="308" y="182">non ci arriva</text>
  </g>
  <line x1="272" y1="200" x2="344" y2="200" stroke="#838383" stroke-width="2" marker-end="url(#ag)"/>
  <g stroke="#a1245a" stroke-width="2.5" stroke-linecap="round">
    <line x1="302" y1="210" x2="312" y2="190"/>
    <line x1="312" y1="210" x2="322" y2="190"/>
  </g>

  <!-- ===== a destra: l'istogramma, elemento focale ===== -->
  <rect x="352" y="16" width="286" height="344" rx="8" fill="none" stroke="#a1245a" stroke-width="1.5" stroke-dasharray="7 5"/>

  <g>
    <rect x="368" y="30" width="12" height="12" rx="2" fill="#ecd3de" stroke="#a1245a" stroke-dasharray="3 2"/>
    <text x="386" y="40" font-size="11" fill="#495057">SpedFast</text>
    <rect x="452" y="30" width="12" height="12" rx="2" fill="#d1efea" stroke="#1ab197" stroke-dasharray="3 2"/>
    <text x="470" y="40" font-size="11" fill="#495057">Corriere Nord</text>
    <rect x="556" y="30" width="12" height="12" rx="2" fill="#dbecf7" stroke="#4da0d7" stroke-dasharray="3 2"/>
    <text x="574" y="40" font-size="11" fill="#495057">PostaPro</text>
  </g>

  <g stroke="#eef0f2" stroke-width="1">
    <line x1="370" y1="235" x2="630" y2="235"/>
    <line x1="370" y1="180" x2="630" y2="180"/>
    <line x1="370" y1="125" x2="630" y2="125"/>
    <line x1="370" y1="70" x2="630" y2="70"/>
  </g>
  <g stroke="#dee2e6" stroke-width="1.4">
    <line x1="370" y1="290" x2="630" y2="290"/>
    <line x1="370" y1="290" x2="370" y2="62"/>
  </g>

  <g opacity="0.55" stroke-dasharray="5 4" stroke-width="1.5">
    <rect x="386" y="110" width="18" height="180" fill="#ecd3de" stroke="#a1245a"/>
    <rect x="408" y="220" width="18" height="70" fill="#d1efea" stroke="#1ab197"/>
    <rect x="430" y="240" width="18" height="50" fill="#dbecf7" stroke="#4da0d7"/>

    <rect x="476" y="250" width="18" height="40" fill="#ecd3de" stroke="#a1245a"/>
    <rect x="498" y="235" width="18" height="55" fill="#d1efea" stroke="#1ab197"/>
    <rect x="520" y="170" width="18" height="120" fill="#dbecf7" stroke="#4da0d7"/>

    <rect x="566" y="260" width="18" height="30" fill="#ecd3de" stroke="#a1245a"/>
    <rect x="588" y="200" width="18" height="90" fill="#d1efea" stroke="#1ab197"/>
    <rect x="610" y="245" width="18" height="45" fill="#dbecf7" stroke="#4da0d7"/>
  </g>

  <g font-size="12" font-weight="600" fill="#838383" text-anchor="middle">
    <text x="417" y="307">ritardi</text>
    <text x="507" y="307">danni</text>
    <text x="597" y="307">mancanti</text>
  </g>

  <text x="495" y="336" text-anchor="middle" font-size="12.5" font-weight="600" fill="#a1245a">la risposta: nessun chunk la contiene</text>
  <text x="495" y="352" text-anchor="middle" font-size="11.5" fill="#838383">una distribuzione sui quattromila</text>
</svg>
