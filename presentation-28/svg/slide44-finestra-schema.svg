<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 566" width="470" height="566" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>La finestra a strati al giro zero del Text2SQL: nel system prompt, sotto il ruolo e le regole, la fascia dello schema del data warehouse con DDL, descrizioni e grano; nello strato dei tool la riga esegui_sql evidenziata; gli altri strati attenuati</title>

  <text x="12" y="24" font-size="19" font-weight="600" fill="#161719">la finestra al giro zero</text>
  <text x="366" y="24" text-anchor="middle" font-size="17" font-weight="600" fill="#838383">token</text>

  <rect x="12" y="40" width="300" height="468" rx="8" fill="#ffffff" stroke="#161719" stroke-width="1.5"/>
  <rect x="328" y="40" width="76" height="468" rx="8" fill="none" stroke="#838383" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- strato 1: system prompt, diviso in due fasce -->
  <rect x="24" y="52" width="276" height="96" rx="6" fill="#ffffff" stroke="#dee2e6"/>
  <rect x="28" y="56" width="268" height="22" rx="5" fill="#f6f6f6" stroke="#dee2e6"/>
  <text x="38" y="71" font-size="13" font-weight="600" fill="#838383">system prompt: ruolo e regole</text>

  <!-- la fascia dello schema: elemento focale -->
  <rect x="28" y="82" width="268" height="64" rx="5" fill="#d1efea" stroke="#1ab197" stroke-width="2.5"/>
  <text x="38" y="98" font-size="13" font-weight="700" fill="#0e7c6a">schema del data warehouse:</text>
  <text x="38" y="112" font-size="12" font-weight="600" fill="#0e7c6a">DDL + descrizioni + grano</text>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" fill="#161719">
    <text x="38" y="127">CREATE TABLE fatto_spedizioni …</text>
    <text x="38" y="140">-- una riga = una spedizione</text>
  </g>

  <!-- strato 2: dichiarazione dei tool, attenuato, con esegui_sql in evidenza -->
  <rect x="24" y="160" width="276" height="96" rx="6" fill="#f6f6f6" stroke="#dee2e6"/>
  <text x="36" y="182" font-size="17" font-weight="600" fill="#838383">dichiarazione dei tool</text>
  <rect x="34" y="192" width="256" height="22" rx="4" fill="#ecd3de" stroke="#a1245a" stroke-width="1.5"/>
  <text x="42" y="207" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="700" fill="#a1245a">esegui_sql(query)</text>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="12.5" fill="#adb5bd">
    <text x="42" y="230">cerca_documenti(query, filtri)</text>
    <text x="42" y="248">percorri_grafo(pattern)</text>
  </g>

  <!-- strato 3: indice delle skill, attenuato -->
  <rect x="24" y="268" width="276" height="96" rx="6" fill="#f6f6f6" stroke="#dee2e6"/>
  <text x="36" y="294" font-size="17" font-weight="600" fill="#838383">indice delle skill</text>
  <text x="162" y="322" text-anchor="middle" font-size="15" font-style="italic" fill="#adb5bd">nessuna, in questo giro</text>

  <!-- strato 4: messaggi, attenuato -->
  <rect x="24" y="376" width="276" height="120" rx="6" fill="#f6f6f6" stroke="#dee2e6"/>
  <text x="36" y="402" font-size="17" font-weight="600" fill="#838383">messaggi</text>
  <text x="162" y="446" text-anchor="middle" font-size="15" font-style="italic" fill="#adb5bd">la domanda dell'utente</text>

  <text x="12" y="542" font-size="17" font-weight="500" fill="#838383">→ chiamata n. 1: la finestra + la domanda</text>
</svg>
