<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1302 848" width="1302" height="848" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>La formula dell'agente, completa: Agent uguale LLM piu Harness piu System Prompt piu Tools piu KB piu Skills, tutti e sei i blocchi accesi, con le tre graffe la CPU, il sistema operativo, il software installato. Sopra la fila, due callout affiancate: da Harness la mappa dell'harness dell'incontro 27 in miniatura, da KB lo spettro dell'incontro 28 con la banda dell'ontologia accesa. Sotto la fila, una riga di sintesi per ciascun blocco</title>

  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#838383"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#a1245a"/>
    </marker>
  </defs>

  <!-- La geometria della fila e delle graffe e' quella della slide 3 del 26 e della
       62 del 27, traslata di (0 420): il canvas cresce sopra (le due callout) e
       sotto (la fascia delle sintesi). Nulla della formula si e' mosso. -->

  <!-- ===== Callout 1: l'harness, aperto nel 27 ===== -->
  <rect x="251" y="12" width="440" height="380" rx="10" fill="#ffffff" stroke="#a1245a" stroke-width="2"/>
  <g id="mappa-harness" transform="translate(263 110) scale(0.2827)" fill="none" stroke="#a1245a" stroke-width="7">
    <rect x="12" y="12" width="470" height="500" rx="8" fill="#ffffff"/>
    <rect x="24" y="68" width="446" height="218" rx="8"/>
    <rect x="24" y="298" width="446" height="56" rx="8"/>
    <rect x="24" y="366" width="446" height="48" rx="8"/>
    <rect x="24" y="426" width="446" height="74" rx="8"/>
    <rect x="494" y="12" width="512" height="500" rx="8" fill="#ffffff"/>
    <rect x="506" y="72" width="488" height="424" rx="16"/>
    <rect x="532" y="114" width="436" height="340" rx="14"/>
    <rect x="558" y="156" width="384" height="256" rx="12"/>
    <rect x="596" y="200" width="308" height="170" rx="8" fill="#ecd3de"/>
    <rect x="1018" y="12" width="470" height="500" rx="8" fill="#ffffff"/>
    <rect x="1030" y="68" width="446" height="136" rx="8"/>
    <rect x="1030" y="216" width="446" height="136" rx="8"/>
    <rect x="1030" y="364" width="446" height="136" rx="8"/>
    <rect x="12" y="524" width="1476" height="64" rx="8" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#838383">
    <text x="333" y="304">context initialization</text>
    <text x="475" y="304">loop agentico</text>
    <text x="617" y="304">environment</text>
  </g>
  <text x="471" y="362" text-anchor="middle" font-size="13" font-weight="600" fill="#a1245a">l'harness (27)</text>

  <!-- ===== Callout 2: la KB, aperta oggi ===== -->
  <rect x="809" y="12" width="440" height="380" rx="10" fill="#ffffff" stroke="#a1245a" stroke-width="2"/>
  <g id="spettro-mini">
    <text x="821" y="42" font-size="12" font-weight="600" fill="#a1245a">Ontologia: il significato, sopra tutto</text>
    <rect x="821" y="50" width="416" height="60" rx="6" fill="#ecd3de" stroke="#a1245a" stroke-width="2.5"/>
    <g fill="none" stroke="#a1245a" stroke-width="1.5" marker-end="url(#ab)">
      <path d="M941 80 H983"/>
      <path d="M1075 80 H1117"/>
    </g>
    <g fill="#ffffff" stroke="#a1245a" stroke-width="1.5">
      <ellipse cx="895" cy="80" rx="46" ry="18"/>
      <ellipse cx="1029" cy="80" rx="46" ry="18"/>
      <ellipse cx="1163" cy="80" rx="46" ry="18"/>
    </g>
    <g text-anchor="middle" font-size="12" font-weight="600" fill="#161719">
      <text x="895" y="84">Cliente</text>
      <text x="1029" y="84">Spedizione</text>
      <text x="1163" y="84">Corriere</text>
    </g>

    <g fill="#ecd3de" stroke="#a1245a" stroke-width="2.5">
      <rect x="821" y="140" width="128" height="56" rx="6"/>
      <rect x="965" y="140" width="128" height="56" rx="6"/>
      <rect x="1109" y="140" width="128" height="56" rx="6"/>
    </g>
    <g text-anchor="middle" font-size="13" font-weight="700" fill="#a1245a">
      <text x="885" y="173">tabella</text>
      <text x="1029" y="173">grafo</text>
      <text x="1173" y="173">documento</text>
    </g>

    <text x="825" y="220" font-size="12" font-weight="600" fill="#838383">strutturato</text>
    <text x="1233" y="220" text-anchor="end" font-size="12" font-weight="600" fill="#838383">non strutturato</text>
    <path d="M825 232 H1233" fill="none" stroke="#838383" stroke-width="2" marker-start="url(#ag)" marker-end="url(#ag)"/>

    <g text-anchor="middle" font-size="12" font-weight="600" fill="#161719">
      <text x="885" y="264">si interroga</text>
      <text x="1029" y="264">si percorre</text>
      <text x="1173" y="264">si cerca</text>
    </g>

    <g fill="#f6f6f6" stroke="#dee2e6" stroke-width="1">
      <rect x="821" y="288" width="128" height="38" rx="6"/>
      <rect x="965" y="288" width="128" height="38" rx="6"/>
      <rect x="1109" y="288" width="128" height="38" rx="6"/>
    </g>
    <g text-anchor="middle" font-size="12" font-weight="700" fill="#161719">
      <text x="885" y="312">Text2SQL</text>
      <text x="1029" y="312">GraphRAG</text>
      <text x="1173" y="312">RAG · search</text>
    </g>
  </g>
  <text x="1029" y="362" text-anchor="middle" font-size="13" font-weight="600" fill="#a1245a">la KB (28)</text>

  <!-- ===== I due raccordi ===== -->
  <g id="raccordi">
    <path d="M441 389 L451 434 L491 434 L501 389 Z" fill="#ffffff"/>
    <path d="M441 391 L451 434" fill="none" stroke="#a1245a" stroke-width="2"/>
    <path d="M501 391 L491 434" fill="none" stroke="#a1245a" stroke-width="2"/>
    <path d="M999 389 L1009 434 L1049 434 L1059 389 Z" fill="#ffffff"/>
    <path d="M999 391 L1009 434" fill="none" stroke="#a1245a" stroke-width="2"/>
    <path d="M1059 391 L1049 434" fill="none" stroke="#a1245a" stroke-width="2"/>
  </g>

  <!-- ===== La formula: tutti e sei accesi ===== -->
  <g id="formula" transform="translate(0 420)">

    <g id="agent">
      <rect x="12" y="57" width="130" height="130" rx="8" fill="#161719"/>
      <text x="77" y="134" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff">Agent</text>
    </g>
    <text x="176" y="134" text-anchor="middle" font-size="36" font-weight="500" fill="#838383">=</text>
    <g id="operatori" font-size="28" font-weight="500" fill="#838383" text-anchor="middle">
      <text x="378" y="132">+</text>
      <text x="564" y="132">+</text>
      <text x="750" y="132">+</text>
      <text x="936" y="132">+</text>
      <text x="1122" y="132">+</text>
    </g>

    <g id="blocchi">
      <g fill="#ecd3de" stroke="#a1245a" stroke-width="2.5">
        <rect x="210" y="12" width="150" height="220" rx="8"/>
        <rect x="396" y="12" width="150" height="220" rx="8"/>
        <rect x="582" y="12" width="150" height="220" rx="8"/>
        <rect x="768" y="12" width="150" height="220" rx="8"/>
        <rect x="954" y="12" width="150" height="220" rx="8"/>
        <rect x="1140" y="12" width="150" height="220" rx="8"/>
      </g>
      <g text-anchor="middle" font-size="30" font-weight="700" fill="#a1245a">
        <text x="285" y="100">LLM</text>
        <text x="471" y="100">Harness</text>
        <text x="843" y="100">Tools</text>
        <text x="1029" y="100">KB</text>
        <text x="1215" y="100">Skills</text>
      </g>
      <g text-anchor="middle" font-size="26" font-weight="700" fill="#a1245a">
        <text x="657" y="88">System</text>
        <text x="657" y="118">Prompt</text>
      </g>
      <g text-anchor="middle" font-size="15" fill="#212529">
        <text x="285" y="151">il motore</text>
        <text x="285" y="173">che genera</text>
        <text x="471" y="140">l'impalcatura</text>
        <text x="471" y="162">che lo fa</text>
        <text x="471" y="184">lavorare</text>
        <text x="657" y="162">ruolo e regole</text>
        <text x="843" y="151">interagire con</text>
        <text x="843" y="173">l'ecosistema IT</text>
        <text x="1029" y="140">ciò che</text>
        <text x="1029" y="162">l'organizzazione</text>
        <text x="1029" y="184">sa: il know-what</text>
        <text x="1215" y="151">il know-how</text>
        <text x="1215" y="173">procedurale</text>
      </g>
    </g>

    <g id="raggruppamenti" fill="none" stroke="#a1245a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M210 252 q0 12 12 12 H273 q12 0 12 12 q0 -12 12 -12 H348 q12 0 12 -12"/>
      <path d="M396 252 q0 12 12 12 H459 q12 0 12 12 q0 -12 12 -12 H534 q12 0 12 -12"/>
      <path d="M582 252 q0 12 12 12 H924 q12 0 12 12 q0 -12 12 -12 H1278 q12 0 12 -12"/>
    </g>
    <g id="etichette-gruppi" text-anchor="middle" font-size="21" font-weight="600" fill="#a1245a">
      <text x="285" y="312">la CPU</text>
      <text x="471" y="312">il sistema operativo</text>
      <text x="936" y="312">il software installato</text>
    </g>
  </g>

  <!-- ===== La fascia delle sintesi: una colonna per blocco ===== -->
  <g id="sintesi" text-anchor="middle" font-size="15" font-weight="600" fill="#161719">
    <text x="285" y="784">sa volere,</text>
    <text x="285" y="806">non sa eseguire (26)</text>

    <text x="471" y="784">prepara la finestra,</text>
    <text x="471" y="806">esegue, governa,</text>
    <text x="471" y="828">osserva (27)</text>

    <text x="657" y="784">ruolo, regole,</text>
    <text x="657" y="806">e lo schema</text>
    <text x="657" y="828">annotato (27, 28)</text>

    <text x="843" y="784">un contratto;</text>
    <text x="843" y="806">dietro, un prodotto</text>
    <text x="843" y="828">dati (27, 28)</text>

    <text x="1029" y="784">lo spettro,</text>
    <text x="1029" y="806">e il significato</text>
    <text x="1029" y="828">sopra (28)</text>

    <text x="1215" y="784">il know-how che</text>
    <text x="1215" y="806">usa il know-what</text>
    <text x="1215" y="828">(27, 28)</text>
  </g>
</svg>
