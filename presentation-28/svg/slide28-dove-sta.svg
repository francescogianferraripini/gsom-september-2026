<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 400" width="650" height="400" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Dove sta il non strutturato: SharePoint e Drive con tre copie dello stesso contratto, la posta, Teams, la wiki e i PDF scansionati; nessuno di questi contenitori ha schema, ETL, owner o versione valida; a destra la pagella gia segnata con non ridondante e veritiera in croce</title>

  <!-- ===== Colonna sinistra: la mappa dei contenitori ===== -->
  <text x="12" y="28" font-size="12" font-weight="700" letter-spacing="1.6" fill="#838383">DOVE STA LA CONOSCENZA NON STRUTTURATA</text>

  <!-- SharePoint / Drive: il contenitore principale, con le tre copie -->
  <g id="sharepoint">
    <rect x="12" y="44" width="392" height="188" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
    <path d="M28 60 h16 l4 5 h22 v20 h-42 z" fill="#f6f6f6" stroke="#838383" stroke-width="1.2"/>
    <text x="82" y="80" font-size="15" font-weight="600" fill="#161719">SharePoint / Drive</text>

    <path d="M36 94 h12 l3 4 h17 v15 h-32 z" fill="#f6f6f6" stroke="#838383" stroke-width="1.2"/>
    <text x="78" y="109" font-size="12" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" fill="#838383">contratti / corrieri /</text>

    <path d="M44 118 V196" fill="none" stroke="#dee2e6" stroke-width="1" stroke-dasharray="3 3"/>
    <g fill="none" stroke="#dee2e6" stroke-width="1">
      <path d="M44 133 H56"/><path d="M44 165 H56"/><path d="M44 197 H56"/>
    </g>

    <g id="copie">
      <g>
        <rect x="56" y="120" width="332" height="26" rx="6" fill="#ecd3de" stroke="#a1245a" stroke-width="1.5"/>
        <path d="M68 126 h10 l5 5 v9 h-15 z" fill="#ffffff" stroke="#a1245a" stroke-width="1.2"/>
        <text x="92" y="138" font-size="12" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" fill="#a1245a">contratto_SpedFast_v2.docx</text>
      </g>
      <g>
        <rect x="56" y="152" width="332" height="26" rx="6" fill="#ecd3de" stroke="#a1245a" stroke-width="1.5"/>
        <path d="M68 158 h10 l5 5 v9 h-15 z" fill="#ffffff" stroke="#a1245a" stroke-width="1.2"/>
        <text x="92" y="170" font-size="12" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" fill="#a1245a">contratto_SpedFast_v3_FINALE.docx</text>
      </g>
      <g>
        <rect x="56" y="184" width="332" height="26" rx="6" fill="#ecd3de" stroke="#a1245a" stroke-width="1.5"/>
        <path d="M68 190 h10 l5 5 v9 h-15 z" fill="#ffffff" stroke="#a1245a" stroke-width="1.2"/>
        <text x="92" y="202" font-size="12" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" fill="#a1245a">contratto_SpedFast_v3_FINALE (1).docx</text>
      </g>
    </g>
    <text x="56" y="224" font-size="12" font-weight="600" fill="#a1245a">tre copie: nessuno sa quale vale</text>
  </g>

  <!-- Gli altri contenitori -->
  <g id="altri-contenitori" font-size="12" fill="#212529" text-anchor="middle">
    <g>
      <rect x="12" y="242" width="92" height="84" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
      <rect x="40" y="262" width="36" height="26" rx="3" fill="#f6f6f6" stroke="#838383" stroke-width="1.2"/>
      <path d="M40 262 L58 276 L76 262" fill="none" stroke="#838383" stroke-width="1.2"/>
      <rect x="66" y="282" width="14" height="10" rx="2" fill="#ffffff" stroke="#838383" stroke-width="1.2"/>
      <text x="58" y="312">posta</text>
    </g>
    <g>
      <rect x="112" y="242" width="92" height="84" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
      <path d="M132 260 h34 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-22 l-8 8 v-8 a4 4 0 0 1 -4 -4 v-14 a4 4 0 0 1 4 -4 z" fill="#f6f6f6" stroke="#838383" stroke-width="1.2"/>
      <path d="M152 278 h28 a4 4 0 0 1 4 4 v10 a4 4 0 0 1 -4 4 h-24 a4 4 0 0 1 -4 -4 z" fill="#ffffff" stroke="#838383" stroke-width="1.2"/>
      <text x="158" y="312">Teams / chat</text>
    </g>
    <g>
      <rect x="212" y="242" width="92" height="84" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
      <rect x="236" y="258" width="30" height="36" rx="2" fill="#f6f6f6" stroke="#838383" stroke-width="1.2"/>
      <rect x="246" y="266" width="30" height="36" rx="2" fill="#ffffff" stroke="#838383" stroke-width="1.2"/>
      <g stroke="#dee2e6" stroke-width="1.5"><path d="M252 276 h18"/><path d="M252 283 h18"/><path d="M252 290 h12"/></g>
      <text x="258" y="312">wiki</text>
    </g>
    <g>
      <rect x="312" y="242" width="92" height="84" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
      <path d="M344 254 h20 l8 8 v30 h-28 z" fill="#f6f6f6" stroke="#838383" stroke-width="1.2"/>
      <path d="M364 254 v8 h8" fill="none" stroke="#838383" stroke-width="1.2"/>
      <g stroke="#dee2e6" stroke-width="1.5"><path d="M350 272 h16"/><path d="M350 279 h16"/><path d="M350 286 h10"/></g>
      <text x="358" y="304">PDF</text>
      <text x="358" y="318">scansionati</text>
    </g>
  </g>

  <!-- Le quattro etichette barrate, una volta sola per tutta la mappa -->
  <g id="mancanze">
    <text x="12" y="348" font-size="12" fill="#838383">nessuno di questi contenitori ha:</text>
    <g font-size="13" fill="#838383">
      <rect x="12" y="356" width="70" height="28" rx="8" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/>
      <text x="47" y="375" text-anchor="middle">schema</text>
      <path d="M22 370 H72" stroke="#838383" stroke-width="1.5"/>

      <rect x="90" y="356" width="52" height="28" rx="8" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/>
      <text x="116" y="375" text-anchor="middle">ETL</text>
      <path d="M100 370 H132" stroke="#838383" stroke-width="1.5"/>

      <rect x="150" y="356" width="66" height="28" rx="8" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/>
      <text x="183" y="375" text-anchor="middle">owner</text>
      <path d="M160 370 H206" stroke="#838383" stroke-width="1.5"/>

      <rect x="224" y="356" width="122" height="28" rx="8" fill="#f6f6f6" stroke="#dee2e6" stroke-width="1"/>
      <text x="285" y="375" text-anchor="middle">versione valida</text>
      <path d="M234 370 H336" stroke="#838383" stroke-width="1.5"/>
    </g>
  </g>

  <!-- ===== Colonna destra: la pagella in miniatura ===== -->
  <g id="pagella">
    <rect x="420" y="44" width="218" height="196" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
    <rect x="420" y="44" width="3" height="196" fill="#a1245a"/>
    <text x="438" y="72" font-size="12" font-weight="700" letter-spacing="1.6" fill="#838383">LA PAGELLA</text>

    <g stroke="#dee2e6" stroke-width="1">
      <path d="M420 132 H638"/><path d="M420 168 H638"/><path d="M420 204 H638"/>
    </g>

    <g font-size="13" fill="#212529">
      <text x="438" y="102">ricercabile in modo</text>
      <text x="438" y="120">progressivo</text>
      <text x="438" y="155">non ridondante</text>
      <text x="438" y="191">veritiera</text>
      <text x="438" y="227">compounding</text>
    </g>

    <g fill="#ffffff" stroke="#dee2e6" stroke-width="1.5">
      <rect x="596" y="96" width="22" height="22" rx="4"/>
      <rect x="596" y="139" width="22" height="22" rx="4"/>
      <rect x="596" y="175" width="22" height="22" rx="4"/>
      <rect x="596" y="211" width="22" height="22" rx="4"/>
    </g>
    <g stroke="#a1245a" stroke-width="2.5" stroke-linecap="round">
      <path d="M601 144 L613 156 M613 144 L601 156"/>
      <path d="M601 180 L613 192 M613 180 L601 192"/>
    </g>
  </g>

  <text x="420" y="264" font-size="13" fill="#838383">prima ancora di cercare</text>

  <g id="callout-search">
    <rect x="420" y="288" width="218" height="92" rx="8" fill="#161719"/>
    <rect x="420" y="288" width="4" height="92" fill="#ffbe0b"/>
    <text x="440" y="318" font-size="13" font-weight="600" fill="#ffffff">la search risolve solo</text>
    <text x="440" y="338" font-size="13" font-weight="600" fill="#ffbe0b">&#171;ricercabile&#187;</text>
    <text x="440" y="362" font-size="12" fill="#838383">gli altri due: governance</text>
  </g>
</svg>
