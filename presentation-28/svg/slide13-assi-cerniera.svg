<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 593 360" width="593" height="360" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>La matrice due per due della forma e del fine, in versione ridotta: la cella relazionale per transazionale e spuntata come fatta, la freccia la struttura deriva da qui e accesa in burgundy e punta alla cella relazionale per analitico, elemento focale con l'etichetta sezione 3</title>
  <defs>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a1245a"/></marker>
  </defs>

  <!-- assi -->
  <text x="348" y="16" text-anchor="middle" font-size="11.5" font-weight="600" fill="#838383">il fine</text>
  <text x="10" y="196" transform="rotate(-90 10 196)" text-anchor="middle" font-size="11.5" font-weight="600" fill="#838383">la forma</text>
  <g text-anchor="middle" font-size="13" font-weight="700" fill="#161719">
    <text x="227" y="36">transazionale</text>
    <text x="469" y="36">analitico</text>
  </g>
  <g text-anchor="end" font-size="12" font-weight="700" fill="#161719">
    <text x="102" y="112">relazionale</text>
    <text x="102" y="266">document</text>
    <text x="102" y="282">(JSON)</text>
  </g>

  <!-- cella relazionale x transazionale: fatta -->
  <rect x="110" y="46" width="234" height="124" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  <text x="126" y="100" font-size="12.5" font-weight="700" fill="#161719">il DB degli ordini</text>
  <text x="126" y="120" font-size="11.5" fill="#838383">dietro <tspan font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" fill="#212529">cerca_ordine</tspan></text>
  <circle cx="324" cy="64" r="10" fill="#ffffff" stroke="#a1245a" stroke-width="1.5"/>
  <path d="M319.5 64 L322.8 67.6 L328.8 59.8" fill="none" stroke="#a1245a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- cella document x transazionale -->
  <rect x="110" y="208" width="234" height="124" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  <text x="126" y="264" font-size="12.5" font-weight="700" fill="#161719">il carrello e il profilo cliente</text>
  <text x="126" y="284" font-size="11.5" fill="#838383">un JSON per cliente, nell'e-commerce</text>

  <!-- cella document x analitico -->
  <rect x="352" y="208" width="234" height="124" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  <text x="368" y="264" font-size="12.5" font-weight="700" fill="#161719">gli eventi di navigazione e i log</text>
  <text x="368" y="284" font-size="11.5" fill="#838383">un JSON per evento, letti a lotti</text>

  <!-- cella relazionale x analitico: elemento focale -->
  <rect x="352" y="46" width="234" height="124" rx="8" fill="#ecd3de" stroke="#a1245a" stroke-width="2.5"/>
  <text x="368" y="88" font-size="12.5" font-weight="700" fill="#161719">il data warehouse vendite</text>
  <text x="368" y="108" font-size="11.5" fill="#212529">fatti e dimensioni</text>
  <rect x="368" y="122" width="76" height="22" rx="8" fill="#a1245a"/>
  <text x="406" y="137" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">sezione 3</text>

  <!-- la struttura deriva dal transazionale: accesa -->
  <path d="M227 170 V188 H469 V172" fill="none" stroke="#a1245a" stroke-width="2.5" marker-end="url(#mb)"/>
  <text x="348" y="204" text-anchor="middle" font-size="11.5" font-weight="600" fill="#a1245a">la struttura deriva da qui</text>
</svg>
