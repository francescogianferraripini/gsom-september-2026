<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 190" width="650" height="190" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Le tabelle ordini e spedizioni disegnate come griglie: la colonna id_ordine di ordini e marcata PK, quella di spedizioni FK, e una freccia burgundy risale dalla chiave esterna alla chiave primaria</title>
  <defs>
