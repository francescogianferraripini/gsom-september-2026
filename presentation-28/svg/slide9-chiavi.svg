  <!-- la freccia focale: chiave esterna verso chiave primaria -->
  <path d="M329 115 V105 H45 V96" fill="none" stroke="#a1245a" stroke-width="2.5" marker-end="url(#mb)"/>
  <text x="380" y="101" font-size="11.5" font-weight="600" fill="#a1245a">chiave esterna → chiave primaria</text>
</svg>
