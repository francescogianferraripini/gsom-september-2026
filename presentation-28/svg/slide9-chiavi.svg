    <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#212529" text-anchor="middle">
      <text x="45" y="45">id_ordine</text>
      <text x="116" y="45">id_cliente</text>
      <text x="191" y="45">data_ordine</text>
      <text x="257" y="45">importo</text>
    </g>
    <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#212529" text-anchor="middle">
      <text x="45" y="58">4471</text><text x="116" y="58">812</text><text x="191" y="58">2026-08-03</text><text x="257" y="58">129,90</text>
      <text x="45" y="73">4472</text><text x="116" y="73">415</text><text x="191" y="73">2026-08-05</text><text x="257" y="73">84,50</text>
      <text x="45" y="88">4473</text><text x="116" y="88">812</text><text x="191" y="88">2026-08-11</text><text x="257" y="88">212,00</text>
    </g>
  </g>

  <!-- tabella spedizioni -->
  <text x="204" y="111" font-size="12" font-weight="700" fill="#161719">spedizioni</text>
