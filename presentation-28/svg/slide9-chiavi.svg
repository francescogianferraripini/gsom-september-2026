  </defs>

  <!-- tabella ordini -->
  <text x="10" y="16" font-size="12" font-weight="700" fill="#161719">ordini</text>
  <g id="ordini">
    <rect x="10" y="22" width="274" height="71" rx="8" fill="#ffffff" stroke="#dee2e6"/>
