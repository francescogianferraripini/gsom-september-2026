<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 420" width="700" height="840" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Lo schema disegnato, cinque tabelle legate per chiave: a sinistra clienti, ordini e spedizioni in colonna; a destra prodotti e righe_ordine. Le righe chiave sono in evidenza. Quattro frecce vanno dalla chiave esterna alla chiave primaria: ordini verso clienti, spedizioni verso ordini, righe_ordine verso ordini e verso prodotti. Sotto: lo stesso valore, per esempio 4471, in due tabelle</title>
  <defs>
    <marker id="mb9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a1245a"/></marker>
  </defs>

  <!-- ═══ clienti ═══ -->
  <rect x="8" y="8" width="150" height="78" rx="6" fill="#ffffff" stroke="#dee2e6"/>
  <path d="M14 8 h138 a6 6 0 0 1 6 6 v18 h-150 v-18 a6 6 0 0 1 6 -6 z" fill="#f6f6f6"/>
  <rect x="8.5" y="32" width="149" height="18" fill="#ecd3de" opacity="0.5"/>
  <g stroke="#dee2e6"><line x1="8" y1="32" x2="158" y2="32"/><line x1="8" y1="50" x2="158" y2="50"/><line x1="8" y1="68" x2="158" y2="68"/></g>
  <rect x="8" y="8" width="150" height="78" rx="6" fill="none" stroke="#dee2e6"/>
  <text x="18" y="25" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700" fill="#161719">clienti</text>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="10" fill="#212529">
    <text x="18" y="45">id_cliente</text><text x="18" y="63">nome</text><text x="18" y="81">regione</text>
  </g>
  <text x="150" y="45" text-anchor="end" font-size="8.5" font-weight="700" fill="#a1245a">PK</text>

  <!-- ═══ prodotti ═══ -->
  <rect x="192" y="8" width="150" height="78" rx="6" fill="#ffffff" stroke="#dee2e6"/>
  <path d="M198 8 h138 a6 6 0 0 1 6 6 v18 h-150 v-18 a6 6 0 0 1 6 -6 z" fill="#f6f6f6"/>
  <rect x="192.5" y="32" width="149" height="18" fill="#ecd3de" opacity="0.5"/>
  <g stroke="#dee2e6"><line x1="192" y1="32" x2="342" y2="32"/><line x1="192" y1="50" x2="342" y2="50"/><line x1="192" y1="68" x2="342" y2="68"/></g>
  <rect x="192" y="8" width="150" height="78" rx="6" fill="none" stroke="#dee2e6"/>
  <text x="202" y="25" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700" fill="#161719">prodotti</text>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="10" fill="#212529">
    <text x="202" y="45">id_prodotto</text><text x="202" y="63">nome</text><text x="202" y="81">prezzo</text>
  </g>
  <text x="334" y="45" text-anchor="end" font-size="8.5" font-weight="700" fill="#a1245a">PK</text>

  <!-- ═══ ordini ═══ -->
  <rect x="8" y="126" width="150" height="96" rx="6" fill="#ffffff" stroke="#dee2e6"/>
  <path d="M14 126 h138 a6 6 0 0 1 6 6 v18 h-150 v-18 a6 6 0 0 1 6 -6 z" fill="#f6f6f6"/>
  <rect x="8.5" y="150" width="149" height="36" fill="#ecd3de" opacity="0.5"/>
  <g stroke="#dee2e6"><line x1="8" y1="150" x2="158" y2="150"/><line x1="8" y1="168" x2="158" y2="168"/><line x1="8" y1="186" x2="158" y2="186"/><line x1="8" y1="204" x2="158" y2="204"/></g>
  <rect x="8" y="126" width="150" height="96" rx="6" fill="none" stroke="#dee2e6"/>
  <text x="18" y="143" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700" fill="#161719">ordini</text>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="10" fill="#212529">
    <text x="18" y="163">id_ordine</text><text x="18" y="181">id_cliente</text><text x="18" y="199">data_ordine</text><text x="18" y="217">importo</text>
  </g>
  <g font-size="8.5" font-weight="700" fill="#a1245a" text-anchor="end"><text x="150" y="163">PK</text><text x="150" y="181">FK</text></g>

  <!-- ═══ righe_ordine: la tabella con due chiavi esterne ═══ -->
  <rect x="192" y="126" width="150" height="78" rx="6" fill="#ffffff" stroke="#dee2e6"/>
  <path d="M198 126 h138 a6 6 0 0 1 6 6 v18 h-150 v-18 a6 6 0 0 1 6 -6 z" fill="#f6f6f6"/>
  <rect x="192.5" y="150" width="149" height="36" fill="#ecd3de" opacity="0.5"/>
  <g stroke="#dee2e6"><line x1="192" y1="150" x2="342" y2="150"/><line x1="192" y1="168" x2="342" y2="168"/><line x1="192" y1="186" x2="342" y2="186"/></g>
  <rect x="192" y="126" width="150" height="78" rx="6" fill="none" stroke="#dee2e6"/>
  <text x="202" y="143" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700" fill="#161719">righe_ordine</text>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="10" fill="#212529">
    <text x="202" y="163">id_ordine</text><text x="202" y="181">id_prodotto</text><text x="202" y="199">quantita</text>
  </g>
  <g font-size="8.5" font-weight="700" fill="#a1245a" text-anchor="end"><text x="334" y="163">FK</text><text x="334" y="181">FK</text></g>

  <!-- ═══ spedizioni ═══ -->
  <rect x="8" y="262" width="150" height="114" rx="6" fill="#ffffff" stroke="#dee2e6"/>
  <path d="M14 262 h138 a6 6 0 0 1 6 6 v18 h-150 v-18 a6 6 0 0 1 6 -6 z" fill="#f6f6f6"/>
  <rect x="8.5" y="304" width="149" height="18" fill="#ecd3de" opacity="0.5"/>
  <g stroke="#dee2e6"><line x1="8" y1="286" x2="158" y2="286"/><line x1="8" y1="304" x2="158" y2="304"/><line x1="8" y1="322" x2="158" y2="322"/><line x1="8" y1="340" x2="158" y2="340"/><line x1="8" y1="358" x2="158" y2="358"/></g>
  <rect x="8" y="262" width="150" height="114" rx="6" fill="none" stroke="#dee2e6"/>
  <text x="18" y="279" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700" fill="#161719">spedizioni</text>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="10" fill="#212529">
    <text x="18" y="299">id_spedizione</text><text x="18" y="317">id_ordine</text><text x="18" y="335">corriere</text><text x="18" y="353">data_prevista</text><text x="18" y="371">data_consegna</text>
  </g>
  <g font-size="8.5" font-weight="700" fill="#a1245a" text-anchor="end"><text x="150" y="299">PK</text><text x="150" y="317">FK</text></g>

  <!-- ═══ le frecce: dalla chiave esterna alla chiave primaria ═══ -->
  <g stroke="#a1245a" stroke-width="2" fill="none" marker-end="url(#mb9)">
    <path d="M83 124 V89"/>
    <path d="M83 260 V225"/>
    <path d="M190 159 H161"/>
    <path d="M267 124 V89"/>
  </g>

  <text x="8" y="400" font-size="10.5" font-weight="700" fill="#a1245a">→ chiave esterna verso chiave primaria</text>
  <text x="8" y="415" font-size="10" fill="#838383">lo stesso valore, per esempio 4471, in due tabelle</text>
</svg>
