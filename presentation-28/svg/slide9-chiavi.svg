      <text x="249" y="153">9001</text><text x="329" y="153">4471</text><text x="412" y="153">SpedFast</text><text x="505" y="153">2026-08-12</text><text x="595" y="153">2026-08-19</text>
      <text x="249" y="168">9002</text><text x="329" y="168">4471</text><text x="412" y="168">Corriere Nord</text><text x="505" y="168">2026-08-13</text><text x="595" y="168">2026-08-14</text>
      <text x="249" y="183">9003</text><text x="329" y="183">4473</text><text x="412" y="183">SpedFast</text><text x="505" y="183">2026-08-18</text><text x="595" y="183">2026-08-18</text>
