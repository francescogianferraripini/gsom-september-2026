<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 334" width="620" height="668" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Lo schema disegnato: il riquadro ordini con le sue colonne, id_ordine in evidenza e marcata PK; sotto, allineato, il riquadro spedizioni con id_spedizione PK e id_ordine FK, anch'essa in evidenza. Una freccia risale dalla chiave esterna alla chiave primaria, con l'etichetta: lo stesso valore, 4471</title>
  <defs>
    <marker id="mb9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a1245a"/></marker>
  </defs>

  <!-- ═══ ordini ═══ -->
  <rect x="46" y="8" width="254" height="108" rx="6" fill="#ffffff" stroke="#dee2e6"/>
  <path d="M52 8 h242 a6 6 0 0 1 6 6 v18 h-254 v-18 a6 6 0 0 1 6 -6 z" fill="#f6f6f6"/>
  <rect x="46.5" y="32" width="253" height="21" fill="#ecd3de" opacity="0.5"/>
  <g stroke="#dee2e6"><line x1="46" y1="32" x2="300" y2="32"/><line x1="46" y1="53" x2="300" y2="53"/><line x1="46" y1="74" x2="300" y2="74"/><line x1="46" y1="95" x2="300" y2="95"/></g>
  <rect x="46" y="8" width="254" height="108" rx="6" fill="none" stroke="#dee2e6"/>
  <text x="58" y="25" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700" fill="#161719">ordini</text>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="10" fill="#212529">
    <text x="58" y="46.5">id_ordine</text>
    <text x="58" y="67.5">id_cliente</text>
    <text x="58" y="88.5">data_ordine</text>
    <text x="58" y="109.5">importo</text>
  </g>
  <text x="288" y="46.5" text-anchor="end" font-size="9" font-weight="700" fill="#a1245a">PK</text>

  <!-- ═══ spedizioni ═══ -->
  <rect x="46" y="196" width="254" height="129" rx="6" fill="#ffffff" stroke="#dee2e6"/>
  <path d="M52 196 h242 a6 6 0 0 1 6 6 v18 h-254 v-18 a6 6 0 0 1 6 -6 z" fill="#f6f6f6"/>
  <rect x="46.5" y="241" width="253" height="21" fill="#ecd3de" opacity="0.5"/>
  <g stroke="#dee2e6"><line x1="46" y1="220" x2="300" y2="220"/><line x1="46" y1="241" x2="300" y2="241"/><line x1="46" y1="262" x2="300" y2="262"/><line x1="46" y1="283" x2="300" y2="283"/><line x1="46" y1="304" x2="300" y2="304"/></g>
  <rect x="46" y="196" width="254" height="129" rx="6" fill="none" stroke="#dee2e6"/>
  <text x="58" y="213" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700" fill="#161719">spedizioni</text>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="10" fill="#212529">
    <text x="58" y="234.5">id_spedizione</text>
    <text x="58" y="255.5">id_ordine</text>
    <text x="58" y="276.5">corriere</text>
    <text x="58" y="297.5">data_prevista</text>
    <text x="58" y="318.5">data_consegna</text>
  </g>
  <text x="288" y="234.5" text-anchor="end" font-size="9" font-weight="700" fill="#a1245a">PK</text>
  <text x="288" y="255.5" text-anchor="end" font-size="9" font-weight="700" fill="#a1245a">FK</text>

  <!-- la freccia: dalla chiave esterna alla chiave primaria, nel corridoio a sinistra -->
  <path d="M44 251 H22 V42 H42" fill="none" stroke="#a1245a" stroke-width="2" marker-end="url(#mb9)"/>
  <text x="58" y="146" font-size="10.5" font-weight="700" fill="#a1245a">chiave esterna → chiave primaria</text>
  <text x="58" y="164" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="10" fill="#212529">lo stesso valore: 4471</text>
</svg>
