<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 333" width="640" height="666" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Lo schema delle due tabelle, disegnato: il riquadro ordini con le sue colonne e id_ordine marcata PK, sotto il riquadro spedizioni con id_spedizione PK e id_ordine FK; accanto alle due colonne chiave lo stesso valore 4471, e una freccia burgundy risale dalla chiave esterna alla chiave primaria</title>
  <defs>
    <marker id="mb9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a1245a"/></marker>
  </defs>

  <!-- ═══ ordini ═══ -->
  <rect x="12" y="8" width="176" height="108" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  <path d="M20 8 h160 a8 8 0 0 1 8 8 v16 h-176 v-16 a8 8 0 0 1 8 -8 z" fill="#f6f6f6"/>
  <rect x="12.5" y="32" width="175" height="21" fill="#ecd3de" opacity="0.5"/>
  <g stroke="#dee2e6"><line x1="12" y1="32" x2="188" y2="32"/><line x1="12" y1="53" x2="188" y2="53"/><line x1="12" y1="74" x2="188" y2="74"/><line x1="12" y1="95" x2="188" y2="95"/></g>
  <rect x="12" y="8" width="176" height="108" rx="8" fill="none" stroke="#dee2e6"/>
  <text x="22" y="25" font-size="11.5" font-weight="700" fill="#161719">ordini</text>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="10" fill="#212529">
    <text x="22" y="46.5">id_ordine</text>
    <text x="22" y="67.5">id_cliente</text>
    <text x="22" y="88.5">data_ordine</text>
    <text x="22" y="109.5">importo</text>
  </g>
  <text x="178" y="46.5" text-anchor="end" font-size="8.5" font-weight="700" fill="#a1245a">PK</text>
  <rect x="198" y="35" width="48" height="16" rx="4" fill="#ffffff" stroke="#a1245a"/>
  <text x="222" y="46.5" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="10" fill="#a1245a">4471</text>

  <!-- ═══ spedizioni ═══ -->
  <rect x="12" y="196" width="176" height="129" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  <path d="M20 196 h160 a8 8 0 0 1 8 8 v16 h-176 v-16 a8 8 0 0 1 8 -8 z" fill="#f6f6f6"/>
  <rect x="12.5" y="241" width="175" height="21" fill="#ecd3de" opacity="0.5"/>
  <g stroke="#dee2e6"><line x1="12" y1="220" x2="188" y2="220"/><line x1="12" y1="241" x2="188" y2="241"/><line x1="12" y1="262" x2="188" y2="262"/><line x1="12" y1="283" x2="188" y2="283"/><line x1="12" y1="304" x2="188" y2="304"/></g>
  <rect x="12" y="196" width="176" height="129" rx="8" fill="none" stroke="#dee2e6"/>
  <text x="22" y="213" font-size="11.5" font-weight="700" fill="#161719">spedizioni</text>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="10" fill="#212529">
    <text x="22" y="234.5">id_spedizione</text>
    <text x="22" y="255.5">id_ordine</text>
    <text x="22" y="276.5">corriere</text>
    <text x="22" y="297.5">data_prevista</text>
    <text x="22" y="318.5">data_consegna</text>
  </g>
  <text x="178" y="234.5" text-anchor="end" font-size="8.5" font-weight="700" fill="#a1245a">PK</text>
  <text x="178" y="255.5" text-anchor="end" font-size="8.5" font-weight="700" fill="#a1245a">FK</text>
  <rect x="198" y="244" width="48" height="16" rx="4" fill="#ffffff" stroke="#a1245a"/>
  <text x="222" y="255.5" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="10" fill="#a1245a">4471</text>

  <!-- la freccia focale: lo stesso valore, da una tabella all'altra -->
  <path d="M246 252 H272 V43 H250" fill="none" stroke="#a1245a" stroke-width="2.2" marker-end="url(#mb9)"/>
  <text x="292" y="148" transform="rotate(-90 292 148)" text-anchor="middle" font-size="10" font-weight="600" fill="#a1245a">chiave esterna → chiave primaria</text>
</svg>
