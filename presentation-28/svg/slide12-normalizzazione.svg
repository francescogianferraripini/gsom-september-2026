  </g>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" fill="#161719" text-anchor="middle">
    <text x="43" y="166">4475</text><text x="99" y="166">Rossi</text><text x="164" y="166">via Verdi 5</text><text x="233" y="166">SpedFast</text><text x="287" y="166">340,00</text>
  </g>
  <rect x="12" y="48" width="300" height="124" rx="8" fill="none" stroke="#dee2e6"/>

  <text x="12" y="194" font-size="11.5" font-weight="700" fill="#a1245a">due indirizzi “veri”</text>
  <text x="12" y="214" font-size="11.5" fill="#838383">cambia l'indirizzo di Rossi: tre righe da aggiornare</text>

  <text x="12" y="340" font-size="11.5" fill="#838383">per leggere “gli ordini di Rossi con il corriere”:</text>
  <text x="12" y="360" font-size="13" font-weight="700" fill="#161719">1 tabella, 0 join</text>

