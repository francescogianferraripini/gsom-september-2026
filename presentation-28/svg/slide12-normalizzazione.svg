    <line x1="12" y1="112" x2="312" y2="112"/>
    <line x1="12" y1="132" x2="312" y2="132"/>
    <line x1="12" y1="152" x2="312" y2="152"/>
    <line x1="74" y1="48" x2="74" y2="172"/>
    <line x1="124" y1="48" x2="124" y2="172"/>
    <line x1="204" y1="48" x2="204" y2="172"/>
    <line x1="262" y1="48" x2="262" y2="172"/>
  </g>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#212529" text-anchor="middle">
    <text x="43" y="65">id_ordine</text>
    <text x="99" y="65">cliente</text>
    <text x="164" y="65">indirizzo</text>
    <text x="233" y="65">corriere</text>
    <text x="287" y="65">importo</text>
  </g>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#212529" text-anchor="middle">
