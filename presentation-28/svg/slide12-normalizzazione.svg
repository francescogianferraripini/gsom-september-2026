  </g>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" fill="#161719" text-anchor="middle">
    <text x="370" y="84">812</text><text x="428" y="84">Rossi</text><text x="494" y="84">via Verdi 3</text>
  </g>

