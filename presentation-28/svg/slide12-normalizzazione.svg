    <text x="43" y="106">4472</text><text x="99" y="106">Bianchi</text><text x="164" y="106">via Po 8</text><text x="233" y="106">PostaPro</text><text x="287" y="106">84,50</text>
    <text x="43" y="126">4473</text><text x="99" y="126">Rossi</text><text x="164" y="126">via Verdi 3</text><text x="233" y="126">SpedFast</text><text x="287" y="126">212,00</text>
    <text x="43" y="146">4474</text><text x="99" y="146">Verdi</text><text x="164" y="146">via Etna 2</text><text x="233" y="146">PostaPro</text><text x="287" y="146">56,00</text>
  </g>
  <path d="M12 152 H312 V164 A8 8 0 0 1 304 172 H20 A8 8 0 0 1 12 164 Z" fill="#ecd3de" stroke="#a1245a" stroke-width="2.5"/>
  <g stroke="#a1245a" opacity="0.3">
