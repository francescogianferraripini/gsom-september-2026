<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 400" width="650" height="400" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Due pannelli a confronto: a sinistra la tabella ordini denormalizzata, con Rossi ripetuto tre volte e una riga con un indirizzo diverso evidenziata; a destra le tre tabelle normalizzate clienti, ordini e spedizioni collegate dalle chiavi, con la riga unica di Rossi in evidenza</title>
  <defs>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#838383"/></marker>
  </defs>

  <line x1="325" y1="8" x2="325" y2="392" stroke="#dee2e6"/>

  <!-- ============ pannello sinistro: denormalizzato ============ -->
  <text x="12" y="22" font-size="13" font-weight="700" fill="#161719">denormalizzato</text>
  <text x="12" y="42" font-size="11.5" font-weight="700" fill="#838383">ordini</text>

  <rect x="12" y="48" width="300" height="124" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  <path d="M20 48 h284 a8 8 0 0 1 8 8 v16 h-300 v-16 a8 8 0 0 1 8 -8 z" fill="#f6f6f6"/>
  <rect x="74" y="72" width="130" height="20" fill="#ecd3de" opacity="0.45"/>
  <rect x="74" y="112" width="130" height="20" fill="#ecd3de" opacity="0.45"/>
  <g stroke="#dee2e6">
