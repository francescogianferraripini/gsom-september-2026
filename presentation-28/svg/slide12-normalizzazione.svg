    <text x="369" y="150">id_ordine</text><text x="432" y="150">id_cliente</text><text x="489" y="150">importo</text>
  </g>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#212529" text-anchor="middle">
    <text x="369" y="170">4471</text><text x="432" y="170">812</text><text x="489" y="170">129,90</text>
    <text x="369" y="190">4473</text><text x="432" y="190">812</text><text x="489" y="190">212,00</text>
  </g>

  <!-- spedizioni -->
  <text x="338" y="234" font-size="11.5" font-weight="700" fill="#838383">spedizioni</text>
  <rect x="338" y="240" width="210" height="62" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  <path d="M346 240 h194 a8 8 0 0 1 8 8 v14 h-210 v-14 a8 8 0 0 1 8 -8 z" fill="#f6f6f6"/>
  <g stroke="#dee2e6">
    <line x1="338" y1="262" x2="548" y2="262"/>
    <line x1="338" y1="282" x2="548" y2="282"/>
    <line x1="428" y1="240" x2="428" y2="302"/>
    <line x1="490" y1="240" x2="490" y2="302"/>
  </g>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#212529" text-anchor="middle">
    <text x="383" y="256">id_spedizione</text><text x="459" y="256">id_ordine</text><text x="519" y="256">corriere</text>
  </g>
  <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#212529" text-anchor="middle">
    <text x="383" y="276">9001</text><text x="459" y="276">4471</text><text x="519" y="276">SpedFast</text>
    <text x="383" y="296">9003</text><text x="459" y="296">4473</text><text x="519" y="296">SpedFast</text>
  </g>

  <!-- le chiavi che si rimandano -->
  <path d="M432 132 V112 H370 V93" fill="none" stroke="#838383" stroke-width="1.5" marker-end="url(#mg)"/>
  <text x="446" y="116" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" fill="#838383">id_cliente</text>
  <path d="M459 238 V218 H369 V199" fill="none" stroke="#838383" stroke-width="1.5" marker-end="url(#mg)"/>
  <text x="473" y="222" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" fill="#838383">id_ordine</text>

  <text x="338" y="340" font-size="11.5" fill="#838383">per leggere “gli ordini di Rossi con il corriere”:</text>
  <text x="338" y="360" font-size="13" font-weight="700" fill="#161719">3 tabelle, 2 join</text>
