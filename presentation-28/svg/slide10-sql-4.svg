      <text x="132" y="343" font-weight="600">SpedFast</text><text x="339" y="343">121</text><text x="409" y="343">3,8</text>
      <text x="132" y="361" font-weight="600">Corriere Nord</text><text x="339" y="361">44</text><text x="409" y="361">1,9</text>
      <text x="132" y="379" font-weight="600">PostaPro</text><text x="339" y="379">22</text><text x="409" y="379">1,2</text>
