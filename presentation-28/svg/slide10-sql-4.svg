  <!-- GROUP BY: la graffa e le tre righe di risultato -->
  <g id="risultato">
    <path d="M84 316 q0 7 7 7 H187 q7 0 7 7 q0 -7 7 -7 H297 q7 0 7 -7" fill="none" stroke="#ffbe0b" stroke-width="1.5"/>
    <rect x="84" y="330" width="360" height="54" rx="8" fill="#fff2ce" stroke="#ffbe0b" stroke-width="2.5"/>
    <g stroke="#ffbe0b" opacity="0.5">
