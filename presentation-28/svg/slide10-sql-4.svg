  <!-- la colonna corriere: e la chiave del raggruppamento -->
  <rect x="84" y="186" width="96" height="130" fill="none" stroke="#a1245a" stroke-width="1.5" opacity="0.55"/>

  <!-- le due colonne calcolate: attenuate, i loro valori arrivano qui sotto -->
  <g id="colonne-calcolate" opacity="0.3">
    <rect x="304" y="186" width="140" height="130" rx="8" fill="none" stroke="#a1245a" stroke-width="1.5" stroke-dasharray="5 4"/>
    <g stroke="#a1245a" stroke-width="1.5" stroke-dasharray="5 4">
