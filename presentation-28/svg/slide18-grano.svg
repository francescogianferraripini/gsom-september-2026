<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 400" width="650" height="400" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Il grano del fatto: tre righe a confronto. Una riga uguale a un ordine non risponde ai ritardi per corriere ne ai colli in ritardo; una riga uguale a una spedizione, il grano scelto ed evidenziato, risponde ai ritardi per corriere e all'importo per mese ma non ai colli; una riga uguale a un collo risponde a tutte e tre le domande, ma solo se il gestionale lo scrive</title>
  <defs>
    <g id="ok">
      <circle r="8" fill="#d1efea" stroke="#1ab197" stroke-width="1.5"/>
      <path d="M-3.6 0 L-1.2 2.8 L3.8 -3" fill="none" stroke="#1ab197" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="no">
      <circle r="8" fill="#ecd3de" stroke="#a1245a" stroke-width="1.5"/>
      <path d="M-3.2 -3.2 L3.2 3.2 M3.2 -3.2 L-3.2 3.2" fill="none" stroke="#a1245a" stroke-width="2" stroke-linecap="round"/>
    </g>
  </defs>

  <g text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.8" fill="#838383">
    <text x="98" y="28">IL GRANO</text>
    <text x="285" y="28">CHE COSA È UNA RIGA</text>
    <text x="514" y="28">CHE COSA SI PUÒ CHIEDERE</text>
  </g>

  <!-- grano: ordine -->
  <g id="grano-ordine">
    <rect x="14" y="40" width="622" height="106" rx="8" fill="#ffffff" stroke="#dee2e6"/>
    <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700" fill="#161719">
      <text x="30" y="86">una riga =</text><text x="30" y="106">un ordine</text>
    </g>
    <g>
      <rect x="180" y="56" width="140" height="40" rx="5" fill="#ffffff" stroke="#dee2e6"/>
      <path d="M180 76 h140 M250 56 v40" stroke="#dee2e6"/>
      <rect x="180.5" y="56.5" width="139" height="19.5" fill="#f6f6f6"/>
      <path d="M180 76 h140 M250 56 v40" stroke="#dee2e6"/>
      <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" text-anchor="middle">
        <text x="215" y="70" font-weight="700" fill="#838383">id_ordine</text><text x="285" y="70" font-weight="700" fill="#838383">corriere</text>
        <text x="215" y="90" fill="#212529">4471</text><text x="285" y="90" fill="#212529">SpedFast?</text>
      </g>
      <text x="180" y="122" font-size="11" fill="#838383">due spedizioni, un corriere solo?</text>
    </g>
    <g font-size="12" fill="#212529">
      <use href="#no" x="410" y="64"/><text x="426" y="68">ritardi per corriere</text>
      <use href="#no" x="410" y="92"/><text x="426" y="96">colli in ritardo</text>
      <use href="#ok" x="410" y="120"/><text x="426" y="124">importo per mese</text>
    </g>
  </g>

  <!-- grano: spedizione, il grano scelto -->
  <g id="grano-spedizione">
    <rect x="14" y="152" width="622" height="106" rx="8" fill="#ecd3de" stroke="#a1245a" stroke-width="2.5"/>
    <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700" fill="#a1245a">
      <text x="30" y="198">una riga =</text><text x="30" y="218">una spedizione</text>
    </g>
    <g>
      <rect x="180" y="168" width="210" height="60" rx="5" fill="#ffffff" stroke="#a1245a"/>
      <rect x="180.5" y="168.5" width="209" height="19.5" fill="#f6f6f6"/>
      <path d="M180 188 h210 M180 208 h210 M272 168 v60 M330 168 v60" stroke="#dee2e6"/>
      <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" text-anchor="middle">
        <text x="226" y="182" font-weight="700" fill="#838383">id_spedizione</text><text x="301" y="182" font-weight="700" fill="#838383">corriere</text><text x="360" y="182" font-weight="700" fill="#838383">importo</text>
        <text x="226" y="202" fill="#212529">8801</text><text x="301" y="202" fill="#212529">SpedFast</text><text x="360" y="202" fill="#212529">1.240 €</text>
        <text x="226" y="222" fill="#212529">8802</text><text x="301" y="222" fill="#212529">PostaPro</text><text x="360" y="222" fill="#212529">890 €</text>
      </g>
      <text x="180" y="250" font-size="11.5" font-weight="700" fill="#a1245a">il grano scelto</text>
    </g>
    <g font-size="12" fill="#212529">
      <use href="#ok" x="410" y="176"/><text x="426" y="180">ritardi per corriere</text>
      <use href="#no" x="410" y="204"/><text x="426" y="208">colli in ritardo</text>
      <use href="#ok" x="410" y="232"/><text x="426" y="236">importo per mese</text>
    </g>
  </g>

  <!-- grano: collo -->
  <g id="grano-collo">
    <rect x="14" y="264" width="622" height="106" rx="8" fill="#ffffff" stroke="#dee2e6"/>
    <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700" fill="#161719">
      <text x="30" y="310">una riga =</text><text x="30" y="330">un collo</text>
    </g>
    <g>
      <rect x="180" y="280" width="210" height="60" rx="5" fill="#ffffff" stroke="#dee2e6"/>
      <rect x="180.5" y="280.5" width="209" height="19.5" fill="#f6f6f6"/>
      <path d="M180 300 h210 M180 320 h210 M242 280 v60 M318 280 v60" stroke="#dee2e6"/>
      <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" text-anchor="middle">
        <text x="211" y="294" font-weight="700" fill="#838383">id_collo</text><text x="280" y="294" font-weight="700" fill="#838383">spedizione</text><text x="354" y="294" font-weight="700" fill="#838383">stato</text>
        <text x="211" y="314" fill="#212529">C-1</text><text x="280" y="314" fill="#212529">8801</text><text x="354" y="314" fill="#212529">in ritardo</text>
        <text x="211" y="334" fill="#212529">C-2</text><text x="280" y="334" fill="#212529">8801</text><text x="354" y="334" fill="#212529">consegnato</text>
      </g>
      <text x="180" y="362" font-size="11.5" font-weight="600" fill="#a1245a">solo se il gestionale lo scrive</text>
    </g>
    <g font-size="12" fill="#212529">
      <use href="#ok" x="410" y="288"/><text x="426" y="292">ritardi per corriere</text>
      <use href="#ok" x="410" y="316"/><text x="426" y="320">colli in ritardo</text>
      <use href="#ok" x="410" y="344"/><text x="426" y="348">importo per mese</text>
    </g>
  </g>
</svg>
