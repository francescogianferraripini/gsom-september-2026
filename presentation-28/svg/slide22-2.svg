  <text x="344" y="242" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700" fill="#161719">4,1</text>

  <path d="M120 206 C158 206 170 274 196 274" fill="none" stroke="#838383" stroke-width="1.4" marker-end="url(#m22)"/>
