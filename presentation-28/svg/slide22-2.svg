  </defs>

  <!-- il transazionale: la fonte di tutte le pipeline -->
  <text x="62" y="150" text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="1.4" fill="#838383">IL TRANSAZIONALE</text>
  <g stroke="#838383" stroke-width="1.1" fill="#ffffff">
