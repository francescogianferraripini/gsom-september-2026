<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 330" width="650" height="330" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Secondo tempo: alla prima pipeline se ne aggiungono altre, una per richiesta, ognuna che riparte dal transazionale con il suo ETL e il suo report; i numeri del ritardo medio sono 3,8 - 3,2 - 4,1 - 3,9. Dieci richieste, dieci pipeline, dieci definizioni di ritardo</title>
  <defs>
    <marker id="m22" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#838383"/></marker>
