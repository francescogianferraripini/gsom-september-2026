<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 434" width="650" height="434" role="img" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Terzo tempo: arriva il fatto nuovo, fatto_fatture_corrieri, con le chiavi id_corriere e id_data, e si aggancia anche lui alle dimensioni conformi che esistono gia: si aggancia a cio che c'e gia, ed e il compounding</title>

  <!-- ═══ le dimensioni conformi ═══ -->
  <text x="325" y="192" text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="1.6" fill="#838383">LE DIMENSIONI CONFORMI</text>
  <g id="dim-corriere">
    <rect x="15" y="200" width="190" height="76" rx="8" fill="#ffffff" stroke="#dee2e6"/>
    <path d="M15 208 a8,8 0 0 1 8,-8 h174 a8,8 0 0 1 8,8 v14 h-190 z" fill="#f6f6f6"/>
    <path d="M15 222 h190" stroke="#dee2e6"/>
    <text x="110" y="216" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="700" fill="#161719">dim_corriere</text>
    <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#212529">
      <text x="25" y="238">nome</text><text x="25" y="255">tipo</text><text x="25" y="272">contratto_dal</text>
    </g>
  </g>
  <g id="dim-data">
    <rect x="230" y="200" width="190" height="76" rx="8" fill="#ffffff" stroke="#dee2e6"/>
    <path d="M230 208 a8,8 0 0 1 8,-8 h174 a8,8 0 0 1 8,8 v14 h-190 z" fill="#f6f6f6"/>
    <path d="M230 222 h190" stroke="#dee2e6"/>
    <text x="325" y="216" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="700" fill="#161719">dim_data</text>
    <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#212529">
      <text x="240" y="238">giorno</text><text x="240" y="255">mese</text><text x="240" y="272">festivo</text>
    </g>
  </g>
  <g id="dim-cliente">
    <rect x="445" y="200" width="190" height="76" rx="8" fill="#ffffff" stroke="#dee2e6"/>
    <path d="M445 208 a8,8 0 0 1 8,-8 h174 a8,8 0 0 1 8,8 v14 h-190 z" fill="#f6f6f6"/>
    <path d="M445 222 h190" stroke="#dee2e6"/>
    <text x="540" y="216" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="700" fill="#161719">dim_cliente</text>
    <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#212529">
      <text x="455" y="238">nome</text><text x="455" y="255">regione</text><text x="455" y="272">segmento</text>
    </g>
  </g>

  <!-- ═══ il primo fatto, con le sue tre join ═══ -->
  <g stroke="#a1245a" stroke-width="2" fill="none">
    <path d="M70 122 V200"/>
    <path d="M140 122 V162 H300 V200"/>
    <path d="M210 122 V180 H520 V200"/>
  </g>
  <g id="fatto-spedizioni">
    <rect x="30" y="14" width="220" height="108" rx="8" fill="#ffffff" stroke="#a1245a" stroke-width="2"/>
    <path d="M30 22 a8,8 0 0 1 8,-8 h204 a8,8 0 0 1 8,8 v15 h-220 z" fill="#ecd3de"/>
    <path d="M30 37 h220" stroke="#a1245a"/>
    <text x="140" y="31" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700" fill="#a1245a">fatto_spedizioni</text>
    <path d="M39 100 V114" stroke="#a1245a" stroke-width="3"/>
    <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5">
      <text x="40" y="58" fill="#212529">id_corriere</text>
      <text x="40" y="76" fill="#212529">id_data</text>
      <text x="40" y="94" fill="#212529">id_cliente</text>
      <text x="46" y="112" fill="#a1245a" font-weight="700">importo</text>
    </g>
    <g font-size="10.5" font-weight="700" fill="#838383" text-anchor="end">
      <text x="242" y="58">FK</text><text x="242" y="76">FK</text><text x="242" y="94">FK</text>
    </g>
    <text x="140" y="140" text-anchor="middle" font-size="10.5" fill="#838383">una riga = una spedizione</text>
  </g>

  <!-- ═══ il secondo fatto: riusa le dimensioni che ci sono già ═══ -->
  <g stroke="#a1245a" stroke-width="2" fill="none">
    <path d="M440 104 V140 H360 V200"/>
    <path d="M580 104 V200"/>
  </g>
  <g id="fatto-reclami">
    <rect x="400" y="14" width="220" height="90" rx="8" fill="#ffffff" stroke="#a1245a" stroke-width="2"/>
    <path d="M400 22 a8,8 0 0 1 8,-8 h204 a8,8 0 0 1 8,8 v15 h-220 z" fill="#ecd3de"/>
    <path d="M400 37 h220" stroke="#a1245a"/>
    <text x="510" y="31" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700" fill="#a1245a">fatto_reclami</text>
    <path d="M409 82 V96" stroke="#a1245a" stroke-width="3"/>
    <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5">
      <text x="410" y="58" fill="#212529">id_data</text>
      <text x="410" y="76" fill="#212529">id_cliente</text>
      <text x="416" y="94" fill="#a1245a" font-weight="700">n_reclami</text>
    </g>
    <g font-size="10.5" font-weight="700" fill="#838383" text-anchor="end">
      <text x="612" y="58">FK</text><text x="612" y="76">FK</text>
    </g>
    <text x="510" y="122" text-anchor="middle" font-size="10.5" fill="#838383">una riga = un reclamo</text>
  </g>
  <text x="540" y="310" text-anchor="middle" font-size="11" fill="#838383">le stesse dimensioni, nessun lavoro in più</text>

  <!-- ═══ il terzo fatto: si aggancia a ciò che c'è già ═══ -->
  <g stroke="#a1245a" stroke-width="2" fill="none">
    <path d="M240 330 V306 H110 V276"/>
    <path d="M390 330 V276"/>
  </g>
  <g id="fatto-fatture">
    <rect x="215" y="330" width="220" height="90" rx="8" fill="#ffffff" stroke="#a1245a" stroke-width="2" stroke-dasharray="5 3"/>
    <path d="M215 338 a8,8 0 0 1 8,-8 h204 a8,8 0 0 1 8,8 v15 h-220 z" fill="#ecd3de"/>
    <path d="M215 353 h220" stroke="#a1245a"/>
    <text x="325" y="347" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700" fill="#a1245a">fatto_fatture_corrieri</text>
    <path d="M224 398 V412" stroke="#a1245a" stroke-width="3"/>
    <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5">
      <text x="225" y="374" fill="#212529">id_corriere</text>
      <text x="225" y="392" fill="#212529">id_data</text>
      <text x="231" y="410" fill="#a1245a" font-weight="700">importo</text>
    </g>
    <g font-size="10.5" font-weight="700" fill="#838383" text-anchor="end">
      <text x="427" y="374">FK</text><text x="427" y="392">FK</text>
    </g>
  </g>
  <rect x="381" y="318" width="54" height="20" rx="7" fill="#a1245a"/>
  <text x="408" y="332" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">nuovo</text>
  <text x="540" y="356" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a1245a">si aggancia a ciò che c'è già:</text>
  <text x="540" y="374" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a1245a">è il compounding</text>
</svg>
